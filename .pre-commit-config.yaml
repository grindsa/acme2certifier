# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-added-large-files
    -   id: check-case-conflict
    -   id: check-docstring-first
    -   id: check-json
    -   id: check-merge-conflict
    -   id: check-symlinks
    -   id: check-toml
    -   id: check-xml
    -   id: check-yaml
        args: [--allow-multiple-documents]
    -   id: debug-statements
    # -   id: double-quote-string-fixer
    -   id: mixed-line-ending

-   repo: https://github.com/psf/black
    rev: 26.5.1
    # rev: 22.10.0
    hooks:
    -   id: black

-   repo: local
    hooks:
    -   id: pycodestyle
        name: pycodestyle (acme2certifier/)
        # $HOME is expanded by the shell; pre-commit does not expand env vars in args.
        entry: bash -c 'exec pycodestyle --config="${HOME}/.config/.pycodestyle" "$@"' --
        language: system
        types: [python]
        files: ^acme2certifier/
    -   id: test-naming-convention
        name: test naming convention
        entry: python3 tools/check_test_naming.py
        language: system
        files: ^test/test.*\.py$

-   repo: https://github.com/jackdewinter/pymarkdown
    rev: v0.9.39
    hooks:
    -   id: pymarkdown
        args: [-d, MD013, scan]
