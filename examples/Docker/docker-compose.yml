services:
  acme-srv:
    container_name: acme-srv
    build:
      context: ../../.
      dockerfile: examples/Docker/$WEBSERVER/Dockerfile
    image: acme2certifier/$WEBSERVER
    environment:
      ACME_SRV_DB_HANDLER: ${ACME_SRV_DB_HANDLER:-wsgi}
    env_file:
      - ./data/django.env
    volumes:
      - type: bind
        source: ./data
        target: /var/www/acme2certifier/volume/
        read_only: false
    ports:
      - "22280:80"
      - "22443:443"
    restart: always

networks:
  default:
    name: acme
    external: true
