[uwsgi]
module = acme2certifier_wsgi:application
master = true
processes = 5
uid = nginx
socket = /run/uwsgi/acme.sock
chown-socket = nginx
chmod-socket = 660
vacuum = true
die-on-term = true
disable-logging = true
enable-threads = true
# APP_ROOT on sys.path so legacy volume symlink acme_srv/ca_handler.py resolves
# (same as Apache WSGI python-path). Installers retarget for /opt layouts.
python-path = /var/www/acme2certifier
