name: Application Tests - lego
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'
      run_id:
        description: 'Run ID of the producing workflow'
        required: true
        default: '0'
      sha:
        description: 'SHA of the commit to run the workflow on'
        required: true
        default: ''
      called_by_workflow:
        description: 'Name of the producing workflow'
        required: true
        default: 'manual-trigger'
      full_ref:
        description: 'Full git ref of the commit to run the workflow on'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ inputs.branch }}
  cancel-in-progress: true

permissions: {}

jobs:
  guard:
    permissions: {}
    uses: ./.github/workflows/_guard.yml
    with:
      sha: ${{ inputs.sha }}
      run_id: ${{ inputs.run_id }}
      branch: ${{ inputs.branch }}

  # ---------------------------------------------------------
  # Test container images (matrix from payload)
  # ---------------------------------------------------------
  test-containers:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        keylength: [rsa2048, rsa4096, ec256]
        websrv: ['apache2', 'nginx']
        dbhandler: ['wsgi', 'django']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Channel setup"
        uses: ./.github/actions/channel_container_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          WEB_SRV: ${{ matrix.websrv }}
          DB_HANDLER: ${{ matrix.dbhandler }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          NAME_SPACE: acme

      - name: "Setup openssl ca_handler"
        uses: ./.github/actions/setup_openssl_cahandler
        with:
          VOLUME_DIR: "examples/Docker/data"

      - name: "Bring up a2c container"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "create folders"
        run: |
          mkdir lego

      - name: "Wait for ACME directory"
        uses: ./.github/actions/wait_for_directory

      - name: "Enroll HTTP-01 single domain lego"
        run: |
          docker run -i -v $PWD/lego:/.lego/ --rm --name lego --network acme goacme/lego run --tls-skip-verify -s https://acme-srv -a --key-type ${{ matrix.keylength }} --email "lego@example.com" -d lego.acme --http
          sudo openssl verify -CAfile examples/Docker/data/acme_ca/root-ca-cert.pem -untrusted examples/Docker/data/acme_ca/sub-ca-cert.pem lego/certificates/lego.acme.crt

      - name: "Renew HTTP-01 single domain lego"
        run: |
          docker run -i -v $PWD/lego:/.lego/ --rm --name lego --network acme goacme/lego run --tls-skip-verify -s https://acme-srv -a --key-type ${{ matrix.keylength }} --email "lego@example.com" -d lego.acme --http --no-random-sleep
          sudo openssl verify -CAfile examples/Docker/data/acme_ca/root-ca-cert.pem -untrusted examples/Docker/data/acme_ca/sub-ca-cert.pem lego/certificates/lego.acme.crt

      - name: "Revoke HTTP-01 single domain lego"
        run: |
          docker run -i -v $PWD/lego:/.lego/ --rm --name lego --network acme goacme/lego certificates revoke --tls-skip-verify -s https://acme-srv --key-type ${{ matrix.keylength }} --email "lego@example.com" --cert.name lego.acme

      - name: "Enroll HTTP-01 2x domain lego"
        run: |
          sudo rm -rf lego/*
          docker run -i -v $PWD/lego:/.lego/ --rm --name lego --network acme --network-alias lego2 goacme/lego run --tls-skip-verify -s https://acme-srv -a --key-type ${{ matrix.keylength }} --email "lego@example.com" -d lego.acme -d lego2.acme --http
          sudo openssl verify -CAfile examples/Docker/data/acme_ca/root-ca-cert.pem -untrusted examples/Docker/data/acme_ca/sub-ca-cert.pem lego/certificates/lego.acme.crt

      - name: "Renew HTTP-01 2x domain lego"
        run: |
          docker run -i -v $PWD/lego:/.lego/ --rm --name lego --network acme --network-alias lego2 goacme/lego run --tls-skip-verify -s https://acme-srv -a --key-type ${{ matrix.keylength }} --email "lego@example.com" -d lego.acme -d lego2.acme --http --no-random-sleep
          sudo openssl verify -CAfile examples/Docker/data/acme_ca/root-ca-cert.pem -untrusted examples/Docker/data/acme_ca/sub-ca-cert.pem lego/certificates/lego.acme.crt

      - name: "Revoke HTTP-01 2x domain lego"
        run: |
          docker run -i -v $PWD/lego:/.lego/ --rm --name lego --network acme goacme/lego certificates revoke --tls-skip-verify -s https://acme-srv --key-type ${{ matrix.keylength }} --email "lego@example.com" --cert.name lego.acme

      - name: "Check container configuration"
        uses: ./.github/actions/container_check
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Channel teardown"
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: container
          ARTIFACT_NAME: test-containers-${{ matrix.keylength }}-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz


  # ---------------------------------------------------------
  # Test RPMs (EL8 & EL9) downloaded from the producer run
  # ---------------------------------------------------------


  test-rpm:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        keylength: [rsa2048, rsa4096, ec256]
        rhversion: [8, 9]
        mode: ['wsgi', 'django']
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6


      - name: "Channel setup"
        uses: ./.github/actions/channel_rpm_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          RH_VERSION: ${{ matrix.rhversion }}
          JSON_SECRET: ${{ secrets.GH_CFG }}

      - name: "Prepare acme_srv.cfg with openssl_ca_handler"
        uses: ./.github/actions/setup_openssl_cahandler

      - name: "Execute install script"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh install -m $MODE
        env:
          MODE: ${{ matrix.mode }}

      - name: "Enroll HTTP-01 single domain lego"
        run: |
          docker run -i -v $PWD/lego:/.lego/ --rm --name lego --network acme goacme/lego run --tls-skip-verify -s https://acme-srv -a --key-type ${{ matrix.keylength }} --email "lego@example.com" -d lego.acme --http
          sudo openssl verify -CAfile data/volume/acme_ca/root-ca-cert.pem -untrusted data/volume/acme_ca/sub-ca-cert.pem lego/certificates/lego.acme.crt

      - name: "Renew HTTP-01 single domain lego"
        run: |
          docker run -i -v $PWD/lego:/.lego/ --rm --name lego --network acme goacme/lego run --tls-skip-verify -s https://acme-srv -a --key-type ${{ matrix.keylength }} --email "lego@example.com" -d lego.acme --http --no-random-sleep
          sudo openssl verify -CAfile data/volume/acme_ca/root-ca-cert.pem -untrusted data/volume/acme_ca/sub-ca-cert.pem lego/certificates/lego.acme.crt

      - name: "Revoke HTTP-01 single domain lego"
        run: |
          docker run -i -v $PWD/lego:/.lego/ --rm --name lego --network acme goacme/lego certificates revoke --tls-skip-verify -s https://acme-srv --key-type ${{ matrix.keylength }} --email "lego@example.com" --cert.name lego.acme

      - name: "Enroll HTTP-01 2x domain lego"
        run: |
          docker run -i -v $PWD/lego:/.lego/ --rm --name lego --network acme --network-alias lego2 goacme/lego run --tls-skip-verify -s https://acme-srv -a --key-type ${{ matrix.keylength }} --email "lego@example.com" -d lego.acme -d lego2.acme --http
          sudo openssl verify -CAfile data/volume/acme_ca/root-ca-cert.pem -untrusted data/volume/acme_ca/sub-ca-cert.pem lego/certificates/lego.acme.crt

      - name: "Renew HTTP-01 2x domain lego"
        run: |
          docker run -i -v $PWD/lego:/.lego/ --rm --name lego --network acme --network-alias lego2 goacme/lego run --tls-skip-verify -s https://acme-srv -a --key-type ${{ matrix.keylength }} --email "lego@example.com" -d lego.acme -d lego2.acme --http --no-random-sleep
          sudo openssl verify -CAfile data/volume/acme_ca/root-ca-cert.pem -untrusted data/volume/acme_ca/sub-ca-cert.pem lego/certificates/lego.acme.crt

      - name: "Revoke HTTP-01 2x domain lego"
        run: |
          docker run -i -v $PWD/lego:/.lego/ --rm --name lego --network acme goacme/lego certificates revoke --tls-skip-verify -s https://acme-srv --key-type ${{ matrix.keylength }} --email "lego@example.com" --cert.name lego.acme

      - name: "Channel teardown"
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: rpm
          ARTIFACT_NAME: test-rpm-rh${{ matrix.rhversion }}-${{ matrix.mode }}.tar.gz

  # ---------------------------------------------------------
  # Test DEB downloaded from the producer run
  # ---------------------------------------------------------


  test-deb:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        keylength: [rsa2048, rsa4096, ec256]
        websrv: ['apache2', 'nginx']
        mode: ['wsgi', 'django']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Channel setup"
        uses: ./.github/actions/channel_deb_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          DJANGO_DB: ${{ matrix.mode == 'django' && 'psql' || '' }}

      - name: "Prepare acme_srv.cfg with openssl_ca_handler"
        uses: ./.github/actions/setup_openssl_cahandler

      - name: "Execute install script"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh install $WEBSRV -m $MODE
        env:
          WEBSRV: ${{ matrix.websrv }}
          MODE: ${{ matrix.mode }}

      - name: "Enroll HTTP-01 single domain lego"
        run: |
          docker run -i -v $PWD/lego:/.lego/ --rm --name lego --network acme goacme/lego run --tls-skip-verify -s https://acme-srv -a --key-type ${{ matrix.keylength }} --email "lego@example.com" -d lego.acme --http
          sudo openssl verify -CAfile data/volume/acme_ca/root-ca-cert.pem -untrusted data/volume/acme_ca/sub-ca-cert.pem lego/certificates/lego.acme.crt

      - name: "Renew HTTP-01 single domain lego"
        run: |
          docker run -i -v $PWD/lego:/.lego/ --rm --name lego --network acme goacme/lego run --tls-skip-verify -s https://acme-srv -a --key-type ${{ matrix.keylength }} --email "lego@example.com" -d lego.acme --http --no-random-sleep
          sudo openssl verify -CAfile data/volume/acme_ca/root-ca-cert.pem -untrusted data/volume/acme_ca/sub-ca-cert.pem lego/certificates/lego.acme.crt

      - name: "Revoke HTTP-01 single domain lego"
        run: |
          docker run -i -v $PWD/lego:/.lego/ --rm --name lego --network acme goacme/lego certificates revoke --tls-skip-verify -s https://acme-srv --key-type ${{ matrix.keylength }} --email "lego@example.com" --cert.name lego.acme

      - name: "Enroll HTTP-01 2x domain lego"
        run: |
          docker run -i -v $PWD/lego:/.lego/ --rm --name lego --network acme --network-alias lego2 goacme/lego run --tls-skip-verify -s https://acme-srv -a --key-type ${{ matrix.keylength }} --email "lego@example.com" -d lego.acme -d lego2.acme --http
          sudo openssl verify -CAfile data/volume/acme_ca/root-ca-cert.pem -untrusted data/volume/acme_ca/sub-ca-cert.pem lego/certificates/lego.acme.crt

      - name: "Renew HTTP-01 2x domain lego"
        run: |
          docker run -i -v $PWD/lego:/.lego/ --rm --name lego --network acme --network-alias lego2 goacme/lego run --tls-skip-verify -s https://acme-srv -a --key-type ${{ matrix.keylength }} --email "lego@example.com" -d lego.acme -d lego2.acme --http --no-random-sleep
          sudo openssl verify -CAfile data/volume/acme_ca/root-ca-cert.pem -untrusted data/volume/acme_ca/sub-ca-cert.pem lego/certificates/lego.acme.crt

      - name: "Revoke HTTP-01 2x domain lego"
        run: |
          docker run -i -v $PWD/lego:/.lego/ --rm --name lego --network acme goacme/lego certificates revoke --tls-skip-verify -s https://acme-srv --key-type ${{ matrix.keylength }} --email "lego@example.com" --cert.name lego.acme

      - name: "Channel teardown"
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: deb
          ARTIFACT_NAME: test-deb-${{ matrix.websrv }}-${{ matrix.mode }}.tar.gz
          WEBSRV: ${{ matrix.websrv }}
