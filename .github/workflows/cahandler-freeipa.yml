name: CA-Handler Tests - FreeIPA
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'
      run_id:
        description: 'Run ID of the producing workflow'
        required: true
        default: '0'
      sha:
        description: 'SHA of the commit to run the workflow on'
        required: true
        default: ''
      called_by_workflow:
        description: 'Name of the producing workflow'
        required: true
        default: 'manual-trigger'
      full_ref:
        description: 'Full git ref of the commit to run the workflow on'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ inputs.branch }}
  cancel-in-progress: true

permissions: {}

jobs:
  guard:
    permissions: {}
    uses: ./.github/workflows/_guard.yml
    with:
      sha: ${{ inputs.sha }}
      run_id: ${{ inputs.run_id }}
      branch: ${{ inputs.branch }}

  # ---------------------------------------------------------
  # Test container images (matrix from payload)
  # ---------------------------------------------------------
  test-containers:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        dbhandler: ['wsgi', 'django']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v7

      - name: "Channel setup"
        uses: ./.github/actions/channel_container_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          WEB_SRV: ${{ matrix.websrv }}
          DB_HANDLER: ${{ matrix.dbhandler }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          NAME_SPACE: server.acme

      - name: Parse FreeIPA config
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.FREEIPA_CFG }}

      - name: "Prepare FreeIPA"
        uses: ./.github/actions/wf_specific/freeipa_ca_handler/freeipa_prep
        with:
          NAME_SPACE: server.acme
          ADMIN_USER: ${{ env.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}
          A2C_USER: ${{ env.A2C_USER }}
          A2C_PASSWORD: ${{ env.A2C_PASSWORD }}

      - name: "Generate UUID"
        run: |
          echo UUID=$(uuidgen | cut -d "-" -f1) >> $GITHUB_ENV
      - run: echo "UUID ${{ env.UUID }}"

      - name: "Setup freeipa_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.freeipa_ca_handler
          OPTIONS: |
            api_host: https://freeipa.server.acme
            api_user: ${{ env.A2C_USER }}
            api_password: ${{ env.A2C_PASSWORD }}
            ca_bundle: False
            realm: SERVER.ACME

      - name: "Setup freeipa_ca_handler (post-cfg)"
        run: |
          sudo mkdir -p examples/Docker/data/acme
          sudo chmod -R 777 examples/Docker/data/acme

      - name: "Bring up a2c container"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}
          NAME_SPACE: server.acme

      - name: "Test enrollment"
        uses: ./.github/actions/acme_clients_enroll
        with:
          TEST_ADL: "false"
          ACME_SERVER: "acme-srv.server.acme"
          NAME_SPACE: "server.acme"
          HOSTNAME_SUFFIX: -${{ env.UUID }}
          USE_RSA: "true"
          USE_CERTBOT: "false"
          USE_LEGO: "false"

      - name: "Check container configuration"
        uses: ./.github/actions/container_check
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "ACME Profiling - Setup a2c with freeca_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.freeipa_ca_handler
          OPTIONS: |
            api_host: https://freeipa.server.acme
            api_user: ${{ env.ADMIN_USER }}
            api_password: ${{ env.ADMIN_PASSWORD }}
            ca_bundle: False
            realm: SERVER.ACME
            enrollment_config_log: True

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "ACME Profiling - Setup a2c with freeca_ca_handler (post-cfg)"
        run: |
          sudo mkdir -p examples/Docker/data/acme
          sudo chmod -R 777 examples/Docker/data/acme
          # disable challenge validation to avoid issues with profile tests
          sudo sed -i "s/challenge_validation_disable: False/challenge_validation_disable: True/g" examples/Docker/data/acme_srv.cfg
          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nprofiles={\"IECUserRoles\": \"http:\/\/foo.bar\/iecuserroles\", \"caIPAserviceCert\": \"http:\/\/foo.bar\/caipaservicecert\", \"profile3\": \"http:\/\/foo.bar\/profile3\"}/g" examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart

      - name: "ACME Profiling - Test enrollment"
        uses: ./.github/actions/wf_specific/freeipa_ca_handler/enroll_acmeprofile
        with:
          DEPLOYMENT_TYPE: container

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "Stage kid_profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/freeipa.json
          DEST: examples/Docker/data/kid_profiles.json
      - name: "EAB Profiling - Setup a2c with freeca_ca_handler"
        run: |
          sudo echo -e "\n[EABhandler]" >> examples/Docker/data/acme_srv.cfg
          sudo echo "eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler" >> examples/Docker/data/acme_srv.cfg
          sudo echo "key_file: volume/kid_profiles.json" >> examples/Docker/data/acme_srv.cfg
          sudo echo "eab_profiling: True" >> examples/Docker/data/acme_srv.cfg


          cd examples/Docker/
          docker compose restart

      - name: "EAB Profiling - Test enrollment"
        uses: ./.github/actions/wf_specific/freeipa_ca_handler/enroll_eabprofile

      - name: "Channel teardown"
        if: ${{ always() }}
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: container
          ARTIFACT_NAME: test-containers-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz

  test-rpm:
    permissions:
      contents: read
      actions: write
    needs: [guard]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        rhversion: [8, 9]
        mode: ['wsgi', 'django']
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v7


      - name: "Channel setup"
        uses: ./.github/actions/channel_rpm_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          RH_VERSION: ${{ matrix.rhversion }}
          JSON_SECRET: ${{ secrets.GH_CFG }}
          NAME_SPACE: "server.acme"

      - name: Parse FreeIPA config
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.FREEIPA_CFG }}

      - name: "Prepare FreeIPA"
        uses: ./.github/actions/wf_specific/freeipa_ca_handler/freeipa_prep
        with:
          NAME_SPACE: server.acme
          ADMIN_USER: ${{ env.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}
          A2C_USER: ${{ env.A2C_USER }}
          A2C_PASSWORD: ${{ env.A2C_PASSWORD }}

      - name: "Generate UUID"
        run: |
          echo UUID=$(uuidgen | cut -d "-" -f1) >> $GITHUB_ENV
      - run: echo "UUID ${{ env.UUID }}"

      - name: "Setup freeipa_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.freeipa_ca_handler
          OPTIONS: |
            api_host: https://freeipa.server.acme
            api_user: ${{ env.A2C_USER }}
            api_password: ${{ env.A2C_PASSWORD }}
            ca_bundle: False
            realm: SERVER.ACME

      - name: "Setup freeipa_ca_handler (post-cfg)"
        run: |
          sudo mkdir -p data/volume/acme
          sudo chmod -R 777 data/volume/acme

      - name: "Execute install script"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh install -m $MODE
        env:
          MODE: ${{ matrix.mode }}

      - name: "Test enrollment"
        uses: ./.github/actions/acme_clients_enroll
        with:
          TEST_ADL: "false"
          ACME_SERVER: "acme-srv.server.acme"
          NAME_SPACE: "server.acme"
          HOSTNAME_SUFFIX: -${{ env.UUID }}
          USE_RSA: "true"
          USE_CERTBOT: "false"
          USE_LEGO: "false"

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: rpm

      - name: "ACME Profiling - Setup a2c with freeca_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.freeipa_ca_handler
          OPTIONS: |
            api_host: https://freeipa.server.acme
            api_user: ${{ env.ADMIN_USER }}
            api_password: ${{ env.ADMIN_PASSWORD }}
            ca_bundle: False
            realm: SERVER.ACME
            enrollment_config_log: True
        env:
          SAEC: ${{ env.SAEC }}

      - name: "ACME Profiling - Setup a2c with freeca_ca_handler (post-cfg)"
        run: |
          sudo mkdir -p data/volume/acme_ca
          sudo chmod -R 777 data/volume/acme_ca
          # disable challenge validation to avoid issues with profile tests
          sudo sed -i "s/challenge_validation_disable: False/challenge_validation_disable: True/g" data/volume/acme_srv.cfg
          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nprofiles={\"IECUserRoles\": \"http:\/\/foo.bar\/iecuserroles\", \"caIPAserviceCert\": \"http:\/\/foo.bar\/caipaservicecert\", \"profile3\": \"http:\/\/foo.bar\/profile3\"}/g" data/volume/acme_srv.cfg
        env:
          SAEC: ${{ env.SAEC }}

      - name: "Reconfigure a2c"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart
        env:
          MODE: ${{ matrix.mode }}

      - name: "ACME Profiling - Test enrollment"
        uses: ./.github/actions/wf_specific/freeipa_ca_handler/enroll_acmeprofile
        with:
          DEPLOYMENT_TYPE: rpm

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: rpm

      - name: "Stage kid_profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/freeipa.json
          DEST: data/volume/acme_ca/kid_profiles.json
      - name: "EAB Profiling - Setup a2c with freeca_ca_handler"
        run: |
          sudo echo -e "\n[EABhandler]" >> data/volume/acme_srv.cfg
          sudo echo "eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler" >> data/volume/acme_srv.cfg
          sudo echo "key_file: /opt/acme2certifier/volume/acme_ca/kid_profiles.json" >> data/volume/acme_srv.cfg
          sudo echo "eab_profiling: True" >> data/volume/acme_srv.cfg


      - name: "Reconfigure a2c"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart
        env:
          MODE: ${{ matrix.mode }}

      - name: "EAB Profiling - Test enrollment"
        uses: ./.github/actions/wf_specific/freeipa_ca_handler/enroll_eabprofile

      - name: "Channel teardown"
        if: ${{ always() }}
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: rpm
          ARTIFACT_NAME: test-rpm-rh${{ matrix.rhversion }}-${{ matrix.mode }}.tar.gz

  # ---------------------------------------------------------
  # Test DEB downloaded from the producer run
  # ---------------------------------------------------------


  test-deb:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        mode: ['wsgi', 'django']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v7

      - name: "Channel setup"
        uses: ./.github/actions/channel_deb_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          DJANGO_DB: ${{ matrix.mode == 'django' && 'psql' || '' }}
          PARSE_GH_CFG: "true"
          JSON_SECRET: ${{ secrets.GH_CFG }}
          NAME_SPACE: "server.acme"

      - name: Parse FreeIPA config
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.FREEIPA_CFG }}

      - name: "Prepare FreeIPA"
        uses: ./.github/actions/wf_specific/freeipa_ca_handler/freeipa_prep
        with:
          NAME_SPACE: server.acme
          ADMIN_USER: ${{ env.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}
          A2C_USER: ${{ env.A2C_USER }}
          A2C_PASSWORD: ${{ env.A2C_PASSWORD }}

      - name: "Generate UUID"
        run: |
          echo UUID=$(uuidgen | cut -d "-" -f1) >> $GITHUB_ENV
      - run: echo "UUID ${{ env.UUID }}"

      - name: "Setup freeipa_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.freeipa_ca_handler
          OPTIONS: |
            api_host: https://freeipa.server.acme
            api_user: ${{ env.A2C_USER }}
            api_password: ${{ env.A2C_PASSWORD }}
            ca_bundle: False
            realm: SERVER.ACME

      - name: "Setup freeipa_ca_handler (post-cfg)"
        run: |
          sudo mkdir -p data/volume/acme_ca
          sudo chmod -R 777 data/volume/acme_ca

      - name: "Execute install script"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh install $WEBSRV -m $MODE
        env:
          WEBSRV: ${{ matrix.websrv }}
          MODE: ${{ matrix.mode }}

      - name: "Test enrollment"
        uses: ./.github/actions/acme_clients_enroll
        with:
          TEST_ADL: "false"
          ACME_SERVER: "acme-srv.server.acme"
          NAME_SPACE: "server.acme"
          HOSTNAME_SUFFIX: -${{ env.UUID }}
          USE_RSA: "true"
          USE_CERTBOT: "false"
          USE_LEGO: "false"

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: deb

      - name: "ACME Profiling - Setup a2c with freeca_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.freeipa_ca_handler
          OPTIONS: |
            api_host: https://freeipa.server.acme
            api_user: ${{ env.ADMIN_USER }}
            api_password: ${{ env.ADMIN_PASSWORD }}
            ca_bundle: False
            realm: SERVER.ACME
            enrollment_config_log: True
        env:
          SAEC: ${{ env.SAEC }}

      - name: "ACME Profiling - Setup a2c with freeca_ca_handler (post-cfg)"
        run: |
          # disable challenge validation to avoid issues with profile tests
          sudo sed -i "s/challenge_validation_disable: False/challenge_validation_disable: True/g" data/volume/acme_srv.cfg
          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nprofiles={\"IECUserRoles\": \"http:\/\/foo.bar\/iecuserroles\", \"caIPAserviceCert\": \"http:\/\/foo.bar\/caipaservicecert\", \"profile3\": \"http:\/\/foo.bar\/profile3\"}/g" data/volume/acme_srv.cfg
        env:
          SAEC: ${{ env.SAEC }}

      - name: "Reconfigure a2c "
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh restart $WEBSRV
        env:
          WEBSRV: ${{ matrix.websrv }}
          MODE: ${{ matrix.mode }}

      - name: "ACME Profiling - Test enrollment"
        uses: ./.github/actions/wf_specific/freeipa_ca_handler/enroll_acmeprofile
        with:
          DEPLOYMENT_TYPE: deb

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: deb

      - name: "Stage kid_profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/freeipa.json
          DEST: data/volume/acme_ca/kid_profiles.json
      - name: "EAB Profiling - Setup a2c with freeca_ca_handler"
        run: |
          sudo echo -e "\n[EABhandler]" >> data/volume/acme_srv.cfg
          sudo echo "eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler" >> data/volume/acme_srv.cfg
          sudo echo "key_file: /var/www/acme2certifier/volume/acme_ca/kid_profiles.json" >> data/volume/acme_srv.cfg
          sudo echo "eab_profiling: True" >> data/volume/acme_srv.cfg


      - name: "Reconfigure a2c "
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh restart $WEBSRV
        env:
          WEBSRV: ${{ matrix.websrv }}
          MODE: ${{ matrix.mode }}

      - name: "EAB Profiling - Test enrollment"
        uses: ./.github/actions/wf_specific/freeipa_ca_handler/enroll_eabprofile

      - name: "Channel teardown"
        if: ${{ always() }}
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: deb
          ARTIFACT_NAME: test-deb-${{ matrix.websrv }}-${{ matrix.mode }}.tar.gz
          WEBSRV: ${{ matrix.websrv }}
