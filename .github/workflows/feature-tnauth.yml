name: Feature Tests - Tnauth
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'
      run_id:
        description: 'Run ID of the producing workflow'
        required: true
        default: '0'
      sha:
        description: 'SHA of the commit to run the workflow on'
        required: true
        default: ''
      called_by_workflow:
        description: 'Name of the producing workflow'
        required: true
        default: 'manual-trigger'
      full_ref:
        description: 'Full git ref of the commit to run the workflow on'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ inputs.branch }}
  cancel-in-progress: true

permissions: {}

jobs:
  guard:
    permissions: {}
    uses: ./.github/workflows/_guard.yml
    with:
      sha: ${{ inputs.sha }}
      run_id: ${{ inputs.run_id }}
      branch: ${{ inputs.branch }}

  # ---------------------------------------------------------
  # Test container images (matrix from payload)
  # ---------------------------------------------------------
  test-containers:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        dbhandler: ['wsgi', 'django']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v7

      - name: "Channel setup"
        uses: ./.github/actions/channel_container_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          WEB_SRV: ${{ matrix.websrv }}
          DB_HANDLER: ${{ matrix.dbhandler }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          NAME_SPACE: acme

      - name: "Setup openssl ca_handler"
        uses: ./.github/actions/setup_openssl_cahandler
        with:
          VOLUME_DIR: "examples/Docker/data"

      - name: "Configure openssl ca_handler"
        run: |
          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: True/g" examples/Docker/data/acme_srv.cfg

      - name: "Bring up a2c container"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Test regular enrollment"
        uses: ./.github/actions/acme_clients_enroll
        with:
          TEST_ADL: "false"

      - name: "Install curl and socat and test connction"
        run: |
          sudo apt-get install -y curl socat
          curl -f http://localhost:22280

      - name: "Install acme.sh"
        run: |
          mkdir /tmp/acme_sh
          curl -kL https://github.com/grindsa/acme.sh/archive/tnauth_list_support.tar.gz | tar xz -C /tmp/acme_sh --strip-components=1

      - name: "Expect tnauth enrollment to fail without break-glass acknowledgement"
        id: tnauth_fail_closed
        continue-on-error: true
        run: |
          rm -rf /tmp/acme-sh-home-fail-closed
          /tmp/acme_sh/acme.sh --home /tmp/acme-sh-home-fail-closed \
            --server http://127.0.0.1:22280 \
            --accountemail grindsa-fail@tnauth.acme \
            --issue -d cert-fail.acme.local \
            --tnauth 123456 --spctoken 1234 --standalone --force --debug 2

      - name: "Verify tnauth enrollment failed without acknowledgement"
        run: |
          if [[ "${{ steps.tnauth_fail_closed.outcome }}" != "failure" ]]; then
            echo "ERROR: tnauth enrollment succeeded without ACME2CERTIFIER_I_KNOW_THE_RISK"
            exit 1
          fi
          echo "tnauth enrollment failed as expected without break-glass acknowledgement"

      # tkauth-01 has no authority token verification, so the challenge is refused
      # unless the break-glass variable acknowledges it. Testing only.
      - name: "Acknowledge unverified tkauth-01 authority tokens"
        working-directory: examples/Docker
        run: |
          cat <<'EOF' > docker-compose.override.yml
          services:
            acme-srv:
              environment:
                ACME2CERTIFIER_I_KNOW_THE_RISK: "1"
          EOF
          docker compose up -d --force-recreate --no-build

      - name: "Wait for ACME directory after restart"
        uses: ./.github/actions/wait_for_directory

      - name: "Enroll certificate using tnauth identifier"
        run: |
          rm -rf /tmp/acme-sh-home-acknowledged
          /tmp/acme_sh/acme.sh --home /tmp/acme-sh-home-acknowledged \
            --server http://127.0.0.1:22280 \
            --accountemail grindsa@tnauth.acme \
            --issue -d cert.acme.local \
            --tnauth 123456 --spctoken 1234 --standalone --force --debug 2

      - name: "Check container configuration"
        uses: ./.github/actions/container_check
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Channel teardown"
        if: ${{ always() }}
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: container
          ARTIFACT_NAME: test-containers-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz

  # ---------------------------------------------------------
  # Test RPMs (EL8 & EL9) downloaded from the producer run
  # ---------------------------------------------------------


  test-rpm:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        rhversion: [8, 9]
        mode: ['wsgi', 'django']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v7

      - name: "Channel setup"
        uses: ./.github/actions/channel_rpm_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          RH_VERSION: ${{ matrix.rhversion }}
          JSON_SECRET: ${{ secrets.GH_CFG }}

      - name: "Prepare acme_srv.cfg with openssl_ca_handler"
        uses: ./.github/actions/setup_openssl_cahandler

      - name: "Prepare acme_srv.cfg with openssl_ca_handler (config)"
        run: |
          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: True/g" data/volume/acme_srv.cfg

      - name: "Execute install script"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh install -m $MODE
        env:
          MODE: ${{ matrix.mode }}

      - name: "Wait for ACME directory (http)"
        uses: ./.github/actions/wait_for_directory
        with:
          CHECK_HTTPS: "false"

      - name: "Install curl and socat and test connction"
        run: |
          sudo apt-get install -y curl socat
          curl -f http://localhost:22280

      - name: "Install acme.sh"
        run: |
          mkdir /tmp/acme_sh
          curl -kL https://github.com/grindsa/acme.sh/archive/tnauth_list_support.tar.gz | tar xz -C /tmp/acme_sh --strip-components=1

      - name: "Expect tnauth enrollment to fail without break-glass acknowledgement"
        id: tnauth_fail_closed
        continue-on-error: true
        run: |
          rm -rf /tmp/acme-sh-home-fail-closed
          /tmp/acme_sh/acme.sh --home /tmp/acme-sh-home-fail-closed \
            --server http://127.0.0.1:22280 \
            --accountemail grindsa-fail@tnauth.acme \
            --issue -d cert-fail.acme.local \
            --tnauth 123456 --spctoken 1234 --standalone --force --debug 2

      - name: "Verify tnauth enrollment failed without acknowledgement"
        run: |
          if [[ "${{ steps.tnauth_fail_closed.outcome }}" != "failure" ]]; then
            echo "ERROR: tnauth enrollment succeeded without ACME2CERTIFIER_I_KNOW_THE_RISK"
            exit 1
          fi
          echo "tnauth enrollment failed as expected without break-glass acknowledgement"

      # tkauth-01 has no authority token verification, so the challenge is refused
      # unless the break-glass variable acknowledges it. Testing only.
      - name: "Acknowledge unverified tkauth-01 authority tokens"
        run: |
          docker exec acme-srv bash -c 'mkdir -p /etc/systemd/system.conf.d && \
            printf "[Manager]\nDefaultEnvironment=ACME2CERTIFIER_I_KNOW_THE_RISK=1\n" \
              > /etc/systemd/system.conf.d/a2c-tkauth.conf && \
            systemctl daemon-reexec'
          docker exec acme-srv systemctl restart acme2certifier.service

      - name: "Wait for ACME directory after restart"
        uses: ./.github/actions/wait_for_directory
        with:
          CHECK_HTTPS: "false"

      - name: "Enroll certificate using tnauth identifier"
        run: |
          rm -rf /tmp/acme-sh-home-acknowledged
          /tmp/acme_sh/acme.sh --home /tmp/acme-sh-home-acknowledged \
            --server http://127.0.0.1:22280 \
            --accountemail grindsa@tnauth.acme \
            --issue -d cert.acme.local \
            --tnauth 123456 --spctoken 1234 --standalone --force --debug 2

      - name: "Channel teardown"
        if: ${{ always() }}
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: rpm
          ARTIFACT_NAME: test-rpm-rh${{ matrix.rhversion }}.tar.gz

  # ---------------------------------------------------------
  # Test DEB downloaded from the producer run
  # ---------------------------------------------------------


  test-deb:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        mode: ['wsgi']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v7

      - name: "Channel setup"
        uses: ./.github/actions/channel_deb_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          PARSE_GH_CFG: "true"
          JSON_SECRET: ${{ secrets.GH_CFG }}

      - name: "Prepare acme_srv.cfg with openssl_ca_handler"
        uses: ./.github/actions/setup_openssl_cahandler

      - name: "Prepare acme_srv.cfg with openssl_ca_handler (config)"
        run: |
          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: True/g" data/volume/acme_srv.cfg
          sudo sed -i "s/volume\/acme_ca/\/var\/www\/acme2certifier\/volume\/acme_ca/g"  data/volume/acme_srv.cfg

      - name: "Execute install script"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh install $WEBSRV -m $MODE
        env:
          WEBSRV: ${{ matrix.websrv }}
          MODE: ${{ matrix.mode }}

      - name: "Wait for ACME directory (http)"
        uses: ./.github/actions/wait_for_directory
        with:
          CHECK_HTTPS: "false"

      - name: "Install curl and socat and test connction"
        run: |
          sudo apt-get install -y curl socat
          curl -f http://localhost:22280

      - name: "Install acme.sh"
        run: |
          mkdir /tmp/acme_sh
          curl -kL https://github.com/grindsa/acme.sh/archive/tnauth_list_support.tar.gz | tar xz -C /tmp/acme_sh --strip-components=1

      - name: "Expect tnauth enrollment to fail without break-glass acknowledgement"
        id: tnauth_fail_closed
        continue-on-error: true
        run: |
          rm -rf /tmp/acme-sh-home-fail-closed
          /tmp/acme_sh/acme.sh --home /tmp/acme-sh-home-fail-closed \
            --server http://127.0.0.1:22280 \
            --accountemail grindsa-fail@tnauth.acme \
            --issue -d cert-fail.acme.local \
            --tnauth 123456 --spctoken 1234 --standalone --force --debug 2

      - name: "Verify tnauth enrollment failed without acknowledgement"
        run: |
          if [[ "${{ steps.tnauth_fail_closed.outcome }}" != "failure" ]]; then
            echo "ERROR: tnauth enrollment succeeded without ACME2CERTIFIER_I_KNOW_THE_RISK"
            exit 1
          fi
          echo "tnauth enrollment failed as expected without break-glass acknowledgement"

      # tkauth-01 has no authority token verification, so the challenge is refused
      # unless the break-glass variable acknowledges it. Testing only.
      # apache2/mod_wsgi has no acme2certifier.service — restart apache2 instead.
      - name: "Acknowledge unverified tkauth-01 authority tokens"
        run: |
          docker exec acme-srv bash -c 'mkdir -p /etc/systemd/system.conf.d && \
            printf "[Manager]\nDefaultEnvironment=ACME2CERTIFIER_I_KNOW_THE_RISK=1\n" \
              > /etc/systemd/system.conf.d/a2c-tkauth.conf && \
            systemctl daemon-reexec'
          if [[ "$WEBSRV" == "apache2" ]]; then
            docker exec acme-srv systemctl restart apache2
          else
            docker exec acme-srv systemctl restart acme2certifier.service
          fi
        env:
          WEBSRV: ${{ matrix.websrv }}

      - name: "Wait for ACME directory after restart"
        uses: ./.github/actions/wait_for_directory
        with:
          CHECK_HTTPS: "false"

      - name: "Enroll certificate using tnauth identifier"
        run: |
          rm -rf /tmp/acme-sh-home-acknowledged
          /tmp/acme_sh/acme.sh --home /tmp/acme-sh-home-acknowledged \
            --server http://127.0.0.1:22280 \
            --accountemail grindsa@tnauth.acme \
            --issue -d cert.acme.local \
            --tnauth 123456 --spctoken 1234 --standalone --force --debug 2

      - name: "Channel teardown"
        if: ${{ always() }}
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: deb
          ARTIFACT_NAME: test-deb-${{ matrix.websrv }}-${{ matrix.mode }}.tar.gz
          WEBSRV: ${{ matrix.websrv }}
