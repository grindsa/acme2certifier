name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type publish to upload the current checkout to PyPI"
        required: true
        default: ""

permissions: {}

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    name: Build and publish
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'grindsa/acme2certifier'
      && (github.event_name != 'workflow_dispatch' || inputs.confirm == 'publish')
    environment:
      name: pypi
      url: https://pypi.org/p/acme2certifier
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
