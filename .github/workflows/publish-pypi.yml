name: Deployment - Publish to PyPI

# release: published does not run when Create Release uses GITHUB_TOKEN.
# main-create-release-push-images-to-dockerhub.yml dispatches this workflow
# with confirm=publish and tag=<version> after it creates a release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type publish to upload the current checkout to PyPI"
        required: true
        default: ""
      tag:
        description: "Release tag to build and to pin README links"
        required: false
        default: ""

permissions: {}

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    name: Build and publish
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'grindsa/acme2certifier'
      && (github.event_name != 'workflow_dispatch' || inputs.confirm == 'publish')
    environment:
      name: pypi
      url: https://pypi.org/p/acme2certifier
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Rewrite README links for PyPI
        env:
          README_REF: ${{ github.event.release.tag_name || inputs.tag || github.sha }}
        run: |
          python .github/scripts/rewrite_readme_links_for_pypi.py README.md \
            --repo "${{ github.repository }}" \
            --ref "${README_REF}"

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
