name: CA-Handler Tests - Hashicorp Vault
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'
      run_id:
        description: 'Run ID of the producing workflow'
        required: true
        default: '0'
      sha:
        description: 'SHA of the commit to run the workflow on'
        required: true
        default: ''
      called_by_workflow:
        description: 'Name of the producing workflow'
        required: true
        default: 'manual-trigger'
      full_ref:
        description: 'Full git ref of the commit to run the workflow on'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ inputs.branch }}
  cancel-in-progress: true

permissions: {}

jobs:
  guard:
    permissions: {}
    uses: ./.github/workflows/_guard.yml
    with:
      sha: ${{ inputs.sha }}
      run_id: ${{ inputs.run_id }}
      branch: ${{ inputs.branch }}

  # ---------------------------------------------------------
  # Test container images (matrix from payload)
  # ---------------------------------------------------------
  test-containers:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        dbhandler: ['wsgi', 'django']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Channel setup"
        uses: ./.github/actions/channel_container_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          WEB_SRV: ${{ matrix.websrv }}
          DB_HANDLER: ${{ matrix.dbhandler }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          NAME_SPACE: acme

      - name: "Instanciate vault"
        uses: ./.github/actions/wf_specific/vault_ca_handler/vault_prep
        with:
          RUNNER_IP: ${{ env.RUNNER_IP }}
          WORKING_DIR: ${{ github.workspace }}/examples/Docker

      - name: "Setup a2c with vault_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.vault_ca_handler
          OPTIONS: |
            vault_url: https://vault.acme:8200
            vault_path: pki_int
            vault_role: serverauth
            vault_token: ${{ env.VAULT_TOKEN }}
            ca_bundle: False
            enrollment_config_log: True
            allowed_domainlist: ["*.acme", "*.bar.local"]
        env:
          VAULT_TOKEN: ${{ env.VAULT_TOKEN }}

      - name: "Setup a2c with vault_ca_handler (post-cfg)"
        run: |
          mkdir -p examples/Docker/data/
          # sudo sed -i "s/revocation_reason_check_disable: False/revocation_reason_check_disable: False\nenrollment_timeout:15/g" examples/Docker/data/acme_srv.cfg
        env:
          VAULT_TOKEN: ${{ env.VAULT_TOKEN }}

      - name: "Bring up a2c container"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Test enrollment"
        uses: ./.github/actions/acme_clients_enroll
        with:
          USE_CERTBOT: "true"
          TEST_ADL: "true"

      - name: "Verify allowed_domainlist error"
        uses: ./.github/actions/logs_assert
        with:
          DEPLOYMENT_TYPE: container
          PATTERN: "FQDN/SAN [^ ]+ not allowed by configuration"
          REGEX: "true"
          IGNORE_CASE: "true"

      - name: "ACME Profiling - setup a2c with vault_ca_handler"
        run: |
          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nprofiles={\"serverauth\": \"http:\/\/foo.bar\/serverauth\", \"clientauth\": \"http:\/\/foo.bar\/clientauth\", \"bar-dot-local\": \"http:\/\/foo.bar\/bar-dot-local\"}/g" examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart
        env:
          VAULT_TOKEN: ${{ env.VAULT_TOKEN }}

      - name: "ACME Profiling - enrollment"
        uses: ./.github/actions/wf_specific/vault_ca_handler/enroll_acmeprofile

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "Stage kid_profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/vault.json
          DEST: examples/Docker/data/kid_profiles.json
      - name: "EAB ACME Profiling - setup a2c with vault_ca_handler"
        run: |
          sudo echo -e "\n[EABhandler]" >> examples/Docker/data/acme_srv.cfg
          sudo echo "eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler" >> examples/Docker/data/acme_srv.cfg
          sudo echo "key_file: volume/kid_profiles.json" >> examples/Docker/data/acme_srv.cfg
          sudo echo "eab_profiling: True" >> examples/Docker/data/acme_srv.cfg

          cd examples/Docker/
          docker compose restart

      - name: "EAB ACME Profiling - enrollment"
        uses: ./.github/actions/wf_specific/vault_ca_handler/enroll_eab_acmeprofile

      - name: "Check container configuration"
        uses: ./.github/actions/container_check
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Channel teardown"
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: container
          ARTIFACT_NAME: test-containers-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz

  # ---------------------------------------------------------
  # Test RPMs (EL8 & EL9) downloaded from the producer run
  # ---------------------------------------------------------


  test-rpm:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        rhversion: [8, 9]
        mode: ['wsgi', 'django']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Channel setup"
        uses: ./.github/actions/channel_rpm_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          RH_VERSION: ${{ matrix.rhversion }}
          JSON_SECRET: ${{ secrets.GH_CFG }}

      - name: "Instanciate vault"
        uses: ./.github/actions/wf_specific/vault_ca_handler/vault_prep
        with:
          RUNNER_IP: ${{ env.RUNNER_IP }}
          WORKING_DIR: ${{ github.workspace }}/examples/Docker

      - name: "Setup a2c with vault_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.vault_ca_handler
          OPTIONS: |
            vault_url: https://vault.acme:8200
            vault_path: pki_int
            vault_role: serverauth
            vault_token: ${{ env.VAULT_TOKEN }}
            ca_bundle: False
            enrollment_config_log: True
            allowed_domainlist: ["*.acme", "*.bar.local"]
        env:
          VAULT_TOKEN: ${{ env.VAULT_TOKEN }}

      - name: "Setup a2c with vault_ca_handler (post-cfg)"
        run: |
          sudo mkdir -p data/volume/acme_ca/certs
          # sudo sed -i "s/revocation_reason_check_disable: False/revocation_reason_check_disable: False\nenrollment_timeout:15/g" data/volume/acme_srv.cfg
          # sudo cat data/volume/acme_srv.cfg
        env:
          VAULT_TOKEN: ${{ env.VAULT_TOKEN }}

      - name: "Execute install script"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh install -m $MODE
          docker ps -a
        env:
          MODE: ${{ matrix.mode }}

      - name: "Test enrollment"
        uses: ./.github/actions/acme_clients_enroll
        with:
          USE_CERTBOT: "true"
          TEST_ADL: "true"

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: rpm

      - name: "ACME Profiling - setup a2c with vault_ca_handler"
        run: |
          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nprofiles={\"serverauth\": \"http:\/\/foo.bar\/serverauth\", \"clientauth\": \"http:\/\/foo.bar\/clientauth\", \"bar-dot-local\": \"http:\/\/foo.bar\/bar-dot-local\"}/g" data/volume/acme_srv.cfg
        env:
          VAULT_TOKEN: ${{ env.VAULT_TOKEN }}

      - name: "Reconfigure a2c"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart
        env:
          MODE: ${{ matrix.mode }}

      - name: "ACME Profiling - enrollment"
        uses: ./.github/actions/wf_specific/vault_ca_handler/enroll_acmeprofile

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: rpm

      - name: "Stage kid_profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/vault.json
          DEST: data/volume/acme_ca/kid_profiles.json
      - name: "EAB ACME Profiling - setup a2c with vault_ca_handler"
        run: |
          sudo echo -e "\n[EABhandler]" >> data/volume/acme_srv.cfg
          sudo echo "eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler" >> data/volume/acme_srv.cfg
          sudo echo "key_file: /opt/acme2certifier/volume/acme_ca/kid_profiles.json" >> data/volume/acme_srv.cfg
          sudo echo "eab_profiling: True" >> data/volume/acme_srv.cfg


      - name: "Reconfigure a2c"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart
        env:
          MODE: ${{ matrix.mode }}

      - name: "EAB ACME Profiling - enrollment"
        uses: ./.github/actions/wf_specific/vault_ca_handler/enroll_eab_acmeprofile

      - name: "Channel teardown"
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: rpm
          ARTIFACT_NAME: test-rpm-rh${{ matrix.rhversion }}-${{ matrix.mode }}.tar.gz

  # ---------------------------------------------------------
  # Test DEB downloaded from the producer run
  # ---------------------------------------------------------


  test-deb:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        mode: ['wsgi', 'django']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Channel setup"
        uses: ./.github/actions/channel_deb_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          DJANGO_DB: ${{ matrix.mode == 'django' && 'psql' || '' }}

      - name: "Instanciate vault"
        uses: ./.github/actions/wf_specific/vault_ca_handler/vault_prep
        with:
          RUNNER_IP: ${{ env.RUNNER_IP }}
          WORKING_DIR: ${{ github.workspace }}/examples/Docker

      - name: "Setup a2c with vault_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.vault_ca_handler
          OPTIONS: |
            vault_url: https://vault.acme:8200
            vault_path: pki_int
            vault_role: serverauth
            vault_token: ${{ env.VAULT_TOKEN }}
            ca_bundle: False
            enrollment_config_log: True
            allowed_domainlist: ["*.acme", "*.bar.local"]
        env:
          VAULT_TOKEN: ${{ env.VAULT_TOKEN }}

      - name: "Setup a2c with vault_ca_handler (post-cfg)"
        run: |
          sudo mkdir -p data/volume/acme_ca/certs
          # sudo sed -i "s/revocation_reason_check_disable: False/revocation_reason_check_disable: False\nenrollment_timeout:15/g" data/volume/acme_srv.cfg
          # sudo cat data/volume/acme_srv.cfg
        env:
          VAULT_TOKEN: ${{ env.VAULT_TOKEN }}

      - name: "Execute install script"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh install $WEBSRV -m $MODE
        env:
          WEBSRV: ${{ matrix.websrv }}
          MODE: ${{ matrix.mode }}

      - name: "Test enrollment"
        uses: ./.github/actions/acme_clients_enroll
        with:
          USE_CERTBOT: "true"
          TEST_ADL: "true"

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: deb

      - name: "ACME Profiling - setup a2c with vault_ca_handler"
        run: |
          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nprofiles={\"serverauth\": \"http:\/\/foo.bar\/serverauth\", \"clientauth\": \"http:\/\/foo.bar\/clientauth\", \"bar-dot-local\": \"http:\/\/foo.bar\/bar-dot-local\"}/g" data/volume/acme_srv.cfg
        env:
          VAULT_TOKEN: ${{ env.VAULT_TOKEN }}

      - name: "Reconfigure a2c "
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh restart $WEBSRV
        env:
          WEBSRV: ${{ matrix.websrv }}
          MODE: ${{ matrix.mode }}

      - name: "ACME Profiling - enrollment"
        uses: ./.github/actions/wf_specific/vault_ca_handler/enroll_acmeprofile

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: deb

      - name: "Stage kid_profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/vault.json
          DEST: data/volume/acme_ca/kid_profiles.json
      - name: "EAB ACME Profiling - setup a2c with vault_ca_handler"
        run: |
          sudo echo -e "\n[EABhandler]" >> data/volume/acme_srv.cfg
          sudo echo "eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler" >> data/volume/acme_srv.cfg
          sudo echo "key_file: /var/www/acme2certifier/volume/acme_ca/kid_profiles.json" >> data/volume/acme_srv.cfg
          sudo echo "eab_profiling: True" >> data/volume/acme_srv.cfg


      - name: "Reconfigure a2c "
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh restart $WEBSRV
        env:
          WEBSRV: ${{ matrix.websrv }}
          MODE: ${{ matrix.mode }}

      - name: "Channel teardown"
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: deb
          ARTIFACT_NAME: test-deb-${{ matrix.websrv }}-${{ matrix.mode }}.tar.gz
          WEBSRV: ${{ matrix.websrv }}
