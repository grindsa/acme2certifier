name: CA-Handler Tests - ACME
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'
      run_id:
        description: 'Run ID of the producing workflow'
        required: true
        default: '0'
      sha:
        description: 'SHA of the commit to run the workflow on'
        required: true
        default: ''
      called_by_workflow:
        description: 'Name of the producing workflow'
        required: true
        default: 'manual-trigger'
      full_ref:
        description: 'Full git ref of the commit to run the workflow on'
        required: false
        default: ''

jobs:

  # ---------------------------------------------------------
  # Quick guard to validate incoming payload
  # ---------------------------------------------------------
  guard:
    runs-on: ubuntu-latest
    if: ${{ inputs.sha != '' && inputs.run_id != '' && inputs.branch != '' && github.repository == 'grindsa/acme2certifier' }}
    steps:
      - run: |
          echo "Triggered by SHA:    $SHA"
          echo "From branch:         $BRANCH"
          echo "Producer run_id:     $RUN_ID"
        env:
          SHA: ${{ inputs.sha }}
          BRANCH: ${{ inputs.branch }}
          RUN_ID: ${{ inputs.run_id }}

  # ---------------------------------------------------------
  # Test container images against le-sim (matrix from payload)
  # ---------------------------------------------------------
  test-containers-lesim:
    needs: guard
    runs-on: ubuntu-latest
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        dbhandler: ['wsgi', 'django']
    steps:

      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Parse XCA configuration from JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.XCA_CFG }}

      - name: "Download and import container"
        uses: ./.github/actions/container_load
        with:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: a2c-${{ inputs.run_id }}.${{ matrix.websrv }}.${{ matrix.dbhandler }}.tar
          DESTINATION_PATH: /tmp
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Prepare container environment"
        uses: ./.github/actions/container_prep
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}
          CONTAINER_BUILD: false

      - name: "Setup acme-le-sim"
        uses: ./.github/actions/wf_specific/acme_ca_handler/le-sim_prep

      - name: "Setup acme ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.acme_ca_handler
          OPTIONS: |
            acme_keyfile: volume/acme/le_staging_private_key.json
            acme_url: http://acme-le-sim
            acme_account_email: grindsa@foo.bar
            allowed_domainlist: ["bar.local", "*.acme"]

      - name: "Setup acme ca_handler (post-cfg)"
        run: |
          sudo mkdir -p examples/Docker/data/acme
          sudo chmod -R 777 examples/Docker/data/acme
          sudo sed -i "s/challenge_validation_disable: False/challenge_validation_disable: True/g" examples/Docker/data/acme_srv.cfg

      - name: "Bring up a2c container"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Test enrollment"
        uses: ./.github/actions/acme_clients
        with:
          TEST_ADL: "true"

      - name: "Verify allowed_domainlist error"
        run: |
          cd examples/Docker
          docker compose logs | grep -iE 'FQDN/SAN [^ ]+ not allowed by configuration'

      - name: "Check acme account found in keyfile"
        run: |
          cd examples/Docker
          docker compose logs | grep -i "found in keyfile"

      - name: "Check container configuration"
        uses: ./.github/actions/container_check
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "ACME Profile - Setup acme ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.acme_ca_handler
          OPTIONS: |
            acme_keyfile: volume/acme/le_staging_private_key.json
            acme_url: http://acme-le-sim
            acme_account_email: grindsa@foo.bar
            allowed_domainlist: ["bar.local", "*.acme"]
            enrollment_config_log: True

      - name: "ACME Profile - Setup acme ca_handler (post-cfg)"
        run: |
          sudo mkdir -p examples/Docker/data/acme
          sudo chmod -R 777 examples/Docker/data/acme
          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nprofiles={\"profile1\": \"http:\/\/foo.bar\/profile1\", \"profile2\": \"http:\/\/foo.bar\/profile2\", \"profile3\": \"http:\/\/foo.bar\/profile3\"}/g" examples/Docker/data/acme_srv.cfg
          sudo sed -i "s/challenge_validation_disable: False/challenge_validation_disable: True/g" examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart

      - name: "ACME Profile - enrollment"
        uses: ./.github/actions/wf_specific/acme_ca_handler/enroll_acmeprofile
        with:
          DEPLOYMENT_TYPE: "container"

      - name: "[ * ] Collecting extra failure logs"
        if: ${{ failure() }}
        run: |
          mkdir -p ${{ github.workspace }}/artifact ${{ github.workspace }}/artifact/data
          docker logs acme-le-sim > ${{ github.workspace }}/artifact/acme-le-sim.log

      - name: "[ * ] collecting test data"
        if: ${{ failure() }}
        uses: ./.github/actions/collect_failure_logs
        with:
          DEPLOYMENT_TYPE: container

      - name: "[ * ] Uploading artifacts"
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: test-container-lesim-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz
          path: ${{ github.workspace }}/artifact/upload/

  # ---------------------------------------------------------
  # Test container images for sectigo challenge
  # ---------------------------------------------------------
  test-containers-sectigo:
    needs: guard
    runs-on: ubuntu-latest
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        dbhandler: ['wsgi', 'django']
    steps:

      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Parse XCA configuration from JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.XCA_CFG }}

      - name: "Download and import container"
        uses: ./.github/actions/container_load
        with:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: a2c-${{ inputs.run_id }}.${{ matrix.websrv }}.${{ matrix.dbhandler }}.tar
          DESTINATION_PATH: /tmp
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Prepare container environment"
        uses: ./.github/actions/container_prep
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}
          CONTAINER_BUILD: false

      - name: "Setup le-sim"
        uses: ./.github/actions/wf_specific/acme_ca_handler/le-sim_prep
        with:
          SECTIGO_SIM: true

      - name: "Setup openssl ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.acme_ca_handler
          OPTIONS: |
            acme_keyfile: volume/acme/le_staging_private_key.json
            acme_url: http://acme-le-sim
            acme_account_email: grindsa@foo.bar

      - name: "Setup openssl ca_handler (post-cfg)"
        run: |
          sudo mkdir -p examples/Docker/data/acme
          sudo sed -i "s/challenge_validation_disable: False/challenge_validation_disable: True/g" examples/Docker/data/acme_srv.cfg

      - name: "Bring up a2c container"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Test enrollment"
        uses: ./.github/actions/acme_clients

      - name: "Check container configuration"
        uses: ./.github/actions/container_check
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "[ * ] Collecting extra failure logs"
        if: ${{ failure() }}
        run: |
          mkdir -p ${{ github.workspace }}/artifact ${{ github.workspace }}/artifact/data
          docker logs acme-le-sim > ${{ github.workspace }}/artifact/acme-le-sim.log

      - name: "[ * ] collecting test data"
        if: ${{ failure() }}
        uses: ./.github/actions/collect_failure_logs
        with:
          DEPLOYMENT_TYPE: container

      - name: "[ * ] Uploading artifacts"
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: test-containers-sectigo-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz
          path: ${{ github.workspace }}/artifact/upload/

  # ---------------------------------------------------------
  # Test container images against acme-le-sim with profiling
  # ---------------------------------------------------------
  test-containers-profiling:
    needs: guard
    runs-on: ubuntu-latest
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        dbhandler: ['wsgi', 'django']
    steps:

      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Parse XCA configuration from JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.XCA_CFG }}

      - name: "Download and import container"
        uses: ./.github/actions/container_load
        with:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: a2c-${{ inputs.run_id }}.${{ matrix.websrv }}.${{ matrix.dbhandler }}.tar
          DESTINATION_PATH: /tmp
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Prepare container environment"
        uses: ./.github/actions/container_prep
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}
          CONTAINER_BUILD: false

      - name: "Setup acme-le-sim-1"
        uses: ./.github/actions/wf_specific/acme_ca_handler/le-sim_prep
        with:
          LESIM_NAME: acme-le-sim-1

      - name: "Setup acme-le-sim-2"
        uses: ./.github/actions/wf_specific/acme_ca_handler/le-sim_prep
        with:
          LESIM_NAME: acme-le-sim-2

      - name: "Reconfigure acme-le-sim-2"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "acme-le-sim-2"
          HANDLER_MODULE: acme2certifier.cahandlers.xca_ca_handler
          OPTIONS: |
            xdb_file: volume/xca/${{ env.XCA_DB_NAME }}
            issuing_ca_name: root-ca
            issuing_ca_key: root-ca
            passphrase: ${{ env.XCA_PASSPHRASE }}
            template_name: ${{ env.XCA_TEMPLATE }}
        env:
          XCA_PASSPHRASE: ${{ env.XCA_PASSPHRASE }}
          XCA_ISSUING_CA: ${{ env.XCA_ISSUING_CA }}
          XCA_TEMPLATE: ${{ env.XCA_TEMPLATE }}
          XCA_DB_NAME: ${{ env.XCA_DB_NAME }}

      - name: "Reconfigure acme-le-sim-2 (post-cfg)"
        run: |
          docker stop acme-le-sim-2
          sudo mkdir acme-le-sim-2/xca
          sudo chmod -R 777 acme-le-sim-2/xca
          sudo cp test/ca/acme2certifier-clean.xdb acme-le-sim-2/xca/$XCA_DB_NAME
          # sudo echo "ca_cert_chain_list: [\"root-ca\"]" >> acme-le-sim-2/acme_srv.cfg
          sudo sed -i "s/challenge_validation_disable: False/challenge_validation_disable: True/g" acme-le-sim-2/acme_srv.cfg
          docker run -d --rm -id --network acme --name=acme-le-sim-2 -v "$(pwd)/acme-le-sim-2":/var/www/acme2certifier/volume/ grindsa/acme2certifier:apache2-wsgi
        env:
          XCA_PASSPHRASE: ${{ env.XCA_PASSPHRASE }}
          XCA_ISSUING_CA: ${{ env.XCA_ISSUING_CA }}
          XCA_TEMPLATE: ${{ env.XCA_TEMPLATE }}
          XCA_DB_NAME: ${{ env.XCA_DB_NAME }}

      - name: "Wait for ACME directory (http)"
        uses: ./.github/actions/wait_for_directory
        with:
          ACME_SERVER: "acme-le-sim-2"
          CHECK_HTTPS: "false"

      - name: "Enroll from acme-le-sim-2"
        run: |
          sudo rm -rf acme-sh/*
          docker run --rm -i -v "$(pwd)/acme-sh":/acme.sh --network acme --name=acme-sh neilpang/acme.sh:latest --issue  --server http://acme-le-sim-2 --accountemail 'acme-sh@example.com' -d acme-sh.acme --standalone --debug 3 --output-insecure --force
          openssl verify -CAfile acme-sh/acme-sh.acme_ecc/ca.cer acme-sh/acme-sh.acme_ecc/acme-sh.acme.cer
          openssl x509 -in acme-sh/acme-sh.acme_ecc/acme-sh.acme.cer -issuer --noout | grep -i root-ca
          sudo rm -rf acme-sh/*

      - name: "EAB Profiling - Setup acme ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.acme_ca_handler
          OPTIONS: |
            acme_keyfile: volume/acme/le_staging_private_key.json
            acme_keypath: volume/acme/
            acme_url: http://acme-le-sim-1
            acme_account_email: grindsa@foo.bar
          EXTRA_SECTIONS: |
            [EABhandler]
            eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler
            key_file: volume/kid_profiles.json
            eab_profiling: True

      - name: "Stage kid_profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/acme.json
          DEST: examples/Docker/data/kid_profiles.json
      - name: "EAB Profiling - Setup acme ca_handler (post-cfg)"
        run: |
          sudo mkdir -p examples/Docker/data/acme
          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nheader_info_list: [\"HTTP_USER_AGENT\"]/g" examples/Docker/data/acme_srv.cfg
          sudo sed -i "s/challenge_validation_disable: False/challenge_validation_disable: True/g" examples/Docker/data/acme_srv.cfg


      - name: "EAB Profiling - Bring up a2c container"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "EAB Profiling - enrollment"
        uses: ./.github/actions/wf_specific/acme_ca_handler/enrollment_profiling

      - name: "Check container configuration"
        uses: ./.github/actions/container_check
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "EAB ACME Profiling - Setup acme ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.acme_ca_handler
          OPTIONS: |
            acme_keyfile: volume/acme/le_staging_private_key_prof.json
            acme_keypath: volume/acme/
            acme_url: http://acme-le-sim-1
            acme_account_email: grindsa@foo.bar
            profile: profile_1
            enrollment_config_log: True
          EXTRA_SECTIONS: |
            [EABhandler]
            eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler
            key_file: volume/kid_profiles.json
            eab_profiling: True

      - name: "Stage kid_profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/acme_profiles.json
          DEST: examples/Docker/data/kid_profiles.json
      - name: "EAB ACME Profiling - Setup acme ca_handler (post-cfg)"
        run: |
          sudo mkdir -p examples/Docker/data/acme
          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nprofiles={\"profile_1\": \"http:\/\/foo.bar\/profile_1\", \"profile_2\": \"http:\/\/foo.bar\/profile_2\", \"profile_3\": \"http:\/\/foo.bar\/profile_3\"}/g" examples/Docker/data/acme_srv.cfg
          sudo sed -i "s/challenge_validation_disable: False/challenge_validation_disable: True/g" examples/Docker/data/acme_srv.cfg
          sudo sed -i "s/challenge_validation_disable: False/challenge_validation_disable: True/g" examples/Docker/data/acme_srv.cfg

          cd examples/Docker/
          docker compose restart

      - name: "EAB ACME Profiling - enrollment"
        uses: ./.github/actions/wf_specific/acme_ca_handler/enroll_eab_acmeprofile
        with:
          DEPLOYMENT_TYPE: "container"

      - name: "[ * ] Collecting extra failure logs"
        if: ${{ failure() }}
        run: |
          mkdir -p ${{ github.workspace }}/artifact ${{ github.workspace }}/artifact/data
          sudo cp -rp acme-le-sim-1/ ${{ github.workspace }}/artifact/data/acme-le-sim-1/
          sudo cp -rp acme-le-sim-2/ ${{ github.workspace }}/artifact/data/acme-le-sim-2/
          docker logs acme-le-sim-1 > ${{ github.workspace }}/artifact/acme-le-sim-1.log
          docker logs acme-le-sim-2 > ${{ github.workspace }}/artifact/acme-le-sim-2.log

      - name: "[ * ] collecting test data"
        if: ${{ failure() }}
        uses: ./.github/actions/collect_failure_logs
        with:
          DEPLOYMENT_TYPE: container

      - name: "[ * ] Uploading artifacts"
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: test-containers-profiling-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz
          path: ${{ github.workspace }}/artifact/upload/

  # ---------------------------------------------------------
  # Test container images against smallstep challenge
  # ---------------------------------------------------------
  test-containers-smallstep:
    needs: guard
    runs-on: ubuntu-latest
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        dbhandler: ['wsgi', 'django']
    steps:

      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Parse XCA configuration from JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.XCA_CFG }}

      - name: "Download and import container"
        uses: ./.github/actions/container_load
        with:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: a2c-${{ inputs.run_id }}.${{ matrix.websrv }}.${{ matrix.dbhandler }}.tar
          DESTINATION_PATH: /tmp
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Prepare container environment"
        uses: ./.github/actions/container_prep
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}
          CONTAINER_BUILD: false

      - name: "Instanciate smallstep"
        uses: ./.github/actions/wf_specific/acme_ca_handler/smallstep_prep

      - name: "Setup acme ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.acme_ca_handler
          OPTIONS: |
            acme_keyfile: volume/acme/le_staging_private_key.json
            acme_url: https://step-ca.acme:9000/acme/acme
            acme_account_email: grindsa@foo.bar
            account_path: /
            ssl_verify: False

      - name: "Setup acme ca_handler (post-cfg)"
        run: |
          sudo mkdir -p examples/Docker/data/acme
          sudo sed -i "s/challenge_validation_disable: False/challenge_validation_disable: True/g" examples/Docker/data/acme_srv.cfg

      - name: "Bring up a2c container"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Enroll via acme_ca_handler 1st attempt"
        run: |
          docker run --rm -i -v "$(pwd)/acme-sh":/acme.sh --network acme --name=acme-sh neilpang/acme.sh:latest --issue --server http://acme-srv --accountemail 'acme-sh@example.com' --issue -d acme-srv.acme --standalone --debug 3 --output-insecure --force

      - name: "Enroll via acme_ca_handler 2nd attempt"
        run: |
          docker run --rm -i -v "$(pwd)/acme-sh":/acme.sh --network acme --name=acme-sh neilpang/acme.sh:latest --issue --server http://acme-srv --accountemail 'acme-sh@example.com' --issue -d acme-srv.acme --standalone --debug 3 --output-insecure --force

      - name: "Check acme account found in keyfile"
        run: |
          cd examples/Docker
          docker compose logs | grep -i "found in keyfile"

      - name: "Check container configuration"
        uses: ./.github/actions/container_check
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "[ * ] Collecting extra failure logs"
        if: ${{ failure() }}
        run: |
          mkdir -p ${{ github.workspace }}/artifact ${{ github.workspace }}/artifact/data
          docker logs step-ca > ${{ github.workspace }}/artifact/step-ca.log

      - name: "[ * ] collecting test data"
        if: ${{ failure() }}
        uses: ./.github/actions/collect_failure_logs
        with:
          DEPLOYMENT_TYPE: container

      - name: "[ * ] Uploading artifacts"
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: test-containers-smallstep-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz
          path: ${{ github.workspace }}/artifact/upload/

  # ---------------------------------------------------------
  # Test container images against Letsencrypt staging
  # including profile sync and renewal info checking
  # ---------------------------------------------------------
  test-containers-letsencrypt:
    needs: guard
    runs-on: ubuntu-latest
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        dbhandler: ['wsgi', 'django']
    steps:

      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Parse JSON secret - ACMEDNS_CFG"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.ACMEDNS_CFG }}

      - name: "Parse JSON secret - CF_CFG"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.CF_CFG }}

      - name: "Parse EMAIL configuration from JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.EMAILADDRESSES_CFG }}

      - name: "Download and import container"
        uses: ./.github/actions/container_load
        with:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: a2c-${{ inputs.run_id }}.${{ matrix.websrv }}.${{ matrix.dbhandler }}.tar
          DESTINATION_PATH: /tmp
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Prepare container environment"
        uses: ./.github/actions/container_prep
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}
          CONTAINER_BUILD: false
          NAME_SPACE: acme.dynamop.de

      - name: "CloudFlare - Setup acme ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.acme_ca_handler
          OPTIONS: |
            acme_keyfile: volume/acme/le_staging_private_key.json
            acme_url: https://acme-staging-v02.api.letsencrypt.org
            acme_account_email: ${{ env.EMAIL }}
            acme_sh_script: volume/acme/acme.sh
            dns_update_script: volume/acme/dns_cf.sh
            dns_update_script_variables: {"CF_Token": "${{ env.CF_TOKEN }}", "CF_Zone_ID": "${{ env.CF_ZONE_ID }}"}
            acme_sh_shell: /bin/bash
            dns_validation_timeout: 20
            enrollment_config_log: True
            profiles_sync: True
            renewalinfo_lookup: True
            allowed_domainlist: ["bar.local", "*.acme.dynamop.de"]
        env:
          CF_TOKEN: ${{ env.CF_TOKEN }}
          CF_ZONE_ID: ${{ env.CF_ZONE_ID }}

      - name: "CloudFlare - Setup acme ca_handler (post-cfg)"
        run: |
          sudo mkdir -p examples/Docker/data/acme
          sudo chmod -R 777 examples/Docker/data/acme
          sudo curl https://raw.githubusercontent.com/acmesh-official/acme.sh/refs/heads/master/acme.sh --output examples/Docker/data/acme/acme.sh
          sudo curl https://raw.githubusercontent.com/acmesh-official/acme.sh/refs/heads/master/dnsapi/dns_cf.sh --output examples/Docker/data/acme/dns_cf.sh
          sudo chmod a+x examples/Docker/data/acme/*.sh
          sudo sed -i "s/challenge_validation_disable: False/challenge_validation_disable: True/g" examples/Docker/data/acme_srv.cfg
          # sudo sed -i "s/revocation_reason_check_disable: False/revocation_reason_check_disable: False\nenrollment_timeout: 15/g" examples/Docker/data/acme_srv.cfg
        env:
          CF_TOKEN: ${{ env.CF_TOKEN }}
          CF_ZONE_ID: ${{ env.CF_ZONE_ID }}

      - name: "CloudFlare - Bring up a2c container"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}
          NAME_SPACE: acme.dynamop.de

      - name: "Compare profile information"
        uses: ./.github/actions/wf_specific/acme_ca_handler/compare_profile_info
        with:
          NAME_SPACE: acme.dynamop.de

      - name: "Generate UUID"
        run: |
          echo UUID=$(uuidgen | cut -d "-" -f1) >> $GITHUB_ENV
      - run: echo "UUID ${{ env.UUID }}"

      - name: "Compare renewal information between A2C and LE"
        uses: ./.github/actions/wf_specific/acme_ca_handler/compare_renewal_info
        with:
          NAME_SPACE: acme.dynamop.de
          HOSTNAME_SUFFIX: -${{ env.UUID }}
          CERTIFICATE_FILE: "lego/certificates/lego-${{ env.UUID }}.acme.dynamop.de.crt"

      - name: "Generate new UUID"
        run: |
          echo UUID=$(uuidgen | cut -d "-" -f1) >> $GITHUB_ENV
      - run: echo "UUID ${{ env.UUID }}"

      - name: "Enrollment"
        uses: ./.github/actions/wf_specific/acme_ca_handler/enroll_dns
        with:
          HOSTNAME_SUFFIX: -${{ env.UUID }}
          NAME_SPACE: acme.dynamop.de
          CERT_TIMEOUT: "360"
          VERIFY_CERT: false

      - name: "ACMEDNS - Setup acme ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.acme_ca_handler
          OPTIONS: |
            acme_keyfile: volume/acme/le_staging_private_key.json
            acme_url: https://acme-staging-v02.api.letsencrypt.org
            acme_account_email: ${{ env.EMAIL }}
            acme_sh_script: volume/acme/acme.sh
            dns_update_script: volume/acme/dns_acmedns.sh
            dns_update_script_variables: {"ACMEDNS_USERNAME": "${{ env.ACMEDNS_USERNAME }}", "ACMEDNS_PASSWORD": "${{ env.ACMEDNS_PASSWORD }}", "ACMEDNS_BASE_URL": "https://auth.acme-dns.io", "ACMEDNS_SUBDOMAIN": "${{ env.ACMEDNS_SUBDOMAIN }}"}
            acme_sh_shell: /bin/bash
            dns_validation_timeout: 30
            enrollment_config_log: True
            allowed_domainlist: ["bar.local", "*.acme.dynamop.de"]
            profiles_sync: True
            renewalinfo_lookup: True
        env:
          ACMEDNS_USERNAME: ${{ env.ACMEDNS_USERNAME }}
          ACMEDNS_PASSWORD: ${{ env.ACMEDNS_PASSWORD }}
          ACMEDNS_SUBDOMAIN: ${{ env.ACMEDNS_SUBDOMAIN }}

      - name: "ACMEDNS - Setup acme ca_handler (post-cfg)"
        run: |
          sudo mkdir -p examples/Docker/data/acme
          sudo chmod -R 777 examples/Docker/data/acme
          sudo curl https://raw.githubusercontent.com/acmesh-official/acme.sh/refs/heads/master/acme.sh --output examples/Docker/data/acme/acme.sh
          sudo curl https://raw.githubusercontent.com/acmesh-official/acme.sh/refs/heads/master/dnsapi/dns_acmedns.sh --output examples/Docker/data/acme/dns_acmedns.sh
          sudo chmod a+x examples/Docker/data/acme/*.sh
          sudo sed -i "s/challenge_validation_disable: False/challenge_validation_disable: True/g" examples/Docker/data/acme_srv.cfg
          sudo sed -i "s/revocation_reason_check_disable: False/revocation_reason_check_disable: False\nenrollment_timeout: 15/g" examples/Docker/data/acme_srv.cfg

          cd examples/Docker/
          docker compose restart
        env:
          ACMEDNS_USERNAME: ${{ env.ACMEDNS_USERNAME }}
          ACMEDNS_PASSWORD: ${{ env.ACMEDNS_PASSWORD }}
          ACMEDNS_SUBDOMAIN: ${{ env.ACMEDNS_SUBDOMAIN }}

      - name: "ACMEDNS - WC - Enrollment"
        uses: ./.github/actions/wf_specific/acme_ca_handler/enroll_dns_wc
        with:
          NAME_SPACE: acme.dynamop.de
          CERT_TIMEOUT: 360
          VERIFY_CERT: false

      - name: "Check acme account found in keyfile"
        run: |
          cd examples/Docker
          docker compose logs | grep -i "found in keyfile"

      - name: "Check container configuration"
        uses: ./.github/actions/container_check
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "[ * ] collecting test data"
        if: ${{ failure() }}
        uses: ./.github/actions/collect_failure_logs
        with:
          DEPLOYMENT_TYPE: container

      - name: "[ * ] Uploading artifacts"
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: test-containers-letsencrypt-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz
          path: ${{ github.workspace }}/artifact/upload/

  # ---------------------------------------------------------
  # Test RPM against le-sim
  # ---------------------------------------------------------
  test-rpm-lesim:
    needs: guard
    runs-on: ubuntu-latest
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        rhversion: [8, 9]
        mode: ['wsgi', 'django']
    steps:

      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Parse JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.GH_CFG }}

      - name: "Prepare Alma environment"
        uses: ./.github/actions/rpm_prep
        with:
          GH_USER: ${{ env.GH_USER }}
          GH_SBOM_REPO_TOKEN: ${{ env.GH_SBOM_REPO_TOKEN }}
          RH_VERSION: ${{ matrix.rhversion }}
          RPM_BUILD: false

      - name: "Download RPM artifact by name from build run"
        uses: ./.github/actions/download_artifact
        with:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: acme2certifier-${{ inputs.run_id }}.noarch.rpm
          DESTINATION_PATH: data/
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Setup le-sim"
        uses: ./.github/actions/wf_specific/acme_ca_handler/le-sim_prep

      - name: "Prepare setup acme_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.acme_ca_handler
          OPTIONS: |
            acme_keyfile: /opt/acme2certifier/volume/le_staging_private_key.json
            acme_url: http://acme-le-sim
            acme_account_email: grindsa@foo.bar
            allowed_domainlist: ["bar.local", "*.acme"]

      - name: "Prepare setup acme_ca_handler (post-cfg)"
        run: |
          sudo mkdir -p data/acme
          sudo sed -i "s/challenge_validation_disable: False/challenge_validation_disable: True/g" data/volume/acme_srv.cfg

      - name: "Execute install script"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh install -m $MODE
        env:
          MODE: ${{ matrix.mode }}

      - name: "Test enrollment"
        uses: ./.github/actions/acme_clients
        with:
          TEST_ADL: "true"

      - name: "Verify allowed_domainlist error"
        run: |
          docker exec acme-srv grep -iE 'FQDN/SAN [^ ]+ not allowed by configuration' /var/log/messages

      - name: "Check acme account found in keyfile"
        run: |
          # docker exec acme-srv grep -i "found in keyfile" /var/log/messages
          docker exec acme-srv bash -c "grep -i \"found in keyfile\" /var/log/messages"

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: rpm

      - name: "ACME Profile - Setup acme ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.acme_ca_handler
          OPTIONS: |
            acme_keyfile: /opt/acme2certifier/volume/le_staging_private_key.json
            acme_url: http://acme-le-sim
            acme_account_email: grindsa@foo.bar
            allowed_domainlist: ["bar.local", "*.acme"]
            enrollment_config_log: True

      - name: "ACME Profile - Setup acme ca_handler (post-cfg)"
        run: |
          sudo mkdir -p data/acme
          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nprofiles={\"profile1\": \"http:\/\/foo.bar\/profile1\", \"profile2\": \"http:\/\/foo.bar\/profile2\", \"profile3\": \"http:\/\/foo.bar\/profile3\"}/g" data/volume/acme_srv.cfg
          sudo sed -i "s/challenge_validation_disable: False/challenge_validation_disable: True/g" data/volume/acme_srv.cfg

      - name: "ACME Profile - Reconfigure a2c"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart
        env:
          MODE: ${{ matrix.mode }}

      - name: "ACME Profile - enrollment"
        uses: ./.github/actions/wf_specific/acme_ca_handler/enroll_acmeprofile
        with:
          DEPLOYMENT_TYPE: "rpm"

      - name: "[ * ] Collecting extra failure logs"
        if: ${{ failure() }}
        run: |
          mkdir -p ${{ github.workspace }}/artifact ${{ github.workspace }}/artifact/data
          docker logs acme-le-sim > ${{ github.workspace }}/artifact/le-sim.log

      - name: "[ * ] Collecting test logs"
        if: ${{ failure() }}
        uses: ./.github/actions/collect_failure_logs
        with:
          DEPLOYMENT_TYPE: rpm

      - name: "[ * ] Uploading artifacts"
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: test-rpm-lesim-rh${{ matrix.rhversion }}-${{ matrix.mode }}.tar.gz
          path: ${{ github.workspace }}/artifact/upload/

