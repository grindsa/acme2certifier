name: CA-Handler Tests - ACME
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'
      run_id:
        description: 'Run ID of the producing workflow'
        required: true
        default: '0'
      sha:
        description: 'SHA of the commit to run the workflow on'
        required: true
        default: ''
      called_by_workflow:
        description: 'Name of the producing workflow'
        required: true
        default: 'manual-trigger'
      full_ref:
        description: 'Full git ref of the commit to run the workflow on'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ inputs.branch }}
  cancel-in-progress: true

permissions: {}

jobs:

  guard:
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ inputs.sha != '' && inputs.run_id != '' && inputs.branch != '' && github.repository == 'grindsa/acme2certifier' }}
    steps:
      - run: |
          echo "Triggered by SHA:    $SHA"
          echo "From branch:         $BRANCH"
          echo "Producer run_id:     $RUN_ID"
        env:
          SHA: ${{ inputs.sha }}
          BRANCH: ${{ inputs.branch }}
          RUN_ID: ${{ inputs.run_id }}

  # ---------------------------------------------------------
  # Containers — le-sim
  # ---------------------------------------------------------
  test-containers-lesim:
    permissions:
      contents: read
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        dbhandler: ['wsgi', 'django']
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.XCA_CFG }}

      - uses: ./.github/actions/wf_specific/acme_ca_handler/container_bootstrap
        with:
          RUN_ID: ${{ inputs.run_id }}
          WEB_SRV: ${{ matrix.websrv }}
          DB_HANDLER: ${{ matrix.dbhandler }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - uses: ./.github/actions/wf_specific/acme_ca_handler/le-sim_prep

      - uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.acme_ca_handler
          OPTIONS: |
            acme_keyfile: volume/acme/le_staging_private_key.json
            acme_url: http://acme-le-sim
            acme_account_email: grindsa@foo.bar
            allowed_domainlist: ["bar.local", "*.acme"]

      - uses: ./.github/actions/wf_specific/acme_ca_handler/post_cfg_common
        with:
          VOLUME_DIR: "examples/Docker/data"

      - uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - uses: ./.github/actions/wait_for_directory

      - uses: ./.github/actions/acme_clients
        with:
          TEST_ADL: "true"

      - name: "Verify allowed_domainlist error"
        uses: ./.github/actions/logs_assert
        with:
          DEPLOYMENT_TYPE: container
          PATTERN: "FQDN/SAN [^ ]+ not allowed by configuration"
          REGEX: "true"
          IGNORE_CASE: "true"
          FLUSH: "false"

      - name: "Check acme account found in keyfile"
        uses: ./.github/actions/logs_assert
        with:
          DEPLOYMENT_TYPE: container
          PATTERN: "found in keyfile"
          IGNORE_CASE: "true"
          FLUSH: "false"

      - uses: ./.github/actions/container_check
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.acme_ca_handler
          OPTIONS: |
            acme_keyfile: volume/acme/le_staging_private_key.json
            acme_url: http://acme-le-sim
            acme_account_email: grindsa@foo.bar
            allowed_domainlist: ["bar.local", "*.acme"]
            enrollment_config_log: True

      - uses: ./.github/actions/wf_specific/acme_ca_handler/post_cfg_common
        with:
          VOLUME_DIR: "examples/Docker/data"
          EXTRA_SED: 's/tnauthlist_support: False/tnauthlist_support: False\nprofiles={"profile1": "http:\/\/foo.bar\/profile1", "profile2": "http:\/\/foo.bar\/profile2", "profile3": "http:\/\/foo.bar\/profile3"}/g'

      - name: "Restart a2c"
        run: |
          cd examples/Docker/
          docker compose restart

      - uses: ./.github/actions/wait_for_directory

      - uses: ./.github/actions/wf_specific/acme_ca_handler/enroll_acmeprofile
        with:
          DEPLOYMENT_TYPE: "container"

      - uses: ./.github/actions/wf_specific/acme_ca_handler/failure_artifacts
        if: ${{ failure() }}
        with:
          DEPLOYMENT_TYPE: container
          ARTIFACT_NAME: test-container-lesim-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz
          SIDECAR_LOGS: acme-le-sim

      - name: "Secure cleanup"
        if: ${{ always() }}
        uses: ./.github/actions/secure_cleanup

  # ---------------------------------------------------------
  # Containers — sectigo sim
  # ---------------------------------------------------------
  test-containers-sectigo:
    permissions:
      contents: read
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        dbhandler: ['wsgi', 'django']
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.XCA_CFG }}

      - uses: ./.github/actions/wf_specific/acme_ca_handler/container_bootstrap
        with:
          RUN_ID: ${{ inputs.run_id }}
          WEB_SRV: ${{ matrix.websrv }}
          DB_HANDLER: ${{ matrix.dbhandler }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - uses: ./.github/actions/wf_specific/acme_ca_handler/le-sim_prep
        with:
          SECTIGO_SIM: true

      - uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.acme_ca_handler
          OPTIONS: |
            acme_keyfile: volume/acme/le_staging_private_key.json
            acme_url: http://acme-le-sim
            acme_account_email: grindsa@foo.bar

      - uses: ./.github/actions/wf_specific/acme_ca_handler/post_cfg_common
        with:
          VOLUME_DIR: "examples/Docker/data"

      - uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - uses: ./.github/actions/wait_for_directory

      - uses: ./.github/actions/acme_clients

      - uses: ./.github/actions/container_check
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - uses: ./.github/actions/wf_specific/acme_ca_handler/failure_artifacts
        if: ${{ failure() }}
        with:
          DEPLOYMENT_TYPE: container
          ARTIFACT_NAME: test-containers-sectigo-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz
          SIDECAR_LOGS: acme-le-sim

      - name: "Secure cleanup"
        if: ${{ always() }}
        uses: ./.github/actions/secure_cleanup

  # ---------------------------------------------------------
  # Containers — EAB profiling
  # ---------------------------------------------------------
  test-containers-profiling:
    permissions:
      contents: read
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        dbhandler: ['wsgi', 'django']
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.XCA_CFG }}

      - uses: ./.github/actions/wf_specific/acme_ca_handler/container_bootstrap
        with:
          RUN_ID: ${{ inputs.run_id }}
          WEB_SRV: ${{ matrix.websrv }}
          DB_HANDLER: ${{ matrix.dbhandler }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - uses: ./.github/actions/wf_specific/acme_ca_handler/le-sim_prep
        with:
          LESIM_NAME: acme-le-sim-1

      - uses: ./.github/actions/wf_specific/acme_ca_handler/le-sim_prep
        with:
          LESIM_NAME: acme-le-sim-2

      - uses: ./.github/actions/wf_specific/acme_ca_handler/dual_sim_xca_prep
        with:
          XCA_DB_NAME: ${{ env.XCA_DB_NAME }}
          XCA_PASSPHRASE: ${{ env.XCA_PASSPHRASE }}
          XCA_TEMPLATE: ${{ env.XCA_TEMPLATE }}

      - uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.acme_ca_handler
          OPTIONS: |
            acme_keyfile: volume/acme/le_staging_private_key.json
            acme_keypath: volume/acme/
            acme_url: http://acme-le-sim-1
            acme_account_email: grindsa@foo.bar
          EXTRA_SECTIONS: |
            [EABhandler]
            eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler
            key_file: volume/kid_profiles.json
            eab_profiling: True

      - uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/acme.json
          DEST: examples/Docker/data/kid_profiles.json

      - uses: ./.github/actions/wf_specific/acme_ca_handler/post_cfg_common
        with:
          VOLUME_DIR: "examples/Docker/data"
          EXTRA_SED: 's/tnauthlist_support: False/tnauthlist_support: False\nheader_info_list: ["HTTP_USER_AGENT"]/g'

      - uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - uses: ./.github/actions/wait_for_directory

      - uses: ./.github/actions/wf_specific/acme_ca_handler/enrollment_profiling

      - uses: ./.github/actions/container_check
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.acme_ca_handler
          OPTIONS: |
            acme_keyfile: volume/acme/le_staging_private_key_prof.json
            acme_keypath: volume/acme/
            acme_url: http://acme-le-sim-1
            acme_account_email: grindsa@foo.bar
            profile: profile_1
            enrollment_config_log: True
          EXTRA_SECTIONS: |
            [EABhandler]
            eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler
            key_file: volume/kid_profiles.json
            eab_profiling: True

      - uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/acme_profiles.json
          DEST: examples/Docker/data/kid_profiles.json

      - uses: ./.github/actions/wf_specific/acme_ca_handler/post_cfg_common
        with:
          VOLUME_DIR: "examples/Docker/data"
          EXTRA_SED: 's/tnauthlist_support: False/tnauthlist_support: False\nprofiles={"profile_1": "http:\/\/foo.bar\/profile_1", "profile_2": "http:\/\/foo.bar\/profile_2", "profile_3": "http:\/\/foo.bar\/profile_3"}/g'

      - name: "Restart a2c"
        run: |
          cd examples/Docker/
          docker compose restart

      - uses: ./.github/actions/wait_for_directory

      - uses: ./.github/actions/wf_specific/acme_ca_handler/enroll_eab_acmeprofile
        with:
          DEPLOYMENT_TYPE: "container"

      - uses: ./.github/actions/wf_specific/acme_ca_handler/failure_artifacts
        if: ${{ failure() }}
        with:
          DEPLOYMENT_TYPE: container
          ARTIFACT_NAME: test-containers-profiling-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz
          SIDECAR_LOGS: acme-le-sim-1,acme-le-sim-2
          COPY_DIRS: acme-le-sim-1,acme-le-sim-2

      - name: "Secure cleanup"
        if: ${{ always() }}
        uses: ./.github/actions/secure_cleanup

  # ---------------------------------------------------------
  # Containers — smallstep
  # ---------------------------------------------------------
  test-containers-smallstep:
    permissions:
      contents: read
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        dbhandler: ['wsgi', 'django']
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.XCA_CFG }}

      - uses: ./.github/actions/wf_specific/acme_ca_handler/container_bootstrap
        with:
          RUN_ID: ${{ inputs.run_id }}
          WEB_SRV: ${{ matrix.websrv }}
          DB_HANDLER: ${{ matrix.dbhandler }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - uses: ./.github/actions/wf_specific/acme_ca_handler/smallstep_prep

      - uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.acme_ca_handler
          OPTIONS: |
            acme_keyfile: volume/acme/le_staging_private_key.json
            acme_url: https://step-ca.acme:9000/acme/acme
            acme_account_email: grindsa@foo.bar
            account_path: /
            ssl_verify: False

      - uses: ./.github/actions/wf_specific/acme_ca_handler/post_cfg_common
        with:
          VOLUME_DIR: "examples/Docker/data"

      - uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - uses: ./.github/actions/wf_specific/acme_ca_handler/enroll_smallstep

      - name: "Check acme account found in keyfile"
        uses: ./.github/actions/logs_assert
        with:
          DEPLOYMENT_TYPE: container
          PATTERN: "found in keyfile"
          IGNORE_CASE: "true"
          FLUSH: "false"

      - uses: ./.github/actions/container_check
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - uses: ./.github/actions/wf_specific/acme_ca_handler/failure_artifacts
        if: ${{ failure() }}
        with:
          DEPLOYMENT_TYPE: container
          ARTIFACT_NAME: test-containers-smallstep-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz
          SIDECAR_LOGS: step-ca

      - name: "Secure cleanup"
        if: ${{ always() }}
        uses: ./.github/actions/secure_cleanup

  # ---------------------------------------------------------
  # Containers — live Let's Encrypt staging
  # ---------------------------------------------------------
  test-containers-letsencrypt:
    permissions:
      contents: read
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        websrv: ['apache2', 'nginx']
        dbhandler: ['wsgi', 'django']
        dns_provider: ['cloudflare', 'acmedns']
    steps:
      - uses: actions/checkout@v6

      - name: "Resolve DNS API script"
        run: |
          if [ "${DNS_PROVIDER}" = "cloudflare" ]; then
            echo "DNS_API=dns_cf.sh" >> "$GITHUB_ENV"
          else
            echo "DNS_API=dns_acmedns.sh" >> "$GITHUB_ENV"
          fi
        env:
          DNS_PROVIDER: ${{ matrix.dns_provider }}

      - uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.ACMEDNS_CFG }}

      - uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.CF_CFG }}

      - uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.EMAILADDRESSES_CFG }}

      - uses: ./.github/actions/wf_specific/acme_ca_handler/container_bootstrap
        with:
          RUN_ID: ${{ inputs.run_id }}
          WEB_SRV: ${{ matrix.websrv }}
          DB_HANDLER: ${{ matrix.dbhandler }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          NAME_SPACE: acme.dynamop.de

      - uses: ./.github/actions/wf_specific/acme_ca_handler/letsencrypt_preflight
        with:
          DNS_PROVIDER: ${{ matrix.dns_provider }}
          CF_TOKEN: ${{ env.CF_TOKEN }}
          CF_ZONE_ID: ${{ env.CF_ZONE_ID }}
          ACMEDNS_BASE_URL: ${{ env.ACMEDNS_BASE_URL }}

      - uses: ./.github/actions/wf_specific/acme_ca_handler/letsencrypt_prep
        with:
          VOLUME_DIR: "examples/Docker/data"
          DNS_PROVIDER: ${{ matrix.dns_provider }}
          ACME_KEYFILE: volume/acme/le_staging_private_key.json
          ACME_SH_SCRIPT: volume/acme/acme.sh
          DNS_UPDATE_SCRIPT: volume/acme/${{ env.DNS_API }}
          ACME_ACCOUNT_EMAIL: ${{ env.EMAIL }}
          DEST_DIR: examples/Docker/data/acme
          CF_TOKEN: ${{ env.CF_TOKEN }}
          CF_ZONE_ID: ${{ env.CF_ZONE_ID }}
          ACMEDNS_USERNAME: ${{ env.ACMEDNS_USERNAME }}
          ACMEDNS_PASSWORD: ${{ env.ACMEDNS_PASSWORD }}
          ACMEDNS_SUBDOMAIN: ${{ env.ACMEDNS_SUBDOMAIN }}
          DNS_VALIDATION_TIMEOUT: "120"
          ENROLLMENT_TIMEOUT: "600"

      - uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}
          NAME_SPACE: acme.dynamop.de

      - uses: ./.github/actions/wait_for_directory
        with:
          NAME_SPACE: acme.dynamop.de

      - name: "Compare profile information"
        if: matrix.dns_provider == 'cloudflare'
        uses: ./.github/actions/wf_specific/acme_ca_handler/compare_profile_info
        with:
          NAME_SPACE: acme.dynamop.de

      - name: "Generate UUID"
        if: matrix.dns_provider == 'cloudflare'
        run: echo "UUID=$(uuidgen | cut -d '-' -f1)" >> "$GITHUB_ENV"

      - name: "Compare renewal information between A2C and LE"
        if: matrix.dns_provider == 'cloudflare'
        uses: ./.github/actions/wf_specific/acme_ca_handler/compare_renewal_info
        with:
          NAME_SPACE: acme.dynamop.de
          HOSTNAME_SUFFIX: -${{ env.UUID }}
          CERTIFICATE_FILE: "lego/certificates/lego-${{ env.UUID }}.acme.dynamop.de.crt"
          CERT_TIMEOUT: "360"

      - name: "ACMEDNS wildcard enrollment"
        if: matrix.dns_provider == 'acmedns'
        uses: ./.github/actions/wf_specific/acme_ca_handler/enroll_dns_wc
        with:
          NAME_SPACE: acme.dynamop.de
          CERT_TIMEOUT: "360"

      - name: "Check acme account found in keyfile"
        uses: ./.github/actions/logs_assert
        with:
          DEPLOYMENT_TYPE: container
          PATTERN: "found in keyfile"
          IGNORE_CASE: "true"
          FLUSH: "false"

      - uses: ./.github/actions/container_check
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - uses: ./.github/actions/wf_specific/acme_ca_handler/failure_artifacts
        if: ${{ failure() }}
        with:
          DEPLOYMENT_TYPE: container
          ARTIFACT_NAME: test-containers-letsencrypt-${{ matrix.websrv }}-${{ matrix.dbhandler }}-${{ matrix.dns_provider }}.tar.gz

      - name: "Secure cleanup"
        if: ${{ always() }}
        uses: ./.github/actions/secure_cleanup

  # ---------------------------------------------------------
  # RPM — le-sim
  # ---------------------------------------------------------
  test-rpm-lesim:
    permissions:
      contents: read
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        rhversion: [8, 9]
        mode: ['wsgi', 'django']
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.GH_CFG }}

      - uses: ./.github/actions/wf_specific/acme_ca_handler/rpm_bootstrap
        with:
          RUN_ID: ${{ inputs.run_id }}
          RH_VERSION: ${{ matrix.rhversion }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          GH_USER: ${{ env.GH_USER }}
          GH_SBOM_REPO_TOKEN: ${{ env.GH_SBOM_REPO_TOKEN }}

      - uses: ./.github/actions/wf_specific/acme_ca_handler/le-sim_prep

      - uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.acme_ca_handler
          OPTIONS: |
            acme_keyfile: /opt/acme2certifier/volume/le_staging_private_key.json
            acme_url: http://acme-le-sim
            acme_account_email: grindsa@foo.bar
            allowed_domainlist: ["bar.local", "*.acme"]

      - uses: ./.github/actions/wf_specific/acme_ca_handler/post_cfg_common
        with:
          VOLUME_DIR: "data/volume"
          ACME_SUBDIR: ""

      - name: "Execute install script"
        run: docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh install -m "$MODE"
        env:
          MODE: ${{ matrix.mode }}

      - uses: ./.github/actions/wait_for_directory

      - uses: ./.github/actions/acme_clients
        with:
          TEST_ADL: "true"

      - name: "Verify allowed_domainlist error"
        uses: ./.github/actions/logs_assert
        with:
          DEPLOYMENT_TYPE: rpm
          PATTERN: "FQDN/SAN [^ ]+ not allowed by configuration"
          REGEX: "true"
          IGNORE_CASE: "true"
          FLUSH: "false"

      - name: "Check acme account found in keyfile"
        uses: ./.github/actions/logs_assert
        with:
          DEPLOYMENT_TYPE: rpm
          PATTERN: "found in keyfile"
          IGNORE_CASE: "true"

      - uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.acme_ca_handler
          OPTIONS: |
            acme_keyfile: /opt/acme2certifier/volume/le_staging_private_key.json
            acme_url: http://acme-le-sim
            acme_account_email: grindsa@foo.bar
            allowed_domainlist: ["bar.local", "*.acme"]
            enrollment_config_log: True

      - uses: ./.github/actions/wf_specific/acme_ca_handler/post_cfg_common
        with:
          VOLUME_DIR: "data/volume"
          ACME_SUBDIR: ""
          EXTRA_SED: 's/tnauthlist_support: False/tnauthlist_support: False\nprofiles={"profile1": "http:\/\/foo.bar\/profile1", "profile2": "http:\/\/foo.bar\/profile2", "profile3": "http:\/\/foo.bar\/profile3"}/g'

      - name: "Reconfigure a2c"
        run: docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart
        env:
          MODE: ${{ matrix.mode }}

      - uses: ./.github/actions/wait_for_directory

      - uses: ./.github/actions/wf_specific/acme_ca_handler/enroll_acmeprofile
        with:
          DEPLOYMENT_TYPE: "rpm"

