name: Deployment Tests - Manual Installation (pip / from-source)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'
      run_id:
        description: 'Run ID of the producing workflow'
        required: true
        default: '0'
      sha:
        description: 'SHA of the commit to run the workflow on'
        required: true
        default: ''
      called_by_workflow:
        description: 'Name of the producing workflow'
        required: true
        default: 'manual-trigger'
      full_ref:
        description: 'Full git ref of the commit to run the workflow on'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ inputs.branch }}
  cancel-in-progress: true

permissions: {}

jobs:
  guard:
    permissions: {}
    uses: ./.github/workflows/_guard.yml
    with:
      sha: ${{ inputs.sha }}
      run_id: ${{ inputs.run_id }}
      branch: ${{ inputs.branch }}

  ubuntu-pip-install:
    permissions:
      contents: read
      actions: write
    name: ubuntu-${{ matrix.ubuntu_version }}-${{ matrix.websrv }}-${{ matrix.dbhandler }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: guard
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        ubuntu_version: ['24.04', '26.04']
        websrv: [apache2, nginx]
        dbhandler: [wsgi, django]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare container
        uses: ./.github/actions/pip_install_prep
        with:
          DISTRO: ubuntu
          VERSION: ${{ matrix.ubuntu_version }}

      - name: Install via script (--from-source)
        run: |
          set -euo pipefail
          if [ "${WEBSRV}" = "apache2" ]; then
            SCRIPT=examples/install_scripts/a2c-ubuntu-apache2.sh
          else
            SCRIPT=examples/install_scripts/a2c-ubuntu-nginx.sh
          fi
          docker exec acme-srv chmod a+rx "/data/acme2certifier/${SCRIPT}"
          docker exec acme-srv bash -lc \
            "cd /data/acme2certifier && ./${SCRIPT} --mode ${DBHANDLER} --from-source"
        env:
          WEBSRV: ${{ matrix.websrv }}
          DBHANDLER: ${{ matrix.dbhandler }}

      - name: Test enrollment
        uses: ./.github/actions/acme_clients_enroll
        with:
          ACME_SERVER: acme-srv
          HTTP_PORT: '80'
          HTTPS_PORT: '443'

      - name: Collect logs
        if: ${{ failure() }}
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/artifact/upload" \
                   "${{ github.workspace }}/artifact/data"
          docker exec acme-srv bash -lc '
            set +e
            mkdir -p /tmp/a2c-logs
            cp -a /var/www/acme2certifier/acme_srv.cfg /tmp/a2c-logs/ 2>/dev/null
            cp -a /var/log/apache2 /tmp/a2c-logs/ 2>/dev/null
            cp -a /var/log/nginx /tmp/a2c-logs/ 2>/dev/null
            journalctl -u apache2 -u nginx -u acme2certifier --no-pager > /tmp/a2c-logs/journal.txt 2>/dev/null
            tar -C /tmp -czf /tmp/a2c-logs.tgz a2c-logs
          ' || true
          docker cp acme-srv:/tmp/a2c-logs.tgz \
            "${{ github.workspace }}/artifact/data/a2c-logs.tgz" || true
          tar -C "${{ github.workspace }}/artifact" -czf \
            "${{ github.workspace }}/artifact/upload/artifact.tar.gz" data

      - name: "Sanitize failure artifacts"
        if: ${{ failure() }}
        uses: ./.github/actions/sanitize_artifact_payload
        with:
          ARTIFACT_DIR: ${{ github.workspace }}/artifact
      - name: Upload artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-${{ matrix.ubuntu_version }}-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz
          path: ${{ github.workspace }}/artifact/upload/
          retention-days: 1

      - name: "Secure cleanup"
        if: ${{ always() }}
        uses: ./.github/actions/secure_cleanup


  alma-pip-install:
    permissions:
      contents: read
      actions: write
    name: alma-${{ matrix.rh_version }}-nginx-${{ matrix.dbhandler }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: guard
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        rh_version: ['9']
        dbhandler: [wsgi, django]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare container
        uses: ./.github/actions/pip_install_prep
        with:
          DISTRO: alma
          VERSION: ${{ matrix.rh_version }}

      - name: Install via script (--from-source)
        run: |
          set -euo pipefail
          SCRIPT=examples/install_scripts/a2c-rel-nginx.sh
          docker exec acme-srv chmod a+rx "/data/acme2certifier/${SCRIPT}"
          docker exec acme-srv bash -lc \
            "cd /data/acme2certifier && ./${SCRIPT} --mode ${DBHANDLER} --from-source"
        env:
          DBHANDLER: ${{ matrix.dbhandler }}

      - name: Test enrollment
        uses: ./.github/actions/acme_clients_enroll
        with:
          ACME_SERVER: acme-srv
          HTTP_PORT: '80'
          HTTPS_PORT: '443'

      - name: Collect logs
        if: ${{ failure() }}
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/artifact/upload" \
                   "${{ github.workspace }}/artifact/data"
          docker exec acme-srv bash -lc '
            set +e
            mkdir -p /tmp/a2c-logs
            cp -a /opt/acme2certifier/acme_srv.cfg /tmp/a2c-logs/ 2>/dev/null
            cp -a /var/log/nginx /tmp/a2c-logs/ 2>/dev/null
            journalctl -u nginx -u acme2certifier --no-pager > /tmp/a2c-logs/journal.txt 2>/dev/null
            cat /var/log/messages > /tmp/a2c-logs/messages 2>/dev/null
            tar -C /tmp -czf /tmp/a2c-logs.tgz a2c-logs
          ' || true
          docker cp acme-srv:/tmp/a2c-logs.tgz \
            "${{ github.workspace }}/artifact/data/a2c-logs.tgz" || true
          tar -C "${{ github.workspace }}/artifact" -czf \
            "${{ github.workspace }}/artifact/upload/artifact.tar.gz" data

      - name: "Sanitize failure artifacts"
        if: ${{ failure() }}
        uses: ./.github/actions/sanitize_artifact_payload
        with:
          ARTIFACT_DIR: ${{ github.workspace }}/artifact
      - name: Upload artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: alma-${{ matrix.rh_version }}-nginx-${{ matrix.dbhandler }}.tar.gz
          path: ${{ github.workspace }}/artifact/upload/
          retention-days: 1

      - name: "Secure cleanup"
        if: ${{ always() }}
        uses: ./.github/actions/secure_cleanup
