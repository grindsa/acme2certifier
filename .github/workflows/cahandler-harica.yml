name: CA handler tests - Harica
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'
      run_id:
        description: 'Run ID of the producing workflow'
        required: true
        default: '0'
      sha:
        description: 'SHA of the commit to run the workflow on'
        required: true
        default: ''
      called_by_workflow:
        description: 'Name of the producing workflow'
        required: true
        default: 'manual-trigger'
      full_ref:
        description: 'Full git ref of the commit to run the workflow on'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ inputs.branch }}
  cancel-in-progress: true

permissions: {}

jobs:
  guard:
    permissions: {}
    if: ${{ inputs.branch == 'master' || inputs.branch == 'devel' }}
    uses: ./.github/workflows/_guard.yml
    with:
      sha: ${{ inputs.sha }}
      run_id: ${{ inputs.run_id }}
      branch: ${{ inputs.branch }}

  # ---------------------------------------------------------
  # Test container images (matrix from payload)
  # ---------------------------------------------------------
  acme-test-containers:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        websrv: ['apache2', 'nginx']
        dbhandler: ['wsgi']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Channel setup"
        uses: ./.github/actions/channel_container_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          WEB_SRV: ${{ matrix.websrv }}
          DB_HANDLER: ${{ matrix.dbhandler }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          NAME_SPACE: acme

      - name: Parse HARICA config
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.HARICA_CFG }}

      - name: "Generate UUID"
        run: |
          echo UUID=$(uuidgen | cut -d "-" -f1) >> $GITHUB_ENV
      - run: echo "UUID ${{ env.UUID }}"

      - name: "Setup acme_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.acme_ca_handler
          OPTIONS: |
            acme_keyfile: volume/acme/harica_staging_private_key.json
            acme_url: ${{ env.ACME_URL }}
            account_path: /acct/
            acme_account_email: ${{ env.ACME_ACCOUNT_EMAIL }}
            eab_kid: ${{ env.EAB_KID }}
            eab_hmac_key: ${{ env.EAB_HMAC_KEY }}
            allowed_domainlist: ["*.${{ env.DOMAIN }}", "*.acme"]
        env:
          ACME_ACCOUNT_EMAIL: ${{ secrets.EMAIL }}

      - name: "Setup acme_ca_handler (post-cfg)"
        run: |
          sudo mkdir -p examples/Docker/data/acme
          sudo chmod -R 777 examples/Docker/data/acme
          sudo sed -i "s/challenge_validation_disable: False/challenge_validation_disable: True/g" examples/Docker/data/acme_srv.cfg
          sudo sed -i "s/revocation_reason_check_disable: False/revocation_reason_check_disable: False\ncert_reusage_timeframe: 1800\nenrollment_timeout: 15\ncert_operations_log: True/g" examples/Docker/data/acme_srv.cfg
        env:
          ACME_ACCOUNT_EMAIL: ${{ secrets.EMAIL }}

      - name: "Bring up a2c container"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Test enrollment"
        uses: ./.github/actions/wf_specific/harica/acme_enroll
        with:
          DEPLOYMENT_TYPE: "container"
          HOSTNAME_SUFFIX: -${{ env.UUID }}

      - name: "Check acme account found in keyfile"
        uses: ./.github/actions/logs_assert
        with:
          DEPLOYMENT_TYPE: container
          PATTERN: "found in keyfile"
          IGNORE_CASE: "true"
          FLUSH: "false"

      - name: "Check container configuration"
        uses: ./.github/actions/container_check
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Channel teardown"
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: container
          ARTIFACT_NAME: acme-test-containers-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz

  test-rpm:
    permissions:
      contents: read
      actions: write
    needs: [guard, acme-test-containers]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        rhversion: [9]
        mode: ['wsgi', 'django']
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6


      - name: "Channel setup"
        uses: ./.github/actions/channel_rpm_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          RH_VERSION: ${{ matrix.rhversion }}
          JSON_SECRET: ${{ secrets.GH_CFG }}

      - name: Parse HARICA config
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.HARICA_CFG }}

      - name: "Generate UUID"
        run: |
          echo UUID=$(uuidgen | cut -d "-" -f1) >> $GITHUB_ENV
      - run: echo "UUID ${{ env.UUID }}"

      - name: "Setup acme_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.acme_ca_handler
          OPTIONS: |
            acme_keyfile: volume/acme/harica_staging_private_key.json
            acme_url: ${{ env.ACME_URL }}
            account_path: /acct/
            acme_account_email: ${{ env.ACME_ACCOUNT_EMAIL }}
            eab_kid: ${{ env.EAB_KID }}
            eab_hmac_key: ${{ env.EAB_HMAC_KEY }}
            allowed_domainlist: ["*.${{ env.DOMAIN }}", "*.acme"]
        env:
          ACME_ACCOUNT_EMAIL: ${{ secrets.EMAIL }}

      - name: "Setup acme_ca_handler (post-cfg)"
        run: |
          sudo mkdir -p data/volume/acme
          sudo chmod -R 777 data/volume/acme
          sudo sed -i "s/challenge_validation_disable: False/challenge_validation_disable: True/g" data/volume/acme_srv.cfg
          sudo sed -i "s/revocation_reason_check_disable: False/revocation_reason_check_disable: False\ncert_reusage_timeframe: 1800\nenrollment_timeout: 15\ncert_operations_log: True/g" data/volume/acme_srv.cfg
        env:
          ACME_ACCOUNT_EMAIL: ${{ secrets.EMAIL }}

      - name: "Execute install script"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh install -m $MODE
        env:
          MODE: ${{ matrix.mode }}

      - name: "Test enrollment"
        uses: ./.github/actions/wf_specific/harica/acme_enroll
        with:
          DEPLOYMENT_TYPE: "rpm"
          HOSTNAME_SUFFIX: -${{ env.UUID }}

      - name: "[ * ] Collecting extra failure logs"
        if: ${{ failure() }}
        run: |
          mkdir -p ${{ github.workspace }}/artifact ${{ github.workspace }}/artifact/data
          docker logs acme-le-sim > ${{ github.workspace }}/artifact/le-sim.log

      - name: "Channel teardown"
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: rpm
          ARTIFACT_NAME: test-rpm-rh${{ matrix.rhversion }}-${{ matrix.mode }}.tar.gz

  # ---------------------------------------------------------
  # Test DEB downloaded from the producer run
  # ---------------------------------------------------------


  test-deb:
    permissions:
      contents: read
      actions: write
    needs: [guard, acme-test-containers, test-rpm]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # if: github.repository == 'grindsa/acme2certifier'
    if: github.repository == 'grindsa/disabled'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        websrv: ['nginx']
        mode: ['wsgi', 'django']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Channel setup"
        uses: ./.github/actions/channel_deb_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          DJANGO_DB: ${{ matrix.mode == 'django' && 'psql' || '' }}

      - name: Parse HARICA config
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.HARICA_CFG }}

      - name: "Generate UUID"
        run: |
          echo UUID=$(uuidgen | cut -d "-" -f1) >> $GITHUB_ENV
      - run: echo "UUID ${{ env.UUID }}"

      - name: "Setup acme_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.acme_ca_handler
          OPTIONS: |
            acme_keyfile: /var/www/acme2certifier/volume/acme/harica_staging_private_key.json
            acme_url: ${{ env.ACME_URL }}
            account_path: /acct/
            acme_account_email: ${{ env.ACME_ACCOUNT_EMAIL }}
            eab_kid: ${{ env.EAB_KID }}
            eab_hmac_key: ${{ env.EAB_HMAC_KEY }}
            allowed_domainlist: ["*.${{ env.DOMAIN }}", "*.acme"]
        env:
          ACME_ACCOUNT_EMAIL: ${{ secrets.EMAIL }}

      - name: "Setup acme_ca_handler (post-cfg)"
        run: |
          sudo mkdir -p data/volume/acme
          sudo chmod -R 777 data/volume/acme
          sudo sed -i "s/challenge_validation_disable: False/challenge_validation_disable: True/g" data/volume/acme_srv.cfg
          sudo sed -i "s/revocation_reason_check_disable: False/revocation_reason_check_disable: False\ncert_reusage_timeframe: 1800\nenrollment_timeout: 15\ncert_operations_log: True/g" data/volume/acme_srv.cfg
        env:
          ACME_ACCOUNT_EMAIL: ${{ secrets.EMAIL }}

      - name: "Execute install script"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh install $WEBSRV -m $MODE
        env:
          WEBSRV: ${{ matrix.websrv }}
          MODE: ${{ matrix.mode }}

      - name: "Test enrollment"
        uses: ./.github/actions/wf_specific/harica/acme_enroll
        with:
          DEPLOYMENT_TYPE: "deb"
          HOSTNAME_SUFFIX: -${{ env.UUID }}

      - name: "Channel teardown"
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: deb
          ARTIFACT_NAME: acme-test-deb-${{ matrix.websrv }}-${{ matrix.mode }}.tar.gz
          WEBSRV: ${{ matrix.websrv }}
