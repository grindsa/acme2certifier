name: CA-Handler Tests - Harica
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'
      run_id:
        description: 'Run ID of the producing workflow'
        required: true
        default: '0'
      sha:
        description: 'SHA of the commit to run the workflow on'
        required: true
        default: ''
      called_by_workflow:
        description: 'Name of the producing workflow'
        required: true
        default: 'manual-trigger'
      full_ref:
        description: 'Full git ref of the commit to run the workflow on'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ inputs.branch }}
  cancel-in-progress: true

permissions: {}

jobs:
  guard:
    permissions: {}
    if: ${{ inputs.branch == 'master' || inputs.branch == 'devel' || contains(inputs.branch, 'harica') }}
    uses: ./.github/workflows/_guard.yml
    with:
      sha: ${{ inputs.sha }}
      run_id: ${{ inputs.run_id }}
      branch: ${{ inputs.branch }}

  # ---------------------------------------------------------
  # HARICA native ACME via acme_ca_handler
  # ---------------------------------------------------------
  acme-test-containers:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        websrv: ['nginx']
        dbhandler: ['wsgi']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v7

      - name: "Channel setup"
        uses: ./.github/actions/channel_container_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          WEB_SRV: ${{ matrix.websrv }}
          DB_HANDLER: ${{ matrix.dbhandler }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          NAME_SPACE: acme

      - name: "Parse HARICA config"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.HARICA_CFG }}

      - name: "Generate UUID"
        run: |
          echo "UUID=$(uuidgen | cut -d "-" -f1)" >> "$GITHUB_ENV"
      - run: echo "UUID ${{ env.UUID }}"

      - name: "Setup acme_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.acme_ca_handler
          OPTIONS: |
            acme_keyfile: volume/acme/harica_staging_private_key.json
            acme_url: ${{ env.ACME_URL }}
            account_path: /acct/
            acme_account_email: ${{ env.ACME_ACCOUNT_EMAIL }}
            eab_kid: ${{ env.EAB_KID }}
            eab_hmac_key: ${{ env.EAB_HMAC_KEY }}
            allowed_domainlist: ["*.${{ env.DOMAIN }}", "*.acme"]
        env:
          ACME_ACCOUNT_EMAIL: ${{ secrets.EMAIL }}

      - name: "Setup acme_ca_handler (post-cfg)"
        run: |
          sudo mkdir -p examples/Docker/data/acme
          sudo chmod -R 777 examples/Docker/data/acme
          sudo sed -i "s/challenge_validation_disable: False/challenge_validation_disable: True/g" examples/Docker/data/acme_srv.cfg
          sudo sed -i "s/revocation_reason_check_disable: False/revocation_reason_check_disable: False\ncert_reusage_timeframe: 1800\nenrollment_timeout: 120\ncert_operations_log: True/g" examples/Docker/data/acme_srv.cfg

      - name: "Bring up a2c container"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Test enrollment and revocation"
        uses: ./.github/actions/wf_specific/harica/acme_enroll
        with:
          DEPLOYMENT_TYPE: "container"
          HOSTNAME_SUFFIX: -acme-${{ env.UUID }}
          WARMUP_ENROLL: "true"
          CERT_TIMEOUT: "180"

      - name: "Check acme account found in keyfile"
        uses: ./.github/actions/logs_assert
        with:
          DEPLOYMENT_TYPE: container
          PATTERN: "found in keyfile"
          IGNORE_CASE: "true"
          FLUSH: "false"

      - name: "Check container configuration"
        uses: ./.github/actions/container_check
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Channel teardown"
        if: ${{ always() }}
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: container
          ARTIFACT_NAME: acme-test-containers-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz

  # ---------------------------------------------------------
  # CertManager REST via harica_ca_handler
  # ---------------------------------------------------------
  rest-test-containers:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        websrv: ['nginx']
        dbhandler: ['wsgi']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v7

      - name: "Channel setup"
        uses: ./.github/actions/channel_container_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          WEB_SRV: ${{ matrix.websrv }}
          DB_HANDLER: ${{ matrix.dbhandler }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          NAME_SPACE: acme

      - name: "Parse HARICA config"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.HARICA_CFG }}

      - name: "Generate UUID"
        run: |
          echo "UUID=$(uuidgen | cut -d "-" -f1)" >> "$GITHUB_ENV"
      - run: echo "UUID ${{ env.UUID }}"

      - name: "Setup harica_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.harica_ca_handler
          OPTIONS: |
            api_url: ${{ env.API_URL }}
            requester_email: ${{ env.REQUESTER_EMAIL }}
            requester_password: ${{ env.REQUESTER_PASSWORD }}
            requester_totp_seed: ${{ env.REQUESTER_TOTP_SEED }}
            transaction_type: OV
            consent_same_key: True
            organization_id: ${{ env.ORGANIZATION_ID }}
            auto_approve: True
            approver_email: ${{ env.APPROVER_EMAIL }}
            approver_password: ${{ env.APPROVER_PASSWORD }}
            approver_totp_seed: ${{ env.APPROVER_TOTP_SEED }}
            request_timeout: 120
            allowed_domainlist: ["*.${{ env.DOMAIN }}", "*.acme"]

      - name: "Setup harica_ca_handler (post-cfg)"
        run: |
          set -euo pipefail
          if [ -z "${ORGANIZATION_ID:-}" ]; then
            sudo sed -i '/^organization_id:[[:space:]]*$/d' examples/Docker/data/acme_srv.cfg
          fi
          sudo sed -i "s/challenge_validation_disable: False/challenge_validation_disable: True/g" examples/Docker/data/acme_srv.cfg
          # enrollment_timeout must stay below lego ResponseHeaderTimeout (~30s); enroll
          # continues in-thread after finalize returns processing (same pattern as certifier).
          sudo sed -i "s/revocation_reason_check_disable: False/revocation_reason_check_disable: False\ncert_reusage_timeframe: 1800\nenrollment_timeout: 15\ncert_operations_log: True/g" examples/Docker/data/acme_srv.cfg

      - name: "Bring up a2c container"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Test enrollment and revocation"
        uses: ./.github/actions/wf_specific/harica/acme_enroll
        with:
          DEPLOYMENT_TYPE: "container"
          HOSTNAME_SUFFIX: -rest-${{ env.UUID }}
          CERT_TIMEOUT: "180"

      - name: "Check revocation logged"
        uses: ./.github/actions/logs_assert
        with:
          DEPLOYMENT_TYPE: container
          # cert_operations_log: True → text logger ("revocation successful"), not json ("Certificate revoked")
          PATTERN: "revocation successful"
          IGNORE_CASE: "true"
          FLUSH: "false"

      - name: "Check container configuration"
        uses: ./.github/actions/container_check
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Channel teardown"
        if: ${{ always() }}
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: container
          ARTIFACT_NAME: rest-test-containers-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz
