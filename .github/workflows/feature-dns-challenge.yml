name: Feature Tests - DNS Challenge
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'
      run_id:
        description: 'Run ID of the producing workflow'
        required: true
        default: '0'
      sha:
        description: 'SHA of the commit to run the workflow on'
        required: true
        default: ''
      called_by_workflow:
        description: 'Name of the producing workflow'
        required: true
        default: 'manual-trigger'
      full_ref:
        description: 'Full git ref of the commit to run the workflow on'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ inputs.branch }}
  cancel-in-progress: true

permissions: {}

jobs:
  guard:
    permissions: {}
    uses: ./.github/workflows/_guard.yml
    with:
      sha: ${{ inputs.sha }}
      run_id: ${{ inputs.run_id }}
      branch: ${{ inputs.branch }}

  # ---------------------------------------------------------
  # Test container images (matrix from payload)
  # ---------------------------------------------------------
  test-containers:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        dbhandler: ['wsgi', 'django']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v7

      - name: "Channel setup"
        uses: ./.github/actions/channel_container_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          WEB_SRV: ${{ matrix.websrv }}
          DB_HANDLER: ${{ matrix.dbhandler }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          NAME_SPACE: acme

      - name: "Setup openssl ca_handler"
        uses: ./.github/actions/setup_openssl_cahandler
        with:
          VOLUME_DIR: "examples/Docker/data"

      - name: "Configure openssl ca_handler"
        run: |
          sudo chmod 777 examples/Docker/data/acme_srv.cfg
          sudo sed -i "s/challenge_validation_disable: False/challenge_validation_disable: False\ndns_server_list: [\"DNS-IP\"]/g" examples/Docker/data/acme_srv.cfg

      - name: "Bring up a2c container"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Prepare acme.sh container and set DNS server in acme_srv.cfg"
        uses: ./.github/actions/wf_specific/dns/acmesh_prep
        with:
          DEPLOYMENT_TYPE: container
          ACME_SRV_CFG: data/acme_srv.cfg

      - name: "Enroll by using dns-01 challenges"
        uses: ./.github/actions/wf_specific/dns/enroll_dns01
        with:
          CA_PATH: examples/Docker/data/acme_ca/
          DEPLOYMENT_TYPE: container

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "Set wildcard_certificate_disable to True"
        run: |
          sudo awk '
          BEGIN { in_order = 0; has_param = 0 }
          /^\[Order\]$/ {
            in_order = 1
            print
            next
          }
          /^\[/ && in_order {
            if (!has_param) {
              print "wildcard_certificate_disable: True"
              has_param = 1
            }
            in_order = 0
          }
          {
            if (in_order && /^wildcard_certificate_disable[[:space:]]*:/) {
              sub(/:.*/, ": True")
              has_param = 1
            }
            print
          }
          END {
            if (in_order && !has_param) {
              print "wildcard_certificate_disable: True"
            }
          }
          ' examples/Docker/data/acme_srv.cfg | sudo tee examples/Docker/data/acme_srv.cfg.tmp > /dev/null
          sudo mv examples/Docker/data/acme_srv.cfg.tmp examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart

      - name: "Enroll by using dns-01 challenges with wildcard disabled (wildcard expected to fail)"
        uses: ./.github/actions/wf_specific/dns/enroll_dns01
        with:
          CA_PATH: examples/Docker/data/acme_ca/
          DEPLOYMENT_TYPE: container
          WILDCARD_EXPECT_FAIL: 'true'

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "Set wildcard_certificate_disable to False"
        run: |
          sudo sed -i "s/^wildcard_certificate_disable:.*/wildcard_certificate_disable: False/g" examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart

      - name: "Enroll by using dns-01 challenges with wildcard enabled (wildcard expected to succeed)"
        uses: ./.github/actions/wf_specific/dns/enroll_dns01
        with:
          CA_PATH: examples/Docker/data/acme_ca/
          DEPLOYMENT_TYPE: container

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "Setup openssl ca_handler for persistent-01 challenge support"
        run: |
          sudo chmod 777 examples/Docker/data/acme_srv.cfg
          echo -e "[Directory]\ncaaidentities: [\"acme.local\", \"acme-srv.acme\"]" >> examples/Docker/data/acme_srv.cfg
          sudo sed -i "s/challenge_validation_disable: False/challenge_validation_disable: False\ndns_persist_01_support: True/g" examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart

      - name: "Register lego container and create dns records for persistent-01 challenges"
        uses: ./.github/actions/wf_specific/dns/persistent_prep
        with:
          DEPLOYMENT_TYPE: container

      - name: "Enroll by using persistent-01 dns challenges (to fail)"
        uses: ./.github/actions/wf_specific/dns/enroll_persistent01
        with:
          CA_PATH: examples/Docker/data/acme_ca/
          DEPLOYMENT_TYPE: container
          TO_FAIL: 'true'

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "Enable Wildcard support"
        run: |
          sudo sed -i "s/dns_persist_01_support: True/dns_persist_01_support: True\ndns_persist_allow_policy_wildcard: True/g" examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart

      - name: "Enroll by using persistent-01 dns challenges (not to fail)"
        uses: ./.github/actions/wf_specific/dns/enroll_persistent01
        with:
          CA_PATH: examples/Docker/data/acme_ca/
          DEPLOYMENT_TYPE: container

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "Enable JIT support"
        run: |
          sudo sed -i "s/dns_persist_allow_policy_wildcard: True/dns_persist_allow_policy_wildcard: True\ndns_persist_jit_validation: True/g" examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart

      - name: "Enroll by using persistent-01 dns challenges (not to fail)"
        uses: ./.github/actions/wf_specific/dns/enroll_persistent01
        with:
          CA_PATH: examples/Docker/data/acme_ca/
          DEPLOYMENT_TYPE: container
          CHECK_JIT: 'true'

      - name: "Channel teardown"
        if: ${{ always() }}
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: container
          ARTIFACT_NAME: container-tests-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz

  # ---------------------------------------------------------
  # Test RPMs (EL8 & EL9) downloaded from the producer run
  # ---------------------------------------------------------


  test-rpm:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        rhversion: [8, 9]
        mode: ['wsgi', 'django']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v7

      - name: "Channel setup"
        uses: ./.github/actions/channel_rpm_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          RH_VERSION: ${{ matrix.rhversion }}
          JSON_SECRET: ${{ secrets.GH_CFG }}

      - name: "Prepare acme_srv.cfg with openssl_ca_handler"
        uses: ./.github/actions/setup_openssl_cahandler

      - name: "Prepare acme_srv.cfg with openssl_ca_handler (config)"
        run: |
          sudo chmod 777 data/volume/acme_srv.cfg
          sudo sed -i "s/challenge_validation_disable: False/challenge_validation_disable: False\ndns_server_list: [\"DNS-IP\"]/g" data/volume/acme_srv.cfg

      - name: "Prepare acme.sh container and set DNS server in acme_srv.cfg"
        uses: ./.github/actions/wf_specific/dns/acmesh_prep

      - name: "Execute install script"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh install -m $MODE
        env:
          MODE: ${{ matrix.mode }}

      - name: "Enroll by using dns-01 challenges"
        uses: ./.github/actions/wf_specific/dns/enroll_dns01

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: rpm

      - name: "Set wildcard_certificate_disable to True"
        run: |
          sudo awk '
          BEGIN { in_order = 0; has_param = 0 }
          /^\[Order\]$/ {
            in_order = 1
            print
            next
          }
          /^\[/ && in_order {
            if (!has_param) {
              print "wildcard_certificate_disable: True"
              has_param = 1
            }
            in_order = 0
          }
          {
            if (in_order && /^wildcard_certificate_disable[[:space:]]*:/) {
              sub(/:.*/, ": True")
              has_param = 1
            }
            print
          }
          END {
            if (in_order && !has_param) {
              print "wildcard_certificate_disable: True"
            }
          }
          ' data/volume/acme_srv.cfg | sudo tee data/volume/acme_srv.cfg.tmp > /dev/null
          sudo mv data/volume/acme_srv.cfg.tmp data/volume/acme_srv.cfg

      - name: "Reconfigure a2c"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart
        env:
          MODE: ${{ matrix.mode }}

      - name: "Enroll by using dns-01 challenges with wildcard disabled (wildcard expected to fail)"
        uses: ./.github/actions/wf_specific/dns/enroll_dns01
        with:
          WILDCARD_EXPECT_FAIL: 'true'

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: rpm

      - name: "Set wildcard_certificate_disable to False"
        run: |
          sudo sed -i "s/^wildcard_certificate_disable:.*/wildcard_certificate_disable: False/g" data/volume/acme_srv.cfg

      - name: "Reconfigure a2c"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart
        env:
          MODE: ${{ matrix.mode }}

      - name: "Enroll by using dns-01 challenges with wildcard enabled (wildcard expected to succeed)"
        uses: ./.github/actions/wf_specific/dns/enroll_dns01

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: rpm

      - name: "Setup openssl ca_handler for persistent-01 challenge support"
        run: |
          sudo chmod 777 data/volume/acme_srv.cfg
          echo -e "[Directory]\ncaaidentities: [\"acme.local\", \"acme-srv.acme\"]" >> data/volume/acme_srv.cfg
          sudo sed -i "s/challenge_validation_disable: False/challenge_validation_disable: False\ndns_persist_01_support: True/g" data/volume/acme_srv.cfg

      - name: "Reconfigure a2c"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart
        env:
          MODE: ${{ matrix.mode }}

      - name: "Register lego container and create dns records for persistent-01 challenges"
        uses: ./.github/actions/wf_specific/dns/persistent_prep
        with:
          DEPLOYMENT_TYPE: container

      - name: "Enroll by using persistent-01 dns challenges (to fail)"
        uses: ./.github/actions/wf_specific/dns/enroll_persistent01
        with:
          CA_PATH: data/volume/acme_ca/
          DEPLOYMENT_TYPE: container
          TO_FAIL: 'true'

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: rpm

      - name: "Enable Wildcard support"
        run: |
          sudo sed -i "s/dns_persist_01_support: True/dns_persist_01_support: True\ndns_persist_allow_policy_wildcard: True/g" data/volume/acme_srv.cfg

      - name: "Reconfigure a2c"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart
        env:
          MODE: ${{ matrix.mode }}

      - name: "Enroll by using persistent-01 dns challenges (not to fail)"
        uses: ./.github/actions/wf_specific/dns/enroll_persistent01
        with:
          CA_PATH: data/volume/acme_ca/
          DEPLOYMENT_TYPE: container

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: rpm

      - name: "Enable JIT support"
        run: |
          sudo sed -i "s/dns_persist_allow_policy_wildcard: True/dns_persist_allow_policy_wildcard: True\ndns_persist_jit_validation: True/g" data/volume/acme_srv.cfg

      - name: "Reconfigure a2c"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart
        env:
          MODE: ${{ matrix.mode }}

      - name: "Enroll by using persistent-01 dns challenges (not to fail)"
        uses: ./.github/actions/wf_specific/dns/enroll_persistent01
        with:
          CA_PATH: data/volume/acme_ca/
          DEPLOYMENT_TYPE: rpm
          CHECK_JIT: 'true'

      - name: "Channel teardown"
        if: ${{ always() }}
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: rpm
          ARTIFACT_NAME: test-rpm-rh${{ matrix.rhversion }}.tar.gz

  # ---------------------------------------------------------
  # Test DEB downloaded from the producer run
  # ---------------------------------------------------------


  test-deb:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        mode: ['wsgi', 'django']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v7

      - name: "Channel setup"
        uses: ./.github/actions/channel_deb_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          DJANGO_DB: ${{ matrix.mode == 'django' && 'psql' || '' }}

      - name: "Prepare acme_srv.cfg with openssl_ca_handler"
        uses: ./.github/actions/setup_openssl_cahandler

      - name: "Prepare acme_srv.cfg with openssl_ca_handler (config)"
        run: |
          sudo chmod 777 data/volume/acme_srv.cfg
          sudo sed -i "s/challenge_validation_disable: False/challenge_validation_disable: False\ndns_server_list: [\"DNS-IP\"]/g" data/volume/acme_srv.cfg

      - name: "Prepare acme.sh container and set DNS server in acme_srv.cfg"
        uses: ./.github/actions/wf_specific/dns/acmesh_prep
        with:
          DEPLOYMENT_TYPE: deb

      - name: "Execute install script"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh install $WEBSRV -m $MODE
        env:
          WEBSRV: ${{ matrix.websrv }}
          MODE: ${{ matrix.mode }}

      - name: "Enroll by using dns-01 challenges"
        uses: ./.github/actions/wf_specific/dns/enroll_dns01
        with:
          DEPLOYMENT_TYPE: deb

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: deb

      - name: "Set wildcard_certificate_disable to True"
        run: |
          sudo awk '
          BEGIN { in_order = 0; has_param = 0 }
          /^\[Order\]$/ {
            in_order = 1
            print
            next
          }
          /^\[/ && in_order {
            if (!has_param) {
              print "wildcard_certificate_disable: True"
              has_param = 1
            }
            in_order = 0
          }
          {
            if (in_order && /^wildcard_certificate_disable[[:space:]]*:/) {
              sub(/:.*/, ": True")
              has_param = 1
            }
            print
          }
          END {
            if (in_order && !has_param) {
              print "wildcard_certificate_disable: True"
            }
          }
          ' data/volume/acme_srv.cfg | sudo tee data/volume/acme_srv.cfg.tmp > /dev/null
          sudo mv data/volume/acme_srv.cfg.tmp data/volume/acme_srv.cfg

      - name: "Reconfigure a2c "
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh restart $WEBSRV
        env:
          WEBSRV: ${{ matrix.websrv }}
          MODE: ${{ matrix.mode }}

      - name: "Enroll by using dns-01 challenges with wildcard disabled (wildcard expected to fail)"
        uses: ./.github/actions/wf_specific/dns/enroll_dns01
        with:
          DEPLOYMENT_TYPE: deb
          WILDCARD_EXPECT_FAIL: 'true'

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: deb

      - name: "Set wildcard_certificate_disable to False"
        run: |
          sudo sed -i "s/^wildcard_certificate_disable:.*/wildcard_certificate_disable: False/g" data/volume/acme_srv.cfg

      - name: "Reconfigure a2c "
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh restart $WEBSRV
        env:
          WEBSRV: ${{ matrix.websrv }}
          MODE: ${{ matrix.mode }}

      - name: "Enroll by using dns-01 challenges with wildcard enabled (wildcard expected to succeed)"
        uses: ./.github/actions/wf_specific/dns/enroll_dns01
        with:
          DEPLOYMENT_TYPE: deb

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: deb

      - name: "Setup openssl ca_handler for persistent-01 challenge support"
        run: |
          sudo chmod 777 data/volume/acme_srv.cfg
          echo -e "[Directory]\ncaaidentities: [\"acme.local\", \"acme-srv.acme\"]" >> data/volume/acme_srv.cfg
          sudo sed -i "s/challenge_validation_disable: False/challenge_validation_disable: False\ndns_persist_01_support: True/g" data/volume/acme_srv.cfg

      - name: "Reconfigure a2c "
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh restart $WEBSRV
        env:
          WEBSRV: ${{ matrix.websrv }}
          MODE: ${{ matrix.mode }}

      - name: "Register lego container and create dns records for persistent-01 challenges"
        uses: ./.github/actions/wf_specific/dns/persistent_prep
        with:
          DEPLOYMENT_TYPE: deb

      - name: "Enroll by using persistent-01 dns challenges (to fail)"
        uses: ./.github/actions/wf_specific/dns/enroll_persistent01
        with:
          CA_PATH: data/volume/acme_ca/
          DEPLOYMENT_TYPE: deb
          TO_FAIL: 'true'

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: deb

      - name: "Enable Wildcard support"
        run: |
          sudo sed -i "s/dns_persist_01_support: True/dns_persist_01_support: True\ndns_persist_allow_policy_wildcard: True/g" data/volume/acme_srv.cfg

      - name: "Reconfigure a2c "
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh restart $WEBSRV
        env:
          WEBSRV: ${{ matrix.websrv }}
          MODE: ${{ matrix.mode }}

      - name: "Enroll by using persistent-01 dns challenges (not to fail)"
        uses: ./.github/actions/wf_specific/dns/enroll_persistent01
        with:
          CA_PATH: data/volume/acme_ca/
          DEPLOYMENT_TYPE: deb

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: deb

      - name: "Enable JIT support"
        run: |
          sudo sed -i "s/dns_persist_allow_policy_wildcard: True/dns_persist_allow_policy_wildcard: True\ndns_persist_jit_validation: True/g" data/volume/acme_srv.cfg

      - name: "Reconfigure a2c "
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh restart $WEBSRV
        env:
          WEBSRV: ${{ matrix.websrv }}
          MODE: ${{ matrix.mode }}

      - name: "Enroll by using persistent-01 dns challenges (not to fail)"
        uses: ./.github/actions/wf_specific/dns/enroll_persistent01
        with:
          CA_PATH: data/volume/acme_ca/
          DEPLOYMENT_TYPE: deb
          CHECK_JIT: 'true'

      - name: "Channel teardown"
        if: ${{ always() }}
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: deb
          ARTIFACT_NAME: test-deb-${{ matrix.websrv }}-${{ matrix.mode }}.tar.gz
          WEBSRV: ${{ matrix.websrv }}
