name: CA-Handler Tests - EJBCA
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'
      run_id:
        description: 'Run ID of the producing workflow'
        required: true
        default: '0'
      sha:
        description: 'SHA of the commit to run the workflow on'
        required: true
        default: ''
      called_by_workflow:
        description: 'Name of the producing workflow'
        required: true
        default: 'manual-trigger'
      full_ref:
        description: 'Full git ref of the commit to run the workflow on'
        required: false
        default: ''

jobs:

  # ---------------------------------------------------------
  # Quick guard to validate incoming payload
  # ---------------------------------------------------------
  guard:
    runs-on: ubuntu-latest
    if: ${{ inputs.sha != '' && inputs.run_id != '' && inputs.branch != '' && github.repository == 'grindsa/acme2certifier' }}
    steps:
      - run: |
          echo "Triggered by SHA:    $SHA"
          echo "From branch:         $BRANCH"
          echo "Producer run_id:     $RUN_ID"
        env:
          SHA: ${{ inputs.sha }}
          BRANCH: ${{ inputs.branch }}
          RUN_ID: ${{ inputs.run_id }}

  # ---------------------------------------------------------
  # Test container images (matrix from payload)
  # ---------------------------------------------------------
  test-containers:
    needs: guard
    runs-on: ubuntu-latest
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        dbhandler: ['wsgi', 'django']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Get runner ip"
        run: |
          echo RUNNER_IP=$(ip addr show eth0 | grep -i "inet " | cut -d ' ' -f 6 | cut -d '/' -f 1) >> $GITHUB_ENV
          echo RUNNER_PATH=$(pwd | sed 's_/_\\/_g') >> $GITHUB_ENV

      - run: echo "runner IP is $RUNNER_IP"
        env:
          RUNNER_IP: ${{ env.RUNNER_IP }}

      - name: "Instanciate ejbca"
        uses: ./.github/actions/wf_specific/ejbca_ca_handler/ejbca_prep
        with:
          RUNNER_IP: ${{ env.RUNNER_IP }}
          WORKING_DIR: ${{ github.workspace }}/examples/Docker

      - name: "Download and import container"
        uses: ./.github/actions/container_load
        with:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: a2c-${{ inputs.run_id }}.${{ matrix.websrv }}.${{ matrix.dbhandler }}.tar
          DESTINATION_PATH: /tmp
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Prepare container environment"
        uses: ./.github/actions/container_prep
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}
          CONTAINER_BUILD: false
          NAME_SPACE: acme

      - name: "Default - setup a2c with ejbca_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.ejbca_ca_handler
          OPTIONS: |
            api_host: https://ejbca
            cert_file: volume/acme_ca/superadmin.p12
            cert_passphrase: ${{ env.SAEC }}
            ca_bundle: volume/acme_ca/ca_bundle.pem
            ca_name: acmesubca
            cert_profile_name: acmeca1
            ee_profile_name: acmeca
            username: acme_srv
            enrollment_code: acme_srv
            allowed_domainlist: ["bar.local", "*.acme"]
        env:
          SAEC: ${{ env.SAEC }}

      - name: "Bring up a2c container"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Test enrollment"
        uses: ./.github/actions/acme_clients
        with:
          TEST_ADL: "true"

      - name: "Verify allowed_domainlist error"
        uses: ./.github/actions/logs_assert
        with:
          DEPLOYMENT_TYPE: container
          PATTERN: "FQDN/SAN [^ ]+ not allowed by configuration"
          REGEX: "true"
          IGNORE_CASE: "true"

      - name: "EAB without headerinfo - setup a2c with ejbca_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.ejbca_ca_handler
          OPTIONS: |
            api_host: https://ejbca
            cert_file: volume/acme_ca/superadmin.p12
            cert_passphrase: ${{ env.SAEC }}
            ca_bundle: volume/acme_ca/ca_bundle.pem
            ca_name: acmesubca
            cert_profile_name: acmeca1
            ee_profile_name: acmeca
            username: acme_srv
            enrollment_code: acme_srv
          EXTRA_SECTIONS: |
            [EABhandler]
            eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler
            key_file: volume/kid_profiles.json
            eab_profiling: True
        env:
          SAEC: ${{ env.SAEC }}

      - name: "Stage kid_profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/ejbca.json
          DEST: examples/Docker/data/kid_profiles.json
      - name: "EAB without headerinfo - setup a2c with ejbca_ca_handler (post-cfg)"
        run: |
          cd examples/Docker/
          docker compose restart
          docker compose logs
        env:
          SAEC: ${{ env.SAEC }}

      - name: "EAB without headerinfo - enrollment"
        uses: ./.github/actions/wf_specific/ejbca_ca_handler/enroll_eab_wo_headerinfo

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "EAB with headerinfo - setup a2c with ejbca_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.ejbca_ca_handler
          OPTIONS: |
            api_host: https://ejbca
            cert_file: volume/acme_ca/superadmin.p12
            cert_passphrase: ${{ env.SAEC }}
            ca_bundle: volume/acme_ca/ca_bundle.pem
            ca_name: acmesubca
            cert_profile_name: acmeca1
            ee_profile_name: acmeca
            username: acme_srv
            enrollment_code: acme_srv
          EXTRA_SECTIONS: |
            [EABhandler]
            eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler
            key_file: volume/kid_profiles.json
            eab_profiling: True
        env:
          SAEC: ${{ env.SAEC }}

      - name: "Stage kid_profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/ejbca.json
          DEST: examples/Docker/data/kid_profiles.json
      - name: "EAB with headerinfo - setup a2c with ejbca_ca_handler (post-cfg)"
        run: |
          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nheader_info_list: [\"HTTP_USER_AGENT\"]/g" examples/Docker/data/acme_srv.cfg

          cd examples/Docker/
          docker compose restart
          docker compose logs
        env:
          SAEC: ${{ env.SAEC }}

      - name: "EAB with headerinfo - enrollment"
        uses: ./.github/actions/wf_specific/ejbca_ca_handler/enroll_eab_w_headerinfo

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "ACME Profiling - setup a2c with ejbca_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.ejbca_ca_handler
          OPTIONS: |
            api_host: https://ejbca
            cert_file: volume/acme_ca/superadmin.p12
            cert_passphrase: ${{ env.SAEC }}
            ca_bundle: volume/acme_ca/ca_bundle.pem
            ca_name: acmesubca
            cert_profile_name: acmeca1
            ee_profile_name: acmeca
            username: acme_srv
            enrollment_code: acme_srv
        env:
          SAEC: ${{ env.SAEC }}

      - name: "ACME Profiling - setup a2c with ejbca_ca_handler (post-cfg)"
        run: |
          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nprofiles={\"acmeca1\": \"http:\/\/foo.bar\/acmeca1\", \"acmeca2\": \"http:\/\/foo.bar\/acmeca2\", \"profile3\": \"http:\/\/foo.bar\/profile3\"}/g" examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart
        env:
          SAEC: ${{ env.SAEC }}

      - name: "ACME Profiling - enrollment"
        uses: ./.github/actions/wf_specific/ejbca_ca_handler/enroll_acmeprofile

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "EAB ACME Profiling - setup a2c with ejbca_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.ejbca_ca_handler
          OPTIONS: |
            api_host: https://ejbca
            cert_file: volume/acme_ca/superadmin.p12
            cert_passphrase: ${{ env.SAEC }}
            ca_bundle: volume/acme_ca/ca_bundle.pem
            ca_name: acmesubca
            cert_profile_name: acmeca1
            ee_profile_name: acmeca
            username: acme_srv
            enrollment_code: acme_srv
          EXTRA_SECTIONS: |
            [EABhandler]
            eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler
            key_file: volume/kid_profiles.json
            eab_profiling: True
        env:
          SAEC: ${{ env.SAEC }}

      - name: "Stage kid_profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/ejbca.json
          DEST: examples/Docker/data/kid_profiles.json
      - name: "EAB ACME Profiling - setup a2c with ejbca_ca_handler (post-cfg)"
        run: |
          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nprofiles={\"acmeca1\": \"http:\/\/foo.bar\/acmeca1\", \"acmeca2\": \"http:\/\/foo.bar\/acmeca2\", \"profile3\": \"http:\/\/foo.bar\/profile3\"}/g" examples/Docker/data/acme_srv.cfg

          cd examples/Docker/
          docker compose restart
        env:
          SAEC: ${{ env.SAEC }}

      - name: "EAB ACME Profiling - enrollment"
        uses: ./.github/actions/wf_specific/ejbca_ca_handler/enroll_eab_acmeprofile

      - name: "Check container configuration"
        uses: ./.github/actions/container_check
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "[ * ] Collecting extra failure logs"
        if: ${{ failure() }}
        run: |
          mkdir -p ${{ github.workspace }}/artifact ${{ github.workspace }}/artifact/data
          docker logs ejbca > ${{ github.workspace }}/artifact/ejbca.log

      - name: "[ * ] Collecting test logs"
        if: ${{ failure() }}
        uses: ./.github/actions/collect_failure_logs
        with:
          DEPLOYMENT_TYPE: container

      - name: "[ * ] Uploading artifacts"
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: container-tests-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz
          path: ${{ github.workspace }}/artifact/upload/

  # ---------------------------------------------------------
  # Test RPMs (EL8 & EL9) downloaded from the producer run
  # ---------------------------------------------------------
  test-rpm:
    needs: guard
    runs-on: ubuntu-latest
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        rhversion: [8, 9]
        mode: ['wsgi', 'django']
    steps:

      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Parse JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.GH_CFG }}

      - name: "Get runner ip"
        run: |
          echo RUNNER_IP=$(ip addr show eth0 | grep -i "inet " | cut -d ' ' -f 6 | cut -d '/' -f 1) >> $GITHUB_ENV
          echo RUNNER_PATH=$(pwd | sed 's_/_\\/_g') >> $GITHUB_ENV
      - run: echo "runner IP is $RUNNER_IP"
        env:
          RUNNER_IP: ${{ env.RUNNER_IP }}

      - name: "Instanciate ejbca"
        uses: ./.github/actions/wf_specific/ejbca_ca_handler/ejbca_prep
        with:
          RUNNER_IP: ${{ env.RUNNER_IP }}
          WORKING_DIR: ${{ github.workspace }}

      - name: "Prepare Alma environment"
        uses: ./.github/actions/rpm_prep
        with:
          GH_USER: ${{ env.GH_USER }}
          GH_SBOM_REPO_TOKEN: ${{ env.GH_SBOM_REPO_TOKEN }}
          RH_VERSION: ${{ matrix.rhversion }}
          RPM_BUILD: false

      - name: "Download RPM artifact by name from build run"
        uses: ./.github/actions/download_artifact
        with:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: acme2certifier-${{ inputs.run_id }}.noarch.rpm
          DESTINATION_PATH: data/
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Default - setup a2c with ejbca_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.ejbca_ca_handler
          OPTIONS: |
            api_host: https://ejbca
            cert_file: /opt/acme2certifier/volume/acme_ca/superadmin.p12
            cert_passphrase: ${{ env.SAEC }}
            ca_bundle: /opt/acme2certifier/volume/acme_ca/ca_bundle.pem
            ca_name: acmesubca
            cert_profile_name: acmeca1
            ee_profile_name: acmeca
            username: acme_srv
            enrollment_code: acme_srv
            allowed_domainlist: ["bar.local", "*.acme"]
        env:
          SAEC: ${{ env.SAEC }}

      - name: "Default - setup a2c with ejbca_ca_handler (post-cfg)"
        run: |
          sudo mkdir -p data/volume/acme_ca/certs
        env:
          SAEC: ${{ env.SAEC }}

      - name: "Execute install script"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh install -m $MODE
        env:
          MODE: ${{ matrix.mode }}

      - name: "Test enrollment"
        uses: ./.github/actions/acme_clients
        with:
          TEST_ADL: "true"

      - name: "Verify allowed_domainlist error"
        uses: ./.github/actions/logs_assert
        with:
          DEPLOYMENT_TYPE: rpm
          PATTERN: "FQDN/SAN [^ ]+ not allowed by configuration"
          REGEX: "true"
          IGNORE_CASE: "true"

      - name: "EAB without headerinfo - setup a2c with ejbca_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.ejbca_ca_handler
          OPTIONS: |
            api_host: https://ejbca
            cert_file: /opt/acme2certifier/volume/acme_ca/superadmin.p12
            cert_passphrase: ${{ env.SAEC }}
            ca_bundle: /opt/acme2certifier/volume/acme_ca/ca_bundle.pem
            ca_name: acmesubca
            cert_profile_name: acmeca1
            ee_profile_name: acmeca
            username: acme_srv
            enrollment_code: acme_srv
          EXTRA_SECTIONS: |
            [EABhandler]
            eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler
            key_file: /opt/acme2certifier/volume/acme_ca/kid_profiles.json
            eab_profiling: True
        env:
          SAEC: ${{ env.SAEC }}

      - name: "Stage kid_profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/ejbca.json
          DEST: data/volume/acme_ca/kid_profiles.json
      - name: "EAB without headerinfo - setup a2c with ejbca_ca_handler (post-cfg)"
        run: |
        env:
          SAEC: ${{ env.SAEC }}

      - name: "Reconfigure a2c"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart
        env:
          MODE: ${{ matrix.mode }}

      - name: "EAB without headerinfo - enrollment"
        uses: ./.github/actions/wf_specific/ejbca_ca_handler/enroll_eab_wo_headerinfo

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: rpm

      - name: "EAB with headerinfo - setup a2c with ejbca_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.ejbca_ca_handler
          OPTIONS: |
            api_host: https://ejbca
            cert_file: /opt/acme2certifier/volume/acme_ca/superadmin.p12
            cert_passphrase: ${{ env.SAEC }}
            ca_bundle: /opt/acme2certifier/volume/acme_ca/ca_bundle.pem
            ca_name: acmesubca
            cert_profile_name: acmeca1
            ee_profile_name: acmeca
            username: acme_srv
            enrollment_code: acme_srv
          EXTRA_SECTIONS: |
            [EABhandler]
            eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler
            key_file: /opt/acme2certifier/volume/acme_ca/kid_profiles.json
            eab_profiling: True
        env:
          SAEC: ${{ env.SAEC }}

      - name: "Stage kid_profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/ejbca.json
          DEST: data/volume/acme_ca/kid_profiles.json
      - name: "EAB with headerinfo - setup a2c with ejbca_ca_handler (post-cfg)"
        run: |
          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nheader_info_list: [\"HTTP_USER_AGENT\"]/g" data/volume/acme_srv.cfg

        env:
          SAEC: ${{ env.SAEC }}

      - name: "Reconfigure a2c"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart
        env:
          MODE: ${{ matrix.mode }}

      - name: "EAB with headerinfo - enrollment"
        uses: ./.github/actions/wf_specific/ejbca_ca_handler/enroll_eab_w_headerinfo

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: rpm

      - name: "ACME Profiling - setup a2c with ejbca_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.ejbca_ca_handler
          OPTIONS: |
            api_host: https://ejbca
            cert_file: /opt/acme2certifier/volume/acme_ca/superadmin.p12
            cert_passphrase: ${{ env.SAEC }}
            ca_bundle: /opt/acme2certifier/volume/acme_ca/ca_bundle.pem
            ca_name: acmesubca
            cert_profile_name: acmeca1
            ee_profile_name: acmeca
            username: acme_srv
            enrollment_code: acme_srv
        env:
          SAEC: ${{ env.SAEC }}

      - name: "ACME Profiling - setup a2c with ejbca_ca_handler (post-cfg)"
        run: |
          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nprofiles={\"acmeca1\": \"http:\/\/foo.bar\/acmeca1\", \"acmeca2\": \"http:\/\/foo.bar\/acmeca2\", \"profile3\": \"http:\/\/foo.bar\/profile3\"}/g" data/volume/acme_srv.cfg
        env:
          SAEC: ${{ env.SAEC }}

      - name: "Reconfigure a2c"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart
        env:
          MODE: ${{ matrix.mode }}

      - name: "ACME Profiling - enrollment"
        uses: ./.github/actions/wf_specific/ejbca_ca_handler/enroll_acmeprofile

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: rpm

      - name: "EAB ACME Profiling - setup a2c with ejbca_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.ejbca_ca_handler
          OPTIONS: |
            api_host: https://ejbca
            cert_file: /opt/acme2certifier/volume/acme_ca/superadmin.p12
            cert_passphrase: ${{ env.SAEC }}
            ca_bundle: /opt/acme2certifier/volume/acme_ca/ca_bundle.pem
            ca_name: acmesubca
            cert_profile_name: acmeca1
            ee_profile_name: acmeca
            username: acme_srv
            enrollment_code: acme_srv
          EXTRA_SECTIONS: |
            [EABhandler]
            eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler
            key_file: /opt/acme2certifier/volume/acme_ca/kid_profiles.json
            eab_profiling: True
        env:
          SAEC: ${{ env.SAEC }}

      - name: "Stage kid_profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/ejbca.json
          DEST: data/volume/acme_ca/kid_profiles.json
      - name: "EAB ACME Profiling - setup a2c with ejbca_ca_handler (post-cfg)"
        run: |
          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nprofiles={\"acmeca1\": \"http:\/\/foo.bar\/acmeca1\", \"acmeca2\": \"http:\/\/foo.bar\/acmeca2\", \"profile3\": \"http:\/\/foo.bar\/profile3\"}/g" data/volume/acme_srv.cfg

        env:
          SAEC: ${{ env.SAEC }}

      - name: "Reconfigure a2c"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart
        env:
          MODE: ${{ matrix.mode }}

      - name: "EAB ACME Profiling - enrollment"
        uses: ./.github/actions/wf_specific/ejbca_ca_handler/enroll_eab_acmeprofile

      - name: "[ * ] Collecting extra failure logs"
        if: ${{ failure() }}
        run: |
          mkdir -p ${{ github.workspace }}/artifact ${{ github.workspace }}/artifact/data
          docker logs ejbca > ${{ github.workspace }}/artifact/ejbca.log

      - name: "[ * ] Collecting test logs"
        if: ${{ failure() }}
        uses: ./.github/actions/collect_failure_logs
        with:
          DEPLOYMENT_TYPE: rpm

      - name: "[ * ] Uploading artifacts"
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: test-rpm-rh${{ matrix.rhversion }}-${{ matrix.mode }}.tar.gz
          path: ${{ github.workspace }}/artifact/upload/

  # ---------------------------------------------------------
  # Test DEB downloaded from the producer run
  # ---------------------------------------------------------
  test-deb:
    needs: guard
    runs-on: ubuntu-latest
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        mode: ['wsgi', 'django']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Prepare Ubuntu environment"
        if: matrix.mode == 'wsgi'
        uses: ./.github/actions/deb_prep
        with:
          DEB_BUILD: false

      - name: "Prepare Ubuntu environment"
        if: matrix.mode == 'django'
        uses: ./.github/actions/deb_prep
        with:
          DEB_BUILD: false
          DJANGO_DB: psql

