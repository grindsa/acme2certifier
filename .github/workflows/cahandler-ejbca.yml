          OPTIONS: |
            api_host: https://ejbca
            cert_file: /var/www/acme2certifier/volume/acme_ca/superadmin.p12
            cert_passphrase: ${{ env.SAEC }}
            ca_bundle: /var/www/acme2certifier/volume/acme_ca/ca_bundle.pem
            ca_name: acmesubca
            cert_profile_name: acmeca1
            ee_profile_name: acmeca
            username: acme_srv
            enrollment_code: acme_srv
            allowed_domainlist: ["bar.local", "*.acme"]
        env:
          SAEC: ${{ env.SAEC }}

      - name: "Default - setup a2c with ejbca_ca_handler (post-cfg)"
        run: |
          sudo mkdir -p data/volume/acme_ca/certs
        env:
          SAEC: ${{ env.SAEC }}

      - name: "Execute install script"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh install $WEBSRV -m $MODE
