name: CA-Handler Tests - ACME (le-sim)
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'
      run_id:
        description: 'Run ID of the producing workflow'
        required: true
        default: '0'
      sha:
        description: 'SHA of the commit to run the workflow on'
        required: true
        default: ''
      called_by_workflow:
        description: 'Name of the producing workflow'
        required: true
        default: 'manual-trigger'
      full_ref:
        description: 'Full git ref of the commit to run the workflow on'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ inputs.branch }}
  cancel-in-progress: true

permissions: {}

jobs:
  guard:
    permissions: {}
    uses: ./.github/workflows/_guard.yml
    with:
      sha: ${{ inputs.sha }}
      run_id: ${{ inputs.run_id }}
      branch: ${{ inputs.branch }}

  # ---------------------------------------------------------
  # Containers — le-sim
  # ---------------------------------------------------------
  test-containers:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        dbhandler: ['wsgi', 'django']
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - uses: actions/checkout@v6

      - uses: ./.github/actions/wf_specific/acme_ca_handler/container_bootstrap
        with:
          RUN_ID: ${{ inputs.run_id }}
          WEB_SRV: ${{ matrix.websrv }}
          DB_HANDLER: ${{ matrix.dbhandler }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - uses: ./.github/actions/wf_specific/acme_ca_handler/le-sim_prep

      - uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.acme_ca_handler
          OPTIONS: |
            acme_keyfile: volume/acme/le_staging_private_key.json
            acme_url: http://acme-le-sim
            acme_account_email: grindsa@foo.bar
            allowed_domainlist: ["bar.local", "*.acme"]

      - uses: ./.github/actions/wf_specific/acme_ca_handler/post_cfg_common
        with:
          VOLUME_DIR: "examples/Docker/data"

      - uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - uses: ./.github/actions/wait_for_directory

      - uses: ./.github/actions/acme_clients_enroll
        with:
          TEST_ADL: "true"

      - name: "Verify allowed_domainlist error"
        uses: ./.github/actions/logs_assert
        with:
          DEPLOYMENT_TYPE: container
          PATTERN: "FQDN/SAN [^ ]+ not allowed by configuration"
          REGEX: "true"
          IGNORE_CASE: "true"
          FLUSH: "false"

      - name: "Check acme account found in keyfile"
        uses: ./.github/actions/logs_assert
        with:
          DEPLOYMENT_TYPE: container
          PATTERN: "found in keyfile"
          IGNORE_CASE: "true"
          FLUSH: "false"

      - uses: ./.github/actions/container_check
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.acme_ca_handler
          OPTIONS: |
            acme_keyfile: volume/acme/le_staging_private_key.json
            acme_url: http://acme-le-sim
            acme_account_email: grindsa@foo.bar
            allowed_domainlist: ["bar.local", "*.acme"]
            enrollment_config_log: True

      - uses: ./.github/actions/wf_specific/acme_ca_handler/post_cfg_common
        with:
          VOLUME_DIR: "examples/Docker/data"
          EXTRA_SED: 's/tnauthlist_support: False/tnauthlist_support: False\nprofiles={"profile1": "http:\/\/foo.bar\/profile1", "profile2": "http:\/\/foo.bar\/profile2", "profile3": "http:\/\/foo.bar\/profile3"}/g'

      - name: "Restart a2c"
        run: |
          cd examples/Docker/
          docker compose restart

      - uses: ./.github/actions/wait_for_directory

      - uses: ./.github/actions/wf_specific/acme_ca_handler/enroll_acmeprofile
        with:
          DEPLOYMENT_TYPE: "container"

      - uses: ./.github/actions/wf_specific/acme_ca_handler/failure_artifacts
        if: ${{ failure() }}
        with:
          DEPLOYMENT_TYPE: container
          ARTIFACT_NAME: test-container-lesim-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz
          SIDECAR_LOGS: acme-le-sim

      - name: "Secure cleanup"
        if: ${{ always() }}
        uses: ./.github/actions/secure_cleanup


  # ---------------------------------------------------------
  # RPM — le-sim
  # ---------------------------------------------------------
  test-rpm:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        rhversion: [8, 9]
        mode: ['wsgi', 'django']
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - uses: actions/checkout@v6

      - uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.GH_CFG }}

      - uses: ./.github/actions/wf_specific/acme_ca_handler/rpm_bootstrap
        with:
          RUN_ID: ${{ inputs.run_id }}
          RH_VERSION: ${{ matrix.rhversion }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          GH_USER: ${{ env.GH_USER }}
          GH_SBOM_REPO_TOKEN: ${{ env.GH_SBOM_REPO_TOKEN }}

      - uses: ./.github/actions/wf_specific/acme_ca_handler/le-sim_prep

      - uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.acme_ca_handler
          OPTIONS: |
            acme_keyfile: /opt/acme2certifier/volume/le_staging_private_key.json
            acme_url: http://acme-le-sim
            acme_account_email: grindsa@foo.bar
            allowed_domainlist: ["bar.local", "*.acme"]

      - uses: ./.github/actions/wf_specific/acme_ca_handler/post_cfg_common
        with:
          VOLUME_DIR: "data/volume"
          ACME_SUBDIR: ""

      - name: "Execute install script"
        run: docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh install -m "$MODE"
        env:
          MODE: ${{ matrix.mode }}

      - uses: ./.github/actions/wait_for_directory

      - uses: ./.github/actions/acme_clients_enroll
        with:
          TEST_ADL: "true"

      - name: "Verify allowed_domainlist error"
        uses: ./.github/actions/logs_assert
        with:
          DEPLOYMENT_TYPE: rpm
          PATTERN: "FQDN/SAN [^ ]+ not allowed by configuration"
          REGEX: "true"
          IGNORE_CASE: "true"
          FLUSH: "false"

      - name: "Check acme account found in keyfile"
        uses: ./.github/actions/logs_assert
        with:
          DEPLOYMENT_TYPE: rpm
          PATTERN: "found in keyfile"
          IGNORE_CASE: "true"

      - uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.acme_ca_handler
          OPTIONS: |
            acme_keyfile: /opt/acme2certifier/volume/le_staging_private_key.json
            acme_url: http://acme-le-sim
            acme_account_email: grindsa@foo.bar
            allowed_domainlist: ["bar.local", "*.acme"]
            enrollment_config_log: True

      - uses: ./.github/actions/wf_specific/acme_ca_handler/post_cfg_common
        with:
          VOLUME_DIR: "data/volume"
          ACME_SUBDIR: ""
          EXTRA_SED: 's/tnauthlist_support: False/tnauthlist_support: False\nprofiles={"profile1": "http:\/\/foo.bar\/profile1", "profile2": "http:\/\/foo.bar\/profile2", "profile3": "http:\/\/foo.bar\/profile3"}/g'

      - name: "Reconfigure a2c"
        run: docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart
        env:
          MODE: ${{ matrix.mode }}

      - uses: ./.github/actions/wait_for_directory

      - uses: ./.github/actions/wf_specific/acme_ca_handler/enroll_acmeprofile
        with:
          DEPLOYMENT_TYPE: "rpm"

      - uses: ./.github/actions/wf_specific/acme_ca_handler/failure_artifacts
        if: ${{ failure() }}
        with:
          DEPLOYMENT_TYPE: rpm
          ARTIFACT_NAME: test-rpm-lesim-rh${{ matrix.rhversion }}-${{ matrix.mode }}.tar.gz
          SIDECAR_LOGS: acme-le-sim

      - name: "Secure cleanup"
        if: ${{ always() }}
        uses: ./.github/actions/secure_cleanup


  # ---------------------------------------------------------
  # DEB — le-sim
  # ---------------------------------------------------------
  test-deb:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        mode: ['wsgi', 'django']
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Channel setup"
        uses: ./.github/actions/channel_deb_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          DJANGO_DB: ${{ matrix.mode == 'django' && 'psql' || '' }}

      - uses: ./.github/actions/wf_specific/acme_ca_handler/le-sim_prep

      - uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.acme_ca_handler
          OPTIONS: |
            acme_keyfile: /var/www/acme2certifier/volume/le_staging_private_key.json
            acme_url: http://acme-le-sim
            acme_account_email: grindsa@foo.bar
            allowed_domainlist: ["bar.local", "*.acme"]

      - uses: ./.github/actions/wf_specific/acme_ca_handler/post_cfg_common
        with:
          VOLUME_DIR: "data/volume"
          ACME_SUBDIR: ""

      - name: "Execute install script"
        run: docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh install "$WEBSRV" -m "$MODE"
        env:
          WEBSRV: ${{ matrix.websrv }}
          MODE: ${{ matrix.mode }}

      - uses: ./.github/actions/wait_for_directory

      - uses: ./.github/actions/acme_clients_enroll
        with:
          TEST_ADL: "true"

      - name: "Verify allowed_domainlist error"
        uses: ./.github/actions/logs_assert
        with:
          DEPLOYMENT_TYPE: deb
          PATTERN: "FQDN/SAN [^ ]+ not allowed by configuration"
          REGEX: "true"
          IGNORE_CASE: "true"
          FLUSH: "false"

      - name: "Check acme account found in keyfile"
        uses: ./.github/actions/logs_assert
        with:
          DEPLOYMENT_TYPE: deb
          PATTERN: "found in keyfile"
          IGNORE_CASE: "true"

      - uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.acme_ca_handler
          OPTIONS: |
            acme_keyfile: /var/www/acme2certifier/volume/le_staging_private_key.json
            acme_url: http://acme-le-sim
            acme_account_email: grindsa@foo.bar
            allowed_domainlist: ["bar.local", "*.acme"]
            enrollment_config_log: True

      - uses: ./.github/actions/wf_specific/acme_ca_handler/post_cfg_common
        with:
          VOLUME_DIR: "data/volume"
          ACME_SUBDIR: ""
          EXTRA_SED: 's/tnauthlist_support: False/tnauthlist_support: False\nprofiles={"profile1": "http:\/\/foo.bar\/profile1", "profile2": "http:\/\/foo.bar\/profile2", "profile3": "http:\/\/foo.bar\/profile3"}/g'

      - name: "Reconfigure a2c"
        run: docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh restart "$WEBSRV"
        env:
          WEBSRV: ${{ matrix.websrv }}

      - uses: ./.github/actions/wait_for_directory

      - uses: ./.github/actions/wf_specific/acme_ca_handler/enroll_acmeprofile
        with:
          DEPLOYMENT_TYPE: "deb"

      - uses: ./.github/actions/wf_specific/acme_ca_handler/failure_artifacts
        if: ${{ failure() }}
        with:
          DEPLOYMENT_TYPE: deb
          ARTIFACT_NAME: test-deb-lesim-${{ matrix.websrv }}-${{ matrix.mode }}.tar.gz
          WEBSRV: ${{ matrix.websrv }}
          SIDECAR_LOGS: acme-le-sim

      - name: "Secure cleanup"
        if: ${{ always() }}
        uses: ./.github/actions/secure_cleanup
