name: Deployment Tests - Upgrades
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'
      run_id:
        description: 'Run ID of the producing workflow'
        required: true
        default: '0'
      sha:
        description: 'SHA of the commit to run the workflow on'
        required: true
        default: ''
      called_by_workflow:
        description: 'Name of the producing workflow'
        required: true
        default: 'manual-trigger'
      full_ref:
        description: 'Full git ref of the commit to run the workflow on'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ inputs.branch }}
  cancel-in-progress: true

permissions: {}

jobs:
  guard:
    permissions: {}
    uses: ./.github/workflows/_guard.yml
    with:
      sha: ${{ inputs.sha }}
      run_id: ${{ inputs.run_id }}
      branch: ${{ inputs.branch }}

  # ---------------------------------------------------------
  # Resolve one-hop matrix: latest / N-1 / N-2 / pre045 → build
  # ---------------------------------------------------------
  resolve-versions:
    permissions:
      contents: read
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.repository == 'grindsa/acme2certifier'
    outputs:
      app_version: ${{ steps.resolve.outputs.app_version }}
      n_tag: ${{ steps.resolve.outputs.n_tag }}
      hops_docker: ${{ steps.resolve.outputs.hops_docker }}
      hops_rpm: ${{ steps.resolve.outputs.hops_rpm }}
      hops_deb: ${{ steps.resolve.outputs.hops_deb }}
      has_docker_hops: ${{ steps.resolve.outputs.has_docker_hops }}
      has_rpm_hops: ${{ steps.resolve.outputs.has_rpm_hops }}
      has_deb_hops: ${{ steps.resolve.outputs.has_deb_hops }}
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v7

      - name: "Resolve one-hop upgrade matrix"
        id: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          is_modern() {
            python3 - "$1" <<'PY'
          import re, sys
          m = re.match(r"(\d+)\.(\d+)", sys.argv[1])
          if not m:
              sys.exit(1)
          sys.exit(0 if (int(m.group(1)), int(m.group(2))) > (0, 44) else 1)
          PY
          }

          # Prefer GitHub Releases API (token already set). Avoid curl HEAD on
          # release-asset URLs (302→CDN) and jq test("\\.rpm$") (\r / invalid escapes).
          release_asset_names() {
            local tag="$1"
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
              --jq '.assets[].name' 2>/dev/null || true
          }

          tag_has_docker() {
            local tag="$1"
            local code websrv
            for websrv in nginx apache2; do
              code=$(curl -sL -o /dev/null -w '%{http_code}' \
                "https://hub.docker.com/v2/repositories/grindsa/acme2certifier/tags/${tag}-${websrv}-wsgi" \
                || echo 000)
              if [[ "${code}" == "200" ]]; then
                return 0
              fi
              code=$(curl -sL -o /dev/null -w '%{http_code}' \
                "https://hub.docker.com/v2/repositories/grindsa/acme2certifier/tags/${tag}-${websrv}-django" \
                || echo 000)
              if [[ "${code}" == "200" ]]; then
                return 0
              fi
              # Hub miss: still OK if Dockerfiles exist on the tag (ensure_container_image builds).
              code=$(curl -sL -o /dev/null -w '%{http_code}' \
                "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${tag}/examples/Docker/${websrv}/wsgi/Dockerfile" \
                || echo 000)
              if [[ "${code}" == "200" ]]; then
                return 0
              fi
            done
            return 1
          }

          docker_tag_exists() {
            local tag="$1"
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
              --jq '.assets[].name' 2>/dev/null || true
          }

          tag_has_docker() {
            local tag="$1"
            local code websrv
            for websrv in nginx apache2; do
              code=$(curl -sL -o /dev/null -w '%{http_code}' \
                "https://hub.docker.com/v2/repositories/grindsa/acme2certifier/tags/${tag}-${websrv}-wsgi" \
                || echo 000)
              if [[ "${code}" == "200" ]]; then
                return 0
              fi
              code=$(curl -sL -o /dev/null -w '%{http_code}' \
                "https://hub.docker.com/v2/repositories/grindsa/acme2certifier/tags/${tag}-${websrv}-django" \
                || echo 000)
              if [[ "${code}" == "200" ]]; then
                return 0
              fi
              # Hub miss: still OK if Dockerfiles exist on the tag (ensure_container_image builds).
              code=$(curl -sL -o /dev/null -w '%{http_code}' \
                "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${tag}/examples/Docker/${websrv}/wsgi/Dockerfile" \
                || echo 000)
              if [[ "${code}" == "200" ]]; then
                return 0
              fi
            done
            return 1
          }

          tag_has_rpm() {
            local tag="$1"
            release_asset_names "${tag}" | grep -Eq '\.noarch\.rpm$'
          }

          tag_has_deb() {
            local tag="$1"
            release_asset_names "${tag}" | grep -Eq '\.deb$'
          }

          APP_VERSION=$(grep -i __version__ acme2certifier/acme_srv/version.py | head -n1 \
            | sed 's/__version__ = //g' | sed 's/"//g' | tr -d "[:space:]")

          N_TAG=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" \
            | jq -r '.tag_name')

          TAGS_JSON=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tags")
          echo "${TAGS_JSON}" | jq -e 'type=="array"' >/dev/null

          # Latest tag matching minor series MM (e.g. 43 → 0.43.x)
          latest_in_minor() {
            local minor="$1"
            echo "${TAGS_JSON}" | jq -r '.[].name' \
              | grep -E "^0\.${minor}(\.|$)" | head -n1 || true
          }

          N_MINOR=$(echo "${N_TAG}" | awk -F. '{print $2}')
          N1_TAG=$(latest_in_minor "$((N_MINOR - 1))")
          N2_TAG=$(latest_in_minor "$((N_MINOR - 2))")

          # Highest tag with version ≤ 0.44
          PRE045_TAG=$(echo "${TAGS_JSON}" | jq -r '.[].name' | python3 -c '
          import re, sys
          best = None
          best_t = None
          for line in sys.stdin:
              tag = line.strip()
              m = re.match(r"(\d+)\.(\d+)(?:\.(\d+))?", tag)
              if not m:
                  continue
              t = (int(m.group(1)), int(m.group(2)), int(m.group(3) or 0))
              if t > (0, 44, 999999):
                  continue
              if best_t is None or t > best_t:
                  best_t = t
                  best = tag
          print(best or "")
          ')

          BUILD_MODERN=false
          is_modern "${APP_VERSION}" && BUILD_MODERN=true || true

          # candidates: id|tag|require_modern_from
          # latest: skip when N ≤ 0.44 (covered by pre045)
          # n1/n2: only if tag > 0.44
          # pre045: always when tag exists
          CANDIDATES=()
          if [[ -n "${N_TAG}" ]] && is_modern "${N_TAG}"; then
            CANDIDATES+=("latest|${N_TAG}|true")
          fi
          if [[ -n "${N1_TAG}" ]] && is_modern "${N1_TAG}"; then
            CANDIDATES+=("n1|${N1_TAG}|true")
          fi
          if [[ -n "${N2_TAG}" ]] && is_modern "${N2_TAG}"; then
            CANDIDATES+=("n2|${N2_TAG}|true")
          fi
          if [[ -n "${PRE045_TAG}" ]]; then
            CANDIDATES+=("pre045|${PRE045_TAG}|false")
          fi

          HOPS_DOCKER='[]'
          HOPS_RPM='[]'
          HOPS_DEB='[]'

          for cand in "${CANDIDATES[@]}"; do
            IFS='|' read -r HID HTAG HREQ <<< "${cand}"
            FROM_MODERN=false
            is_modern "${HTAG}" && FROM_MODERN=true || true
            if [[ "${HREQ}" == "true" && "${FROM_MODERN}" != "true" ]]; then
              continue
            fi

            MIGRATE=false
            if [[ "${FROM_MODERN}" != "true" && "${BUILD_MODERN}" == "true" ]]; then
              MIGRATE=true
            fi
            # pre045 always migrates when build is modern
            if [[ "${HID}" == "pre045" && "${BUILD_MODERN}" == "true" ]]; then
              MIGRATE=true
            fi

            hop_json=$(jq -nc \
              --arg id "${HID}" \
              --arg from_tag "${HTAG}" \
              --arg from_modern "${FROM_MODERN}" \
              --arg migrate "${MIGRATE}" \
              '{id:$id, from_tag:$from_tag, from_modern:$from_modern, migrate:$migrate}')

            if tag_has_docker "${HTAG}"; then
              HOPS_DOCKER=$(echo "${HOPS_DOCKER}" | jq -c --argjson h "${hop_json}" '. + [$h]')
            fi
            if tag_has_rpm "${HTAG}"; then
              HOPS_RPM=$(echo "${HOPS_RPM}" | jq -c --argjson h "${hop_json}" '. + [$h]')
            fi
            if tag_has_deb "${HTAG}"; then
              HOPS_DEB=$(echo "${HOPS_DEB}" | jq -c --argjson h "${hop_json}" '. + [$h]')
            fi
          done

          HAS_DOCKER=false
          HAS_RPM=false
          HAS_DEB=false
          [[ "$(echo "${HOPS_DOCKER}" | jq 'length')" -gt 0 ]] && HAS_DOCKER=true
          [[ "$(echo "${HOPS_RPM}" | jq 'length')" -gt 0 ]] && HAS_RPM=true
          [[ "$(echo "${HOPS_DEB}" | jq 'length')" -gt 0 ]] && HAS_DEB=true

          {
            echo "app_version=${APP_VERSION}"
            echo "n_tag=${N_TAG}"
            echo "hops_docker=${HOPS_DOCKER}"
            echo "hops_rpm=${HOPS_RPM}"
            echo "hops_deb=${HOPS_DEB}"
            echo "has_docker_hops=${HAS_DOCKER}"
            echo "has_rpm_hops=${HAS_RPM}"
            echo "has_deb_hops=${HAS_DEB}"
          } >> "${GITHUB_OUTPUT}"

          echo "N=${N_TAG} N-1=${N1_TAG:-none} N-2=${N2_TAG:-none} pre045=${PRE045_TAG:-none} build=${APP_VERSION}"
          if [[ -n "${PRE045_TAG}" ]]; then
            echo "pre045 probes: docker=$(tag_has_docker "${PRE045_TAG}" && echo yes || echo no) rpm=$(tag_has_rpm "${PRE045_TAG}" && echo yes || echo no) deb=$(tag_has_deb "${PRE045_TAG}" && echo yes || echo no)"
            echo "pre045 assets:"; release_asset_names "${PRE045_TAG}" | sed 's/^/  /' || true
          fi
          echo "docker hops: ${HOPS_DOCKER}"
          echo "rpm hops:    ${HOPS_RPM}"
          echo "deb hops:    ${HOPS_DEB}"

  # ---------------------------------------------------------
  # Containers (nginx|apache2 × wsgi|django) × hop → build
  # ---------------------------------------------------------
  test-containers:
    permissions:
      contents: read
      actions: write
    needs: [guard, resolve-versions]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.repository == 'grindsa/acme2certifier' && needs.resolve-versions.outputs.has_docker_hops == 'true'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['nginx', 'apache2']
        dbhandler: ['wsgi', 'django']
        hop: ${{ fromJSON(needs.resolve-versions.outputs.hops_docker) }}
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v7

      - name: "Parse XCA configuration from JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.XCA_CFG }}

      - name: "Prepare container environment"
        uses: ./.github/actions/container_prep
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}
          CONTAINER_BUILD: false
          DJANGO_DB: ${{ matrix.dbhandler == 'django' && 'mariadb' || '' }}
          NAME_SPACE: acme

      - name: "Stage xca materials + legacy cfg"
        uses: ./.github/actions/wf_specific/upgrade/setup_legacy_xca
        with:
          VOLUME_DIR: examples/Docker/data
          DEPLOYMENT_TYPE: container
          DJANGO: ${{ matrix.dbhandler == 'django' && 'true' || 'false' }}
          DJANGO_SETTINGS_TAG: ${{ matrix.hop.from_tag }}

      - name: "Modernize cfg for from_tag"
        if: matrix.hop.from_modern == 'true'
        uses: ./.github/actions/wf_specific/upgrade/migrate_cfg
        with:
          VOLUME_DIR: examples/Docker/data
          DEPLOYMENT_TYPE: container
          XDB_FILE: volume/xca/${{ env.XCA_DB_NAME }}
          DJANGO: ${{ matrix.dbhandler == 'django' && 'true' || 'false' }}

      - name: "Ensure from image ${{ matrix.hop.from_tag }}"
        uses: ./.github/actions/wf_specific/upgrade/ensure_container_image
        with:
          VERSION: ${{ matrix.hop.from_tag }}
          WEB_SRV: ${{ matrix.websrv }}
          DB_HANDLER: ${{ matrix.dbhandler }}

      - name: "Spin-up ${{ matrix.hop.id }} (${{ matrix.hop.from_tag }})"
        uses: ./.github/actions/container_run
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}
          VERSION: ${{ matrix.hop.from_tag }}

      - name: "Enroll + renew (from)"
        uses: ./.github/actions/wf_specific/upgrade/enroll
        with:
          RENEWAL: true

      - name: "Stop container"
        run: docker stop acme-srv

      - name: "Migrate cfg before build"
        if: matrix.hop.migrate == 'true'
        uses: ./.github/actions/wf_specific/upgrade/migrate_cfg
        with:
          VOLUME_DIR: examples/Docker/data
          DEPLOYMENT_TYPE: container
          XDB_FILE: volume/xca/${{ env.XCA_DB_NAME }}
          DJANGO: ${{ matrix.dbhandler == 'django' && 'true' || 'false' }}

      - name: "Download and import build container"
        uses: ./.github/actions/container_load
        with:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: a2c-${{ inputs.run_id }}.${{ matrix.websrv }}.${{ matrix.dbhandler }}.tar
          DESTINATION_PATH: /tmp
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Spin-up build artifact"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Renew after build"
        uses: ./.github/actions/acme_clients_renew
        with:
          CLEANUP: true
          HOSTNAME_SUFFIX: ""

      - name: "Fresh enrollment"
        uses: ./.github/actions/acme_clients_enroll

      - name: "EAB profiling (final)"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: examples/Docker/data
          HANDLER_MODULE: acme2certifier.cahandlers.xca_ca_handler
          OPTIONS: |
            xdb_file: volume/xca/${{ env.XCA_DB_NAME }}
            issuing_ca_name: ${{ env.XCA_ISSUING_CA }}
            passphrase: ${{ env.XCA_PASSPHRASE }}
            ca_cert_chain_list: ["root-ca"]
            template_name: ${{ env.XCA_TEMPLATE }}
          EXTRA_SECTIONS: |
            [EABhandler]
            eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler
            key_file: volume/kid_profiles.json
            eab_profiling: True

      - name: "Stage kid_profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/xca.json
          DEST: examples/Docker/data/kid_profiles.json

      - name: "Restart for EAB cfg"
        uses: ./.github/actions/container_down
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Bring up for EAB"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "EAB enrollment"
        uses: ./.github/actions/wf_specific/upgrade/enroll_eab

      - name: "Check container configuration"
        uses: ./.github/actions/container_check
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Stop a2c instance"
        uses: ./.github/actions/container_down
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Channel teardown"
        if: ${{ always() }}
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: container
          ARTIFACT_NAME: test-containers-${{ matrix.websrv }}-${{ matrix.dbhandler }}-${{ matrix.hop.id }}-upgrade.tar.gz

  # ---------------------------------------------------------
  # RPM (EL8/EL9 × wsgi|django) × hop → build
  # ---------------------------------------------------------


  test-rpm:
    permissions:
      contents: read
      actions: write
    needs: [guard, resolve-versions]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.repository == 'grindsa/acme2certifier' && needs.resolve-versions.outputs.has_rpm_hops == 'true'
    strategy:
      fail-fast: false
      matrix:
        rhversion: [8, 9]
        mode: ['wsgi', 'django']
        hop: ${{ fromJSON(needs.resolve-versions.outputs.hops_rpm) }}
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v7

      - name: "Parse JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.GH_CFG }}

      - name: "Parse XCA configuration from JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.XCA_CFG }}

      - name: "Prepare Alma environment"
        uses: ./.github/actions/rpm_prep
        with:
          GH_USER: ${{ env.GH_USER }}
          GH_SBOM_REPO_TOKEN: ${{ env.GH_SBOM_REPO_TOKEN }}
          RH_VERSION: ${{ matrix.rhversion }}
          # EL8: pre045 needs python36 (python3-*); modern from-tags need python39.
          # Do not stage both at once — python3-django and python39-django both
          # own /usr/bin/django-admin.
          # EL9: system python3 leaf.
          PYTHON_STACK: >-
            ${{ matrix.rhversion == 9 && 'python3'
                || (matrix.hop.from_modern == 'true' && 'python39' || 'python36') }}
          RPM_BUILD: false
          DJANGO_DB: ${{ matrix.mode == 'django' && 'mariadb' || '' }}

      - name: "Stage xca materials + legacy cfg"
        uses: ./.github/actions/wf_specific/upgrade/setup_legacy_xca
        with:
          VOLUME_DIR: data/volume
          DEPLOYMENT_TYPE: rpm
          DJANGO: ${{ matrix.mode == 'django' && 'true' || 'false' }}
          DJANGO_SETTINGS_TAG: ${{ matrix.hop.from_tag }}

      - name: "Modernize cfg for from_tag"
        if: matrix.hop.from_modern == 'true'
        uses: ./.github/actions/wf_specific/upgrade/migrate_cfg
        with:
          VOLUME_DIR: data/volume
          DEPLOYMENT_TYPE: rpm
          XDB_FILE: volume/acme_ca/${{ env.XCA_DB_NAME }}
          DJANGO: ${{ matrix.mode == 'django' && 'true' || 'false' }}

      - name: "Download from RPM ${{ matrix.hop.from_tag }}"
        uses: ./.github/actions/wf_specific/upgrade/download_release_pkg
        with:
          TAG: ${{ matrix.hop.from_tag }}
          PKG_TYPE: rpm
          DESTINATION_PATH: data

      - name: "Install from RPM"
        uses: ./.github/actions/wf_specific/upgrade/rpm_install
        with:
          RPM_PATH: ${{ env.PKG_FILE }}
          MODE: ${{ matrix.mode }}
          MODERN: ${{ matrix.hop.from_modern }}

      - name: "Enroll + renew (from)"
        uses: ./.github/actions/wf_specific/upgrade/enroll
        with:
          RENEWAL: true

      - name: "Migrate cfg before build"
        if: matrix.hop.migrate == 'true'
        uses: ./.github/actions/wf_specific/upgrade/migrate_cfg
        with:
          VOLUME_DIR: data/volume
          DEPLOYMENT_TYPE: rpm
          XDB_FILE: volume/acme_ca/${{ env.XCA_DB_NAME }}
          DJANGO: ${{ matrix.mode == 'django' && 'true' || 'false' }}

      - name: "Download build RPM artifact"
        uses: ./.github/actions/download_artifact
        with:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: acme2certifier-${{ inputs.run_id }}.noarch.rpm
          DESTINATION_PATH: data/
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "EL8: swap SBOM to python39 before modern upgrade"
        if: matrix.rhversion == 8 && matrix.hop.from_modern == 'false'
        run: |
          set -euo pipefail
          # Legacy from-tag used python36 / system python3-*. Modern a2c needs
          # python39-*. Unversioned /usr/bin helpers collide (django-admin, jws, …).
          rm -rf /tmp/sbom-py39
          git clone --filter=blob:none --sparse --depth 1 \
            "https://${GH_USER}:${GH_SBOM_REPO_TOKEN}@github.com/${GH_USER}/sbom" /tmp/sbom-py39
          git -C /tmp/sbom-py39 sparse-checkout set rpm-repo/RPMs/rhel8/python39
          ARCH="$(uname -m)"
          shopt -s nullglob
          src=/tmp/sbom-py39/rpm-repo/RPMs/rhel8/python39
          copied=0
          for r in "${src}"/*.noarch.rpm "${src}"/*."${ARCH}".rpm; do
            [[ -f "${r}" ]] || continue
            sudo cp -v "${r}" data/
            copied=$((copied + 1))
          done
          if [[ "${copied}" -eq 0 ]]; then
            echo "ERROR: no python39 SBOM RPMs staged" >&2
            exit 1
          fi
          docker exec acme-srv bash -c '
            set -euo pipefail
            PKG=yum
            command -v dnf >/dev/null 2>&1 && PKG=dnf
            shopt -s nullglob
            filtered=()
            for r in /tmp/acme2certifier/python39-*.rpm /tmp/acme2certifier/uwsgi-plugin-python39-*.rpm; do
              [[ -f "${r}" ]] || continue
              filtered+=("${r}")
            done
            if ((${#filtered[@]} == 0)); then
              echo "ERROR: no python39 RPMs under /tmp/acme2certifier" >&2
              exit 1
            fi

            # Drop whatever currently owns /usr/bin paths the new RPMs ship.
            # Use rpm --nodeps so we do not cascade-remove acme2certifier-0.44
            # (it Requires python3-josepy etc. until the modern upgrade step).
            mapfile -t bins < <(
              for r in "${filtered[@]}"; do
                rpm -qpl "${r}" 2>/dev/null | grep -E "^/usr/bin/" || true
              done | sort -u
            )
            owners=()
            for b in "${bins[@]+"${bins[@]}"}"; do
              [[ -e "${b}" ]] || continue
              # NOTE: bash -c is single-quoted; do not nest '%{NAME}\n' or the
              # closing quote truncates the format to "%{NAME}n".
              if own="$(rpm -qf --qf %{NAME} "${b}" 2>/dev/null)"; then
                owners+=("${own}")
              fi
            done
            if ((${#owners[@]} > 0)); then
              mapfile -t owners < <(printf "%s\n" "${owners[@]}" | sort -u)
              echo "Removing conflicting owners of /usr/bin helpers (--nodeps):"
              printf "  %s\n" "${owners[@]}"
              rpm -e --nodeps "${owners[@]}"
            fi

            echo "Installing ${#filtered[@]} python39 companion RPM(s)"
            ${PKG} localinstall -y "${filtered[@]}"
          '
        env:
          GH_USER: ${{ env.GH_USER }}
          GH_SBOM_REPO_TOKEN: ${{ env.GH_SBOM_REPO_TOKEN }}

      - name: "Upgrade to build artifact"
        uses: ./.github/actions/wf_specific/upgrade/rpm_install
        with:
          RPM_PATH: data/acme2certifier-${{ inputs.run_id }}.noarch.rpm
          MODE: ${{ matrix.mode }}
          MODERN: "true"

      - name: "DB update after build"
        uses: ./.github/actions/wf_specific/upgrade/db_update

      - name: "Renew after build"
        uses: ./.github/actions/acme_clients_renew
        with:
          CLEANUP: true
          HOSTNAME_SUFFIX: ""

      - name: "Fresh enrollment"
        uses: ./.github/actions/acme_clients_enroll

      - name: "EAB profiling (final)"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: data/volume
          HANDLER_MODULE: acme2certifier.cahandlers.xca_ca_handler
          OPTIONS: |
            xdb_file: volume/acme_ca/${{ env.XCA_DB_NAME }}
            issuing_ca_name: ${{ env.XCA_ISSUING_CA }}
            passphrase: ${{ env.XCA_PASSPHRASE }}
            ca_cert_chain_list: ["root-ca"]
            template_name: ${{ env.XCA_TEMPLATE }}
          EXTRA_SECTIONS: |
            [EABhandler]
            eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler
            key_file: /opt/acme2certifier/volume/acme_ca/kid_profiles.json
            eab_profiling: True

      - name: "Stage kid_profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/xca.json
          DEST: data/volume/acme_ca/kid_profiles.json

      - name: "Restart for EAB"
        run: docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart

      - name: "EAB enrollment"
        uses: ./.github/actions/wf_specific/upgrade/enroll_eab

      - name: "Channel teardown"
        if: ${{ always() }}
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: rpm
          ARTIFACT_NAME: test-rpm-rh${{ matrix.rhversion }}-${{ matrix.mode }}-${{ matrix.hop.id }}-upgrade.tar.gz

  # ---------------------------------------------------------
  # DEB (nginx × wsgi|django) × hop → build
  # ---------------------------------------------------------


  test-deb:
    permissions:
      contents: read
      actions: write
    needs: [guard, resolve-versions]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.repository == 'grindsa/acme2certifier' && needs.resolve-versions.outputs.has_deb_hops == 'true'
    strategy:
      fail-fast: false
      matrix:
        mode: ['wsgi', 'django']
        hop: ${{ fromJSON(needs.resolve-versions.outputs.hops_deb) }}
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v7

      - name: "Channel setup"
        uses: ./.github/actions/channel_deb_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          DJANGO_DB: ${{ matrix.mode == 'django' && 'mariadb' || '' }}

      - name: "Parse XCA configuration from JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.XCA_CFG }}

      - name: "Stage xca materials + legacy cfg"
        uses: ./.github/actions/wf_specific/upgrade/setup_legacy_xca
        with:
          VOLUME_DIR: data/volume
          DEPLOYMENT_TYPE: deb
          DJANGO: ${{ matrix.mode == 'django' && 'true' || 'false' }}
          DJANGO_SETTINGS_TAG: ${{ matrix.hop.from_tag }}

      - name: "Modernize cfg for from_tag"
        if: matrix.hop.from_modern == 'true'
        uses: ./.github/actions/wf_specific/upgrade/migrate_cfg
        with:
          VOLUME_DIR: data/volume
          DEPLOYMENT_TYPE: deb
          XDB_FILE: /var/www/acme2certifier/volume/acme_ca/${{ env.XCA_DB_NAME }}
          DJANGO: ${{ matrix.mode == 'django' && 'true' || 'false' }}

      - name: "Download from DEB ${{ matrix.hop.from_tag }}"
        uses: ./.github/actions/wf_specific/upgrade/download_release_pkg
        with:
          TAG: ${{ matrix.hop.from_tag }}
          PKG_TYPE: deb
          DESTINATION_PATH: data

      - name: "Install from DEB"
        uses: ./.github/actions/wf_specific/upgrade/deb_install
        with:
          DEB_PATH: ${{ env.PKG_FILE }}
          MODE: ${{ matrix.mode }}
          MODERN: ${{ matrix.hop.from_modern }}

      - name: "Enroll + renew (from)"
        uses: ./.github/actions/wf_specific/upgrade/enroll
        with:
          RENEWAL: true

      - name: "Migrate cfg before build"
        if: matrix.hop.migrate == 'true'
        uses: ./.github/actions/wf_specific/upgrade/migrate_cfg
        with:
          VOLUME_DIR: data/volume
          DEPLOYMENT_TYPE: deb
          XDB_FILE: /var/www/acme2certifier/volume/acme_ca/${{ env.XCA_DB_NAME }}
          DJANGO: ${{ matrix.mode == 'django' && 'true' || 'false' }}

      - name: "Upgrade to build artifact"
        uses: ./.github/actions/wf_specific/upgrade/deb_install
        with:
          DEB_PATH: data/acme2certifier-${{ inputs.run_id }}-1_all.deb
          MODE: ${{ matrix.mode }}
          MODERN: "true"

      - name: "DB update after build"
        uses: ./.github/actions/wf_specific/upgrade/db_update
        with:
          APP_ROOT: /var/www/acme2certifier

      - name: "Renew after build"
        uses: ./.github/actions/acme_clients_renew
        with:
          CLEANUP: true
          HOSTNAME_SUFFIX: ""

      - name: "Fresh enrollment"
        uses: ./.github/actions/acme_clients_enroll

      - name: "EAB profiling (final)"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: data/volume
          HANDLER_MODULE: acme2certifier.cahandlers.xca_ca_handler
          OPTIONS: |
            xdb_file: /var/www/acme2certifier/volume/acme_ca/${{ env.XCA_DB_NAME }}
            issuing_ca_name: ${{ env.XCA_ISSUING_CA }}
            passphrase: ${{ env.XCA_PASSPHRASE }}
            ca_cert_chain_list: ["root-ca"]
            template_name: ${{ env.XCA_TEMPLATE }}
          EXTRA_SECTIONS: |
            [EABhandler]
            eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler
            key_file: /var/www/acme2certifier/volume/acme_ca/kid_profiles.json
            eab_profiling: True

      - name: "Stage kid_profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/xca.json
          DEST: data/volume/acme_ca/kid_profiles.json

      - name: "Restart for EAB"
        run: docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh restart nginx

      - name: "EAB enrollment"
        uses: ./.github/actions/wf_specific/upgrade/enroll_eab

      - name: "Channel teardown"
        if: ${{ always() }}
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: deb
          ARTIFACT_NAME: test-deb-nginx-${{ matrix.mode }}-${{ matrix.hop.id }}-upgrade.tar.gz
          WEBSRV: nginx

