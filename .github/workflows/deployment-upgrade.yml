name: Deployment Tests - Upgrades
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'
      run_id:
        description: 'Run ID of the producing workflow'
        required: true
        default: '0'
      sha:
        description: 'SHA of the commit to run the workflow on'
        required: true
        default: ''
      called_by_workflow:
        description: 'Name of the producing workflow'
        required: true
        default: 'manual-trigger'
      full_ref:
        description: 'Full git ref of the commit to run the workflow on'
        required: false
        default: ''

jobs:

  guard:
    runs-on: ubuntu-latest
    if: ${{ inputs.sha != '' && inputs.run_id != '' && inputs.branch != '' && github.repository == 'grindsa/acme2certifier' }}
    steps:
      - run: |
          echo "Triggered by SHA:    $SHA"
          echo "From branch:         $BRANCH"
          echo "Producer run_id:     $RUN_ID"
        env:
          SHA: ${{ inputs.sha }}
          BRANCH: ${{ inputs.branch }}
          RUN_ID: ${{ inputs.run_id }}

  # ---------------------------------------------------------
  # Resolve upgrade ladder: 0.23.2 → 2nd-latest → latest → build
  # ---------------------------------------------------------
  resolve-versions:
    needs: guard
    runs-on: ubuntu-latest
    if: github.repository == 'grindsa/acme2certifier'
    outputs:
      start_tag: ${{ steps.resolve.outputs.start_tag }}
      second_latest: ${{ steps.resolve.outputs.second_latest }}
      latest_tag: ${{ steps.resolve.outputs.latest_tag }}
      app_version: ${{ steps.resolve.outputs.app_version }}
      run_second: ${{ steps.resolve.outputs.run_second }}
      run_latest: ${{ steps.resolve.outputs.run_latest }}
      run_latest_docker: ${{ steps.resolve.outputs.run_latest_docker }}
      run_latest_rpm: ${{ steps.resolve.outputs.run_latest_rpm }}
      run_latest_deb: ${{ steps.resolve.outputs.run_latest_deb }}
      migrate_at_second: ${{ steps.resolve.outputs.migrate_at_second }}
      migrate_at_latest: ${{ steps.resolve.outputs.migrate_at_latest }}
      migrate_at_build: ${{ steps.resolve.outputs.migrate_at_build }}
      second_modern: ${{ steps.resolve.outputs.second_modern }}
      latest_modern: ${{ steps.resolve.outputs.latest_modern }}
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Resolve version ladder"
        id: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          needs_new_cfg() {
            python3 - "$1" <<'PY'
          import re, sys
          m = re.match(r"(\d+)\.(\d+)", sys.argv[1])
          if not m:
              sys.exit(1)
          sys.exit(0 if (int(m.group(1)), int(m.group(2))) > (0, 44) else 1)
          PY
          }

          asset_exists() {
            local url="$1"
            local code
            code=$(curl -sI -o /dev/null -w '%{http_code}' "$url" || echo 000)
            [[ "${code}" == "200" ]]
          }

          docker_tag_exists() {
            local tag="$1"
            local code
            code=$(curl -sL -o /dev/null -w '%{http_code}' \
              "https://hub.docker.com/v2/repositories/grindsa/acme2certifier/tags/${tag}" || echo 000)
            [[ "${code}" == "200" ]]
          }

          START_TAG="0.23.2"
          APP_VERSION=$(grep -i __version__ acme2certifier/acme_srv/version.py | head -n1 \
            | sed 's/__version__ = //g' | sed 's/"//g' | tr -d "[:space:]")

          # 2nd-latest: previous minor series vs APP_VERSION (see historical lines 75-101)
          MINOR=$(echo "${APP_VERSION}" | awk -F. '{print $2}')
          PRE_MINOR=$((MINOR - 1))
          RESP=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tags")
          echo "$RESP" | jq -e 'type=="array"' >/dev/null
          SECOND_LATEST=$(echo "$RESP" | jq -r '.[].name' \
            | grep -E "(^|[^0-9])${PRE_MINOR}(\.|$)" | head -n1 || true)
          if [[ -z "${SECOND_LATEST}" ]]; then
            echo "Could not determine SECOND_LATEST for minor ${PRE_MINOR}" >&2
            exit 1
          fi

          LATEST_TAG=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" \
            | jq -r '.tag_name')

          RUN_SECOND=true
          [[ "${SECOND_LATEST}" == "${START_TAG}" ]] && RUN_SECOND=false

          RUN_LATEST=true
          [[ "${LATEST_TAG}" == "${SECOND_LATEST}" ]] && RUN_LATEST=false
          [[ "${LATEST_TAG}" == "${START_TAG}" ]] && RUN_LATEST=false

          RUN_LATEST_DOCKER=false
          RUN_LATEST_RPM=false
          RUN_LATEST_DEB=false
          if [[ "${RUN_LATEST}" == "true" ]]; then
            if docker_tag_exists "${LATEST_TAG}-nginx-wsgi" \
              || docker_tag_exists "${LATEST_TAG}-nginx-django"; then
              RUN_LATEST_DOCKER=true
            fi
            if asset_exists "https://github.com/${GITHUB_REPOSITORY}/releases/download/${LATEST_TAG}/acme2certifier-${LATEST_TAG}-1.0.noarch.rpm"; then
              RUN_LATEST_RPM=true
            fi
            if asset_exists "https://github.com/${GITHUB_REPOSITORY}/releases/download/${LATEST_TAG}/acme2certifier_${LATEST_TAG}-1_all.deb"; then
              RUN_LATEST_DEB=true
            else
              # soft-check: any deb on the release
              if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${LATEST_TAG}" \
                --jq '.assets[].name | select(endswith(".deb"))' | grep -q .; then
                RUN_LATEST_DEB=true
              fi
            fi
            # If no package-specific assets, skip that package's latest hop.
            if [[ "${RUN_LATEST_DOCKER}" != "true" && "${RUN_LATEST_RPM}" != "true" && "${RUN_LATEST_DEB}" != "true" ]]; then
              RUN_LATEST=false
            fi
          fi

          SECOND_MODERN=false
          LATEST_MODERN=false
          needs_new_cfg "${SECOND_LATEST}" && SECOND_MODERN=true || true
          needs_new_cfg "${LATEST_TAG}" && LATEST_MODERN=true || true

          MIGRATE_AT_SECOND=false
          MIGRATE_AT_LATEST=false
          MIGRATE_AT_BUILD=false
          migrated=false
          if [[ "${RUN_SECOND}" == "true" && "${SECOND_MODERN}" == "true" ]]; then
            MIGRATE_AT_SECOND=true
            migrated=true
          fi
          if [[ "${migrated}" != "true" && "${RUN_LATEST}" == "true" && "${LATEST_MODERN}" == "true" ]]; then
            MIGRATE_AT_LATEST=true
            migrated=true
          fi
          if [[ "${migrated}" != "true" ]] && needs_new_cfg "${APP_VERSION}"; then
            MIGRATE_AT_BUILD=true
          fi

          {
            echo "start_tag=${START_TAG}"
            echo "second_latest=${SECOND_LATEST}"
            echo "latest_tag=${LATEST_TAG}"
            echo "app_version=${APP_VERSION}"
            echo "run_second=${RUN_SECOND}"
            echo "run_latest=${RUN_LATEST}"
            echo "run_latest_docker=${RUN_LATEST_DOCKER}"
            echo "run_latest_rpm=${RUN_LATEST_RPM}"
            echo "run_latest_deb=${RUN_LATEST_DEB}"
            echo "migrate_at_second=${MIGRATE_AT_SECOND}"
            echo "migrate_at_latest=${MIGRATE_AT_LATEST}"
            echo "migrate_at_build=${MIGRATE_AT_BUILD}"
            echo "second_modern=${SECOND_MODERN}"
            echo "latest_modern=${LATEST_MODERN}"
          } >> "${GITHUB_OUTPUT}"

          echo "Ladder: ${START_TAG} -> ${SECOND_LATEST} -> ${LATEST_TAG} -> build(${APP_VERSION})"
          echo "run_second=${RUN_SECOND} run_latest=${RUN_LATEST} docker=${RUN_LATEST_DOCKER} rpm=${RUN_LATEST_RPM} deb=${RUN_LATEST_DEB}"
          echo "migrate: second=${MIGRATE_AT_SECOND} latest=${MIGRATE_AT_LATEST} build=${MIGRATE_AT_BUILD}"

  # ---------------------------------------------------------
  # Containers (nginx × wsgi|django/mariadb)
  # ---------------------------------------------------------
  test-containers:
    needs: [guard, resolve-versions]
    runs-on: ubuntu-latest
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        dbhandler: ['wsgi', 'django']
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Parse XCA configuration from JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.XCA_CFG }}

      - name: "Prepare container environment"
        uses: ./.github/actions/container_prep
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: nginx
          CONTAINER_BUILD: false
          DJANGO_DB: ${{ matrix.dbhandler == 'django' && 'mariadb' || '' }}
          NAME_SPACE: acme

      - name: "Setup legacy xca cfg"
        uses: ./.github/actions/wf_specific/upgrade/setup_legacy_xca
        with:
          VOLUME_DIR: examples/Docker/data
          DEPLOYMENT_TYPE: container
          DJANGO: ${{ matrix.dbhandler == 'django' && 'true' || 'false' }}
          DJANGO_SETTINGS_TAG: ${{ needs.resolve-versions.outputs.start_tag }}

      - name: "Ensure start image ${{ needs.resolve-versions.outputs.start_tag }}"
        uses: ./.github/actions/wf_specific/upgrade/ensure_container_image
        with:
          VERSION: ${{ needs.resolve-versions.outputs.start_tag }}
          WEB_SRV: nginx
          DB_HANDLER: ${{ matrix.dbhandler }}

      - name: "Spin-up ${{ needs.resolve-versions.outputs.start_tag }}"
        uses: ./.github/actions/container_run
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: nginx
          VERSION: ${{ needs.resolve-versions.outputs.start_tag }}

      - name: "Enroll + renew (start)"
        uses: ./.github/actions/wf_specific/upgrade/enroll
        with:
          RENEWAL: true

      - name: "Stop container"
        run: docker stop acme-srv

      - name: "Migrate cfg before second-latest"
        if: needs.resolve-versions.outputs.run_second == 'true' && needs.resolve-versions.outputs.migrate_at_second == 'true'
        uses: ./.github/actions/wf_specific/upgrade/migrate_cfg
        with:
          VOLUME_DIR: examples/Docker/data
          DEPLOYMENT_TYPE: container
          XDB_FILE: volume/xca/${{ env.XCA_DB_NAME }}
          DJANGO: ${{ matrix.dbhandler == 'django' && 'true' || 'false' }}

      - name: "Ensure second-latest image"
        if: needs.resolve-versions.outputs.run_second == 'true'
        uses: ./.github/actions/wf_specific/upgrade/ensure_container_image
        with:
          VERSION: ${{ needs.resolve-versions.outputs.second_latest }}
          WEB_SRV: nginx
          DB_HANDLER: ${{ matrix.dbhandler }}

      - name: "Spin-up second-latest"
        if: needs.resolve-versions.outputs.run_second == 'true'
        uses: ./.github/actions/container_run
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: nginx
          VERSION: ${{ needs.resolve-versions.outputs.second_latest }}

      - name: "Renew after second-latest"
        if: needs.resolve-versions.outputs.run_second == 'true'
        uses: ./.github/actions/wf_specific/upgrade/renew
        with:
          CLEANUP: false
          HOSTNAME_SUFFIX: ""

      - name: "Stop container"
        if: needs.resolve-versions.outputs.run_second == 'true'
        run: docker stop acme-srv

      - name: "Migrate cfg before latest"
        if: needs.resolve-versions.outputs.run_latest_docker == 'true' && needs.resolve-versions.outputs.migrate_at_latest == 'true'
        uses: ./.github/actions/wf_specific/upgrade/migrate_cfg
        with:
          VOLUME_DIR: examples/Docker/data
          DEPLOYMENT_TYPE: container
          XDB_FILE: volume/xca/${{ env.XCA_DB_NAME }}
          DJANGO: ${{ matrix.dbhandler == 'django' && 'true' || 'false' }}

      - name: "Ensure latest image"
        if: needs.resolve-versions.outputs.run_latest_docker == 'true'
        uses: ./.github/actions/wf_specific/upgrade/ensure_container_image
        with:
          VERSION: ${{ needs.resolve-versions.outputs.latest_tag }}
          WEB_SRV: nginx
          DB_HANDLER: ${{ matrix.dbhandler }}

      - name: "Spin-up latest release"
        if: needs.resolve-versions.outputs.run_latest_docker == 'true'
        uses: ./.github/actions/container_run
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: nginx
          VERSION: ${{ needs.resolve-versions.outputs.latest_tag }}

      - name: "Renew after latest"
        if: needs.resolve-versions.outputs.run_latest_docker == 'true'
        uses: ./.github/actions/wf_specific/upgrade/renew
        with:
          CLEANUP: false
          HOSTNAME_SUFFIX: ""

      - name: "Stop container"
        if: needs.resolve-versions.outputs.run_latest_docker == 'true'
        run: docker stop acme-srv

      - name: "Migrate cfg before build artifacts"
        if: needs.resolve-versions.outputs.migrate_at_build == 'true'
        uses: ./.github/actions/wf_specific/upgrade/migrate_cfg
        with:
          VOLUME_DIR: examples/Docker/data
          DEPLOYMENT_TYPE: container
          XDB_FILE: volume/xca/${{ env.XCA_DB_NAME }}
          DJANGO: ${{ matrix.dbhandler == 'django' && 'true' || 'false' }}

      - name: "Download and import build container"
        uses: ./.github/actions/container_load
        with:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: a2c-${{ inputs.run_id }}.nginx.${{ matrix.dbhandler }}.tar
          DESTINATION_PATH: /tmp
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Spin-up build artifact"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: nginx

      - name: "Renew after build"
        uses: ./.github/actions/wf_specific/upgrade/renew
        with:
          CLEANUP: true
          HOSTNAME_SUFFIX: ""

      - name: "Fresh enrollment"
        uses: ./.github/actions/acme_clients

      - name: "EAB profiling (final hop)"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: examples/Docker/data
          HANDLER_MODULE: acme2certifier.cahandlers.xca_ca_handler
          OPTIONS: |
            xdb_file: volume/xca/${{ env.XCA_DB_NAME }}
            issuing_ca_name: ${{ env.XCA_ISSUING_CA }}
            passphrase: ${{ env.XCA_PASSPHRASE }}
            ca_cert_chain_list: ["root-ca"]
            template_name: ${{ env.XCA_TEMPLATE }}
          EXTRA_SECTIONS: |
            [EABhandler]
            eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler
            key_file: volume/kid_profiles.json
            eab_profiling: True

      - name: "Stage kid_profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/xca.json
          DEST: examples/Docker/data/kid_profiles.json

      - name: "Restart for EAB cfg"
        uses: ./.github/actions/container_down
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: nginx

      - name: "Bring up for EAB"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: nginx

      - name: "EAB enrollment"
        uses: ./.github/actions/wf_specific/xca_ca_handler/enroll_eab

      - name: "Check container configuration"
        uses: ./.github/actions/container_check
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: nginx

      - name: "Stop a2c instance"
        uses: ./.github/actions/container_down
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: nginx

      - name: "[ * ] Collecting test logs"
        if: ${{ failure() }}
        uses: ./.github/actions/collect_failure_logs
        with:
          DEPLOYMENT_TYPE: container

      - name: "[ * ] Uploading artifacts"
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: test-containers-nginx-${{ matrix.dbhandler }}-upgrade.tar.gz
          path: ${{ github.workspace }}/artifact/upload/

  # ---------------------------------------------------------
  # RPM (EL8/EL9 × wsgi|django/mariadb), nginx
  # ---------------------------------------------------------
  test-rpm:
    needs: [guard, resolve-versions]
    runs-on: ubuntu-latest
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        rhversion: [8, 9]
        mode: ['wsgi', 'django']
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Parse JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.GH_CFG }}

      - name: "Parse XCA configuration from JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.XCA_CFG }}

      - name: "Prepare Alma environment"
        uses: ./.github/actions/rpm_prep
        with:
          GH_USER: ${{ env.GH_USER }}
          GH_SBOM_REPO_TOKEN: ${{ env.GH_SBOM_REPO_TOKEN }}
          RH_VERSION: ${{ matrix.rhversion }}
          RPM_BUILD: false
          DJANGO_DB: ${{ matrix.mode == 'django' && 'mariadb' || '' }}

      - name: "Setup legacy xca cfg"
        uses: ./.github/actions/wf_specific/upgrade/setup_legacy_xca
        with:
          VOLUME_DIR: data/volume
          DEPLOYMENT_TYPE: rpm
          DJANGO: ${{ matrix.mode == 'django' && 'true' || 'false' }}
          DJANGO_SETTINGS_TAG: ${{ needs.resolve-versions.outputs.start_tag }}

      - name: "Download start RPM"
        uses: ./.github/actions/wf_specific/upgrade/download_release_pkg
        with:
          TAG: ${{ needs.resolve-versions.outputs.start_tag }}
          PKG_TYPE: rpm
          DESTINATION_PATH: data

      - name: "Install start RPM"
        uses: ./.github/actions/wf_specific/upgrade/rpm_install
        with:
          RPM_PATH: data/acme2certifier-${{ needs.resolve-versions.outputs.start_tag }}-1.0.noarch.rpm
          MODE: ${{ matrix.mode }}
          MODERN: "false"

      - name: "Enroll + renew (start)"
        uses: ./.github/actions/wf_specific/upgrade/enroll
        with:
          RENEWAL: true

      - name: "Migrate cfg before second-latest"
        if: needs.resolve-versions.outputs.run_second == 'true' && needs.resolve-versions.outputs.migrate_at_second == 'true'
        uses: ./.github/actions/wf_specific/upgrade/migrate_cfg
        with:
          VOLUME_DIR: data/volume
          DEPLOYMENT_TYPE: rpm
          XDB_FILE: volume/acme_ca/${{ env.XCA_DB_NAME }}
          DJANGO: ${{ matrix.mode == 'django' && 'true' || 'false' }}

      - name: "Download second-latest RPM"
        if: needs.resolve-versions.outputs.run_second == 'true'
        uses: ./.github/actions/wf_specific/upgrade/download_release_pkg
        with:
          TAG: ${{ needs.resolve-versions.outputs.second_latest }}
          PKG_TYPE: rpm
          DESTINATION_PATH: data

      - name: "Upgrade to second-latest"
        if: needs.resolve-versions.outputs.run_second == 'true'
        uses: ./.github/actions/wf_specific/upgrade/rpm_install
        with:
          RPM_PATH: data/acme2certifier-${{ needs.resolve-versions.outputs.second_latest }}-1.0.noarch.rpm
          MODE: ${{ matrix.mode }}
          MODERN: ${{ needs.resolve-versions.outputs.second_modern }}

      - name: "DB update after second-latest"
        if: needs.resolve-versions.outputs.run_second == 'true'
        uses: ./.github/actions/wf_specific/upgrade/db_update
        with:
          APP_ROOT: /opt/acme2certifier

      - name: "Renew after second-latest"
        if: needs.resolve-versions.outputs.run_second == 'true'
        uses: ./.github/actions/wf_specific/upgrade/renew
        with:
          CLEANUP: false
          HOSTNAME_SUFFIX: ""

      - name: "Migrate cfg before latest"
        if: needs.resolve-versions.outputs.run_latest_rpm == 'true' && needs.resolve-versions.outputs.migrate_at_latest == 'true'
        uses: ./.github/actions/wf_specific/upgrade/migrate_cfg
        with:
          VOLUME_DIR: data/volume
          DEPLOYMENT_TYPE: rpm
          XDB_FILE: volume/acme_ca/${{ env.XCA_DB_NAME }}
          DJANGO: ${{ matrix.mode == 'django' && 'true' || 'false' }}

      - name: "Download latest RPM"
        if: needs.resolve-versions.outputs.run_latest_rpm == 'true'
        uses: ./.github/actions/wf_specific/upgrade/download_release_pkg
        with:
          TAG: ${{ needs.resolve-versions.outputs.latest_tag }}
          PKG_TYPE: rpm
          DESTINATION_PATH: data

      - name: "Upgrade to latest release"
        if: needs.resolve-versions.outputs.run_latest_rpm == 'true'
        uses: ./.github/actions/wf_specific/upgrade/rpm_install
        with:
          RPM_PATH: data/acme2certifier-${{ needs.resolve-versions.outputs.latest_tag }}-1.0.noarch.rpm
          MODE: ${{ matrix.mode }}
          MODERN: ${{ needs.resolve-versions.outputs.latest_modern }}

      - name: "DB update after latest"
        if: needs.resolve-versions.outputs.run_latest_rpm == 'true'
        uses: ./.github/actions/wf_specific/upgrade/db_update

      - name: "Renew after latest"
        if: needs.resolve-versions.outputs.run_latest_rpm == 'true'
        uses: ./.github/actions/wf_specific/upgrade/renew
        with:
          CLEANUP: false
          HOSTNAME_SUFFIX: ""

      - name: "Migrate cfg before build artifacts"
        if: needs.resolve-versions.outputs.migrate_at_build == 'true'
        uses: ./.github/actions/wf_specific/upgrade/migrate_cfg
        with:
          VOLUME_DIR: data/volume
          DEPLOYMENT_TYPE: rpm
          XDB_FILE: volume/acme_ca/${{ env.XCA_DB_NAME }}
          DJANGO: ${{ matrix.mode == 'django' && 'true' || 'false' }}

      - name: "Download build RPM artifact"
        uses: ./.github/actions/download_artifact
        with:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: acme2certifier-${{ inputs.run_id }}.noarch.rpm
          DESTINATION_PATH: data/
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Upgrade to build artifact"
        uses: ./.github/actions/wf_specific/upgrade/rpm_install
        with:
          RPM_PATH: data/acme2certifier-${{ inputs.run_id }}.noarch.rpm
          MODE: ${{ matrix.mode }}
          MODERN: "true"

      - name: "DB update after build"
        uses: ./.github/actions/wf_specific/upgrade/db_update

      - name: "Renew after build"
        uses: ./.github/actions/wf_specific/upgrade/renew
        with:
          CLEANUP: true
          HOSTNAME_SUFFIX: ""

      - name: "Fresh enrollment"
        uses: ./.github/actions/acme_clients

      - name: "EAB profiling (final hop)"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: data/volume
          HANDLER_MODULE: acme2certifier.cahandlers.xca_ca_handler
          OPTIONS: |
            xdb_file: volume/acme_ca/${{ env.XCA_DB_NAME }}
            issuing_ca_name: ${{ env.XCA_ISSUING_CA }}
            passphrase: ${{ env.XCA_PASSPHRASE }}
            ca_cert_chain_list: ["root-ca"]
            template_name: ${{ env.XCA_TEMPLATE }}
          EXTRA_SECTIONS: |
            [EABhandler]
            eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler
            key_file: /opt/acme2certifier/volume/acme_ca/kid_profiles.json
            eab_profiling: True

      - name: "Stage kid_profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/xca.json
          DEST: data/volume/acme_ca/kid_profiles.json

      - name: "Restart for EAB"
        run: docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart

      - name: "EAB enrollment"
        uses: ./.github/actions/wf_specific/xca_ca_handler/enroll_eab

      - name: "[ * ] Collecting test logs"
        if: ${{ failure() }}
        uses: ./.github/actions/collect_failure_logs
        with:
          DEPLOYMENT_TYPE: rpm

      - name: "[ * ] Uploading artifacts"
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: test-rpm-rh${{ matrix.rhversion }}-${{ matrix.mode }}-upgrade.tar.gz
          path: ${{ github.workspace }}/artifact/upload/

  # ---------------------------------------------------------
  # DEB (nginx × wsgi|django/mariadb)
  # ---------------------------------------------------------
  test-deb:
    needs: [guard, resolve-versions]
    runs-on: ubuntu-latest
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        mode: ['wsgi', 'django']
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Parse XCA configuration from JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.XCA_CFG }}

      - name: "Prepare Ubuntu environment"
        uses: ./.github/actions/deb_prep
        with:
          DEB_BUILD: false
          DJANGO_DB: ${{ matrix.mode == 'django' && 'mariadb' || '' }}

      - name: "Setup legacy xca cfg"
        uses: ./.github/actions/wf_specific/upgrade/setup_legacy_xca
        with:
          VOLUME_DIR: data/volume
          DEPLOYMENT_TYPE: deb
          DJANGO: ${{ matrix.mode == 'django' && 'true' || 'false' }}
          DJANGO_SETTINGS_TAG: ${{ needs.resolve-versions.outputs.start_tag }}

      - name: "Download start DEB"
        uses: ./.github/actions/wf_specific/upgrade/download_release_pkg
        with:
          TAG: ${{ needs.resolve-versions.outputs.start_tag }}
          PKG_TYPE: deb
          DESTINATION_PATH: data

      - name: "Install start DEB"
        uses: ./.github/actions/wf_specific/upgrade/deb_install
        with:
          DEB_PATH: data/acme2certifier_${{ needs.resolve-versions.outputs.start_tag }}-1_all.deb
          MODE: ${{ matrix.mode }}
          MODERN: "false"

      - name: "Enroll + renew (start)"
        uses: ./.github/actions/wf_specific/upgrade/enroll
        with:
          RENEWAL: true

      - name: "Migrate cfg before second-latest"
        if: needs.resolve-versions.outputs.run_second == 'true' && needs.resolve-versions.outputs.migrate_at_second == 'true'
        uses: ./.github/actions/wf_specific/upgrade/migrate_cfg
        with:
          VOLUME_DIR: data/volume
          DEPLOYMENT_TYPE: deb
          XDB_FILE: /var/www/acme2certifier/volume/acme_ca/${{ env.XCA_DB_NAME }}
          DJANGO: ${{ matrix.mode == 'django' && 'true' || 'false' }}

      - name: "Download second-latest DEB"
        if: needs.resolve-versions.outputs.run_second == 'true'
        uses: ./.github/actions/wf_specific/upgrade/download_release_pkg
        with:
          TAG: ${{ needs.resolve-versions.outputs.second_latest }}
          PKG_TYPE: deb
          DESTINATION_PATH: data

      - name: "Upgrade to second-latest"
        if: needs.resolve-versions.outputs.run_second == 'true'
        uses: ./.github/actions/wf_specific/upgrade/deb_install
        with:
          DEB_PATH: data/acme2certifier_${{ needs.resolve-versions.outputs.second_latest }}-1_all.deb
          MODE: ${{ matrix.mode }}
          MODERN: ${{ needs.resolve-versions.outputs.second_modern }}

      - name: "DB update after second-latest"
        if: needs.resolve-versions.outputs.run_second == 'true'
        uses: ./.github/actions/wf_specific/upgrade/db_update
        with:
          APP_ROOT: /var/www/acme2certifier

      - name: "Renew after second-latest"
        if: needs.resolve-versions.outputs.run_second == 'true'
        uses: ./.github/actions/wf_specific/upgrade/renew
        with:
          CLEANUP: false
          HOSTNAME_SUFFIX: ""

      - name: "Migrate cfg before latest"
        if: needs.resolve-versions.outputs.run_latest_deb == 'true' && needs.resolve-versions.outputs.migrate_at_latest == 'true'
        uses: ./.github/actions/wf_specific/upgrade/migrate_cfg
        with:
          VOLUME_DIR: data/volume
          DEPLOYMENT_TYPE: deb
          XDB_FILE: /var/www/acme2certifier/volume/acme_ca/${{ env.XCA_DB_NAME }}
          DJANGO: ${{ matrix.mode == 'django' && 'true' || 'false' }}

      - name: "Download latest DEB"
        if: needs.resolve-versions.outputs.run_latest_deb == 'true'
        uses: ./.github/actions/wf_specific/upgrade/download_release_pkg
        with:
          TAG: ${{ needs.resolve-versions.outputs.latest_tag }}
          PKG_TYPE: deb
          DESTINATION_PATH: data

      - name: "Upgrade to latest release"
        if: needs.resolve-versions.outputs.run_latest_deb == 'true'
        uses: ./.github/actions/wf_specific/upgrade/deb_install
        with:
          DEB_PATH: data/acme2certifier_${{ needs.resolve-versions.outputs.latest_tag }}-1_all.deb
          MODE: ${{ matrix.mode }}
          MODERN: ${{ needs.resolve-versions.outputs.latest_modern }}

      - name: "DB update after latest"
        if: needs.resolve-versions.outputs.run_latest_deb == 'true'
        uses: ./.github/actions/wf_specific/upgrade/db_update
        with:
          APP_ROOT: /var/www/acme2certifier

      - name: "Renew after latest"
        if: needs.resolve-versions.outputs.run_latest_deb == 'true'
        uses: ./.github/actions/wf_specific/upgrade/renew
        with:
          CLEANUP: false
          HOSTNAME_SUFFIX: ""

      - name: "Migrate cfg before build artifacts"
        if: needs.resolve-versions.outputs.migrate_at_build == 'true'
        uses: ./.github/actions/wf_specific/upgrade/migrate_cfg
        with:
          VOLUME_DIR: data/volume
          DEPLOYMENT_TYPE: deb
          XDB_FILE: /var/www/acme2certifier/volume/acme_ca/${{ env.XCA_DB_NAME }}
          DJANGO: ${{ matrix.mode == 'django' && 'true' || 'false' }}

      - name: "Download build DEB artifact"
        uses: ./.github/actions/download_artifact
        with:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: acme2certifier-${{ inputs.run_id }}-1_all.deb
          DESTINATION_PATH: data/
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Upgrade to build artifact"
        uses: ./.github/actions/wf_specific/upgrade/deb_install
        with:
          DEB_PATH: data/acme2certifier-${{ inputs.run_id }}-1_all.deb
          MODE: ${{ matrix.mode }}
          MODERN: "true"

      - name: "DB update after build"
        uses: ./.github/actions/wf_specific/upgrade/db_update
        with:
          APP_ROOT: /var/www/acme2certifier

      - name: "Renew after build"
        uses: ./.github/actions/wf_specific/upgrade/renew
        with:
          CLEANUP: true
          HOSTNAME_SUFFIX: ""

      - name: "Fresh enrollment"
        uses: ./.github/actions/acme_clients

      - name: "EAB profiling (final hop)"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: data/volume
          HANDLER_MODULE: acme2certifier.cahandlers.xca_ca_handler
          OPTIONS: |
            xdb_file: /var/www/acme2certifier/volume/acme_ca/${{ env.XCA_DB_NAME }}
            issuing_ca_name: ${{ env.XCA_ISSUING_CA }}
            passphrase: ${{ env.XCA_PASSPHRASE }}
            ca_cert_chain_list: ["root-ca"]
            template_name: ${{ env.XCA_TEMPLATE }}
          EXTRA_SECTIONS: |
            [EABhandler]
            eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler
            key_file: /var/www/acme2certifier/volume/acme_ca/kid_profiles.json
            eab_profiling: True

      - name: "Stage kid_profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/xca.json
          DEST: data/volume/acme_ca/kid_profiles.json

      - name: "Restart for EAB"
        run: docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh restart nginx

      - name: "EAB enrollment"
        uses: ./.github/actions/wf_specific/xca_ca_handler/enroll_eab

      - name: "[ * ] Collecting test logs"
        if: ${{ failure() }}
        uses: ./.github/actions/collect_failure_logs
        with:
          DEPLOYMENT_TYPE: deb
          WEBSRV: nginx

      - name: "[ * ] Uploading artifacts"
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: test-deb-nginx-${{ matrix.mode }}-upgrade.tar.gz
          path: ${{ github.workspace }}/artifact/upload/
