name: Security - Sanitizer Selftest

on:
  pull_request:
    paths:
      - ".github/actions/sanitize_artifact_payload/**"
      - ".github/workflows/security-sanitizer-selftest.yml"
  workflow_dispatch: {}

permissions: {}

jobs:
  sanitizer-selftest:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create mock artifact payload
        shell: bash
        run: |
          set -euo pipefail
          secret_marker="secret"
          mkdir -p artifact/data artifact/upload artifact/acme-sh/accounts
          echo "safe-log" > artifact/data/service.log
          echo "${secret_marker}" > artifact/data/private.key
          echo "${secret_marker}" > artifact/data/cert.pem
          echo "${secret_marker}" > artifact/data/krb5.keytab
          echo "${secret_marker}" > artifact/data/acme_srv.cfg
          echo "${secret_marker}" > artifact/data/settings.py
          echo "${secret_marker}" > artifact/acme-sh/accounts/account.json

      - name: Run sanitizer
        uses: ./.github/actions/sanitize_artifact_payload
        with:
          ARTIFACT_DIR: ${{ github.workspace }}/artifact

      - name: Assert sanitized output
        shell: bash
        run: |
          set -euo pipefail
          test -f artifact/data/service.log
          test ! -f artifact/data/private.key
          test ! -f artifact/data/cert.pem
          test ! -f artifact/data/krb5.keytab
          test ! -f artifact/data/acme_srv.cfg
          test ! -f artifact/data/settings.py
          test ! -d artifact/acme-sh/accounts
