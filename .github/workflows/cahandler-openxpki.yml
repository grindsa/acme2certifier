name: CA-Handler Tests - OpenXPKI
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'
      run_id:
        description: 'Run ID of the producing workflow'
        required: true
        default: '0'
      sha:
        description: 'SHA of the commit to run the workflow on'
        required: true
        default: ''
      called_by_workflow:
        description: 'Name of the producing workflow'
        required: true
        default: 'manual-trigger'
      full_ref:
        description: 'Full git ref of the commit to run the workflow on'
        required: false
        default: ''

jobs:

  # ---------------------------------------------------------
  # Quick guard to validate incoming payload
  # ---------------------------------------------------------
  guard:
    runs-on: ubuntu-latest
    if: ${{ inputs.sha != '' && inputs.run_id != '' && inputs.branch != '' && github.repository == 'grindsa/acme2certifier' }}
    steps:
      - run: |
          echo "Triggered by SHA:    $SHA"
          echo "From branch:         $BRANCH"
          echo "Producer run_id:     $RUN_ID"
        env:
          SHA: ${{ inputs.sha }}
          BRANCH: ${{ inputs.branch }}
          RUN_ID: ${{ inputs.run_id }}

  # ---------------------------------------------------------
  # Test container images (matrix from payload)
  # ---------------------------------------------------------
  test-containers:
    needs: guard
    runs-on: ubuntu-latest
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        dbhandler: ['wsgi', 'django']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Get runner ip"
        run: |
          echo RUNNER_IP=$(ip addr show eth0 | grep -i "inet " | cut -d ' ' -f 6 | cut -d '/' -f 1) >> $GITHUB_ENV
          echo RUNNER_PATH=$(pwd | sed 's_/_\\/_g') >> $GITHUB_ENV

      - run: echo "runner IP is $RUNNER_IP"
        env:
          RUNNER_IP: ${{ env.RUNNER_IP }}

      - name: "Download and import container"
        uses: ./.github/actions/container_load
        with:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: a2c-${{ inputs.run_id }}.${{ matrix.websrv }}.${{ matrix.dbhandler }}.tar
          DESTINATION_PATH: /tmp
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Prepare container environment"
        uses: ./.github/actions/container_prep
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}
          CONTAINER_BUILD: false
          NAME_SPACE: acme

      - name: "Instanciate OpenXPKI server"
        uses: ./.github/actions/wf_specific/openxpki_ca_handler/openxpki_prep
        with:
          RUNNER_IP: ${{ env.RUNNER_IP }}
          WORKING_DIR: ${{ github.workspace }}/examples/Docker

      - name: "Setup a2c with est_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.est_ca_handler
          OPTIONS: |
            est_host: https://openxpki:8443
            est_client_cert: volume/acme_ca/client_crt.pem
            est_client_key: volume/acme_ca/client_key.pem
            ca_bundle: /var/www/acme2certifier/volume/acme_ca/ca_bundle.pem
        env:
          OPENXPKI_IP: ${{ env.RUNNER_IP }}

      - name: "Bring up a2c container"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Test enrollment"
        uses: ./.github/actions/acme_clients
        with:
          REVOCATION: "false"
          USE_CERTBOT: "false"
          USE_LEGO: "false"

      - name: "Delete acme-sh, letsencypt and lego folders"
        run: |
          sudo rm -rf  lego/*
          sudo rm -rf  acme-sh/*
          sudo rm -rf  certbot/*

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "Setup a2c with est_ca_handler using pksc12"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.est_ca_handler
          OPTIONS: |
            est_host: https://openxpki:8443
            est_client_cert: volume/acme_ca/client_crt.p12
            cert_passphrase: Test1234
            ca_bundle: volume/acme_ca/ca_bundle.pem
        env:
          OPENXPKI_IP: ${{ env.RUNNER_IP }}

      - name: "Setup a2c with est_ca_handler using pksc12 (post-cfg)"
        run: |
          # sudo echo "est_host: https://$OPENXPKI_IP:8443" >> examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart
        env:
          OPENXPKI_IP: ${{ env.RUNNER_IP }}

      - name: "Test enrollment"
        uses: ./.github/actions/acme_clients
        with:
          REVOCATION: "false"
          USE_CERTBOT: "false"
          USE_LEGO: "false"

      - name: "Delete acme-sh, letsencypt and lego folders"
        run: |
          sudo rm -rf  lego/*
          sudo rm -rf  acme-sh/*
          sudo rm -rf  certbot/*

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "Setup a2c with openxpki_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.openxpki_ca_handler
          OPTIONS: |
            host: https://openxpki:8443
            client_cert: volume/acme_ca/client_crt.pem
            client_key: volume/acme_ca/client_key.pem
            ca_bundle: volume/acme_ca/ca_bundle.pem
            cert_profile_name: tls-server
            endpoint_name: enroll
            polling_timeout: 60
            allowed_domainlist: ["bar.local", "*.acme"]
        env:
          OPENXPKI_IP: ${{ env.RUNNER_IP }}

      - name: "Setup a2c with openxpki_ca_handler (post-cfg)"
        run: |
          # sudo echo "host: https://$OPENXPKI_IP:8443" >> examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart
        env:
          OPENXPKI_IP: ${{ env.RUNNER_IP }}

      - name: "Test enrollment"
        uses: ./.github/actions/acme_clients
        with:
          TEST_ADL: "true"
          # REVOCATION: "false"

      - name: "Verify allowed_domainlist error"
        run: |
          cd examples/Docker
          docker compose logs | grep -iE 'FQDN/SAN [^ ]+ not allowed by configuration'

      - name: "Delete acme-sh, letsencypt and lego folders"
        run: |
          sudo rm -rf  lego/*
          sudo rm -rf  acme-sh/*
          sudo rm -rf  certbot/*

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "Reconfigure a2c (pkcs12 support)"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.openxpki_ca_handler
          OPTIONS: |
            host: https://openxpki:8443
            client_cert: volume/acme_ca/client_crt.p12
            cert_passphrase: Test1234
            ca_bundle: volume/acme_ca/ca_bundle.pem
            cert_profile_name: tls-server
            endpoint_name: enroll
            polling_timeout: 60
            allowed_domainlist: ["bar.local", "*.acme"]
        env:
          OPENXPKI_IP: ${{ env.RUNNER_IP }}

      - name: "Reconfigure a2c (pkcs12 support) (post-cfg)"
        run: |
          docker ps -a
          sudo truncate -s 0 $(docker inspect --format='{{.LogPath}}' acme2certifier-acme-srv-1)
          # sudo echo "host: https://$OPENXPKI_IP:8443" >> examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart
        env:
          OPENXPKI_IP: ${{ env.RUNNER_IP }}

      - name: "Test enrollment"
        uses: ./.github/actions/acme_clients
        with:
          TEST_ADL: "true"
          # REVOCATION: "false"

      - name: "Verify allowed_domainlist error"
        run: |
          cd examples/Docker
          docker compose logs | grep -iE 'FQDN/SAN [^ ]+ not allowed by configuration'

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "ACME Profiling - setup a2c with openxpki_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.openxpki_ca_handler
          OPTIONS: |
            host: https://openxpki:8443
            client_cert: volume/acme_ca/client_crt.p12
            cert_passphrase: Test1234
            ca_bundle: volume/acme_ca/ca_bundle.pem
            cert_profile_name: tls-server
            endpoint_name: enroll
            polling_timeout: 60
            allowed_domainlist: ["bar.local", "*.acme"]
            enrollment_config_log: True
        env:
          OPENXPKI_IP: ${{ env.RUNNER_IP }}

      - name: "ACME Profiling - setup a2c with openxpki_ca_handler (post-cfg)"
        run: |
          sudo truncate -s 0 $(docker inspect --format='{{.LogPath}}' acme2certifier-acme-srv-1)
          # sudo echo "host: https://$OPENXPKI_IP:8443" >> examples/Docker/data/acme_srv.cfg
          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nprofiles={\"tls-client\": \"http:\/\/foo.bar\/profile1\", \"tls-server\": \"http:\/\/foo.bar\/profile2\", \"profile3\": \"http:\/\/foo.bar\/profile3\"}/g" examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart
        env:
          OPENXPKI_IP: ${{ env.RUNNER_IP }}

      - name: "ACME Profile - Test enrollment"
        uses: ./.github/actions/wf_specific/openxpki_ca_handler/enroll_acmeprofile
        with:
          DEPLOYMENT_TYPE: "container"

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "EAB ACME Profiling - setup a2c with openxpki_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.openxpki_ca_handler
          OPTIONS: |
            host: https://openxpki:8443
            client_cert: volume/acme_ca/client_crt.p12
            cert_passphrase: Test1234
            ca_bundle: volume/acme_ca/ca_bundle.pem
            cert_profile_name: tls-server
            endpoint_name: enroll
            polling_timeout: 60
            allowed_domainlist: ["bar.local", "*.acme"]
            enrollment_config_log: True
          EXTRA_SECTIONS: |
            [EABhandler]
            eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler
            key_file: volume/kid_profiles.json
            eab_profiling: True
        env:
          OPENXPKI_IP: ${{ env.RUNNER_IP }}

      - name: "Stage kid_profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/openxpki.json
          DEST: examples/Docker/data/kid_profiles.json
      - name: "EAB ACME Profiling - setup a2c with openxpki_ca_handler (post-cfg)"
        run: |
          # sudo echo "host: https://$OPENXPKI_IP:8443" >> examples/Docker/data/acme_srv.cfg

          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nprofiles={\"tls-client\": \"http:\/\/foo.bar\/profile1\", \"tls-server\": \"http:\/\/foo.bar\/profile2\", \"profile3\": \"http:\/\/foo.bar\/profile3\"}/g" examples/Docker/data/acme_srv.cfg


          cd examples/Docker/
          docker compose restart
        env:
          OPENXPKI_IP: ${{ env.RUNNER_IP }}

      - name: "EAB ACME Profile - Test enrollment"
        uses: ./.github/actions/wf_specific/openxpki_ca_handler/enroll_eab_acmeprofile
        with:
          DEPLOYMENT_TYPE: "container"
          # REVOCATION: "false"

      - name: "[ * ] Collecting test logs"
        if: ${{ failure() }}
        run: |
          mkdir -p ${{ github.workspace }}/artifact/upload
          sudo cp -rp examples/Docker/data/ ${{ github.workspace }}/artifact/data/
          sudo cp -rp acme-sh/ ${{ github.workspace }}/artifact/acme-sh/
          sudo cp -rp certbot/ ${{ github.workspace }}/artifact/certbot/
          sudo cp -rp lego/ ${{ github.workspace }}/artifact/lego/
          cd examples/Docker
          docker ps -a
          docker compose logs > ${{ github.workspace }}/artifact/a2c.log
          docker exec  OpenXPKI_Server cat /var/log/openxpki-server/catchall.log >> ${{ github.workspace }}/artifact/openxpki_server.log
          docker exec  OpenXPKI_Client cat /var/log/openxpki-client/est.log >> ${{ github.workspace }}/artifact/openxpki_client_est.log
          docker exec  OpenXPKI_Client cat /var/log/openxpki-client/rpc.log >> ${{ github.workspace }}/artifact/openxpki_client_rpc.log
          sudo tar -C ${{ github.workspace }}/artifact/ -cvzf ${{ github.workspace }}/artifact/upload/artifact.tar.gz openxpki_server.log openxpki_client_est.log openxpki_client_rpc.log a2c.log data # acme-sh certbot lego

      - name: "[ * ] Uploading artifacts"
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: test-containers-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz.tar.gz
          path: ${{ github.workspace }}/artifact/upload/

  # ---------------------------------------------------------
  # Test RPMs (EL8 & EL9) downloaded from the producer run
  # ---------------------------------------------------------
  test-rpm:
    needs: guard
    runs-on: ubuntu-latest
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        rhversion: [8, 9]
        mode: ['wsgi', 'django']
    steps:

      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Parse JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.GH_CFG }}

      - name: "Get runner ip"
        run: |
          echo RUNNER_IP=$(ip addr show eth0 | grep -i "inet " | cut -d ' ' -f 6 | cut -d '/' -f 1) >> $GITHUB_ENV
          echo RUNNER_PATH=$(pwd | sed 's_/_\\/_g') >> $GITHUB_ENV

      - run: echo "runner IP is $RUNNER_IP"
        env:
          RUNNER_IP: ${{ env.RUNNER_IP }}

      - name: "Prepare Alma environment"
        uses: ./.github/actions/rpm_prep
        with:
          GH_USER: ${{ env.GH_USER }}
          GH_SBOM_REPO_TOKEN: ${{ env.GH_SBOM_REPO_TOKEN }}
          RH_VERSION: ${{ matrix.rhversion }}
          RPM_BUILD: false

      - name: "Download RPM artifact by name from build run"
        uses: ./.github/actions/download_artifact
        with:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: acme2certifier-${{ inputs.run_id }}.noarch.rpm
          DESTINATION_PATH: data/
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Instanciate OpenXPKI server"
        uses: ./.github/actions/wf_specific/openxpki_ca_handler/openxpki_prep
        with:
          RUNNER_IP: ${{ env.RUNNER_IP }}
          WORKING_DIR: ${{ github.workspace }}

      - name: "Setup a2c with est_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.est_ca_handler
          OPTIONS: |
            est_host: https://openxpki:8443
            est_client_cert: /opt/acme2certifier/volume/acme_ca/client_crt.pem
            est_client_key: /opt/acme2certifier/volume/acme_ca/client_key.pem
            ca_bundle: /opt/acme2certifier/volume/acme_ca/ca_bundle.pem
        env:
          OPENXPKI_IP: ${{ env.RUNNER_IP }}

      - name: "Execute install script"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh install -m $MODE
        env:
          MODE: ${{ matrix.mode }}

      - name: "Test enrollment"
        uses: ./.github/actions/acme_clients
        with:
          REVOCATION: "false"
          USE_CERTBOT: "false"
          USE_LEGO: "false"

      - name: "Delete acme-sh, letsencypt and lego folders"
        run: |
          sudo rm -rf  certbot/*
          sudo rm -rf  lego/*
          sudo rm -rf  acme-sh/*

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: rpm

      - name: "Setup a2c with est_ca_handler (pkcs12)"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.est_ca_handler
          OPTIONS: |
            est_host: https://openxpki:8443
            est_client_cert: /opt/acme2certifier/volume/acme_ca/client_crt.p12
            cert_passphrase: Test1234
            ca_bundle: /opt/acme2certifier/volume/acme_ca/ca_bundle.pem
        env:
          OPENXPKI_IP: ${{ env.RUNNER_IP }}

      - name: "Reconfigure a2c"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart
        env:
          MODE: ${{ matrix.mode }}

      - name: "Test enrollment"
        uses: ./.github/actions/acme_clients
        with:
          REVOCATION: "false"
          USE_CERTBOT: "false"
          USE_LEGO: "false"

      - name: "Delete acme-sh, letsencypt and lego folders"
        run: |
          sudo rm -rf  certbot/*
          sudo rm -rf  lego/*
          sudo rm -rf  acme-sh/*

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: rpm

      - name: "Setup a2c with openxpki_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.openxpki_ca_handler
          OPTIONS: |
            host: https://openxpki:8443
            client_cert: /opt/acme2certifier/volume/acme_ca/client_crt.pem
            client_key: /opt/acme2certifier/volume/acme_ca/client_key.pem
            ca_bundle: /opt/acme2certifier/volume/acme_ca/ca_bundle.pem
            cert_profile_name: tls-server
            endpoint_name: enroll
            polling_timeout: 60
            allowed_domainlist: ["bar.local", "*.acme"]
        env:
          OPENXPKI_IP: ${{ env.RUNNER_IP }}

      - name: "Reconfigure a2c"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart
        env:
          MODE: ${{ matrix.mode }}

      - name: "Test enrollment"
        uses: ./.github/actions/acme_clients
        with:
          TEST_ADL: "true"
          # REVOCATION: "false"

      - name: "Delete acme-sh, letsencypt and lego folders"
        run: |
          sudo rm -rf  certbot/*
          sudo rm -rf  lego/*
          sudo rm -rf  acme-sh/*

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: rpm

      - name: "Reconfigure a2c (pkcs12 support)"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.openxpki_ca_handler
          OPTIONS: |
            host: https://openxpki:8443
            client_cert: /opt/acme2certifier/volume/acme_ca/client_crt.p12
            cert_passphrase: Test1234
            ca_bundle: /opt/acme2certifier/volume/acme_ca/ca_bundle.pem
            cert_profile_name: tls-server
            endpoint_name: enroll
            polling_timeout: 60
            allowed_domainlist: ["bar.local", "*.acme"]
        env:
          OPENXPKI_IP: ${{ env.RUNNER_IP }}

      - name: "Reconfigure a2c"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart
        env:
          MODE: ${{ matrix.mode }}

      - name: "Test enrollment"
        uses: ./.github/actions/acme_clients
        with:
          TEST_ADL: "true"
          # REVOCATION: "false"

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
