      - name: "ACME Profile - Test enrollment"
        uses: ./.github/actions/wf_specific/openxpki_ca_handler/enroll_acmeprofile
        with:
          DEPLOYMENT_TYPE: "rpm"

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: rpm

      - name: "EAB ACME Profiling - setup a2c with openxpki_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.openxpki_ca_handler
          OPTIONS: |
            host: https://openxpki:8443
            client_cert: volume/acme_ca/client_crt.p12
            cert_passphrase: Test1234
            ca_bundle: volume/acme_ca/ca_bundle.pem
            cert_profile_name: tls-server
            endpoint_name: enroll
            polling_timeout: 60
            allowed_domainlist: ["bar.local", "*.acme"]
            enrollment_config_log: True
          EXTRA_SECTIONS: |
            [EABhandler]
            eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler
            key_file: /opt/acme2certifier/volume/acme_ca/kid_profiles.json
            eab_profiling: True
        env:
          OPENXPKI_IP: ${{ env.RUNNER_IP }}

      - name: "Stage kid_profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/openxpki.json
          DEST: data/volume/acme_ca/kid_profiles.json
      - name: "EAB ACME Profiling - setup a2c with openxpki_ca_handler (post-cfg)"
        run: |
          # sudo echo "host: https://$OPENXPKI_IP:8443" >> data/volume/acme_srv.cfg
          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nprofiles={\"tls-client\": \"http:\/\/foo.bar\/profile1\", \"tls-server\": \"http:\/\/foo.bar\/profile2\", \"profile3\": \"http:\/\/foo.bar\/profile3\"}/g" data/volume/acme_srv.cfg

        env:
          OPENXPKI_IP: ${{ env.RUNNER_IP }}

      - name: "Reconfigure a2c"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart
        env:
          MODE: ${{ matrix.mode }}

      - name: "EAB ACME Profile - Test enrollment"
        uses: ./.github/actions/wf_specific/openxpki_ca_handler/enroll_eab_acmeprofile
        with:
          DEPLOYMENT_TYPE: "rpm"
          # REVOCATION: "false"

      - name: "Delete acme-sh, letsencypt and lego folders"
        run: |
          sudo rm -rf  certbot/*
          sudo rm -rf  lego/*
          sudo rm -rf  acme-sh/*

      - name: "[ * ] Collecting test logs"
        if: ${{ failure() }}
        run: |
          mkdir -p ${{ github.workspace }}/artifact/upload
          docker exec acme-srv tar cvfz /tmp/acme2certifier/a2c.tgz /opt/acme2certifier
          # docker logs openxpki-docker_openxpki-server_1 > ${{ github.workspace }}/artifact/openxpki_server.log
          # docker logs openxpki-docker_openxpki-client_1 > ${{ github.workspace }}/artifact/openxpki_client.log
          sudo cp -rp data/ ${{ github.workspace }}/artifact/data/
          sudo cp -rp acme-sh/ ${{ github.workspace }}/artifact/acme-sh/
          sudo rm ${{ github.workspace }}/artifact/data/*.rpm
          docker exec acme-srv cat /etc/nginx/nginx.conf.orig > ${{ github.workspace }}/artifact/data/nginx.conf.orig
          docker exec acme-srv rpm -qa > ${{ github.workspace }}/artifact/data/packages.txt
          docker exec acme-srv cat /etc/nginx/nginx.conf > ${{ github.workspace }}/artifact/data/nginx.conf
          docker exec acme-srv cat /var/log/messages > ${{ github.workspace }}/artifact/acme-srv.log
          sudo tar -C ${{ github.workspace }}/artifact/ -cvzf ${{ github.workspace }}/artifact/upload/artifact.tar.gz data openxpki_server.log openxpki_client.log acme-srv.log acme-sh

      - name: "[ * ] Uploading artifacts"
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: test-rpm-rh${{ matrix.rhversion }}.tar.gz
          path: ${{ github.workspace }}/artifact/upload/

  # ---------------------------------------------------------
  # Test DEB downloaded from the producer run
  # ---------------------------------------------------------
  test-deb:
    needs: guard
    runs-on: ubuntu-latest
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        mode: ['wsgi', 'django']

    steps:

      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Prepare Ubuntu environment"
        if: matrix.mode == 'wsgi'
        uses: ./.github/actions/deb_prep
        with:
          DEB_BUILD: false

      - name: "Prepare Ubuntu environment"
        if: matrix.mode == 'django'
        uses: ./.github/actions/deb_prep
        with:
          DEB_BUILD: false
          DJANGO_DB: psql

      - name: "Download DEB artifact by name from build run"
        uses: ./.github/actions/download_artifact
        with:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: acme2certifier-${{ inputs.run_id }}-1_all.deb
          DESTINATION_PATH: data/
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Get runner ip"
        run: |
          echo RUNNER_IP=$(ip addr show eth0 | grep -i "inet " | cut -d ' ' -f 6 | cut -d '/' -f 1) >> $GITHUB_ENV
          echo RUNNER_PATH=$(pwd | sed 's_/_\\/_g') >> $GITHUB_ENV
      - run: echo "runner IP is $RUNNER_IP"
        env:
          RUNNER_IP: ${{ env.RUNNER_IP }}

      - name: "Instanciate OpenXPKI server"
        uses: ./.github/actions/wf_specific/openxpki_ca_handler/openxpki_prep
        with:
          RUNNER_IP: ${{ env.RUNNER_IP }}
          WORKING_DIR: ${{ github.workspace }}

      - name: "Setup a2c with est_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.est_ca_handler
          OPTIONS: |
            est_host: https://openxpki:8443
            est_client_cert: /var/www/acme2certifier/volume/acme_ca/client_crt.pem
            est_client_key: /var/www/acme2certifier/volume/acme_ca/client_key.pem
            ca_bundle: /var/www/acme2certifier/volume/acme_ca/ca_bundle.pem
        env:
          OPENXPKI_IP: ${{ env.RUNNER_IP }}

      - name: "Execute install script"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh install $WEBSRV -m $MODE
        env:
          WEBSRV: ${{ matrix.websrv }}
          MODE: ${{ matrix.mode }}

      - name: "Test enrollment"
        uses: ./.github/actions/acme_clients
        with:
          REVOCATION: "false"
          USE_CERTBOT: "false"
          USE_LEGO: "false"

      - name: "Delete acme-sh, letsencypt and lego folders"
        run: |
          sudo rm -rf  certbot/*
          sudo rm -rf  lego/*
          sudo rm -rf  acme-sh/*

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: deb

      - name: "Setup a2c with est_ca_handler (pkcs12)"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.est_ca_handler
          OPTIONS: |
            est_host: https://openxpki:8443
            est_client_cert: /var/www/acme2certifier/volume/acme_ca/client_crt.p12
            cert_passphrase: Test1234
            ca_bundle: /var/www/acme2certifier/volume/acme_ca/ca_bundle.pem
        env:
          OPENXPKI_IP: ${{ env.RUNNER_IP }}

      - name: "Reconfigure a2c "
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh restart $WEBSRV
        env:
          WEBSRV: ${{ matrix.websrv }}
          MODE: ${{ matrix.mode }}

      - name: "Test enrollment"
        uses: ./.github/actions/acme_clients
        with:
          REVOCATION: "false"
          USE_CERTBOT: "false"
          USE_LEGO: "false"

      - name: "Delete acme-sh, letsencypt and lego folders"
        run: |
          sudo rm -rf  certbot/*
          sudo rm -rf  lego/*
          sudo rm -rf  acme-sh/*

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: deb

      - name: "Setup a2c with openxpki_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.openxpki_ca_handler
          OPTIONS: |
            host: https://openxpki:8443
            client_cert: /var/www/acme2certifier/volume/acme_ca/client_crt.pem
            client_key: /var/www/acme2certifier/volume/acme_ca/client_key.pem
            ca_bundle: /var/www/acme2certifier/volume/acme_ca/ca_bundle.pem
            cert_profile_name: tls-server
            endpoint_name: enroll
            polling_timeout: 60
            allowed_domainlist: ["bar.local", "*.acme"]
        env:
          OPENXPKI_IP: ${{ env.RUNNER_IP }}

      - name: "Reconfigure a2c "
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh restart $WEBSRV
        env:
          WEBSRV: ${{ matrix.websrv }}
          MODE: ${{ matrix.mode }}

      - name: "Test enrollment"
        uses: ./.github/actions/acme_clients
        with:
          TEST_ADL: "true"
          # REVOCATION: "false"

      - name: "Delete acme-sh, letsencypt and lego folders"
        run: |
          sudo rm -rf  certbot/*
          sudo rm -rf  lego/*
          sudo rm -rf  acme-sh/*

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: deb

      - name: "Reconfigure a2c (pkcs12 support)"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.openxpki_ca_handler
          OPTIONS: |
            host: https://openxpki:8443
            client_cert: /var/www/acme2certifier/volume/acme_ca/client_crt.p12
            cert_passphrase: Test1234
            ca_bundle: /var/www/acme2certifier/volume/acme_ca/ca_bundle.pem
            cert_profile_name: tls-server
            endpoint_name: enroll
            polling_timeout: 60
            allowed_domainlist: ["bar.local", "*.acme"]
        env:
          OPENXPKI_IP: ${{ env.RUNNER_IP }}

      - name: "Reconfigure a2c "
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh restart $WEBSRV
        env:
          WEBSRV: ${{ matrix.websrv }}
          MODE: ${{ matrix.mode }}

      - name: "Test enrollment"
        uses: ./.github/actions/acme_clients
        with:
          TEST_ADL: "true"
          # REVOCATION: "false"

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: deb

      - name: "ACME Profiling - setup a2c with openxpki_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.openxpki_ca_handler
          OPTIONS: |
            host: https://openxpki:8443
            client_cert: /var/www/acme2certifier/volume/acme_ca/client_crt.p12
            cert_passphrase: Test1234
            ca_bundle: /var/www/acme2certifier/volume/acme_ca/ca_bundle.pem
            cert_profile_name: tls-server
            endpoint_name: enroll
            polling_timeout: 60
            allowed_domainlist: ["bar.local", "*.acme"]
            enrollment_config_log: True
        env:
          OPENXPKI_IP: ${{ env.RUNNER_IP }}

      - name: "ACME Profiling - setup a2c with openxpki_ca_handler (post-cfg)"
        run: |
          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nprofiles={\"tls-client\": \"http:\/\/foo.bar\/profile1\", \"tls-server\": \"http:\/\/foo.bar\/profile2\", \"profile3\": \"http:\/\/foo.bar\/profile3\"}/g" data/volume/acme_srv.cfg
        env:
          OPENXPKI_IP: ${{ env.RUNNER_IP }}

      - name: "Reconfigure a2c "
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh restart $WEBSRV
        env:
          WEBSRV: ${{ matrix.websrv }}
          MODE: ${{ matrix.mode }}

      - name: "ACME Profile - Test enrollment"
        uses: ./.github/actions/wf_specific/openxpki_ca_handler/enroll_acmeprofile
        with:
          DEPLOYMENT_TYPE: "deb"

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: deb

      - name: "EAB ACME Profiling - setup a2c with openxpki_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.openxpki_ca_handler
          OPTIONS: |
            host: https://openxpki:8443
            client_cert: /var/www/acme2certifier/volume/acme_ca/client_crt.p12
            cert_passphrase: Test1234
            ca_bundle: /var/www/acme2certifier/volume/acme_ca/ca_bundle.pem
            cert_profile_name: tls-server
            endpoint_name: enroll
            polling_timeout: 60
            allowed_domainlist: ["bar.local", "*.acme"]
            enrollment_config_log: True
          EXTRA_SECTIONS: |
            [EABhandler]
            eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler
            key_file: /var/www/acme2certifier/volume/acme_ca/kid_profiles.json
            eab_profiling: True
        env:
          OPENXPKI_IP: ${{ env.RUNNER_IP }}

      - name: "Stage kid_profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/openxpki.json
          DEST: data/volume/acme_ca/kid_profiles.json
      - name: "EAB ACME Profiling - setup a2c with openxpki_ca_handler (post-cfg)"
        run: |
          # sudo echo "host: https://$OPENXPKI_IP:8443" >> data/volume/acme_srv.cfg
          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nprofiles={\"tls-client\": \"http:\/\/foo.bar\/profile1\", \"tls-server\": \"http:\/\/foo.bar\/profile2\", \"profile3\": \"http:\/\/foo.bar\/profile3\"}/g" data/volume/acme_srv.cfg

        env:
          OPENXPKI_IP: ${{ env.RUNNER_IP }}

      - name: "Reconfigure a2c "
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh restart $WEBSRV
        env:
          WEBSRV: ${{ matrix.websrv }}
          MODE: ${{ matrix.mode }}

      - name: "EAB ACME Profile - Test enrollment"
        uses: ./.github/actions/wf_specific/openxpki_ca_handler/enroll_eab_acmeprofile
        with:
          DEPLOYMENT_TYPE: "deb"
          # REVOCATION: "false"

      - name: "Delete acme-sh, letsencypt and lego folders"
        run: |
          sudo rm -rf  certbot/*
          sudo rm -rf  lego/*
          sudo rm -rf  acme-sh/*

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: deb

      - name: "[ * ] Collecting test logs"
        if: ${{ failure() }}
        run: |
          mkdir -p ${{ github.workspace }}/artifact/upload
          docker exec acme-srv tar cvfz /tmp/acme2certifier/a2c.tgz /var/www/acme2certifier
          sudo cp -rp data/ ${{ github.workspace }}/artifact/data/
          sudo rm ${{ github.workspace }}/artifact/data/*.deb
          if [ ${{ matrix.websrv }} == "apache2" ]; then
            docker exec acme-srv cat /var/log/apache2/error.log > ${{ github.workspace }}/artifact/acme-srv.log
          else
            docker exec acme-srv cat /var/log/nginx/error.log > ${{ github.workspace }}/artifact/acme-srv.log
          fi
          docker exec acme-srv cat /var/log/syslog > ${{ github.workspace }}/artifact/syslog
          sudo tar -C ${{ github.workspace }}/artifact/ -cvzf ${{ github.workspace }}/artifact/upload/artifact.tar.gz data acme-srv.log syslog

      - name: "[ * ] Uploading artifacts"
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: test-deb-${{ matrix.websrv }}-${{ matrix.mode }}.tar.gz
          path: ${{ github.workspace }}/artifact/upload/
