            client_key: /opt/acme2certifier/volume/acme_ca/client_key.pem
            ca_bundle: /opt/acme2certifier/volume/acme_ca/ca_bundle.pem
            cert_profile_name: tls-server
            endpoint_name: enroll
            polling_timeout: 60
            allowed_domainlist: ["bar.local", "*.acme"]
        env:
          OPENXPKI_IP: ${{ env.RUNNER_IP }}

      - name: "Reconfigure a2c"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart
        env:
          MODE: ${{ matrix.mode }}

      - name: "Test enrollment"
        uses: ./.github/actions/acme_clients_enroll
        with:
