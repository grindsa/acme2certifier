name: CA-Handler Tests - PKCS7 SOAP
# Temporarily disabled; re-enable by restoring workflow_dispatch.
on:
  push:
    branches: [ 'disabled']

#  workflow_dispatch:
#    inputs:
#      branch:
#        description: 'Branch to run the workflow on'
#        required: true
#        default: 'main'
#      run_id:
#        description: 'Run ID of the producing workflow'
#        required: true
#        default: '0'
#      sha:
#        description: 'SHA of the commit to run the workflow on'
#        required: true
#        default: ''
#      called_by_workflow:
#        description: 'Name of the producing workflow'
#        required: true
#        default: 'manual-trigger'
#      full_ref:
#        description: 'Full git ref of the commit to run the workflow on'
#        required: false
#        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ inputs.branch }}
  cancel-in-progress: true

permissions: {}

jobs:
  guard:
    permissions: {}
    uses: ./.github/workflows/_guard.yml
    with:
      sha: ${{ inputs.sha }}
      run_id: ${{ inputs.run_id }}
      branch: ${{ inputs.branch }}

  # ---------------------------------------------------------
  # Test container images (matrix from payload)
  # ---------------------------------------------------------
  int-test-containers:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        dbhandler: ['wsgi', 'django']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v7

      - name: "Channel setup"
        uses: ./.github/actions/channel_container_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          WEB_SRV: ${{ matrix.websrv }}
          DB_HANDLER: ${{ matrix.dbhandler }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          NAME_SPACE: acme

      - name: "Parse XCA configuration from JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.XCA_CFG }}

      - name: "Prepare SOAP server"
        run: |
          sudo mkdir -p examples/Docker/data
          sudo mkdir -p examples/Docker/data/xca
          sudo chmod -R 777 examples/Docker/data/xca
          sudo cp test/ca/acme2certifier-clean.xdb examples/Docker/data/xca/$XCA_DB_NAME
          sudo touch examples/Docker/data/soap_srv.cfg
          sudo chmod 777 examples/Docker/data/soap_srv.cfg
          sudo echo "[CAhandler]" >> examples/Docker/data/soap_srv.cfg
          sudo echo "xdb_file: /etc/soap-srv/xca/$XCA_DB_NAME" >> examples/Docker/data/soap_srv.cfg
          sudo echo "issuing_ca_name: $XCA_ISSUING_CA" >> examples/Docker/data/soap_srv.cfg
          sudo echo "issuing_ca_key: $XCA_ISSUING_CA" >> examples/Docker/data/soap_srv.cfg
          sudo echo "passphrase: $XCA_PASSPHRASE" >> examples/Docker/data/soap_srv.cfg
          sudo echo "ca_cert_chain_list: [\"root-ca\"]" >> examples/Docker/data/soap_srv.cfg
          sudo echo "template_name: $XCA_TEMPLATE" >> examples/Docker/data/soap_srv.cfg

      - name: "Build and start SOAP server"
        working-directory: examples/Docker/
        run: |
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --batch --yes --no-tty --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
          sudo apt update
          sudo apt install -y docker-compose-plugin
          sudo mv ../../.dockerignore ../../.dockerignore.acme
          docker compose -f soap_srv.yml up -d
          docker compose -f soap_srv.yml logs

      - name: "Generate keys and certificates"
        uses: ./.github/actions/cert_gen

      - name: "Setup a2c with pkcs7_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.pkcs7_soap_ca_handler
          OPTIONS: |
            soap_srv: http://soap-srv.acme:8888
            signing_cert: /var/www/acme2certifier/volume/cert.pem
            signing_key: /var/www/acme2certifier/volume/key.pem
            password: Test1234
            ca_bundle: /var/www/acme2certifier/volume/ca_bundle.pem
            profilename: foo
            email: grindsa@foo.bar

      - name: "Setup a2c with pkcs7_ca_handler (post-cfg)"
        run: |
          sudo mkdir -p examples/Docker/data/acme_ca/certs
          sudo cp test/ca/sub-ca-key.pem test/ca/sub-ca-crl.pem test/ca/sub-ca-cert.pem test/ca/root-ca-cert.pem examples/Docker/data/acme_ca/
          sudo cp .github/acme2certifier.pem examples/Docker/data/acme2certifier.pem
          sudo cp .github/acme2certifier_cert.pem examples/Docker/data/acme2certifier_cert.pem
          sudo cp .github/acme2certifier_key.pem examples/Docker/data/acme2certifier_key.pem
          sudo cp test/ca/sub-ca-key.pem examples/Docker/data/key.pem
          sudo cp test/ca/sub-ca-cert.pem examples/Docker/data/cert.pem
          sudo cp test/ca/certs.pem examples/Docker/data/ca_bundle.pem
          cat examples/Docker/data/acme_srv.cfg

      - name: "Bring up a2c container"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Test enrollment"
        uses: ./.github/actions/acme_clients_enroll
        with:
          REVOCATION: "false"

      - name: "[ * ] Collecting extra failure logs"
        if: ${{ failure() }}
        run: |
          mkdir -p ${{ github.workspace }}/artifact ${{ github.workspace }}/artifact/data
          (cd examples/Docker && docker compose -f soap_srv.yml logs > ${{ github.workspace }}/artifact/soap-srv.log) || true

      - name: "Channel teardown"
        if: ${{ always() }}
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: container
          ARTIFACT_NAME: int-container-tests-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz


