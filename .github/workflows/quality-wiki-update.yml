name: Documentation - Wiki Update
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'
      run_id:
        description: 'Run ID of the producing workflow'
        required: true
        default: '0'
      sha:
        description: 'SHA of the commit to run the workflow on'
        required: true
        default: ''
      called_by_workflow:
        description: 'Name of the producing workflow'
        required: true
        default: 'manual-trigger'
      full_ref:
        description: 'Full git ref of the commit to run the workflow on'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ inputs.branch }}
  cancel-in-progress: true

permissions: {}

jobs:
  # ---------------------------------------------------------
  # Quick guard to validate incoming payload
  # ---------------------------------------------------------
  guard:
    permissions: {}
    uses: ./.github/workflows/_guard.yml
    with:
      sha: ${{ inputs.sha }}
      run_id: ${{ inputs.run_id }}
      branch: ${{ inputs.branch }}

  wiki-update:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: guard
    if: github.repository == 'grindsa/acme2certifier' && inputs.branch == 'master'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      - name: Publish documentation to Wiki
        uses: grindsa/github-wiki-publish-action@d6117ce124c26a0558eca1347112243438ca6620 # customize_wiki_title
        with:
          path: |
            docs
            examples/Docker
          exclude: architecture/**
          generate-home: true
          generate-sidebar: true
          inject-nav: true
          sync: true
          home-title: Welcome to the acme2certifier wiki
        env:
          GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          WIKI_COMMIT_MESSAGE: "Publish wiki from ${{ inputs.sha }}"
