name: Feature Tests - Dry Run Mode
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'
      run_id:
        description: 'Run ID of the producing workflow'
        required: true
        default: '0'
      sha:
        description: 'SHA of the commit to run the workflow on'
        required: true
        default: ''
      called_by_workflow:
        description: 'Name of the producing workflow'
        required: true
        default: 'manual-trigger'
      full_ref:
        description: 'Full git ref of the commit to run the workflow on'
        required: false
        default: ''

jobs:

  # ---------------------------------------------------------
  # Quick guard to validate incoming payload
  # ---------------------------------------------------------
  guard:
    runs-on: ubuntu-latest
    if: ${{ inputs.sha != '' && inputs.run_id != '' && inputs.branch != '' && github.repository == 'grindsa/acme2certifier' }}
    steps:
      - run: |
          echo "Triggered by SHA:    $SHA"
          echo "From branch:         $BRANCH"
          echo "Producer run_id:     $RUN_ID"
        env:
          SHA: ${{ inputs.sha }}
          BRANCH: ${{ inputs.branch }}
          RUN_ID: ${{ inputs.run_id }}

  # ---------------------------------------------------------
  # Test container images downloaded from the producer run
  # ---------------------------------------------------------
  test-containers:
    needs: guard
    runs-on: ubuntu-latest
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        dbhandler: ['wsgi', 'django']
    steps:

      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Download and import container"
        uses: ./.github/actions/container_load
        with:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: a2c-${{ inputs.run_id }}.${{ matrix.websrv }}.${{ matrix.dbhandler }}.tar
          DESTINATION_PATH: /tmp
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Prepare container environment"
        uses: ./.github/actions/container_prep
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}
          CONTAINER_BUILD: false

      - name: "Setup openssl ca_handler - dryrun mode false"
        uses: ./.github/actions/setup_openssl_cahandler
        with:
          VOLUME_DIR: "examples/Docker/data"

      - name: "Configure openssl ca_handler - dryrun mode false"
        run: |
          sudo chmod 777 examples/Docker/data/acme_srv.cfg
          sudo sed -i "s/debug: True/debug: True\ndryrun: False/g" examples/Docker/data/acme_srv.cfg
          cd examples/Docker/

      - name: "Bring up a2c container"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Test enrollment - dryrun mode false"
        uses: ./.github/actions/wf_specific/dryrun/enroll
        with:
          FAIL: "false"
          DEPLOYMENT_TYPE: "container"

      - name: "Check container configuration"
        uses: ./.github/actions/container_check
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "Reconfigure openssl ca_handler - dryrun mode to true"
        run: |
          sudo sed -i "s/dryrun: False/dryrun: True/g" examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart

      - name: "Test enrollment - dryrun mode true"
        uses: ./.github/actions/wf_specific/dryrun/enroll
        with:
          FAIL: "true"
          DEPLOYMENT_TYPE: "container"

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "Reconfigure openssl ca_handler - dryrun mode profile and no profile name"
        run: |
          sudo sed -i "s/dryrun: True/dryrun: profile/g" examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart

      - name: "Test enrollment - dryrun mode profile and no profile name"
        uses: ./.github/actions/wf_specific/dryrun/enroll
        with:
          FAIL: "missing_profile"
          DEPLOYMENT_TYPE: "container"

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "Reconfigure openssl ca_handler - dryrun mode profile and no profiles in cfg"
        run: |
          sudo sed -i "s/dryrun: profile/dryrun: profile\ndryrun_profile: dry-run/g" examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart

      - name: "Test enrollment - dryrun mode profile and no profiles in cfg"
        uses: ./.github/actions/wf_specific/dryrun/enroll
        with:
          FAIL: "profile"
          DEPLOYMENT_TYPE: "container"

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "Reconfigure openssl ca_handler - dryrun mode profile and profiles in cfg"
        run: |
          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nprofiles={\"profile1\": \"http:\/\/foo.bar\/profile1\", \"profile2\": \"http:\/\/foo.bar\/profile2\", \"profile3\": \"http:\/\/foo.bar\/profile3\"}/g" examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart

      - name: "Test enrollment - dryrun mode profile and profiles in cfg"
        uses: ./.github/actions/wf_specific/dryrun/enroll
        with:
          FAIL: "profile"
          DEPLOYMENT_TYPE: "container"

      - name: "[ * ] Collecting test logs"
        if: ${{ failure() }}
        uses: ./.github/actions/collect_failure_logs
        with:
          DEPLOYMENT_TYPE: container

      - name: "Sanitize failure artifacts"
        if: ${{ failure() }}
        uses: ./.github/actions/sanitize_artifact_payload
        with:
          ARTIFACT_DIR: ${{ github.workspace }}/artifact
      - name: "[ * ] Uploading artifacts"
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: container-tests-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz
          path: ${{ github.workspace }}/artifact/upload/
          retention-days: 1

      - name: "Secure cleanup"
        if: ${{ always() }}
        uses: ./.github/actions/secure_cleanup

  # ---------------------------------------------------------
  # Test RPMs (EL8 & EL9) downloaded from the producer run
  # ---------------------------------------------------------


  test-rpm:
    needs: guard
    runs-on: ubuntu-latest
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        rhversion: [8, 9]
        mode: ['wsgi', 'django']

    steps:

      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Parse JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.GH_CFG }}

      - name: "Prepare Alma environment"
        uses: ./.github/actions/rpm_prep
        with:
          GH_USER: ${{ env.GH_USER }}
          GH_SBOM_REPO_TOKEN: ${{ env.GH_SBOM_REPO_TOKEN }}
          RH_VERSION: ${{ matrix.rhversion }}
          RPM_BUILD: false

      - name: "Download RPM artifact by name from build run"
        uses: ./.github/actions/download_artifact
        with:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: acme2certifier-${{ inputs.run_id }}.noarch.rpm
          DESTINATION_PATH: data/
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Setup openssl ca_handler - dryrun false"
        uses: ./.github/actions/setup_openssl_cahandler

      - name: "Configure openssl ca_handler - dryrun false"
        run: |
          sudo chmod 777 data/volume/acme_srv.cfg
          sudo sed -i "s/debug: True/debug: True\ndryrun: False/g" data/volume/acme_srv.cfg

      - name: "Execute install script"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh install -m $MODE
        env:
          MODE: ${{ matrix.mode }}

      - name: "Test enrollment - dryrun mode false"
        uses: ./.github/actions/wf_specific/dryrun/enroll
        with:
          FAIL: "false"
          DEPLOYMENT_TYPE: "rpm"
          CA_PATH: data/volume/acme_ca/

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: rpm

      - name: "Reconfigure openssl ca_handler - dryrun mode true"
        run: |
          sudo sed -i "s/dryrun: False/dryrun: True/g" data/volume/acme_srv.cfg

      - name: "Reconfigure a2c"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart
        env:
          MODE: ${{ matrix.mode }}

      - name: "Test enrollment - dryrun mode true"
        uses: ./.github/actions/wf_specific/dryrun/enroll
        with:
          FAIL: "true"
          DEPLOYMENT_TYPE: "rpm"
          CA_PATH: data/volume/acme_ca/

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: rpm

      - name: "Reconfigure openssl ca_handler - dryrun mode profile and no profile name"
        run: |
          sudo sed -i "s/dryrun: True/dryrun: profile/g" data/volume/acme_srv.cfg

      - name: "Reconfigure a2c"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart
        env:
          MODE: ${{ matrix.mode }}

      - name: "Test enrollment - dryrun mode profile and no profile name"
        uses: ./.github/actions/wf_specific/dryrun/enroll
        with:
          FAIL: "missing_profile"
          DEPLOYMENT_TYPE: "rpm"
          CA_PATH: data/volume/acme_ca/

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: rpm

      - name: "Reconfigure openssl ca_handler - dryrun mode profile and no profiles in cfg"
        run: |
          sudo sed -i "s/dryrun: profile/dryrun: profile\ndryrun_profile: dry-run/g" data/volume/acme_srv.cfg

      - name: "Reconfigure a2c"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart
        env:
          MODE: ${{ matrix.mode }}

      - name: "Test enrollment - dryrun mode profile and no profiles in cfg"
        uses: ./.github/actions/wf_specific/dryrun/enroll
        with:
          FAIL: "profile"
          DEPLOYMENT_TYPE: "rpm"
          CA_PATH: data/volume/acme_ca/

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: rpm

      - name: "Reconfigure openssl ca_handler - dryrun mode profile and profiles in cfg"
        run: |
          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nprofiles={\"profile1\": \"http:\/\/foo.bar\/profile1\", \"profile2\": \"http:\/\/foo.bar\/profile2\", \"profile3\": \"http:\/\/foo.bar\/profile3\"}/g" data/volume/acme_srv.cfg

      - name: "Reconfigure a2c"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart
        env:
          MODE: ${{ matrix.mode }}

      - name: "Test enrollment - dryrun mode profile and profiles in cfg"
        uses: ./.github/actions/wf_specific/dryrun/enroll
        with:
          FAIL: "profile"
          DEPLOYMENT_TYPE: "rpm"
          CA_PATH: data/volume/acme_ca/

      - name: "[ * ] Collecting test logs"
        if: ${{ failure() }}
        uses: ./.github/actions/collect_failure_logs
        with:
          DEPLOYMENT_TYPE: rpm

      - name: "Sanitize failure artifacts"
        if: ${{ failure() }}
        uses: ./.github/actions/sanitize_artifact_payload
        with:
          ARTIFACT_DIR: ${{ github.workspace }}/artifact
      - name: "[ * ] Uploading artifacts"
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: test-rpm-rh${{ matrix.rhversion }}-${{ matrix.mode }}.tar.gz
          path: ${{ github.workspace }}/artifact/upload/
          retention-days: 1

      - name: "Secure cleanup"
        if: ${{ always() }}
        uses: ./.github/actions/secure_cleanup


  # ---------------------------------------------------------
  # Test DEB downloaded from the producer run
  # ---------------------------------------------------------


  test-deb:
    needs: guard
    runs-on: ubuntu-latest
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        mode: ['wsgi', 'django']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Prepare Ubuntu environment"
        if: matrix.mode == 'wsgi'
        uses: ./.github/actions/deb_prep
        with:
          DEB_BUILD: false

      - name: "Prepare Ubuntu environment"
        if: matrix.mode == 'django'
        uses: ./.github/actions/deb_prep
        with:
          DEB_BUILD: false
          DJANGO_DB: psql

      - name: "Download DEB artifact by name from build run"
        uses: ./.github/actions/download_artifact
        with:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: acme2certifier-${{ inputs.run_id }}-1_all.deb
          DESTINATION_PATH: data/
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Setup openssl ca_handler - dryrun false"
        uses: ./.github/actions/setup_openssl_cahandler

      - name: "Configure openssl ca_handler - dryrun false"
        run: |
          sudo chmod 777 data/volume/acme_srv.cfg
          sudo sed -i "s#volume/acme_ca/#/var/www/acme2certifier/volume/acme_ca/#g" data/volume/acme_srv.cfg
          sudo sed -i "s/debug: True/debug: True\ndryrun: False/g" data/volume/acme_srv.cfg

      - name: "Execute install script"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh install $WEBSRV -m $MODE
        env:
          WEBSRV: ${{ matrix.websrv }}
          MODE: ${{ matrix.mode }}

      - name: "Test enrollment - dryrun mode false"
        uses: ./.github/actions/wf_specific/dryrun/enroll
        with:
          FAIL: "false"
          DEPLOYMENT_TYPE: "deb"
          CA_PATH: data/volume/acme_ca/

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: deb

      - name: "Reconfigure openssl ca_handler - dryrun mode true"
        run: |
          sudo sed -i "s/dryrun: False/dryrun: True/g" data/volume/acme_srv.cfg

      - name: "Reconfigure a2c "
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh restart $WEBSRV
        env:
          WEBSRV: ${{ matrix.websrv }}
          MODE: ${{ matrix.mode }}

      - name: "Test enrollment - dryrun mode true"
        uses: ./.github/actions/wf_specific/dryrun/enroll
        with:
          FAIL: "true"
          DEPLOYMENT_TYPE: "deb"
          CA_PATH: data/volume/acme_ca/

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: deb

      - name: "Reconfigure openssl ca_handler - dryrun mode profile and no profile name"
        run: |
          sudo sed -i "s/dryrun: True/dryrun: profile/g" data/volume/acme_srv.cfg

      - name: "Reconfigure a2c "
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh restart $WEBSRV
        env:
          WEBSRV: ${{ matrix.websrv }}
          MODE: ${{ matrix.mode }}

      - name: "Test enrollment - dryrun mode profile and no profile name"
        uses: ./.github/actions/wf_specific/dryrun/enroll
        with:
          FAIL: "missing_profile"
          DEPLOYMENT_TYPE: "deb"
          CA_PATH: data/volume/acme_ca/

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: deb

      - name: "Reconfigure openssl ca_handler - dryrun mode profile and no profiles in cfg"
        run: |
          sudo sed -i "s/dryrun: profile/dryrun: profile\ndryrun_profile: dry-run/g" data/volume/acme_srv.cfg

      - name: "Reconfigure a2c "
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh restart $WEBSRV
        env:
          WEBSRV: ${{ matrix.websrv }}
          MODE: ${{ matrix.mode }}

      - name: "Test enrollment - dryrun mode profile and no profiles in cfg"
        uses: ./.github/actions/wf_specific/dryrun/enroll
        with:
          FAIL: "profile"
          DEPLOYMENT_TYPE: "deb"
          CA_PATH: data/volume/acme_ca/

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: deb

      - name: "Reconfigure openssl ca_handler - dryrun mode profile and profiles in cfg"
        run: |
          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nprofiles={\"profile1\": \"http:\/\/foo.bar\/profile1\", \"profile2\": \"http:\/\/foo.bar\/profile2\", \"profile3\": \"http:\/\/foo.bar\/profile3\"}/g" data/volume/acme_srv.cfg

      - name: "Reconfigure a2c "
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh restart $WEBSRV
        env:
          WEBSRV: ${{ matrix.websrv }}
          MODE: ${{ matrix.mode }}

      - name: "Test enrollment - dryrun mode profile and profiles in cfg"
        uses: ./.github/actions/wf_specific/dryrun/enroll
        with:
          FAIL: "profile"
          DEPLOYMENT_TYPE: "deb"
          CA_PATH: data/volume/acme_ca/


      - name: "[ * ] Collecting test logs"
        if: ${{ failure() }}
        uses: ./.github/actions/collect_failure_logs
        with:
          DEPLOYMENT_TYPE: deb
          WEBSRV: ${{ matrix.websrv }}

      - name: "Sanitize failure artifacts"
        if: ${{ failure() }}
        uses: ./.github/actions/sanitize_artifact_payload
        with:
          ARTIFACT_DIR: ${{ github.workspace }}/artifact
      - name: "[ * ] Uploading artifacts"
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: test-deb-${{ matrix.websrv }}-${{ matrix.mode }}.tar.gz
          path: ${{ github.workspace }}/artifact/upload/
          retention-days: 1

      - name: "Secure cleanup"
        if: ${{ always() }}
        uses: ./.github/actions/secure_cleanup
