name: Code quality - Python Tests
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'
      run_id:
        description: 'Run ID of the producing workflow'
        required: true
        default: '0'
      sha:
        description: 'SHA of the commit to run the workflow on'
        required: true
        default: ''
      called_by_workflow:
        description: 'Name of the producing workflow'
        required: true
        default: 'manual-trigger'
      full_ref:
        description: 'Full git ref of the commit to run the workflow on'
        required: false
        default: ''

jobs:
  # ---------------------------------------------------------
  # Quick guard to validate incoming payload
  # ---------------------------------------------------------
  guard:
    runs-on: ubuntu-latest
    if: ${{ inputs.sha != '' && inputs.run_id != '' && inputs.branch != '' && github.repository == 'grindsa/acme2certifier' }}
    steps:
      - run: |
          echo "Triggered by SHA:    $SHA"
          echo "From branch:         $BRANCH"
          echo "Producer run_id:     $RUN_ID"
        env:
          SHA: ${{ inputs.sha }}
          BRANCH: ${{ inputs.branch }}
          RUN_ID: ${{ inputs.run_id }}

  unittest:
    runs-on: ubuntu-latest
    needs: guard
    # Prevent workflows from running in forks
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      matrix:
        python_version: ['3.x', '3.14', '3.13', '3.12', '3.11', '3.10', '3.9']

    name: Python Unittest (${{ matrix.python_version }})
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python_version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python_version }}

    - name: Install components
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND="noninteractive" apt-get install --no-install-recommends -y \
        libkrb5-dev \
        python3-gssapi \

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade build
        pip install ".[test,gssapi]"
        pip install pytest impacket

    - name: cp
      run: |
          cp examples/acme_srv.cfg acme2certifier/acme_srv/
    - name: Python test
      run: |
        pytest

  pylint:
    runs-on: ubuntu-latest
    needs: guard
    # Prevent workflows from running in forks
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      matrix:
        python_version: ['3.x', '3.12', '3.11', '3.10', '3.9', '3.8']

    name: Pylint test (${{ matrix.python_version }})

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python_version }}

      - name: Install components
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND="noninteractive" apt-get install --no-install-recommends -y \
          libkrb5-dev \
          python3-gssapi \

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint pylint-exit
          pip install ".[gssapi]"

      - name: "Pylint folder: acme2certifier package"
        run: |
          pylint --rcfile=".github/pylintrc" acme2certifier/ || pylint-exit $?

      - name: "Pylint folder: acme2certifier/dbhandlers"
        run: |
          pylint --rcfile=".github/pylintrc" acme2certifier/dbhandlers/*.py || pylint-exit $?

      - name: "Pylint folder: examples skeletons"
        run: |
          pylint --rcfile=".github/pylintrc" acme2certifier/share/skeletons/ca_handler/skeleton_ca_handler.py acme2certifier/share/skeletons/eab_handler/skeleton_eab_handler.py acme2certifier/share/skeletons/hooks/skeleton_hooks.py || pylint-exit $?

      - name: "Linting with pycodestyle"
        run: |
          pip install pycodestyle
          cp .github/pycodestyle ~/.config/pycodestyle
          pycodestyle --show-source acme2certifier/.
          pycodestyle --show-source examples/.
