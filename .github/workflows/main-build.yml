name: Build - Packages and Containers
on:

  push:
    # branches: [ "disabled" ]         # build on any branch
    branches: [ "**" ]       # build on any branch
  workflow_dispatch: {}
  #schedule:
  #   - cron: '0 01 * * 6'  # Every Saturday morning


jobs:
  build-containers:
    name: Build container (${{ matrix.websrv }} / ${{ matrix.dbhandler }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [ build-deb ]
    permissions:
      pull-requests: write
      contents: write
    if: github.repository == 'grindsa/acme2certifier' && !startsWith(github.ref_name, 'wf_') && !startsWith(github.ref_name, 'min')
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        dbhandler: ['wsgi', 'django']
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v7

      - uses: actions/checkout@v7

      - name: "Download DEB artifact by name from build run"
        uses: ./.github/actions/download_artifact
        with:
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_NAME: acme2certifier-${{ github.run_id }}-1_all.deb
          DESTINATION_PATH: ./
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Build container"
        uses: ./.github/actions/container_build_upload
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

  # ---------------------------------------------------------
  # Job 2: Build RPM and upload artifacts
  # ---------------------------------------------------------
  build-rpm:
    name: Build RPM package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pull-requests: write
      contents: write
    if: github.repository == 'grindsa/acme2certifier' && !startsWith(github.ref_name, 'wf_') && !startsWith(github.ref_name, 'min')
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v7

      - uses: actions/checkout@v7
      - name: "Build rpm package"
        id: rpm_build
        uses: ./.github/actions/rpm_build_upload


  # ---------------------------------------------------------
  # Job 3: Build one DEB and upload artifact
  # ---------------------------------------------------------
  build-deb:
    name: Build DEB package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pull-requests: write
      contents: write
    if: github.repository == 'grindsa/acme2certifier' && !startsWith(github.ref_name, 'wf_') && !startsWith(github.ref_name, 'min')
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v7

      - uses: actions/checkout@v7
      - name: "deb build and upload"
        uses: ./.github/actions/deb_build_upload
        with:
          NO_VERSION: "true"

  # ---------------------------------------------------------
  # Dispatch tests with full payload (branch/ref-safe)
  # ---------------------------------------------------------
  dispatch:
    name: Dispatch test workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ build-containers, build-rpm, build-deb ]
    permissions:
      contents: read
      actions: read
      deployments: write
    if: >
      always() &&
      !cancelled() &&
      github.repository == 'grindsa/acme2certifier' &&
      !startsWith(github.ref_name, 'wf_') &&
      (
        startsWith(github.ref_name, 'min') ||
        (
          needs.build-containers.result == 'success' &&
          needs.build-rpm.result == 'success' &&
          needs.build-deb.result == 'success'
        )
      )
    steps:
      - name: Dispatch quality-python
        if: startsWith(github.ref_name, 'min')
        env:
          GH_TOKEN: ${{ secrets.GH_WF_TOKEN }}
        run: |
          gh workflow run quality-python.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            -f sha="${{ github.sha }}" \
            -f branch="${{ github.ref_name }}" \
            -f full_ref="${{ github.ref }}" \
            -f run_id="${{ github.run_id }}" \
            -f called_by_workflow="${{ github.workflow }}"

      - name: Dispatch repository event
        if: ${{ !startsWith(github.ref_name, 'min') }}
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.GH_WF_TOKEN }}
          event-type: artifacts_ready
          client-payload: >-
            {
              "sha":        "${{ github.sha }}",
              "branch":     "${{ github.ref_name }}",
              "full_ref":   "${{ github.ref }}",
              "run_id":     "${{ github.run_id }}",
              "called_by_workflow": "${{ github.workflow }}"
            }
