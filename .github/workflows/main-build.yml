name: Build - Packages and Containers
on:

  push:
    # branches: [ "disabled" ]         # build on any branch
    branches: [ "**" ]       # build on any branch
  workflow_dispatch: {}
  #schedule:
  #   - cron: '0 01 * * 6'  # Every Saturday morning

concurrency:
  group: main-build-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # ---------------------------------------------------------
  # Job 1: Build four container images (matrix) and push to GHCR
  # ---------------------------------------------------------
  build-containers:
    name: Build container (${{ matrix.websrv }} / ${{ matrix.dbhandler }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [ build-deb ]
    permissions:
      contents: read
      actions: write
    if: github.repository == 'grindsa/acme2certifier' && !startsWith(github.ref_name, 'wf_')
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        dbhandler: ['wsgi', 'django']
    steps:
      - uses: actions/checkout@v6

      - name: "Download DEB artifact by name from build run"
        uses: ./.github/actions/download_artifact
        with:
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_NAME: acme2certifier-${{ github.run_id }}-1_all.deb
          DESTINATION_PATH: ./
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Build container"
        uses: ./.github/actions/container_build_upload
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

  # ---------------------------------------------------------
  # Job 2: Build RPM and upload artifacts
  # ---------------------------------------------------------
  build-rpm:
    name: Build RPM package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    if: github.repository == 'grindsa/acme2certifier' && !startsWith(github.ref_name, 'wf_')
    steps:
      - uses: actions/checkout@v6
      - name: "Build rpm package"
        id: rpm_build
        uses: ./.github/actions/rpm_build_upload


  # ---------------------------------------------------------
  # Job 3: Build one DEB and upload artifact
  # ---------------------------------------------------------
  build-deb:
    name: Build DEB package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    if: github.repository == 'grindsa/acme2certifier' && !startsWith(github.ref_name, 'wf_')
    steps:
      - uses: actions/checkout@v6
      - name: "deb build and upload"
        uses: ./.github/actions/deb_build_upload
        with:
          NO_VERSION: "true"

  # ---------------------------------------------------------
  # Dispatch tests with full payload (branch/ref-safe)
  # ---------------------------------------------------------
  dispatch:
    name: Dispatch test workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ build-containers, build-rpm, build-deb ]
    permissions:
      contents: read
      actions: read
      deployments: write
    if: github.repository == 'grindsa/acme2certifier' && !startsWith(github.ref_name, 'wf_')
    steps:
      - name: Dispatch repository event
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.GH_WF_TOKEN }}
          event-type: artifacts_ready
          client-payload: >-
            {
              "sha":        "${{ github.sha }}",
              "branch":     "${{ github.ref_name }}",
              "full_ref":   "${{ github.ref }}",
              "run_id":     "${{ github.run_id }}",
              "called_by_workflow": "${{ github.workflow }}"
            }
