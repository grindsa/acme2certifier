name: Feature Tests - EmailReply Challenge
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'
      run_id:
        description: 'Run ID of the producing workflow'
        required: true
        default: '0'
      sha:
        description: 'SHA of the commit to run the workflow on'
        required: true
        default: ''
      called_by_workflow:
        description: 'Name of the producing workflow'
        required: true
        default: 'manual-trigger'
      full_ref:
        description: 'Full git ref of the commit to run the workflow on'
        required: false
        default: ''

jobs:

  # ---------------------------------------------------------
  # Quick guard to validate incoming payload
  # ---------------------------------------------------------
  guard:
    runs-on: ubuntu-latest
    if: ${{ inputs.sha != '' && inputs.run_id != '' && inputs.branch != '' && github.repository == 'grindsa/acme2certifier' }}
    steps:
      - run: |
          echo "Triggered by SHA:    $SHA"
          echo "From branch:         $BRANCH"
          echo "Producer run_id:     $RUN_ID"
        env:
          SHA: ${{ inputs.sha }}
          BRANCH: ${{ inputs.branch }}
          RUN_ID: ${{ inputs.run_id }}

  # ---------------------------------------------------------
  # Test container images (matrix from payload)
  # ---------------------------------------------------------
  test-containers:
    needs: guard
    runs-on: ubuntu-latest
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        dbhandler: ['wsgi', 'django']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Download and import container"
        uses: ./.github/actions/container_load
        with:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: a2c-${{ inputs.run_id }}.${{ matrix.websrv }}.${{ matrix.dbhandler }}.tar
          DESTINATION_PATH: /tmp
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Prepare container environment"
        uses: ./.github/actions/container_prep
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}
          CONTAINER_BUILD: false
          NAME_SPACE: acme

      - name: "Parse XCA configuration from JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.XCA_CFG }}

      - name: "Parse EMAIL configuration from JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.EMAILADDRESSES_CFG }}

      - name: "Install mailserver"
        uses: ./.github/actions/mailserver_install
        with:
          MAILSERVER_CERT: ${{ secrets.MAILSERVER_CERT }}

      - name: "Setup a2c with xca_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.xca_ca_handler
          OPTIONS: |
            xdb_file: volume/xca/${{ env.XCA_DB_NAME }}
            issuing_ca_name: ${{ env.XCA_ISSUING_CA }}
            passphrase: ${{ env.XCA_PASSPHRASE }}
            ca_cert_chain_list: ["root-ca"]
            allowed_domainlist: ["bar.local", "*.acme"]

      - name: "Setup a2c with xca_ca_handler (post-cfg)"
        run: |
          sudo mkdir -p examples/Docker/data/xca
          sudo chmod -R 777 examples/Docker/data/xca
          sudo cp test/ca/acme2certifier-clean.xdb examples/Docker/data/xca/$XCA_DB_NAME
          sudo mkdir -p examples/Docker/data/acme_ca/certs
          sudo cp test/ca/sub-ca-key.pem test/ca/sub-ca-crl.pem test/ca/sub-ca-cert.pem test/ca/root-ca-cert.pem examples/Docker/data/acme_ca/
          # sudo echo "template_name: $XCA_TEMPLATE" >> examples/Docker/data/acme_srv.cfg

          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nemail_identifier_support: True\nemail_identifier_rewrite: True\ndns_validation_pause_timer: 5/g" examples/Docker/data/acme_srv.cfg
          sudo sed -i "s/debug: True/debug: True\nimap_server: mailserver.acme\nimap_port: 993\nimap_use_ssl: True\nsmtp_port: 587\nsmtp_use_tls: True\nusername: $A2C_ADDR\npassword: $A2C_PASSWORD\nemail_address: $A2C_ADDR/g" examples/Docker/data/acme_srv.cfg

      - name: "Bring up a2c container"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      #- name: "Test enrollment"
      #  uses: ./.github/actions/acme_clients
      #  with:
      #    TEST_ADL: "true"

      - name: "Install and enroll via acme-email"
        uses: ./.github/actions/wf_specific/emailreply_challengevalidation/acme_email_enroll
        with:
          INSTALL: "true"
          TO_FAIL: "true"

      - name: "Disable Challenge validation"
        run: |
          sudo sed -i "s/challenge_validation_disable: False/challenge_validation_disable: True/g" examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart

      #- name: "Enroll via acme-email"
      #  uses: ./.github/actions/wf_specific/emailreply_challengevalidation/acme_email_enroll
      #  with:
      #    TO_FAIL: "false"

      - name: "Stage kid_profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/emailreply.json
          DEST: examples/Docker/data/kid_profiles.json
      - name: "EAB profile - setup handler with EAB support"
        run: |
          sudo sed -i "s/challenge_validation_disable: True/challenge_validation_disable: False/g" examples/Docker/data/acme_srv.cfg
          sudo chmod 777 examples/Docker/data/acme_srv.cfg
          sudo echo -e "\n[EABhandler]" >> examples/Docker/data/acme_srv.cfg
          sudo echo "eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler" >> examples/Docker/data/acme_srv.cfg
          sudo echo "key_file: volume/kid_profiles.json" >> examples/Docker/data/acme_srv.cfg
          sudo echo "eab_profiling: True" >> examples/Docker/data/acme_srv.cfg


          cd examples/Docker/
          docker compose restart

      - name: "EAB Profiling - Test enrollment"
        uses: ./.github/actions/wf_specific/emailreply_challengevalidation/enroll_eabprofile

      - name: "[ * ] Collecting extra failure logs"
        if: ${{ failure() }}
        run: |
          mkdir -p ${{ github.workspace }}/artifact ${{ github.workspace }}/artifact/data
          sudo cp -rp mailserver/ ${{ github.workspace }}/artifact/mailserver/
          sudo mkdir -p ${{ github.workspace }}/artifact/acme_email
          sudo cp acme_email/lets* ${{ github.workspace }}/artifact/acme_email/
          docker logs mailserver 2>&1 > ${{ github.workspace }}/artifact/mailserver.log

      - name: "[ * ] Collecting test logs"
        if: ${{ failure() }}
        uses: ./.github/actions/collect_failure_logs
        with:
          DEPLOYMENT_TYPE: container

      - name: "[ * ] Sanitizing artifact payload"
        if: ${{ failure() }}
        uses: ./.github/actions/sanitize_artifact_payload
        with:
          ARTIFACT_DIR: ${{ github.workspace }}/artifact

      - name: "[ * ] Uploading artifacts"
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: container-tests-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz
          path: ${{ github.workspace }}/artifact/upload/
          retention-days: 1

  # ---------------------------------------------------------
  # Test RPMs (EL8 & EL9) downloaded from the producer run
  # ---------------------------------------------------------
  test-rpm:
    needs: guard
    runs-on: ubuntu-latest
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        rhversion: [8, 9]
        mode: ['wsgi', 'django']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Parse JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.GH_CFG }}

      - name: "Parse XCA configuration from JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.XCA_CFG }}

      - name: "Parse EMAIL configuration from JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.EMAILADDRESSES_CFG }}

      - name: "Download RPM artifact by name from build run"
        uses: ./.github/actions/download_artifact
        with:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: acme2certifier-${{ inputs.run_id }}.noarch.rpm
          DESTINATION_PATH: data/
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Prepare Alma environment"
        uses: ./.github/actions/rpm_prep
        with:
          GH_USER: ${{ env.GH_USER }}
          GH_SBOM_REPO_TOKEN: ${{ env.GH_SBOM_REPO_TOKEN }}
          RH_VERSION: ${{ matrix.rhversion }}
          RPM_BUILD: false

      - name: "Install mailserver"
        uses: ./.github/actions/mailserver_install
        with:
          MAILSERVER_CERT: ${{ secrets.MAILSERVER_CERT }}

      - name: "Setup acme_srv.cfg with xca_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.xca_ca_handler
          OPTIONS: |
            xdb_file: volume/acme_ca/${{ env.XCA_DB_NAME }}
            issuing_ca_name: ${{ env.XCA_ISSUING_CA }}
            passphrase: ${{ env.XCA_PASSPHRASE }}
            ca_cert_chain_list: ["root-ca"]
            template_name: ${{ env.XCA_TEMPLATE }}
            allowed_domainlist: ["bar.local", "*.acme"]

      - name: "Setup acme_srv.cfg with xca_ca_handler (post-cfg)"
        run: |
          mkdir -p data/volume/acme_ca/certs
          sudo cp test/ca/acme2certifier-clean.xdb data/volume/acme_ca/$XCA_DB_NAME
          sudo cp test/ca/sub-ca-key.pem test/ca/sub-ca-crl.pem test/ca/sub-ca-cert.pem test/ca/root-ca-cert.pem data/volume/acme_ca/

          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nemail_identifier_support: True\nemail_identifier_rewrite: True\ndns_validation_pause_timer: 5/g" data/volume/acme_srv.cfg
          sudo sed -i "s/debug: True/debug: True\nimap_server: mailserver.acme\nimap_port: 993\nimap_use_ssl: True\nsmtp_port: 587\nsmtp_use_tls: True\nusername: $A2C_ADDR\npassword: $A2C_PASSWORD\nemail_address: $A2C_ADDR/g" data/volume/acme_srv.cfg

      - name: "Execute install script"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh install -m $MODE
          docker ps -a
        env:
          MODE: ${{ matrix.mode }}

      #- name: "Test enrollment"
      #  uses: ./.github/actions/acme_clients
      #  with:
      #    TEST_ADL: "true"

      - name: "Install and enroll via acme-email"
        uses: ./.github/actions/wf_specific/emailreply_challengevalidation/acme_email_enroll
        with:
          INSTALL: "true"
          TO_FAIL: "true"

      - name: "Disable challenge validation"
        run: |
          sudo sed -i "s/challenge_validation_disable: False/challenge_validation_disable: True/g" data/volume/acme_srv.cfg

      - name: "Reconfigure a2c"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart
        env:
          MODE: ${{ matrix.mode }}

      - name: "Enroll via acme-email"
        uses: ./.github/actions/wf_specific/emailreply_challengevalidation/acme_email_enroll
        with:
          TO_FAIL: "false"

      - name: "Stage kid_profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/emailreply.json
          DEST: data/volume/acme_ca/kid_profiles.json
      - name: "EAB profile - setup handler with EAB support"
        run: |
          sudo sed -i "s/challenge_validation_disable: True/challenge_validation_disable: False/g" data/volume/acme_srv.cfg
          sudo chmod 777 data/volume/acme_srv.cfg
          sudo echo -e "\n[EABhandler]" >> data/volume/acme_srv.cfg
          sudo echo "eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler" >> data/volume/acme_srv.cfg
          sudo echo "key_file: /opt/acme2certifier/volume/acme_ca/kid_profiles.json" >> data/volume/acme_srv.cfg
          sudo echo "eab_profiling: True" >> data/volume/acme_srv.cfg


      - name: "Reconfigure a2c"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart
        env:
          MODE: ${{ matrix.mode }}

      - name: "EAB Profiling - Test enrollment"
        uses: ./.github/actions/wf_specific/emailreply_challengevalidation/enroll_eabprofile

      - name: "[ * ] Collecting extra failure logs"
        if: ${{ failure() }}
        run: |
          mkdir -p ${{ github.workspace }}/artifact ${{ github.workspace }}/artifact/data
          sudo cp -rp mailserver/ ${{ github.workspace }}/artifact/mailserver/
          sudo mkdir -p ${{ github.workspace }}/artifact/acme_email

      - name: "[ * ] Collecting test logs"
        if: ${{ failure() }}
        uses: ./.github/actions/collect_failure_logs
        with:
          DEPLOYMENT_TYPE: rpm

      - name: "[ * ] Sanitizing artifact payload"
        if: ${{ failure() }}
        uses: ./.github/actions/sanitize_artifact_payload
        with:
          ARTIFACT_DIR: ${{ github.workspace }}/artifact

      - name: "[ * ] Uploading artifacts"
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: test-rpm-rh${{ matrix.rhversion }}-${{ matrix.mode }}.tar.gz
          path: ${{ github.workspace }}/artifact/upload/
          retention-days: 1

  # ---------------------------------------------------------
  # Test DEB downloaded from the producer run
  # ---------------------------------------------------------
  test-deb:
    needs: guard
    runs-on: ubuntu-latest
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        mode: ['wsgi', 'django']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Parse XCA configuration from JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.XCA_CFG }}

      - name: "Parse EMAIL configuration from JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.EMAILADDRESSES_CFG }}

      - name: "Prepare Ubuntu environment"
        if: matrix.mode == 'wsgi'
        uses: ./.github/actions/deb_prep
        with:
          DEB_BUILD: false

      - name: "Prepare Ubuntu environment"
        if: matrix.mode == 'django'
        uses: ./.github/actions/deb_prep
        with:
          DEB_BUILD: false
          DJANGO_DB: psql

      - name: "Download DEB artifact by name from build run"
        uses: ./.github/actions/download_artifact
        with:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: acme2certifier-${{ inputs.run_id }}-1_all.deb
          DESTINATION_PATH: data/
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Install mailserver"
        uses: ./.github/actions/mailserver_install
        with:
          MAILSERVER_CERT: ${{ secrets.MAILSERVER_CERT }}

      - name: "Setup acme_srv.cfg with xca_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.xca_ca_handler
          OPTIONS: |
            xdb_file: /var/www/acme2certifier/volume/acme_ca/${{ env.XCA_DB_NAME }}
            issuing_ca_name: ${{ env.XCA_ISSUING_CA }}
            passphrase: ${{ env.XCA_PASSPHRASE }}
            ca_cert_chain_list: ["root-ca"]
            template_name: ${{ env.XCA_TEMPLATE }}
            allowed_domainlist: ["bar.local", "*.acme"]

      - name: "Setup acme_srv.cfg with xca_ca_handler (post-cfg)"
        run: |
          mkdir -p data/volume/acme_ca/certs
          sudo cp test/ca/acme2certifier-clean.xdb data/volume/acme_ca/$XCA_DB_NAME
          sudo cp test/ca/sub-ca-key.pem test/ca/sub-ca-crl.pem test/ca/sub-ca-cert.pem test/ca/root-ca-cert.pem data/volume/acme_ca/

          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nemail_identifier_support: True\nemail_identifier_rewrite: True\ndns_validation_pause_timer: 5/g" data/volume/acme_srv.cfg
          sudo sed -i "s/debug: True/debug: True\nimap_server: mailserver.acme\nimap_port: 993\nimap_use_ssl: True\nsmtp_port: 587\nsmtp_use_tls: True\nusername: $A2C_ADDR\npassword: $A2C_PASSWORD\nemail_address: $A2C_ADDR/g" data/volume/acme_srv.cfg

      - name: "Execute install script"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh install $WEBSRV -m $MODE
        env:
          WEBSRV: ${{ matrix.websrv }}
          MODE: ${{ matrix.mode }}

      #- name: "Test enrollment"
      #  uses: ./.github/actions/acme_clients
      #  with:
      #    TEST_ADL: "true"

      - name: "Install and enroll via acme-email"
        uses: ./.github/actions/wf_specific/emailreply_challengevalidation/acme_email_enroll
        with:
          INSTALL: "true"
          TO_FAIL: "true"

      - name: "Disable challenge validation"
        run: |
          sudo sed -i "s/challenge_validation_disable: False/challenge_validation_disable: True/g" data/volume/acme_srv.cfg

      - name: "Reconfigure a2c "
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh restart $WEBSRV
        env:
          WEBSRV: ${{ matrix.websrv }}
          MODE: ${{ matrix.mode }}

      - name: "Enroll via acme-email"
        uses: ./.github/actions/wf_specific/emailreply_challengevalidation/acme_email_enroll
        with:
          TO_FAIL: "false"

      - name: "Stage kid_profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/emailreply.json
          DEST: data/volume/acme_ca/kid_profiles.json
      - name: "EAB profile - setup handler with EAB support"
        run: |
          sudo sed -i "s/challenge_validation_disable: True/challenge_validation_disable: False/g" data/volume/acme_srv.cfg
          sudo chmod 777 data/volume/acme_srv.cfg
          sudo echo -e "\n[EABhandler]" >> data/volume/acme_srv.cfg
          sudo echo "eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler" >> data/volume/acme_srv.cfg
          sudo echo "key_file: /var/www/acme2certifier/volume/acme_ca/kid_profiles.json" >> data/volume/acme_srv.cfg
          sudo echo "eab_profiling: True" >> data/volume/acme_srv.cfg


      - name: "Reconfigure a2c "
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh restart $WEBSRV
        env:
          WEBSRV: ${{ matrix.websrv }}
          MODE: ${{ matrix.mode }}

      - name: "EAB Profiling - Test enrollment"
        uses: ./.github/actions/wf_specific/emailreply_challengevalidation/enroll_eabprofile

      - name: "[ * ] Collecting test logs"
        if: ${{ failure() }}
        uses: ./.github/actions/collect_failure_logs
        with:
          DEPLOYMENT_TYPE: deb
          WEBSRV: ${{ matrix.websrv }}

      - name: "[ * ] Sanitizing artifact payload"
        if: ${{ failure() }}
        uses: ./.github/actions/sanitize_artifact_payload
        with:
          ARTIFACT_DIR: ${{ github.workspace }}/artifact

      - name: "[ * ] Uploading artifacts"
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: test-deb-${{ matrix.websrv }}-${{ matrix.mode }}.tar.gz
          path: ${{ github.workspace }}/artifact/upload/
          retention-days: 1
