name: CA-Handler Tests - Digicert CertCentral
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'
      run_id:
        description: 'Run ID of the producing workflow'
        required: true
        default: '0'
      sha:
        description: 'SHA of the commit to run the workflow on'
        required: true
        default: ''
      called_by_workflow:
        description: 'Name of the producing workflow'
        required: true
        default: 'manual-trigger'
      full_ref:
        description: 'Full git ref of the commit to run the workflow on'
        required: false
        default: ''
jobs:

  # ---------------------------------------------------------
  # Quick guard to validate incoming payload
  # ---------------------------------------------------------
  guard:
    runs-on: ubuntu-latest
    if: ${{ inputs.sha != '' && inputs.run_id != '' && inputs.branch != '' && github.repository == 'grindsa/acme2certifier' && (inputs.branch == 'master' || inputs.branch == 'devel') }}
    steps:
      - run: |
          echo "Triggered by SHA:    $SHA"
          echo "From branch:         $BRANCH"
          echo "Producer run_id:     $RUN_ID"
        env:
          SHA: ${{ inputs.sha }}
          BRANCH: ${{ inputs.branch }}
          RUN_ID: ${{ inputs.run_id }}

  # ---------------------------------------------------------
  # Test container images (matrix from payload)
  # ---------------------------------------------------------
  test-containers:
    needs: guard
    runs-on: ubuntu-latest
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        websrv: ['apache2']
        dbhandler: ['wsgi', 'django']
    steps:

      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Parse DIGICERT_CFG JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.DIGICERT_CFG }}

      - name: "Download and import container"
        uses: ./.github/actions/container_load
        with:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: a2c-${{ inputs.run_id }}.${{ matrix.websrv }}.${{ matrix.dbhandler }}.tar
          DESTINATION_PATH: /tmp
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Prepare container environment"
        uses: ./.github/actions/container_prep
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}
          CONTAINER_BUILD: false
          NAME_SPACE: acme.dynamop.de

      - name: "Setup a2c with digicert_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.digicert_ca_handler
          OPTIONS: |
            api_key: ${{ env.DIGICERT_API_KEY }}
            organization_name: ${{ env.DIGICERT_ORGNAME }}
            allowed_domainlist: ["*.${{ env.DIGICERT_DOMAIN }}", "*.bar.local"]
        env:
          DIGICERT_API_KEY: ${{ env.DIGICERT_API_KEY }}
          DIGICERT_ORGNAME: ${{ env.DIGICERT_ORGNAME }}
          DIGICERT_DOMAIN: ${{ env.DIGICERT_DOMAIN }}

      - name: "Setup a2c with digicert_ca_handler (post-cfg)"
        run: |
          sudo cp test/ca/certsrv_ca_certs.pem examples/Docker/data/ca_certs.pem
          sudo sed -i "s/revocation_reason_check_disable: False/revocation_reason_check_disable: False\nenrollment_timeout:15/g" examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart
        env:
          DIGICERT_API_KEY: ${{ env.DIGICERT_API_KEY }}
          DIGICERT_ORGNAME: ${{ env.DIGICERT_ORGNAME }}
          DIGICERT_DOMAIN: ${{ env.DIGICERT_DOMAIN }}

      - name: "Bring up a2c container"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}
          NAME_SPACE: acme.dynamop.de

      - name: "Test enrollment"
        uses: ./.github/actions/acme_clients
        with:
          NAME_SPACE: acme.dynamop.de
          USE_CERTBOT: false
          TEST_ADL: "true"

      - name: "Verify allowed_domainlist error"
        run: |
          cd examples/Docker
          docker compose logs | grep -iE 'FQDN/SAN [^ ]+ not allowed by configuration'

      - name: "Check container configuration"
        uses: ./.github/actions/container_check
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "EAB - Setup a2c with digicert_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.digicert_ca_handler
          OPTIONS: |
            api_key: ${{ env.DIGICERT_API_KEY }}
            organization_name: ${{ env.DIGICERT_ORGNAME }}
            allowed_domainlist: ["*.${{ env.DIGICERT_DOMAIN }}", "*.bar.local"]
          EXTRA_SECTIONS: |
            [EABhandler]
            eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler
            key_file: volume/kid_profiles.json
            eab_profiling: True
        env:
          DIGICERT_API_KEY: ${{ env.DIGICERT_API_KEY }}
          DIGICERT_ORGNAME: ${{ env.DIGICERT_ORGNAME }}
          DIGICERT_DOMAIN: ${{ env.DIGICERT_DOMAIN }}

      - name: "Stage kid_profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/digicert.json
          DEST: examples/Docker/data/kid_profiles.json
      - name: "EAB - Setup a2c with digicert_ca_handler (post-cfg)"
        run: |
          mkdir -p examples/Docker/data
          sudo cp test/ca/certsrv_ca_certs.pem examples/Docker/data/ca_certs.pem
          sudo sed -i "s/revocation_reason_check_disable: False/revocation_reason_check_disable: False\nenrollment_timeout:15/g" examples/Docker/data/acme_srv.cfg
          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nheader_info_list: [\"HTTP_USER_AGENT\"]/g" examples/Docker/data/acme_srv.cfg

          cd examples/Docker/
          docker compose restart
        env:
          DIGICERT_API_KEY: ${{ env.DIGICERT_API_KEY }}
          DIGICERT_ORGNAME: ${{ env.DIGICERT_ORGNAME }}
          DIGICERT_DOMAIN: ${{ env.DIGICERT_DOMAIN }}

      - name: "EAB - Test enrollment"
        uses: ./.github/actions/wf_specific/digicert_ca_handler/enroll_eab

      - name: "ACME Profile - Setup a2c with digicert_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.digicert_ca_handler
          OPTIONS: |
            api_key: ${{ env.DIGICERT_API_KEY }}
            organization_name: ${{ env.DIGICERT_ORGNAME }}
            allowed_domainlist: ["*.${{ env.DIGICERT_DOMAIN }}", "*.bar.local"]
            enrollment_config_log: True
        env:
          DIGICERT_API_KEY: ${{ env.DIGICERT_API_KEY }}
          DIGICERT_ORGNAME: ${{ env.DIGICERT_ORGNAME }}
          DIGICERT_DOMAIN: ${{ env.DIGICERT_DOMAIN }}

      - name: "ACME Profile - Setup a2c with digicert_ca_handler (post-cfg)"
        run: |
          mkdir -p examples/Docker/data
          sudo cp test/ca/certsrv_ca_certs.pem examples/Docker/data/ca_certs.pem
          sudo sed -i "s/revocation_reason_check_disable: False/revocation_reason_check_disable: False\nenrollment_timeout:15/g" examples/Docker/data/acme_srv.cfg
          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nprofiles={\"ssl_basic\": \"http:\/\/foo.bar\/acmeca1\", \"ssl_securesite_pro\": \"http:\/\/foo.bar\/acmeca2\", \"ssl_securesite_flex\": \"http:\/\/foo.bar\/profile3\"}/g" examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart
        env:
          DIGICERT_API_KEY: ${{ env.DIGICERT_API_KEY }}
          DIGICERT_ORGNAME: ${{ env.DIGICERT_ORGNAME }}
          DIGICERT_DOMAIN: ${{ env.DIGICERT_DOMAIN }}

      - name: "ACME Profile - Test enrollment"
        uses: ./.github/actions/wf_specific/digicert_ca_handler/enroll_acmeprofile
        with:
          DEPLOYMENT_TYPE: "container"

      - name: "EAB ACME Profile - Setup a2c with digicert_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.digicert_ca_handler
          OPTIONS: |
            api_key: ${{ env.DIGICERT_API_KEY }}
            organization_name: ${{ env.DIGICERT_ORGNAME }}
            allowed_domainlist: ["*.${{ env.DIGICERT_DOMAIN }}", "*.bar.local"]
            enrollment_config_log: True
          EXTRA_SECTIONS: |
            [EABhandler]
            eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler
            key_file: volume/kid_profiles.json
            eab_profiling: True
        env:
          DIGICERT_API_KEY: ${{ env.DIGICERT_API_KEY }}
          DIGICERT_ORGNAME: ${{ env.DIGICERT_ORGNAME }}
          DIGICERT_DOMAIN: ${{ env.DIGICERT_DOMAIN }}

      - name: "Stage kid_profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/digicert.json
          DEST: examples/Docker/data/kid_profiles.json
      - name: "EAB ACME Profile - Setup a2c with digicert_ca_handler (post-cfg)"
        run: |
          mkdir -p examples/Docker/data
          sudo cp test/ca/certsrv_ca_certs.pem examples/Docker/data/ca_certs.pem
          sudo sed -i "s/revocation_reason_check_disable: False/revocation_reason_check_disable: False\nenrollment_timeout:15/g" examples/Docker/data/acme_srv.cfg
          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nprofiles={\"ssl_basic\": \"http:\/\/foo.bar\/acmeca1\", \"ssl_securesite_pro\": \"http:\/\/foo.bar\/acmeca2\", \"ssl_securesite_flex\": \"http:\/\/foo.bar\/profile3\"}/g" examples/Docker/data/acme_srv.cfg

          cd examples/Docker/
          docker compose restart
        env:
          DIGICERT_API_KEY: ${{ env.DIGICERT_API_KEY }}
          DIGICERT_ORGNAME: ${{ env.DIGICERT_ORGNAME }}
          DIGICERT_DOMAIN: ${{ env.DIGICERT_DOMAIN }}

      - name: "EAB ACME Profile - Test enrollment"
        uses: ./.github/actions/wf_specific/digicert_ca_handler/enroll_eab_acmeprofile
        with:
          DEPLOYMENT_TYPE: "container"

      - name: "[ * ] Collecting test logs"
        if: ${{ failure() }}
        uses: ./.github/actions/collect_failure_logs
        with:
          DEPLOYMENT_TYPE: container

      - name: "[ * ] Uploading artifacts"
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: test-containers-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz
          path: ${{ github.workspace }}/artifact/upload/

  # ---------------------------------------------------------
  # Test RPMs (EL8 & EL9) downloaded from the producer run
  # ---------------------------------------------------------
  test-rpm:
    needs: [guard, test-containers]
    runs-on: ubuntu-latest
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        rhversion: [8]
        mode: ['wsgi']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Parse DIGICERT_CFG JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.DIGICERT_CFG }}

      - name: "Parse GH_CFG JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.GH_CFG }}

      - name: "Download RPM artifact by name from build run"
        uses: ./.github/actions/download_artifact
        with:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: acme2certifier-${{ inputs.run_id }}.noarch.rpm
          DESTINATION_PATH: data/
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Prepare Alma environment"
        uses: ./.github/actions/rpm_prep
        with:
          GH_USER: ${{ env.GH_USER }}
          GH_SBOM_REPO_TOKEN: ${{ env.GH_SBOM_REPO_TOKEN }}
          RH_VERSION: ${{ matrix.rhversion }}
          RPM_BUILD: false
          NAME_SPACE: acme.dynamop.de

      - name: "Setup a2c with digicert_ca_handler for django"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.digicert_ca_handler
          OPTIONS: |
            api_key: ${{ env.DIGICERT_API_KEY }}
            organization_name: ${{ env.DIGICERT_ORGNAME }}
            allowed_domainlist: ["*.${{ env.DIGICERT_DOMAIN }}", "*.bar.local"]
        env:
          DIGICERT_API_KEY: ${{ env.DIGICERT_API_KEY }}
          DIGICERT_ORGNAME: ${{ env.DIGICERT_ORGNAME }}
          DIGICERT_DOMAIN: ${{ env.DIGICERT_DOMAIN }}

      - name: "Setup a2c with digicert_ca_handler for django (post-cfg)"
        run: |
          sudo mkdir -p data/volume/acme_ca/certs
          sudo cp test/ca/certsrv_ca_certs.pem data/volume/ca_certs.pem
          sudo sed -i "s/revocation_reason_check_disable: False/revocation_reason_check_disable: False\nenrollment_timeout:15/g" data/volume/acme_srv.cfg
        env:
          DIGICERT_API_KEY: ${{ env.DIGICERT_API_KEY }}
          DIGICERT_ORGNAME: ${{ env.DIGICERT_ORGNAME }}
          DIGICERT_DOMAIN: ${{ env.DIGICERT_DOMAIN }}

      - name: "Execute install script"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh install -m $MODE
        env:
          MODE: ${{ matrix.mode }}

      - name: "Test enrollment"
        uses: ./.github/actions/acme_clients
        with:
          NAME_SPACE: acme.dynamop.de
          USE_CERTBOT: false
          TEST_ADL: "true"

      - name: "Verify allowed_domainlist error"
        run: |
          docker exec acme-srv grep -iE 'FQDN/SAN [^ ]+ not allowed by configuration' /var/log/messages

      - name: "EAB - Setup a2c with digicert_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.digicert_ca_handler
          OPTIONS: |
            api_key: ${{ env.DIGICERT_API_KEY }}
            organization_name: ${{ env.DIGICERT_ORGNAME }}
            allowed_domainlist: ["*.${{ env.DIGICERT_DOMAIN }}", "*.bar.local"]
          EXTRA_SECTIONS: |
            [EABhandler]
            eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler
            key_file: /opt/acme2certifier/volume/acme_ca/kid_profiles.json
            eab_profiling: True
        env:
          DIGICERT_API_KEY: ${{ env.DIGICERT_API_KEY }}
          DIGICERT_ORGNAME: ${{ env.DIGICERT_ORGNAME }}
          DIGICERT_DOMAIN: ${{ env.DIGICERT_DOMAIN }}

      - name: "Stage kid_profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/digicert.json
          DEST: data/volume/acme_ca/kid_profiles.json
      - name: "EAB - Setup a2c with digicert_ca_handler (post-cfg)"
        run: |
          sudo mkdir -p data/volume/acme_ca/certs
          sudo cp test/ca/certsrv_ca_certs.pem data/ca_certs.pem
          sudo sed -i "s/revocation_reason_check_disable: False/revocation_reason_check_disable: False\nenrollment_timeout:15/g" data/volume/acme_srv.cfg
          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nheader_info_list: [\"HTTP_USER_AGENT\"]/g" data/volume/acme_srv.cfg

        env:
          DIGICERT_API_KEY: ${{ env.DIGICERT_API_KEY }}
          DIGICERT_ORGNAME: ${{ env.DIGICERT_ORGNAME }}
          DIGICERT_DOMAIN: ${{ env.DIGICERT_DOMAIN }}

      - name: "Reconfigure a2c"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart
        env:
          MODE: ${{ matrix.mode }}

      - name: "EAB - Test enrollment"
        uses: ./.github/actions/wf_specific/digicert_ca_handler/enroll_eab

      - name: "ACME Profile -  - Setup a2c with digicert_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.digicert_ca_handler
          OPTIONS: |
            api_key: ${{ env.DIGICERT_API_KEY }}
            organization_name: ${{ env.DIGICERT_ORGNAME }}
            allowed_domainlist: ["*.${{ env.DIGICERT_DOMAIN }}", "*.bar.local"]
            enrollment_config_log: True
        env:
          DIGICERT_API_KEY: ${{ env.DIGICERT_API_KEY }}
          DIGICERT_ORGNAME: ${{ env.DIGICERT_ORGNAME }}
          DIGICERT_DOMAIN: ${{ env.DIGICERT_DOMAIN }}

      - name: "ACME Profile -  - Setup a2c with digicert_ca_handler (post-cfg)"
        run: |
          sudo mkdir -p data/volume/acme_ca/certs
          sudo cp test/ca/certsrv_ca_certs.pem data/ca_certs.pem
          sudo sed -i "s/revocation_reason_check_disable: False/revocation_reason_check_disable: False\nenrollment_timeout:15/g" data/volume/acme_srv.cfg
          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nprofiles={\"ssl_basic\": \"http:\/\/foo.bar\/acmeca1\", \"ssl_securesite_pro\": \"http:\/\/foo.bar\/acmeca2\", \"ssl_securesite_flex\": \"http:\/\/foo.bar\/profile3\"}/g" data/volume/acme_srv.cfg
        env:
          DIGICERT_API_KEY: ${{ env.DIGICERT_API_KEY }}
          DIGICERT_ORGNAME: ${{ env.DIGICERT_ORGNAME }}
          DIGICERT_DOMAIN: ${{ env.DIGICERT_DOMAIN }}

      - name: "Reconfigure a2c"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart
        env:
          MODE: ${{ matrix.mode }}

      - name: "ACME Profile - Test enrollment"
        uses: ./.github/actions/wf_specific/digicert_ca_handler/enroll_acmeprofile
        with:
          DEPLOYMENT_TYPE: "rpm"

      - name: "EAB ACME Profile - Setup a2c with digicert_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.digicert_ca_handler
          OPTIONS: |
            api_key: ${{ env.DIGICERT_API_KEY }}
            organization_name: ${{ env.DIGICERT_ORGNAME }}
            allowed_domainlist: ["*.${{ env.DIGICERT_DOMAIN }}", "*.bar.local"]
            enrollment_config_log: True
          EXTRA_SECTIONS: |
            [EABhandler]
            eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler
            key_file: /opt/acme2certifier/volume/acme_ca/kid_profiles.json
            eab_profiling: True
        env:
          DIGICERT_API_KEY: ${{ env.DIGICERT_API_KEY }}
          DIGICERT_ORGNAME: ${{ env.DIGICERT_ORGNAME }}
          DIGICERT_DOMAIN: ${{ env.DIGICERT_DOMAIN }}

      - name: "Stage kid_profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/digicert.json
          DEST: data/volume/acme_ca/kid_profiles.json
      - name: "EAB ACME Profile - Setup a2c with digicert_ca_handler (post-cfg)"
        run: |
          sudo mkdir -p data/volume/acme_ca/certs
          sudo cp test/ca/certsrv_ca_certs.pem data/ca_certs.pem
          sudo sed -i "s/revocation_reason_check_disable: False/revocation_reason_check_disable: False\nenrollment_timeout:15/g" data/volume/acme_srv.cfg
          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nprofiles={\"ssl_basic\": \"http:\/\/foo.bar\/acmeca1\", \"ssl_securesite_pro\": \"http:\/\/foo.bar\/acmeca2\", \"ssl_securesite_flex\": \"http:\/\/foo.bar\/profile3\"}/g" data/volume/acme_srv.cfg

        env:
          DIGICERT_API_KEY: ${{ env.DIGICERT_API_KEY }}
          DIGICERT_ORGNAME: ${{ env.DIGICERT_ORGNAME }}
          DIGICERT_DOMAIN: ${{ env.DIGICERT_DOMAIN }}

      - name: "Reconfigure a2c"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart
        env:
          MODE: ${{ matrix.mode }}

      - name: "EAB ACME Profile - Test enrollment"
        uses: ./.github/actions/wf_specific/digicert_ca_handler/enroll_eab_acmeprofile
        with:
          DEPLOYMENT_TYPE: "rpm"

      - name: "[ * ] Collecting test logs"
        if: ${{ failure() }}
        uses: ./.github/actions/collect_failure_logs
        with:
          DEPLOYMENT_TYPE: rpm

      - name: "[ * ] Uploading artifacts"
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: test-rpm-rh${{ matrix.rhversion }}-${{ matrix.mode }}.tar.gz
          path: ${{ github.workspace }}/artifact/upload/

  # ---------------------------------------------------------
  # Test DEB downloaded from the producer run
  # ---------------------------------------------------------
  test-deb:
    needs: [guard, test-rpm]
    runs-on: ubuntu-latest
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['nginx']
        mode: ['django']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Parse DIGICERT_CFG JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.DIGICERT_CFG }}

      - name: "Prepare Ubuntu environment"
        if: matrix.mode == 'wsgi'
        uses: ./.github/actions/deb_prep
        with:
          DEB_BUILD: false
          NAME_SPACE: acme.dynamop.de

      - name: "Prepare Ubuntu environment"
        if: matrix.mode == 'django'
        uses: ./.github/actions/deb_prep
        with:
          DEB_BUILD: false
          DJANGO_DB: psql
          NAME_SPACE: acme.dynamop.de

      - name: "Download DEB artifact by name from build run"
        uses: ./.github/actions/download_artifact
        with:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: acme2certifier-${{ inputs.run_id }}-1_all.deb
          DESTINATION_PATH: data/
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Setup a2c with digicert_ca_handler for django"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.digicert_ca_handler
          OPTIONS: |
            api_key: ${{ env.DIGICERT_API_KEY }}
            organization_name: ${{ env.DIGICERT_ORGNAME }}
            allowed_domainlist: ["*.${{ env.DIGICERT_DOMAIN }}", "*.bar.local"]
        env:
          DIGICERT_API_KEY: ${{ env.DIGICERT_API_KEY }}
          DIGICERT_ORGNAME: ${{ env.DIGICERT_ORGNAME }}
          DIGICERT_DOMAIN: ${{ env.DIGICERT_DOMAIN }}

      - name: "Setup a2c with digicert_ca_handler for django (post-cfg)"
        run: |
          sudo mkdir -p data/volume/acme_ca/certs
          sudo cp test/ca/certsrv_ca_certs.pem data/volume/ca_certs.pem
          sudo sed -i "s/revocation_reason_check_disable: False/revocation_reason_check_disable: False\nenrollment_timeout:15/g" data/volume/acme_srv.cfg
        env:
