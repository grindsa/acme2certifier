name: Application Tests - Traefik
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'
      run_id:
        description: 'Run ID of the producing workflow'
        required: true
        default: '0'
      sha:
        description: 'SHA of the commit to run the workflow on'
        required: true
        default: ''
      called_by_workflow:
        description: 'Name of the producing workflow'
        required: true
        default: 'manual-trigger'
      full_ref:
        description: 'Full git ref of the commit to run the workflow on'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ inputs.branch }}
  cancel-in-progress: true

permissions: {}

jobs:

  # ---------------------------------------------------------
  # Quick guard to validate incoming payload
  # ---------------------------------------------------------
  guard:
    permissions: {}
    uses: ./.github/workflows/_guard.yml
    with:
      sha: ${{ inputs.sha }}
      run_id: ${{ inputs.run_id }}
      branch: ${{ inputs.branch }}

  # ---------------------------------------------------------
  # Test container images (matrix from payload)
  # ---------------------------------------------------------
  test-containers:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        dbhandler: ['wsgi', 'django']
        challenge_type: [tlschallenge=true, httpchallenge.entrypoint=web]

    steps:
      - name: "Channel setup"
        uses: ./.github/actions/channel_container_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          WEB_SRV: ${{ matrix.websrv }}
          DB_HANDLER: ${{ matrix.dbhandler }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          NAME_SPACE: acme

      - name: "get runner information"
        run: |
          echo RUNNER_HOSTNAME=$(hostname -f) >> $GITHUB_ENV

      - run: echo "runner hostname is ${{ env.RUNNER_HOSTNAME }}"
        env:
          RUNNER_HOSTNAME: ${{ env.RUNNER_HOSTNAME }}

      - name: "Setup openssl ca_handler"
        uses: ./.github/actions/setup_openssl_cahandler
        with:
          VOLUME_DIR: examples/Docker/data

      - name: "Bring up a2c container"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Wait for ACME directory"
        uses: ./.github/actions/wait_for_directory

      - name: "Traefik enroll and verify certificate"
        uses: ./.github/actions/wf_specific/traefik/enroll_check
        with:
          CHALLENGE_TYPE: ${{ matrix.challenge_type }}
          RUNNER_HOSTNAME: ${{ env.RUNNER_HOSTNAME }}

      - name: "[ * ] Collecting extra failure logs"
        if: ${{ failure() }}
        continue-on-error: true
        run: |
          mkdir -p ${{ github.workspace }}/artifact ${{ github.workspace }}/artifact/data
          docker logs traefik > traefik/traefik.log 2>&1 || true
          sudo cp -rp traefik/ ${{ github.workspace }}/artifact/traefik/ || true

      - name: "Channel teardown"
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: container
          ARTIFACT_NAME: test-containers-${{ matrix.challenge_type }}-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz

  test-rpm:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        rhversion: [8, 9]
        mode: ['wsgi', 'django']
        challenge_type: [tlschallenge=true, httpchallenge.entrypoint=web]

    steps:
      - name: "Channel setup"
        uses: ./.github/actions/channel_rpm_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          RH_VERSION: ${{ matrix.rhversion }}
          JSON_SECRET: ${{ secrets.GH_CFG }}

      - name: "get runner information"
        run: |
          echo RUNNER_HOSTNAME=$(hostname -f) >> $GITHUB_ENV

      - run: echo "runner hostname is ${{ env.RUNNER_HOSTNAME }}"
        env:
          RUNNER_HOSTNAME: ${{ env.RUNNER_HOSTNAME }}

      - name: "Setup openssl ca_handler"
        uses: ./.github/actions/setup_openssl_cahandler

      - name: "Execute install script"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh install -m $MODE
        env:
          MODE: ${{ matrix.mode }}

      - name: "Wait for ACME directory"
        uses: ./.github/actions/wait_for_directory

      - name: "Traefik enroll and verify certificate"
        uses: ./.github/actions/wf_specific/traefik/enroll_check
        with:
          CHALLENGE_TYPE: ${{ matrix.challenge_type }}
          RUNNER_HOSTNAME: ${{ env.RUNNER_HOSTNAME }}
          INSTALL_COMPOSE_PLUGIN: "true"

      - name: "[ * ] Collecting extra failure logs"
        if: ${{ failure() }}
        continue-on-error: true
        run: |
          mkdir -p ${{ github.workspace }}/artifact ${{ github.workspace }}/artifact/data
          docker logs traefik > ${{ github.workspace }}/artifact/traefik.log 2>&1 || true
          if [ -d traefik ]; then
            sudo cp -rp traefik/ ${{ github.workspace }}/artifact/traefik/ || true
          fi

      - name: "Channel teardown"
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: rpm
          ARTIFACT_NAME: test-rpm-rh${{ matrix.rhversion }}-${{ matrix.mode }}-${{ matrix.challenge_type }}.tar.gz

  test-deb:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        mode: ['wsgi', 'django']
        challenge_type: [tlschallenge=true, httpchallenge.entrypoint=web]

    steps:
      - name: "Channel setup"
        uses: ./.github/actions/channel_deb_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          DJANGO_DB: ${{ matrix.mode == 'django' && 'psql' || '' }}

      - name: "get runner information"
        run: |
          echo RUNNER_HOSTNAME=$(hostname -f) >> $GITHUB_ENV

      - run: echo "runner hostname is ${{ env.RUNNER_HOSTNAME }}"
        env:
          RUNNER_HOSTNAME: ${{ env.RUNNER_HOSTNAME }}

      - name: "Setup openssl ca_handler"
        uses: ./.github/actions/setup_openssl_cahandler

      - name: "Execute install script"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh install $WEBSRV -m $MODE
        env:
          WEBSRV: ${{ matrix.websrv }}
          MODE: ${{ matrix.mode }}

      - name: "Wait for ACME directory"
        uses: ./.github/actions/wait_for_directory

      - name: "Traefik enroll and verify certificate"
        uses: ./.github/actions/wf_specific/traefik/enroll_check
        with:
          CHALLENGE_TYPE: ${{ matrix.challenge_type }}
          RUNNER_HOSTNAME: ${{ env.RUNNER_HOSTNAME }}
          INSTALL_COMPOSE_PLUGIN: "true"

      - name: "[ * ] Collecting extra failure logs"
        if: ${{ failure() }}
        continue-on-error: true
        run: |
          mkdir -p ${{ github.workspace }}/artifact ${{ github.workspace }}/artifact/data
          docker logs traefik > ${{ github.workspace }}/artifact/traefik.log 2>&1 || true
          if [ -d traefik ]; then
            sudo cp -rp traefik/ ${{ github.workspace }}/artifact/traefik/ || true
          fi

      - name: "Channel teardown"
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: deb
          ARTIFACT_NAME: test-deb-${{ matrix.websrv }}-${{ matrix.mode }}-${{ matrix.challenge_type }}.tar.gz
          WEBSRV: ${{ matrix.websrv }}

