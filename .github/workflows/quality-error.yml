name: Code quality - Error testing
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'
      run_id:
        description: 'Run ID of the producing workflow'
        required: true
        default: '0'
      sha:
        description: 'SHA of the commit to run the workflow on'
        required: true
        default: ''
      called_by_workflow:
        description: 'Name of the producing workflow'
        required: true
        default: 'manual-trigger'
      full_ref:
        description: 'Full git ref of the commit to run the workflow on'
        required: false
        default: ''

jobs:

  # ---------------------------------------------------------
  # Quick guard to validate incoming payload
  # ---------------------------------------------------------
  guard:
    runs-on: ubuntu-latest
    if: ${{ inputs.sha != '' && inputs.run_id != '' && inputs.branch != '' && github.repository == 'grindsa/acme2certifier' }}
    steps:
      - run: |
          echo "Triggered by SHA:    $SHA"
          echo "From branch:         $BRANCH"
          echo "Producer run_id:     $RUN_ID"
        env:
          SHA: ${{ inputs.sha }}
          BRANCH: ${{ inputs.branch }}
          RUN_ID: ${{ inputs.run_id }}

  # ---------------------------------------------------------
  # Test container images downloaded from the producer run
  # ---------------------------------------------------------
  test-containers:
    needs: guard
    runs-on: ubuntu-latest
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        dbhandler: ['wsgi', 'django']
    steps:

      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Download and import container"
        uses: ./.github/actions/container_load
        with:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: a2c-${{ inputs.run_id }}.${{ matrix.websrv }}.${{ matrix.dbhandler }}.tar
          DESTINATION_PATH: /tmp
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Prepare container environment"
        uses: ./.github/actions/container_prep
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}
          CONTAINER_BUILD: false

      - name: "Setup openssl ca_handler"
        run: |
          sudo mkdir -p examples/Docker/data/acme_ca/certs
          sudo cp test/ca/sub-ca-key.pem test/ca/sub-ca-crl.pem test/ca/sub-ca-cert.pem test/ca/root-ca-cert.pem examples/Docker/data/acme_ca/
          sudo cp .github/openssl_ca_handler.py_acme_srv_choosen_handler.cfg examples/Docker/data/acme_srv.cfg
          sudo chmod 777 examples/Docker/data/acme_srv.cfg
          sudo sed -i "s/tnauthlist_support: False/identifier_limit: 2\nallowed_domainlist: [\"*.acme\", \"*.bar.local\"]/g" examples/Docker/data/acme_srv.cfg
          echo "[Directory]" >> examples/Docker/data/acme_srv.cfg
          echo "tos_url: https://letsencrypt.org/documents/LE-SA-v1.5-February-24-2025.pdf" >> examples/Docker/data/acme_srv.cfg

      - name: "Bring up a2c container"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Install acmeshell"
        uses: ./.github/actions/wf_specific/error_tests/acmeshell_install

      - name: "Test for Account Resource"
        uses: ./.github/actions/wf_specific/error_tests/account_checks

      - name: "Test for Order Resource"
        uses: ./.github/actions/wf_specific/error_tests/order_checks

      - name: "Parse XCA configuration from JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.XCA_CFG }}

      - name: "Setup a2c with xca_ca_handler"
        run: |
          sudo mkdir -p examples/Docker/data/xca
          sudo chmod -R 777 examples/Docker/data/xca
          sudo cp test/ca/acme2certifier-clean.xdb examples/Docker/data/xca/$XCA_DB_NAME
          sudo mkdir -p examples/Docker/data/acme_ca/certs
          sudo cp test/ca/sub-ca-key.pem test/ca/sub-ca-crl.pem test/ca/sub-ca-cert.pem test/ca/root-ca-cert.pem examples/Docker/data/acme_ca/
          sudo touch examples/Docker/data/acme_srv.cfg
          sudo chmod 777 examples/Docker/data/acme_srv.cfg
          sudo head -n -8 .github/openssl_ca_handler.py_acme_srv_default_handler.cfg > examples/Docker/data/acme_srv.cfg
          sudo echo "handler_module: acme2certifier.cahandlers.xca_ca_handler" >> examples/Docker/data/acme_srv.cfg
          sudo echo "xdb_file: volume/xca/$XCA_DB_NAME" >> examples/Docker/data/acme_srv.cfg
          sudo echo "issuing_ca_name: sub-ca1" >> examples/Docker/data/acme_srv.cfg
          sudo echo "issuing_ca_key: $XCA_ISSUING_CA" >> examples/Docker/data/acme_srv.cfg
          sudo echo "passphrase: $XCA_PASSPHRASE" >> examples/Docker/data/acme_srv.cfg
          sudo echo "ca_cert_chain_list: [\"root-ca\"]" >> examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart

      - name: "Test no CA_error forwarding"
        uses: ./.github/actions/wf_specific/error_tests/global_ca_error_forwarding
        with:
          CA_ERROR_FORWARDING: "false"

      - name: "Setup a2c with xca_ca_handler with CA_error forwarding"
        run: |
          sudo echo "ca_error_details_forward: true" >> examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart

      - name: "Test global CA_error forwarding of 'true'"
        uses: ./.github/actions/wf_specific/error_tests/global_ca_error_forwarding
        with:
          CA_ERROR_FORWARDING: "true"

      - name: "Setup a2c with xca_ca_handler with CA_error forwarding false"
        run: |
          sudo sed -i "s/ca_error_details_forward: true/ca_error_details_forward: false/g" examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart

      - name: "Test no CA_error forwarding"
        uses: ./.github/actions/wf_specific/error_tests/global_ca_error_forwarding
        with:
          CA_ERROR_FORWARDING: "false"

      - name: "Setup a2c with xca_ca_handler"
        run: |
          sudo echo -e "\n\n[EABhandler]" >> examples/Docker/data/acme_srv.cfg
          sudo echo "eab_strict_mode: False" >> examples/Docker/data/acme_srv.cfg
          sudo echo "eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler" >> examples/Docker/data/acme_srv.cfg
          sudo echo "key_file: volume/kid_profiles.json" >> examples/Docker/data/acme_srv.cfg
          sudo echo "eab_profiling: True" >> examples/Docker/data/acme_srv.cfg
          sudo sed -i "s/ca_error_details_forward: false/unknown_key: unknown_value/g" examples/Docker/data/acme_srv.cfg

          sudo cp acme2certifier/share/skeletons/eab_handler/kid_profiles.json examples/Docker/data/kid_profiles.json
          sudo sed -i '29,33d' examples/Docker/data/kid_profiles.json
          sudo sed -i '20,22d' examples/Docker/data/kid_profiles.json
          sudo chmod 777 acme2certifier/share/skeletons/eab_handler/kid_profiles.json
          sudo sed -i "s/\"profile_id\"\: \[\"profile_1\", \"profile_2\", \"profile_3\"\]/\"ca_error_details_forward\"\: \"True\"/g" examples/Docker/data/kid_profiles.json
          sudo sed -i "s/\"profile_id\"\: \"profile_2\"/\"ca_error_details_forward\"\: \"False\"/g" examples/Docker/data/kid_profiles.json
          sudo sed -i "s/\"ca_name\": \"example_ca\",/\"unknown_key\": \"unknown_value\"/g" examples/Docker/data/kid_profiles.json
          sudo sed -i "s/  \"ca_name\": \"example_ca_2\",/  \"issuing_ca_name\": \"root-ca\",\n      \"issuing_ca_key\": \"root-ca\"\n    },\n    "challenge": {\n      \"challenge_validation_disable\": \"True\"\n      \"issuing_ca_key\": \"root-ca\"/g" examples/Docker/data/kid_profiles.json
          sudo sed -i "s/example.net/acme/g" examples/Docker/data/kid_profiles.json
          sudo sed -i "s/www.example.com/www.example.local/g" examples/Docker/data/kid_profiles.json
          sudo sed -i '22,24d' examples/Docker/data/kid_profiles.json
          sudo sed -i '8,9d' examples/Docker/data/kid_profiles.json

          cat examples/Docker/data/kid_profiles.json
          cd examples/Docker/
          docker compose restart

      - name: "Test global CA_error forwarding of 'false'"
        uses: ./.github/actions/wf_specific/error_tests/global_ca_error_forwarding
        with:
          CA_ERROR_FORWARDING: "false"

      - name: "Test EAB CA_error forwarding"
        uses: ./.github/actions/wf_specific/error_tests/eab_ca_error_forwarding

      - name: "Setup a2c with xca_ca_handler with CA_error forwarding"
        run: |
          sudo echo "ca_error_details_forward: true" >> examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart

      - name: "Test global CA_error forwarding of 'true'"
        uses: ./.github/actions/wf_specific/error_tests/global_ca_error_forwarding
        with:
          CA_ERROR_FORWARDING: "true"

      - name: "Test EAB CA_error forwarding"
        uses: ./.github/actions/wf_specific/error_tests/eab_ca_error_forwarding

      - name: "Setup a2c with xca_ca_handler with CA_error forwarding false"
        run: |
          sudo sed -i "s/ca_error_details_forward: true/ca_error_details_forward: false/g" examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart

      - name: "Test global CA_error forwarding of 'false'"
        uses: ./.github/actions/wf_specific/error_tests/global_ca_error_forwarding
        with:
          CA_ERROR_FORWARDING: "false"

      - name: "Test EAB CA_error forwarding"
        uses: ./.github/actions/wf_specific/error_tests/eab_ca_error_forwarding

      - name: "[ * ] Collecting test logs"
        if: ${{ failure() }}
        run: |
          mkdir -p ${{ github.workspace }}/artifact/upload
          sudo cp -rp examples/Docker/data/ ${{ github.workspace }}/artifact/data/
          cd examples/Docker
          docker compose logs > ${{ github.workspace }}/artifact/docker-compose.log
          # sudo cp -rp acmeshell/ ${{ github.workspace }}/artifact/acmeshell/
          sudo tar -C ${{ github.workspace }}/artifact/ -cvzf ${{ github.workspace }}/artifact/upload/artifact.tar.gz docker-compose.log data

      - name: "[ * ] Uploading artifacts"
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: container-tests-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz
          path: ${{ github.workspace }}/artifact/upload/artifact.tar.gz
