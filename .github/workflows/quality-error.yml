name: Code quality - Error testing
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'
      run_id:
        description: 'Run ID of the producing workflow'
        required: true
        default: '0'
      sha:
        description: 'SHA of the commit to run the workflow on'
        required: true
        default: ''
      called_by_workflow:
        description: 'Name of the producing workflow'
        required: true
        default: 'manual-trigger'
      full_ref:
        description: 'Full git ref of the commit to run the workflow on'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ inputs.branch }}
  cancel-in-progress: true

permissions: {}

jobs:
  guard:
    permissions: {}
    uses: ./.github/workflows/_guard.yml
    with:
      sha: ${{ inputs.sha }}
      run_id: ${{ inputs.run_id }}
      branch: ${{ inputs.branch }}

  # ---------------------------------------------------------
  # Test container images downloaded from the producer run
  # ---------------------------------------------------------
  test-containers:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        dbhandler: ['wsgi', 'django']
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v7


      - name: "Channel setup"
        uses: ./.github/actions/channel_container_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          WEB_SRV: ${{ matrix.websrv }}
          DB_HANDLER: ${{ matrix.dbhandler }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Setup openssl ca_handler"
        uses: ./.github/actions/setup_openssl_cahandler
        with:
          VOLUME_DIR: "examples/Docker/data"

      - name: "Configure openssl ca_handler"
        run: |
          sudo chmod 777 examples/Docker/data/acme_srv.cfg
          sudo sed -i "s/tnauthlist_support: False/identifier_limit: 2\nallowed_domainlist: [\"*.acme\", \"*.bar.local\"]/g" examples/Docker/data/acme_srv.cfg
          echo "[Directory]" >> examples/Docker/data/acme_srv.cfg
          echo "tos_url: https://letsencrypt.org/documents/LE-SA-v1.5-February-24-2025.pdf" >> examples/Docker/data/acme_srv.cfg

      - name: "Bring up a2c container"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Install acmeshell"
        uses: ./.github/actions/wf_specific/error_tests/acmeshell_install

      - name: "Flush logs before account error checks"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container
          CONTAINER_NAME: acme-srv

      - name: "Test for Account Resource"
        uses: ./.github/actions/wf_specific/error_tests/account_checks

      - name: "Flush logs before order error checks"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container
          CONTAINER_NAME: acme-srv

      - name: "Test for Order Resource"
        uses: ./.github/actions/wf_specific/error_tests/order_checks

      - name: "Flush logs before challenge error checks"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container
          CONTAINER_NAME: acme-srv

      - name: "Test for Challenge Resource"
        uses: ./.github/actions/wf_specific/error_tests/challenge_checks

      - name: "Configure DNS-only RFC 8555 challenges"
        run: |
          sudo sed -i '/^\[Challenge\]/a http_01_support: False\ntls_alpn_01_support: False' examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart

      - name: "Test challenge type filtering (global cfg)"
        uses: ./.github/actions/wf_specific/error_tests/challenge_type_support_checks
        with:
          EXPECT_TYPES: "dns-01"
          FORBID_TYPES: "http-01,tls-alpn-01"

      - name: "Configure EAB challenge type profiling"
        run: |
          cfg=examples/Docker/data/acme_srv.cfg
          sudo sed -i '/http_01_support:/d;/tls_alpn_01_support:/d' "$cfg"
          {
            echo
            echo "[EABhandler]"
            echo "eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler"
            echo "key_file: volume/kid_profiles.json"
            echo "eab_profiling: True"
          } | sudo tee -a "$cfg" >/dev/null
          cd examples/Docker/
          docker compose restart

      - name: "Stage kid_profiles for challenge type EAB test"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/challenge_type_eab.json
          DEST: examples/Docker/data/kid_profiles.json

      - name: "Test challenge type filtering (EAB profile)"
        uses: ./.github/actions/wf_specific/error_tests/challenge_type_support_checks
        with:
          EXPECT_TYPES: "dns-01"
          FORBID_TYPES: "http-01,tls-alpn-01"
          IDENTIFIER: "chal-types-eab.bar.local"
          EAB_KID: "keyid_chaltypes"
          EAB_HMAC: "V2VfbmVlZF9hbm90aGVyX3ZlcnkfX2xvbmdfaG1hY190b19jaGVja19lYWJfZm9yX2tleWlkXzAwX2FzX2xlZ29fZW5mb3JjZXNfYW5faG1hY19sb25nZXJfdGhhbl8yNTZfYml0cw"

      - name: "Flush logs before certificate error checks"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container
          CONTAINER_NAME: acme-srv

      - name: "Test for Certificate Resource"
        uses: ./.github/actions/wf_specific/error_tests/certificate_checks

      - name: "Flush logs before resource ownership checks"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container
          CONTAINER_NAME: acme-srv

      - name: "Test cross-account resource ownership"
        uses: ./.github/actions/wf_specific/error_tests/resource_ownership_checks

      - name: "Flush logs before CSR binding checks"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container
          CONTAINER_NAME: acme-srv

      - name: "Test CSR-to-order binding"
        uses: ./.github/actions/wf_specific/error_tests/csr_binding_checks

      - name: "Parse XCA configuration from JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.XCA_CFG }}

      - name: "Setup a2c with xca_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.xca_ca_handler
          OPTIONS: |
            xdb_file: volume/xca/${{ env.XCA_DB_NAME }}
            issuing_ca_name: sub-ca1
            issuing_ca_key: ${{ env.XCA_ISSUING_CA }}
            passphrase: ${{ env.XCA_PASSPHRASE }}
            ca_cert_chain_list: ["root-ca"]

      - name: "Setup a2c with xca_ca_handler (post-cfg)"
        run: |
          sudo mkdir -p examples/Docker/data/xca
          sudo chmod -R 777 examples/Docker/data/xca
          sudo cp test/ca/acme2certifier-clean.xdb examples/Docker/data/xca/$XCA_DB_NAME
          sudo mkdir -p examples/Docker/data/acme_ca/certs
          sudo cp test/ca/sub-ca-key.pem test/ca/sub-ca-crl.pem test/ca/sub-ca-cert.pem test/ca/root-ca-cert.pem examples/Docker/data/acme_ca/
          cd examples/Docker/
          docker compose restart

      - name: "Test no CA_error forwarding"
        uses: ./.github/actions/wf_specific/error_tests/global_ca_error_forwarding
        with:
          CA_ERROR_FORWARDING: "false"

      - name: "Setup a2c with xca_ca_handler with CA_error forwarding"
        run: |
          sudo echo "ca_error_details_forward: true" >> examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart

      - name: "Test global CA_error forwarding of 'true'"
        uses: ./.github/actions/wf_specific/error_tests/global_ca_error_forwarding
        with:
          CA_ERROR_FORWARDING: "true"

      - name: "Setup a2c with xca_ca_handler with CA_error forwarding false"
        run: |
          sudo sed -i "s/ca_error_details_forward: true/ca_error_details_forward: false/g" examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart

      - name: "Test no CA_error forwarding"
        uses: ./.github/actions/wf_specific/error_tests/global_ca_error_forwarding
        with:
          CA_ERROR_FORWARDING: "false"

      - name: "Stage kid_profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/quality_error_xca.json
          DEST: examples/Docker/data/kid_profiles.json

      - name: "Setup a2c with xca_ca_handler"
        run: |
          sudo echo -e "\n\n[EABhandler]" >> examples/Docker/data/acme_srv.cfg
          sudo echo "eab_strict_mode: False" >> examples/Docker/data/acme_srv.cfg
          sudo echo "eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler" >> examples/Docker/data/acme_srv.cfg
          sudo echo "key_file: volume/kid_profiles.json" >> examples/Docker/data/acme_srv.cfg
          sudo echo "eab_profiling: True" >> examples/Docker/data/acme_srv.cfg
          sudo sed -i "s/ca_error_details_forward: false/unknown_key: unknown_value/g" examples/Docker/data/acme_srv.cfg

          cd examples/Docker/
          docker compose restart

      - name: "Test global CA_error forwarding of 'false'"
        uses: ./.github/actions/wf_specific/error_tests/global_ca_error_forwarding
        with:
          CA_ERROR_FORWARDING: "false"

      - name: "Test EAB CA_error forwarding"
        uses: ./.github/actions/wf_specific/error_tests/eab_ca_error_forwarding

      - name: "Setup a2c with xca_ca_handler with CA_error forwarding"
        run: |
          sudo sed -i "s/unknown_key: unknown_value/ca_error_details_forward: true/g" examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart

      - name: "Test global CA_error forwarding of 'true'"
        uses: ./.github/actions/wf_specific/error_tests/global_ca_error_forwarding
        with:
          CA_ERROR_FORWARDING: "true"

      - name: "Test EAB CA_error forwarding"
        uses: ./.github/actions/wf_specific/error_tests/eab_ca_error_forwarding

      - name: "Setup a2c with xca_ca_handler with CA_error forwarding false"
        run: |
          sudo sed -i "s/ca_error_details_forward: true/ca_error_details_forward: false/g" examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart

      - name: "Test global CA_error forwarding of 'false'"
        uses: ./.github/actions/wf_specific/error_tests/global_ca_error_forwarding
        with:
          CA_ERROR_FORWARDING: "false"

      - name: "Test EAB CA_error forwarding"
        uses: ./.github/actions/wf_specific/error_tests/eab_ca_error_forwarding

      - name: "Channel teardown"
        if: ${{ always() }}
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: container
          ARTIFACT_NAME: container-tests-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz
