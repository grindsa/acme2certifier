name: CA-Handler Tests - Insta Certifier (CMPv2)
on:
  workflow_call:
    inputs:
      run_id:
        description: Producer workflow run ID
        type: string
        required: true
      public_ip:
        description: Live EC2 public IP from instance_start
        type: string
        required: true

permissions: {}

jobs:
  test-cmpv2-containers:
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        websrv: ['nginx']
        dbhandler: ['wsgi', 'django']
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v7

      - name: "Channel setup"
        uses: ./.github/actions/channel_container_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          WEB_SRV: ${{ matrix.websrv }}
          DB_HANDLER: ${{ matrix.dbhandler }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Parse AWS_CFG JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.AWS_CFG }}

      - name: "Parse NCM configuration"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.NCM_CFG }}
          uppercase: 'true'

      - name: "Setup tunnel"
        uses: ./.github/actions/wf_specific/certifier_ca_handler/tunnel_setup
        with:
          SSH_USER: ${{ env.SSH_USER }}
          SSH_HOST: ${{ inputs.public_ip || env.SSH_HOST }}
          SSH_PORT: ${{ env.SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ env.SSH_KNOWN_HOSTS }}
          SSH_KEY: ${{ env.SSH_KEY }}
          NCM_API_HOST: ${{ env.NCM_API_HOST }}
          NCM_API_USER: ${{ env.NCM_API_USER }}
          NCM_API_PASSWORD: ${{ env.NCM_API_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_INSTANCE_ID: ${{ env.AWS_X64-UB-01_INSTANCE_ID }}

      - name: "Setup a2c with cmp_ca_handler (key-cert)"
        uses: ./.github/actions/wf_specific/certifier_ca_handler/reconfigure
        with:
          DEPLOYMENT_TYPE: container
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.cmp_ca_handler
          RESTART: "false"
          COPY_CA_CERTS: "false"
          CERTIFICATE_OPTIONS: |
            enrollment_timeout: 15
          OPTIONS: |
            cmp_path: pkix/
            cmp_ignore_keyusage: True
            cmp_msg_timeout: 3
            cmp_total_timeout: 5
            cmp_server: forwarder.acme:8080
            cmp_cert: volume/ra_cert.pem
            cmp_key: volume/ra_key.pem
            cmp_trusted: volume/ca_bundle.pem
            cmp_recipient: ${{ env.CMP_RECIPIENT }}
            allowed_domainlist: ["bar.local", "*.acme"]

      - name: "Stage CMP certificates"
        run: |
          set -euo pipefail
          sudo touch examples/Docker/data/ca_bundle.pem examples/Docker/data/ra_cert.pem examples/Docker/data/ra_key.pem
          sudo chmod 777 examples/Docker/data/*.pem
          printf '%s\n' "$CMP_TRUSTED" | sudo tee examples/Docker/data/ca_bundle.pem >/dev/null
          printf '%s\n' "$CMP_RA_CERT" | sudo tee examples/Docker/data/ra_cert.pem >/dev/null
          printf '%s\n' "$CMP_RA_KEY" | sudo tee examples/Docker/data/ra_key.pem >/dev/null
        env:
          CMP_RA_KEY: ${{ env.CMP_RA_KEY }}
          CMP_RA_CERT: ${{ env.CMP_RA_CERT }}
          CMP_TRUSTED: ${{ env.CMP_TRUSTED }}

      - name: "Bring up a2c container"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Check container configuration"
        uses: ./.github/actions/container_check
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Wait for ACME directory"
        uses: ./.github/actions/wait_for_directory

      - name: "Enroll acme.sh"
        run: |
          docker run --rm -i -v "$(pwd)/acme-sh":/acme.sh --network acme --name=acme-sh neilpang/acme.sh:latest --issue --server http://acme-srv --accountemail 'acme-sh@example.com' -d acme-sh.acme --alpn --standalone --debug 3 --output-insecure --force
          awk 'BEGIN {c=0;} /BEGIN CERT/{c++} { print > "cert-" c ".pem"}' < acme-sh/acme-sh.acme_ecc/ca.cer
          openssl verify -CAfile cert-2.pem -untrusted cert-1.pem acme-sh/acme-sh.acme_ecc/acme-sh.acme.cer
          sudo rm -rf acme-sh/* || true

      - name: "Allowed domainlist feature - Enroll lego (fail)"
        continue-on-error: true
        id: legofail01
        run: |
          docker run -i --rm -v $PWD/lego:/.lego/ --name lego --network acme goacme/lego run -s  https://acme-srv --tls-skip-verify -a --email "lego@example.com" -d lego --tls

      - name: "Allowed domainlist feature - check result"
        if: ${{ steps.legofail01.outcome != 'failure' }}
        run: |
          echo "legofail outcome is ${{ steps.legofail01.outcome }}"
          exit 1

      - name: "Verify allowed_domainlist error"
        uses: ./.github/actions/logs_assert
        with:
          DEPLOYMENT_TYPE: container
          PATTERN: "FQDN/SAN [^ ]+ not allowed by configuration"
          REGEX: "true"
          IGNORE_CASE: "true"

      - name: "Setup a2c with cmp_ca_handler (PSK)"
        uses: ./.github/actions/wf_specific/certifier_ca_handler/reconfigure
        with:
          DEPLOYMENT_TYPE: container
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.cmp_ca_handler
          RESTART: "false"
          COPY_CA_CERTS: "false"
          CERTIFICATE_OPTIONS: |
            enrollment_timeout: 15
          OPTIONS: |
            cmp_path: pkix/
            cmp_ignore_keyusage: True
            cmp_msg_timeout: 3
            cmp_total_timeout: 5
            cmp_server: forwarder.acme:8080
            cmp_cert: volume/ra_cert.pem
            cmp_trusted: volume/ca_bundle.pem
            cmp_recipient: ${{ env.CMP_RECIPIENT }}
            cmp_ref: ${{ env.CMP_REF }}
            cmp_secret: ${{ env.CMP_SECRET }}
            allowed_domainlist: ["bar.local", "*.acme"]

      - name: "Stage CMP certificates"
        run: |
          set -euo pipefail
          sudo touch examples/Docker/data/ca_bundle.pem examples/Docker/data/ra_cert.pem
          sudo chmod 777 examples/Docker/data/*.pem
          printf '%s\n' "$CMP_TRUSTED" | sudo tee examples/Docker/data/ca_bundle.pem >/dev/null
          printf '%s\n' "$CMP_RA_CERT" | sudo tee examples/Docker/data/ra_cert.pem >/dev/null
        env:
          CMP_RA_CERT: ${{ env.CMP_RA_CERT }}
          CMP_TRUSTED: ${{ env.CMP_TRUSTED }}

      - name: "Restart a2c"
        run: |
          cd examples/Docker/
          docker compose restart

      - name: "Wait for ACME directory"
        uses: ./.github/actions/wait_for_directory

      - name: "Enroll acme.sh"
        run: |
          docker run --rm -i -v "$(pwd)/acme-sh":/acme.sh --network acme --name=acme-sh neilpang/acme.sh:latest --issue --server http://acme-srv --accountemail 'acme-sh@example.com' -d acme-sh.acme --alpn --standalone --debug 3 --output-insecure --force
          awk 'BEGIN {c=0;} /BEGIN CERT/{c++} { print > "cert-" c ".pem"}' < acme-sh/acme-sh.acme_ecc/ca.cer
          openssl verify -CAfile cert-2.pem -untrusted cert-1.pem acme-sh/acme-sh.acme_ecc/acme-sh.acme.cer
          sudo rm -rf acme-sh/* || true

      - name: "Allowed domainlist feature - Enroll lego (fail)"
        continue-on-error: true
        id: legofail02
        run: |
          docker run -i --rm -v $PWD/lego:/.lego/ --name lego --network acme goacme/lego run -s  https://acme-srv --tls-skip-verify -a --email "lego@example.com" -d lego --tls

      - name: "Allowed domainlist feature - check result"
        if: ${{ steps.legofail02.outcome != 'failure' }}
        run: |
          echo "legofail outcome is ${{ steps.legofail02.outcome }}"
          exit 1

      - name: "Verify allowed_domainlist error"
        uses: ./.github/actions/logs_assert
        with:
          DEPLOYMENT_TYPE: container
          PATTERN: "FQDN/SAN [^ ]+ not allowed by configuration"
          REGEX: "true"
          IGNORE_CASE: "true"

      - name: "Channel teardown"
        if: ${{ always() }}
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: container
          ARTIFACT_NAME: test-cmpv2-containers-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz


  test-cmpv2-rpm:
    permissions:
      contents: read
