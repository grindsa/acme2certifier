name: CA-Handler Tests - Microsoft CA
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'
      run_id:
        description: 'Run ID of the producing workflow'
        required: true
        default: '0'
      sha:
        description: 'SHA of the commit to run the workflow on'
        required: true
        default: ''
      called_by_workflow:
        description: 'Name of the producing workflow'
        required: true
        default: 'manual-trigger'
      full_ref:
        description: 'Full git ref of the commit to run the workflow on'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ inputs.branch }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ inputs.sha != '' && inputs.run_id != '' && inputs.branch != '' && github.repository == 'grindsa/acme2certifier' }}
    steps:
      - run: |
          echo "Triggered by SHA:    $SHA"
          echo "From branch:         $BRANCH"
          echo "Producer run_id:     $RUN_ID"
        env:
          SHA: ${{ inputs.sha }}
          BRANCH: ${{ inputs.branch }}
          RUN_ID: ${{ inputs.run_id }}

  instance_start:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Shared Windows MSCA AWS host; keep in sync with instance_stop skip logic.
    if: ${{ github.repository == 'grindsa/acme2certifier' && (inputs.branch == 'master' || inputs.branch == 'devel' || contains(inputs.branch, 'wf_pip') || contains(inputs.branch, 'msca')) }}
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Parse AWS_CFG JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.AWS_CFG }}

      - name: "Start AWS instance for testing"
        uses: ./.github/actions/aws_instance_manage
        with:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_INSTANCE_ID: ${{ env.AWS_WINDOWS-01_INSTANCE_ID }}
          ACTION: "start"
          IGNORE_CURRENT_STATUS: "false"

      - name: "Wait for instance public IP + status"
        run: |
          set -euo pipefail
          INSTANCE_ID="${{ env.AWS_WINDOWS-01_INSTANCE_ID }}"
          REGION="${{ env.AWS_REGION }}"
          PUBLIC_IP=""
          for i in $(seq 1 40); do
            STATE="$(aws ec2 describe-instances --region "$REGION" --instance-ids "$INSTANCE_ID" \
              --query 'Reservations[0].Instances[0].State.Name' --output text)"
            PUBLIC_IP="$(aws ec2 describe-instances --region "$REGION" --instance-ids "$INSTANCE_ID" \
              --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)"
            echo "attempt ${i}/40 state=${STATE} public_ip=${PUBLIC_IP}"
            if [[ "$STATE" == "running" && -n "$PUBLIC_IP" && "$PUBLIC_IP" != "None" ]]; then
              break
            fi
            sleep 5
            PUBLIC_IP=""
          done
          if [[ -z "$PUBLIC_IP" || "$PUBLIC_IP" == "None" ]]; then
            echo "ERROR: instance has no public IP yet" >&2
            exit 1
          fi
          echo "MSCA instance public IP: ${PUBLIC_IP}"
          aws ec2 wait instance-status-ok --region "$REGION" --instance-ids "$INSTANCE_ID" || true


  mscertserv-test-containers:
    needs: [guard, instance_start]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        websrv: ['apache2', 'nginx']
        dbhandler: ['wsgi', 'django']
    name: "mscertsrv_handler_tests"
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Parse AWS_CFG JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.AWS_CFG }}

      - name: "Parse MSCA_CFG secrets"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.MSCA_CFG }}

      - name: "Parse GH_CFG secrets"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.GH_CFG }}

      - name: "Download and import container"
        uses: ./.github/actions/container_load
        with:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: a2c-${{ inputs.run_id }}.${{ matrix.websrv }}.${{ matrix.dbhandler }}.tar
          DESTINATION_PATH: /tmp
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Prepare container environment"
        uses: ./.github/actions/container_prep
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}
          CONTAINER_BUILD: false
          NAME_SPACE: local

      - name: "Get runner ip"
        run: |
          echo RUNNER_IP=$(ip addr show eth0 | grep -i "inet " | cut -d ' ' -f 6 | cut -d '/' -f 1) >> $GITHUB_ENV

      - name: "Setup tunnel"
        uses: ./.github/actions/wf_specific/ms_ca_handler/tunnel_setup
        with:
          SSH_USER: ${{ env.SSH_USER }}
          SSH_HOST: ${{ env.SSH_HOST }}
          SSH_PORT: ${{ env.SSH_PORT }}
          MSCA_IP: ${{ env.MSCA_IP }}
          MSCA_FQDN_WOTLD: ${{ env.MSCA_FQDN_WOTLD }}
          MSCA_FQDN: ${{ env.MSCA_FQDN }}
          SSH_KNOWN_HOSTS: ${{ env.SSH_KNOWN_HOSTS }}
          SSH_KEY: ${{ env.SSH_KEY }}
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_INSTANCE_ID: ${{ env.AWS_WINDOWS-01_INSTANCE_ID }}
          NAME_SPACE: local

      - name: "KRB Headerinfo - Setup a2c"
        uses: ./.github/actions/wf_specific/ms_ca_handler/reconfigure
        with:
          DEPLOYMENT_TYPE: container
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.mscertsrv_ca_handler
          RESTART: "false"
          COPY_CA_CERTS: "true"
          KRB5_CONF: ${{ env.KRB5_CONF }}
          CERTIFICATE_OPTIONS: |
            enrollment_timeout: 40
          ORDER_OPTIONS: |
            header_info_list: ["HTTP_USER_AGENT"]
          OPTIONS: |
            host: ${{ env.MSCA_FQDN }}
            user: ${{ env.MSCA_USER }}
            password: ${{ env.MSCA_PASSWORD }}
            auth_method: gssapi
            template: ${{ env.MSCA_TEMPLATE }}
            ca_bundle: /var/www/acme2certifier/volume/ca_certs.pem
            krb5_config: /var/www/acme2certifier/volume/krb5.conf
            verify: False
            request_timeout: 30

      - name: "Bring up a2c container"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}
          NAME_SPACE: local

      - name: "KRB Headerinfo - Enrollment"
        uses: ./.github/actions/wf_specific/ms_ca_handler/enroll_default_headerinfo
        with:
          NAME_SPACE: local

      - name: "Check container configuration"
        uses: ./.github/actions/container_check
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "KRB ACME Profiling - Setup a2c"
        uses: ./.github/actions/wf_specific/ms_ca_handler/reconfigure
        with:
          DEPLOYMENT_TYPE: container
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.mscertsrv_ca_handler
          RESTART: "true"
          COPY_CA_CERTS: "true"
          KRB5_CONF: ${{ env.KRB5_CONF }}
          CERTIFICATE_OPTIONS: |
            enrollment_timeout: 40
          ORDER_OPTIONS: |
            profiles={"WebServer-07-C": "http://foo.bar/acmeca1", "WebServer-07-S": "http://foo.bar/acmeca2", "profile3": "http://foo.bar/profile3"}
          OPTIONS: |
            host: ${{ env.MSCA_FQDN }}
            user: ${{ env.MSCA_USER }}
            password: ${{ env.MSCA_PASSWORD }}
            auth_method: gssapi
            template: ${{ env.MSCA_TEMPLATE }}
            ca_bundle: /var/www/acme2certifier/volume/ca_certs.pem
            krb5_config: /var/www/acme2certifier/volume/krb5.conf
            verify: False
            request_timeout: 30
            enrollment_config_log: True

      - name: "KRB ACME Profiling - Enrollment"
        uses: ./.github/actions/wf_specific/ms_ca_handler/enroll_acmeprofile
        with:
          NAME_SPACE: local
          DEPLOYMENT_TYPE: container

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "KRB ACME Profiling keytab - Setup a2c"
        uses: ./.github/actions/wf_specific/ms_ca_handler/reconfigure
        with:
          DEPLOYMENT_TYPE: container
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.mscertsrv_ca_handler
          RESTART: "true"
          COPY_CA_CERTS: "true"
          KRB5_CONF: ${{ env.KRB5_CONF }}
          KRB5_KEYTAB_B64: ${{ env.KRB5_KEYTAB }}
          CERTIFICATE_OPTIONS: |
            enrollment_timeout: 40
          ORDER_OPTIONS: |
            profiles={"WebServer-07-C": "http://foo.bar/acmeca1", "WebServer-07-S": "http://foo.bar/acmeca2", "profile3": "http://foo.bar/profile3"}
          OPTIONS: |
            host: ${{ env.MSCA_FQDN }}
            krb5_principal: ${{ env.KRB5_PRINCIPAL }}
            krb5_keytab: volume/krb5.keytab
            auth_method: gssapi
            template: ${{ env.MSCA_TEMPLATE }}
            ca_bundle: /var/www/acme2certifier/volume/ca_certs.pem
            krb5_config: /var/www/acme2certifier/volume/krb5.conf
            verify: False
            request_timeout: 30
            enrollment_config_log: True

      - name: "KRB ACME Profiling - Enrollment with keytab"
        uses: ./.github/actions/wf_specific/ms_ca_handler/enroll_acmeprofile
        with:
          NAME_SPACE: local
          DEPLOYMENT_TYPE: container

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "NTLM Headerinfo - Setup a2c"
        uses: ./.github/actions/wf_specific/ms_ca_handler/reconfigure
        with:
          DEPLOYMENT_TYPE: container
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.mscertsrv_ca_handler
          RESTART: "false"
          COPY_CA_CERTS: "false"
          CERTIFICATE_OPTIONS: |
            enrollment_timeout: 40
          ORDER_OPTIONS: |
            header_info_list: ["HTTP_USER_AGENT"]
          OPTIONS: |
            host: ${{ env.MSCA_FQDN }}
            user: ${{ env.MSCA_USER }}
            password: ${{ env.MSCA_PASSWORD }}
            auth_method: ntlm
            template: ${{ env.MSCA_TEMPLATE }}
            ca_bundle: /var/www/acme2certifier/volume/ca_certs.pem
            verify: False
            request_timeout: 30

      - name: "NTLM Headerinfo - Enrollment"
        uses: ./.github/actions/wf_specific/ms_ca_handler/enroll_default_headerinfo
        with:
          NAME_SPACE: local

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "NTLM allowed_domainlist - Setup a2c"
        uses: ./.github/actions/wf_specific/ms_ca_handler/reconfigure
        with:
          DEPLOYMENT_TYPE: container
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.mscertsrv_ca_handler
          RESTART: "true"
          COPY_CA_CERTS: "false"
          DISABLE_CHALLENGE_VALIDATION: "true"
          CERTIFICATE_OPTIONS: |
            enrollment_timeout: 40
          ORDER_OPTIONS: |
            allowed_domainlist: ["*.acme", "foo1.bar", "*.bar.local"]
          OPTIONS: |
            host: ${{ env.MSCA_FQDN }}
            user: ${{ env.MSCA_USER }}
            password: ${{ env.MSCA_PASSWORD }}
            auth_method: ntlm
            template: ${{ env.MSCA_TEMPLATE }}
            ca_bundle: /var/www/acme2certifier/volume/ca_certs.pem
            verify: False
            request_timeout: 30

      - name: "NTLM allowed_domainlist - Enrollment"
        uses: ./.github/actions/wf_specific/ms_ca_handler/enroll_allowed_domain_list
        with:
          NAME_SPACE: local

      - name: "Verify allowed_domainlist error"
        uses: ./.github/actions/logs_assert
        with:
          DEPLOYMENT_TYPE: container
          PATTERN: "FQDN/SAN [^ ]+ not allowed by configuration"
          REGEX: "true"

      - name: "NTLM ACME Profiling - Setup a2c"
        uses: ./.github/actions/wf_specific/ms_ca_handler/reconfigure
        with:
          DEPLOYMENT_TYPE: container
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.mscertsrv_ca_handler
          RESTART: "false"
          COPY_CA_CERTS: "false"
          CERTIFICATE_OPTIONS: |
            enrollment_timeout: 40
          ORDER_OPTIONS: |
            profiles={"WebServer-07-C": "http://foo.bar/acmeca1", "WebServer-07-S": "http://foo.bar/acmeca2", "profile3": "http://foo.bar/profile3"}
          OPTIONS: |
            host: ${{ env.MSCA_FQDN }}
            user: ${{ env.MSCA_USER }}
            password: ${{ env.MSCA_PASSWORD }}
            auth_method: ntlm
            template: ${{ env.MSCA_TEMPLATE }}
            ca_bundle: /var/www/acme2certifier/volume/ca_certs.pem
            verify: False
            request_timeout: 30
            enrollment_config_log: True

      - name: "NTLM ACME Profiling - Enrollment"
        uses: ./.github/actions/wf_specific/ms_ca_handler/enroll_acmeprofile
        with:
          NAME_SPACE: local
          DEPLOYMENT_TYPE: container

      - name: "Collect failure logs"
        if: failure()
        uses: ./.github/actions/collect_failure_logs
        with:
          DEPLOYMENT_TYPE: container
      - name: "Sanitize failure artifacts"
        if: ${{ failure() }}
        uses: ./.github/actions/sanitize_artifact_payload
        with:
          ARTIFACT_DIR: ${{ github.workspace }}/artifact
      - name: "Upload failure artifacts"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mscertsrv-container-tests-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz
          path: ${{ github.workspace }}/artifact/upload/
          retention-days: 1

      - name: "Secure cleanup"
        if: ${{ always() }}
        uses: ./.github/actions/secure_cleanup


  mscertsrv-eabprov-container-tests:
    needs: [guard, instance_start, mscertserv-test-containers]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        websrv: ['apache2', 'nginx']
        dbhandler: ['wsgi', 'django']
    name: "mscertsrv-container-eab-profiling-tests"
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Parse AWS_CFG JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.AWS_CFG }}

      - name: "Parse MSCA_CFG secrets"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.MSCA_CFG }}

      - name: "Parse GH_CFG secrets"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.GH_CFG }}

      - name: "Download and import container"
        uses: ./.github/actions/container_load
        with:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: a2c-${{ inputs.run_id }}.${{ matrix.websrv }}.${{ matrix.dbhandler }}.tar
          DESTINATION_PATH: /tmp
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Prepare container environment"
        uses: ./.github/actions/container_prep
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}
          CONTAINER_BUILD: false
          NAME_SPACE: local

      - name: "Get runner ip"
        run: |
          echo RUNNER_IP=$(ip addr show eth0 | grep -i "inet " | cut -d ' ' -f 6 | cut -d '/' -f 1) >> $GITHUB_ENV

      - name: "Setup tunnel"
        uses: ./.github/actions/wf_specific/ms_ca_handler/tunnel_setup
        with:
          SSH_USER: ${{ env.SSH_USER }}
          SSH_HOST: ${{ env.SSH_HOST }}
          SSH_PORT: ${{ env.SSH_PORT }}
          MSCA_IP: ${{ env.MSCA_IP }}
          MSCA_FQDN_WOTLD: ${{ env.MSCA_FQDN_WOTLD }}
          MSCA_FQDN: ${{ env.MSCA_FQDN }}
          SSH_KNOWN_HOSTS: ${{ env.SSH_KNOWN_HOSTS }}
          SSH_KEY: ${{ env.SSH_KEY }}
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_INSTANCE_ID: ${{ env.AWS_WINDOWS-01_INSTANCE_ID }}
          NAME_SPACE: local

      - name: "EAB headerinfo - Setup a2c"
        uses: ./.github/actions/wf_specific/ms_ca_handler/reconfigure
        with:
          DEPLOYMENT_TYPE: container
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.mscertsrv_ca_handler
          RESTART: "false"
          COPY_CA_CERTS: "true"
          KRB5_CONF: ${{ env.KRB5_CONF }}
          KRB5_KEYTAB_B64: ${{ env.KRB5_KEYTAB }}
          CERTIFICATE_OPTIONS: |
            enrollment_timeout: 40
          ORDER_OPTIONS: |
            header_info_list: ["HTTP_USER_AGENT"]
          EXTRA_SECTIONS: |
            [EABhandler]
            eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler
            key_file: volume/kid_profiles.json
            eab_profiling: True
          OPTIONS: |
            host: ${{ env.MSCA_FQDN }}
            krb5_principal: ${{ env.KRB5_PRINCIPAL }}
            krb5_keytab: volume/krb5.keytab
            auth_method: gssapi
            template: ${{ env.MSCA_TEMPLATE }}
            ca_bundle: /var/www/acme2certifier/volume/ca_certs.pem
            krb5_config: /var/www/acme2certifier/volume/krb5.conf
            verify: False
            request_timeout: 30

      - name: "Stage kid profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/msca.json
          DEST: examples/Docker/data/kid_profiles.json

      - name: "Bring up a2c container"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}
          NAME_SPACE: local

      - name: "EAB headerinfo - Enrollment"
        uses: ./.github/actions/wf_specific/ms_ca_handler/enroll_eab
        with:
          NAME_SPACE: local

      - name: "Check container configuration"
        uses: ./.github/actions/container_check
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "EAB ACME Profiling - Setup a2c"
        uses: ./.github/actions/wf_specific/ms_ca_handler/reconfigure
        with:
          DEPLOYMENT_TYPE: container
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.mscertsrv_ca_handler
          RESTART: "true"
          COPY_CA_CERTS: "true"
          KRB5_CONF: ${{ env.KRB5_CONF }}
          CERTIFICATE_OPTIONS: |
            enrollment_timeout: 40
          ORDER_OPTIONS: |
            profiles={"WebServer-07-C": "http://foo.bar/profile1", "WebServer-07-S": "http://foo.bar/profile2", "profile3": "http://foo.bar/profile3"}
          EXTRA_SECTIONS: |
            [EABhandler]
            eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler
            key_file: volume/kid_profiles.json
            eab_profiling: True
          OPTIONS: |
            host: ${{ env.MSCA_FQDN }}
            user: ${{ env.MSCA_USER }}
            password: ${{ env.MSCA_PASSWORD }}
            auth_method: gssapi
            template: ${{ env.MSCA_TEMPLATE }}
            ca_bundle: /var/www/acme2certifier/volume/ca_certs.pem
            krb5_config: /var/www/acme2certifier/volume/krb5.conf
            verify: False
            request_timeout: 30
            enrollment_config_log: True

      - name: "Stage kid profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/msca.json
          DEST: examples/Docker/data/kid_profiles.json

      - name: "EAB ACME Profiling - Enrollment"
        uses: ./.github/actions/wf_specific/ms_ca_handler/enroll_eab_acmeprofile
        with:
          NAME_SPACE: local
          DEPLOYMENT_TYPE: container

      - name: "Collect failure logs"
        if: failure()
        uses: ./.github/actions/collect_failure_logs
        with:
          DEPLOYMENT_TYPE: container
      - name: "Sanitize failure artifacts"
        if: ${{ failure() }}
        uses: ./.github/actions/sanitize_artifact_payload
        with:
          ARTIFACT_DIR: ${{ github.workspace }}/artifact
      - name: "Upload failure artifacts"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mscertsrv-eabp-container-tests-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz
          path: ${{ github.workspace }}/artifact/upload/
          retention-days: 1

      - name: "Secure cleanup"
        if: ${{ always() }}
        uses: ./.github/actions/secure_cleanup


  mswcce-test-containers:
    needs: [guard, instance_start]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        websrv: ['apache2', 'nginx']
        dbhandler: ['wsgi', 'django']
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Parse AWS_CFG JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.AWS_CFG }}

      - name: "Parse MSCA_CFG secrets"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.MSCA_CFG }}

      - name: "Parse GH_CFG secrets"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.GH_CFG }}

      - name: "Download and import container"
        uses: ./.github/actions/container_load
        with:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: a2c-${{ inputs.run_id }}.${{ matrix.websrv }}.${{ matrix.dbhandler }}.tar
          DESTINATION_PATH: /tmp
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Prepare container environment"
        uses: ./.github/actions/container_prep
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}
          CONTAINER_BUILD: false
          NAME_SPACE: acme

      - name: "Get runner ip"
        run: |
          echo RUNNER_IP=$(ip addr show eth0 | grep -i "inet " | cut -d ' ' -f 6 | cut -d '/' -f 1) >> $GITHUB_ENV

      - name: "Setup dnsmasq"
