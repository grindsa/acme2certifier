name: CA-Handler Tests - Microsoft CA
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'
      run_id:
        description: 'Run ID of the producing workflow'
        required: true
        default: '0'
      sha:
        description: 'SHA of the commit to run the workflow on'
        required: true
        default: ''
      called_by_workflow:
        description: 'Name of the producing workflow'
        required: true
        default: 'manual-trigger'
      full_ref:
        description: 'Full git ref of the commit to run the workflow on'
        required: false
        default: ''

concurrency:
  # Shared Windows MSCA EC2: serialize across branches so master+devel cannot start the same box.
  group: msca-ec2
  cancel-in-progress: false

permissions: {}

jobs:
  guard:
    permissions: {}
    uses: ./.github/workflows/_guard.yml
    with:
      sha: ${{ inputs.sha }}
      run_id: ${{ inputs.run_id }}
      branch: ${{ inputs.branch }}

  instance_start:
    permissions:
      contents: read
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Shared Windows MSCA AWS host; keep in sync with instance_stop skip logic.
    if: ${{ github.repository == 'grindsa/acme2certifier' && (inputs.branch == 'master' || inputs.branch == 'devel' || contains(inputs.branch, 'wf_pip') || contains(inputs.branch, 'msca')) }}
    outputs:
      # Live EC2 public IP captured after start; prefer over DNS (often stale post stop/start).
      public_ip: ${{ steps.wait_ip.outputs.public_ip }}
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v7

      - name: "Parse AWS_CFG JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.AWS_CFG }}

      - name: "Parse MSCA_CFG secrets"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.MSCA_CFG }}

      - name: "Start AWS instance for testing"
        uses: ./.github/actions/aws_instance_manage
        with:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_INSTANCE_ID: ${{ env.AWS_WINDOWS-01_INSTANCE_ID }}
          ACTION: "start"
          IGNORE_CURRENT_STATUS: "false"

      - name: "Wait for instance public IP + status"
        id: wait_ip
        run: |
          set -euo pipefail
          # Prefer the live EC2 public IP: DNS (SSH_HOST) can lag after stop/start.
          INSTANCE_ID="${{ env.AWS_WINDOWS-01_INSTANCE_ID }}"
          REGION="${{ env.AWS_REGION }}"
          DNS_HOST="${{ env.SSH_HOST }}"
          DNS_IP="$(getent ahostsv4 "$DNS_HOST" | awk '{print $1; exit}' || true)"
          echo "SSH_HOST DNS ${DNS_HOST} -> ${DNS_IP:-unresolved}"

          PUBLIC_IP=""
          for i in $(seq 1 40); do
            STATE="$(aws ec2 describe-instances --region "$REGION" --instance-ids "$INSTANCE_ID" \
              --query 'Reservations[0].Instances[0].State.Name' --output text)"
            PUBLIC_IP="$(aws ec2 describe-instances --region "$REGION" --instance-ids "$INSTANCE_ID" \
              --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)"
            echo "attempt ${i}/40 state=${STATE} public_ip=${PUBLIC_IP}"
            if [[ "$STATE" == "running" && -n "$PUBLIC_IP" && "$PUBLIC_IP" != "None" ]]; then
              break
            fi
            sleep 5
            PUBLIC_IP=""
          done
          if [[ -z "$PUBLIC_IP" || "$PUBLIC_IP" == "None" ]]; then
            echo "ERROR: instance has no public IP yet" >&2
            exit 1
          fi
          if [[ -n "$DNS_IP" && "$DNS_IP" != "$PUBLIC_IP" ]]; then
            echo "WARNING: DNS ${DNS_IP} != EC2 public IP ${PUBLIC_IP}; using EC2 IP for SSH"
          fi
          echo "MSCA instance public IP: ${PUBLIC_IP}"
          echo "public_ip=${PUBLIC_IP}" >> "$GITHUB_OUTPUT"
          aws ec2 wait instance-status-ok --region "$REGION" --instance-ids "$INSTANCE_ID" || true


  # mscertsrv and mswcce run in parallel on the shared Windows box.
  # Children are workflow_call-only so the broker cannot start/stop the EC2.
  mscertsrv:
    name: mscertsrv
    permissions:
      contents: read
      actions: write
    needs: [guard, instance_start]
    secrets: inherit
    uses: ./.github/workflows/_cahandler-msca-mscertsrv.yml
    with:
      run_id: ${{ inputs.run_id }}
      public_ip: ${{ needs.instance_start.outputs.public_ip }}

  mswcce:
    name: mswcce
    permissions:
      contents: read
      actions: write
    needs: [guard, instance_start]
    secrets: inherit
    uses: ./.github/workflows/_cahandler-msca-mswcce.yml
    with:
      run_id: ${{ inputs.run_id }}
      public_ip: ${{ needs.instance_start.outputs.public_ip }}

  instance_stop:
    permissions:
      contents: read
    needs: [guard, instance_start, mscertsrv, mswcce]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ always() && needs.instance_start.result != 'skipped' && github.repository == 'grindsa/acme2certifier' }}
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v7

      - name: "Parse AWS_CFG JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.AWS_CFG }}

      - name: "Stop AWS instance for testing"
        uses: ./.github/actions/aws_instance_manage
        with:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_INSTANCE_ID: ${{ env.AWS_WINDOWS-01_INSTANCE_ID }}
          ACTION: "stop"
          IGNORE_CURRENT_STATUS: "false"
