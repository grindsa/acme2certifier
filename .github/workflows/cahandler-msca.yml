    timeout-minutes: 90
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        websrv: ['nginx']
        mode: ['wsgi', 'django']
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Parse AWS_CFG JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.AWS_CFG }}

      - name: "Parse MSCA_CFG secrets"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.MSCA_CFG }}

      - name: "Parse GH_CFG secrets"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.GH_CFG }}

      - name: "Prepare Ubuntu environment"
        if: matrix.mode == 'wsgi'
        uses: ./.github/actions/deb_prep
        with:
          DEB_BUILD: false

      - name: "Prepare Ubuntu environment"
        if: matrix.mode == 'django'
        uses: ./.github/actions/deb_prep
        with:
          DEB_BUILD: false
          DJANGO_DB: psql

      - name: "Download DEB artifact by name from build run"
        uses: ./.github/actions/download_artifact
        with:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: acme2certifier-${{ inputs.run_id }}-1_all.deb
          DESTINATION_PATH: data/
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Get runner ip"
        run: |
          echo RUNNER_IP=$(ip addr show eth0 | grep -i "inet " | cut -d ' ' -f 6 | cut -d '/' -f 1) >> $GITHUB_ENV

      - name: "Setup dnsmasq"
        uses: ./.github/actions/wf_specific/ms_ca_handler/dnsmasq_setup
        with:
          RUNNER_IP: ${{ env.RUNNER_IP }}
          MSCA_FQDN: ${{ env.MSCA_FQDN }}
          MSCA_ADS_DOMAIN: ${{ env.MSCA_ADS_DOMAIN }}
          WES_HOST: ${{ env.WES_HOST }}

      - name: "Allow dnsmasq non-local queries"
        run: |
          sudo sed -i 's/--local-service//' /etc/init.d/dnsmasq || true
          sudo systemctl restart dnsmasq || true

      - name: "Setup tunnel"
        uses: ./.github/actions/wf_specific/ms_ca_handler/tunnel_setup
        with:
          SSH_USER: ${{ env.SSH_USER }}
          SSH_HOST: ${{ env.SSH_HOST }}
          SSH_PORT: ${{ env.SSH_PORT }}
          MSCA_IP: ${{ env.MSCA_IP }}
          MSCA_FQDN_WOTLD: ${{ env.MSCA_FQDN_WOTLD }}
          MSCA_FQDN: ${{ env.MSCA_FQDN }}
          SSH_KNOWN_HOSTS: ${{ env.SSH_KNOWN_HOSTS }}
          SSH_KEY: ${{ env.SSH_KEY }}
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_INSTANCE_ID: ${{ env.AWS_WINDOWS-01_INSTANCE_ID }}

      - name: "NTLM - Setup a2c"
        uses: ./.github/actions/wf_specific/ms_ca_handler/reconfigure
        with:
          DEPLOYMENT_TYPE: deb
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.msicpr_ca_handler
          RESTART: "false"
          COPY_CA_CERTS: "true"
          CA_CERTS_CONTENT: ${{ env.MSCA_CA_BUNDLE }}
          WEBSRV: ${{ matrix.websrv }}
          CERTIFICATE_OPTIONS: |
            enrollment_timeout: 40
          ORDER_OPTIONS: |
            header_info_list: ["HTTP_USER_AGENT"]
          OPTIONS: |
            host: ${{ env.RUNNER_IP }}
            user: ${{ env.MSCA_USER }}
            password: ${{ env.MSCA_PASSWORD }}
            template: ${{ env.MSCA_TEMPLATE }}
            ca_name: ${{ env.MSCA_NAME }}
            target_domain: ${{ env.MSCA_ADS_DOMAIN }}
            ca_bundle: /var/www/acme2certifier/volume/acme_ca/ca_certs.pem
            timeout: 20

      - name: "Install a2c DEB"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh install ${{ matrix.websrv }} -m ${{ matrix.mode }}
          docker exec acme-srv apt-get install -y python3-impacket

      - name: "NTLM - Enrollment"
        uses: ./.github/actions/wf_specific/ms_ca_handler/enroll_default_headerinfo

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: deb

      - name: "KRB - Setup a2c"
        uses: ./.github/actions/wf_specific/ms_ca_handler/reconfigure
        with:
          DEPLOYMENT_TYPE: deb
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.msicpr_ca_handler
          RESTART: "true"
          COPY_CA_CERTS: "true"
          CA_CERTS_CONTENT: ${{ env.MSCA_CA_BUNDLE }}
          WEBSRV: ${{ matrix.websrv }}
          CERTIFICATE_OPTIONS: |
            enrollment_timeout: 40
          ORDER_OPTIONS: |
            header_info_list: ["HTTP_USER_AGENT"]
          OPTIONS: |
            host: ${{ env.MSCA_FQDN }}
            user: ${{ env.MSCA_USER }}
            password: ${{ env.MSCA_PASSWORD }}
            template: ${{ env.MSCA_TEMPLATE }}
            ca_name: ${{ env.MSCA_NAME }}
            target_domain: ${{ env.MSCA_ADS_DOMAIN }}
            domain_controller: ${{ env.RUNNER_IP }}
            ca_bundle: /var/www/acme2certifier/volume/acme_ca/ca_certs.pem
            timeout: 20
            use_kerberos: True

      - name: "KRB - Enrollment"
        uses: ./.github/actions/wf_specific/ms_ca_handler/enroll_default_headerinfo

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: deb

      - name: "KRB allowed_domainlist - Setup a2c"
        uses: ./.github/actions/wf_specific/ms_ca_handler/reconfigure
        with:
          DEPLOYMENT_TYPE: deb
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.msicpr_ca_handler
          RESTART: "true"
          COPY_CA_CERTS: "false"
          WEBSRV: ${{ matrix.websrv }}
          DISABLE_CHALLENGE_VALIDATION: "true"
          CERTIFICATE_OPTIONS: |
            enrollment_timeout: 40
          ORDER_OPTIONS: |
            allowed_domainlist: ["*.acme", "foo1.bar", "*.bar.local"]
          OPTIONS: |
            host: ${{ env.MSCA_FQDN }}
            user: ${{ env.MSCA_USER }}
            password: ${{ env.MSCA_PASSWORD }}
            template: ${{ env.MSCA_TEMPLATE }}
            ca_name: ${{ env.MSCA_NAME }}
            target_domain: ${{ env.MSCA_ADS_DOMAIN }}
            domain_controller: ${{ env.RUNNER_IP }}
            ca_bundle: /var/www/acme2certifier/volume/acme_ca/ca_certs.pem
            timeout: 20
            use_kerberos: True

      - name: "KRB allowed_domainlist - Enrollment"
        uses: ./.github/actions/wf_specific/ms_ca_handler/enroll_allowed_domain_list

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: deb

      - name: "ACME Profiling keytab - Setup a2c"
        uses: ./.github/actions/wf_specific/ms_ca_handler/reconfigure
        with:
          DEPLOYMENT_TYPE: deb
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.msicpr_ca_handler
          RESTART: "true"
          COPY_CA_CERTS: "false"
          WEBSRV: ${{ matrix.websrv }}
          KRB5_CONF: ${{ env.KRB5_CONF }}
          KRB5_KEYTAB_B64: ${{ env.KRB5_KEYTAB }}
          CERTIFICATE_OPTIONS: |
            enrollment_timeout: 40
          ORDER_OPTIONS: |
            profiles={"WebServer-07-C": "http://foo.bar/acmeca1", "WebServer-07-S": "http://foo.bar/acmeca2", "profile3": "http://foo.bar/profile3"}
          OPTIONS: |
            host: ${{ env.MSCA_FQDN }}
            krb5_principal: ${{ env.KRB5_PRINCIPAL }}
            krb5_keytab: /var/www/acme2certifier/volume/acme_ca/krb5.keytab
            krb5_config: /var/www/acme2certifier/volume/acme_ca/krb5.conf
            krb5_kinit_path: /usr/bin/kinit
            template: ${{ env.MSCA_TEMPLATE }}
            ca_name: ${{ env.MSCA_NAME }}
            target_domain: ${{ env.MSCA_ADS_DOMAIN }}
            domain_controller: ${{ env.RUNNER_IP }}
            ca_bundle: /var/www/acme2certifier/volume/acme_ca/ca_certs.pem
            timeout: 20
            use_kerberos: True
            enrollment_config_log: True

      - name: "ACME Profiling keytab - Enrollment"
        uses: ./.github/actions/wf_specific/ms_ca_handler/enroll_acmeprofile
        with:
          DEPLOYMENT_TYPE: deb

      - name: "Collect failure logs"
        if: failure()
        uses: ./.github/actions/collect_failure_logs
        with:
          DEPLOYMENT_TYPE: deb
          WEBSRV: ${{ matrix.websrv }}
      - name: "Sanitize failure artifacts"
        if: ${{ failure() }}
        uses: ./.github/actions/sanitize_artifact_payload
        with:
          ARTIFACT_DIR: ${{ github.workspace }}/artifact
      - name: "Upload failure artifacts"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mswcce-test-deb-${{ matrix.websrv }}-${{ matrix.mode }}.tar.gz
          path: ${{ github.workspace }}/artifact/upload/
          retention-days: 1

      - name: "Secure cleanup"
        if: ${{ always() }}
        uses: ./.github/actions/secure_cleanup


  instance_stop:
    needs: [guard, instance_start, mscertserv-test-containers, mscertsrv-eabprov-container-tests, mswcce-test-containers, mswcce-eab-container-tests, mscertsrv-without-impacket_tests, mscertsrv-test-rpm, mscertsrv-eabprofile-test-rpm, mswcce-tests-rpm, mswcce-eab-tests-rpm, mscertsrv-test-deb, mswcce-test-deb]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ always() && needs.instance_start.result != 'skipped' && github.repository == 'grindsa/acme2certifier' }}
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Parse AWS_CFG JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.AWS_CFG }}

      - name: "Stop AWS instance for testing"
        uses: ./.github/actions/aws_instance_manage
        with:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_INSTANCE_ID: ${{ env.AWS_WINDOWS-01_INSTANCE_ID }}
          ACTION: "stop"
          IGNORE_CURRENT_STATUS: "false"
