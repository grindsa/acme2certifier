name: Release and push images to Docker Hub / GHCR

on:
  push:
    branches: ["master"]
  workflow_dispatch: {}
  schedule:
    - cron: "0 01 * * 6"

concurrency:
  group: release-push-images-${{ github.repository }}
  cancel-in-progress: false

jobs:
  create_release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    outputs:
      tag_n: ${{ steps.versions.outputs.tag_n }}
      app_name: ${{ steps.versions.outputs.app_name }}
      created_release: ${{ steps.versions.outputs.created_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get latest published release tag
        id: latest_release
        uses: oprypin/find-latest-tag@v1
        with:
          repository: ${{ github.repository }}
          releases-only: true

      - name: Parse EMAIL configuration from JSON secret
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.EMAILADDRESSES_CFG }}

      - name: Resolve version from version.py
        id: versions
        run: |
          set -euo pipefail
          APP_NAME=$(echo "${GITHUB_REPOSITORY}" | awk -F / '{print $2}')
          TAG_N=$(grep -i '__version__' acme2certifier/acme_srv/version.py | head -n 1 | sed 's/__version__ = //g' | sed 's/"//g' | tr -d "[:space:]")
          DB_VERSION=$(grep -i '__dbversion__' acme2certifier/acme_srv/version.py | head -n 1 | sed "s/__dbversion__ = //g" | sed "s/'//g" | tr -d "[:space:]")
          FIXTURE_VERSION=$(awk '/name: dbversion/{getline; print $2}' acme2certifier/django_app/fixture/status.yaml | tr -d "'")

          echo "app_name=${APP_NAME}" >> "${GITHUB_OUTPUT}"
          echo "tag_n=${TAG_N}" >> "${GITHUB_OUTPUT}"
          echo "db_version=${DB_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "fixture_version=${FIXTURE_VERSION}" >> "${GITHUB_OUTPUT}"

          if [[ "${TAG_N}" != "${LATEST_RELEASE}" ]]; then
            echo "created_release=true" >> "${GITHUB_OUTPUT}"
          else
            echo "created_release=false" >> "${GITHUB_OUTPUT}"
          fi

          echo "version.py=${TAG_N} latest_release=${LATEST_RELEASE} db=${DB_VERSION} fixture=${FIXTURE_VERSION}"
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          LATEST_RELEASE: ${{ steps.latest_release.outputs.tag }}

      - name: Check fixture version
        if: steps.versions.outputs.db_version != steps.versions.outputs.fixture_version
        run: |
          echo "Fixture version (${{ steps.versions.outputs.fixture_version }}) != db version (${{ steps.versions.outputs.db_version }})"
          exit 1

      - name: Prepare RPM packaging inputs
        if: steps.versions.outputs.created_release == 'true'
        run: |
          set -euo pipefail
          sudo sed -i "s/__version__/${TAG_N}/g" examples/install_scripts/rpm/acme2certifier.spec
          sudo sed -i "s/\/var\/www\/acme2certifier\/volume/\/etc\/nginx/g" acme2certifier/share/nginx/nginx_acme_srv_ssl.conf
          git config --global user.email "${EMAIL}"
          git config --global user.name "rpm update"
          git add acme2certifier/share/nginx examples/install_scripts/rpm/acme2certifier.spec
          git commit -a -m "rpm update" || true
        env:
          TAG_N: ${{ steps.versions.outputs.tag_n }}
          EMAIL: ${{ env.EMAIL }}

      - name: Build RPM package
        id: rpm_build
        if: steps.versions.outputs.created_release == 'true'
        uses: grindsa/rpmbuild@alma9
        with:
          spec_file: examples/install_scripts/rpm/acme2certifier.spec

      - name: Prepare and build Debian package
        if: steps.versions.outputs.created_release == 'true'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          # Match debian/control Build-Depends (+ dpkg tooling); keep in sync with .github/actions/deb_build.
          sudo apt-get -y install --no-install-recommends \
            build-essential dpkg-dev fakeroot debhelper \
            dh-python pybuild-plugin-pyproject \
            python3-all python3-setuptools python3-build
          cp -R examples/install_scripts/debian ./
          sudo sed -i "s/__version__/${TAG_N}/g" debian/changelog
          chmod +x debian/rules debian/patch_apache_for_deb.py
          REPO_DIR="$(pwd)"
          dpkg-buildpackage -uc -us
          cp "../acme2certifier_${TAG_N}-1_all.deb" "${REPO_DIR}/acme2certifier_${TAG_N}-1_all.deb"
          ls -la "${REPO_DIR}/acme2certifier_${TAG_N}-1_all.deb"
        env:
          TAG_N: ${{ steps.versions.outputs.tag_n }}

      - name: Create GitHub release and upload packages
        if: steps.versions.outputs.created_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versions.outputs.tag_n }}
          name: ${{ steps.versions.outputs.app_name }} ${{ steps.versions.outputs.tag_n }}
          body: |
            [Changelog](https://github.com/grindsa/acme2certifier/blob/master/CHANGES.md)
          files: |
            acme2certifier_${{ steps.versions.outputs.tag_n }}-1_all.deb
            ${{ steps.rpm_build.outputs.rpm_dir_path }}noarch/acme2certifier-${{ steps.versions.outputs.tag_n }}-1.0.noarch.rpm
            ${{ steps.rpm_build.outputs.source_rpm_path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  resolve_versions:
    name: Resolve supported tags
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: create_release
    if: github.repository == 'grindsa/acme2certifier'
    outputs:
      tag_n: ${{ steps.resolve.outputs.tag_n }}
      tag_n1: ${{ steps.resolve.outputs.tag_n1 }}
      tags_json: ${{ steps.resolve.outputs.tags_json }}
      app_name: ${{ steps.resolve.outputs.app_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Resolve N and N-1 tags
        id: resolve
        uses: ./.github/actions/resolve_supported_tags
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  build_and_push_n1:
    name: Build and push N-1 images
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [create_release, resolve_versions]
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: [apache2, nginx]
        dbhandler: [wsgi, django]
    steps:
      - name: Checkout workflow sources
        uses: actions/checkout@v6

      - name: Parse software repository secrets
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.SWREPO_CFG }}

      - name: Build and push ${{ needs.resolve_versions.outputs.tag_n1 }}-${{ matrix.websrv }}-${{ matrix.dbhandler }}
        uses: ./.github/actions/image_build_push
        with:
          tag: ${{ needs.resolve_versions.outputs.tag_n1 }}
          websrv: ${{ matrix.websrv }}
          dbhandler: ${{ matrix.dbhandler }}
          tag_n: ${{ needs.resolve_versions.outputs.tag_n }}
          dockerhub_user: ${{ env.DOCKERHUB_USER }}
          dockerhub_token: ${{ env.DOCKERHUB_TOKEN }}
          ghcr_user: ${{ env.GHCR_USER }}
          ghcr_token: ${{ env.GHCR_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  build_and_push_n:
    name: Build and push N images
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [resolve_versions, build_and_push_n1]
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: [apache2, nginx]
        dbhandler: [wsgi, django]
    steps:
      - name: Checkout workflow sources
        uses: actions/checkout@v6

      - name: Parse software repository secrets
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.SWREPO_CFG }}

      - name: Build and push ${{ needs.resolve_versions.outputs.tag_n }}-${{ matrix.websrv }}-${{ matrix.dbhandler }}
        uses: ./.github/actions/image_build_push
        with:
          tag: ${{ needs.resolve_versions.outputs.tag_n }}
          websrv: ${{ matrix.websrv }}
          dbhandler: ${{ matrix.dbhandler }}
          tag_n: ${{ needs.resolve_versions.outputs.tag_n }}
          dockerhub_user: ${{ env.DOCKERHUB_USER }}
          dockerhub_token: ${{ env.DOCKERHUB_TOKEN }}
          ghcr_user: ${{ env.GHCR_USER }}
          ghcr_token: ${{ env.GHCR_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  test_amd64:
    name: Test amd64 images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [resolve_versions, build_and_push_n]
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: [apache2, nginx]
        dbhandler: [wsgi, django]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Parse software repository secrets
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.SWREPO_CFG }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_USER }}
          password: ${{ env.GHCR_TOKEN }}

      - name: Enrollment test
        uses: ./.github/actions/image_enrollment_test
        with:
          image: ghcr.io/grindsa/acme2certifier:${{ needs.resolve_versions.outputs.tag_n }}-${{ matrix.websrv }}-${{ matrix.dbhandler }}
          hostname_suffix: -${{ matrix.websrv }}-${{ matrix.dbhandler }}-amd64
          name_space: acme-${{ matrix.websrv }}-${{ matrix.dbhandler }}
          container_name: acme-srv

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: amd64-${{ matrix.websrv }}-${{ matrix.dbhandler }}
          path: ${{ github.workspace }}/artifact/upload/
          if-no-files-found: ignore

  test_arm64:
    name: Test arm64 images
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    needs: [resolve_versions, build_and_push_n]
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: [apache2, nginx]
        dbhandler: [wsgi, django]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Parse software repository secrets
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.SWREPO_CFG }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_USER }}
          password: ${{ env.GHCR_TOKEN }}

      - name: Enrollment test
        uses: ./.github/actions/image_enrollment_test
        with:
          image: ghcr.io/grindsa/acme2certifier:${{ needs.resolve_versions.outputs.tag_n }}-${{ matrix.websrv }}-${{ matrix.dbhandler }}
          hostname_suffix: -${{ matrix.websrv }}-${{ matrix.dbhandler }}-arm64
          name_space: acme-${{ matrix.websrv }}-${{ matrix.dbhandler }}
          container_name: acme-srv

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-${{ matrix.websrv }}-${{ matrix.dbhandler }}
          path: ${{ github.workspace }}/artifact/upload/
          if-no-files-found: ignore

  sbom_update:
    name: Update SBOMs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [resolve_versions, test_amd64]
    if: github.repository == 'grindsa/acme2certifier' && needs.test_amd64.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        websrv: [apache2, nginx]
        dbhandler: [wsgi, django]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Parse GitHub secrets
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.GH_CFG }}

      - name: Parse EMAIL configuration
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.EMAILADDRESSES_CFG }}

      - name: Parse software repository secrets
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.SWREPO_CFG }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_USER }}
          password: ${{ env.GHCR_TOKEN }}

      - name: Install syft (verified)
        env:
          SYFT_VERSION: v1.14.0
        run: |
          set -euo pipefail
          ARCH="$(uname -m)"
          case "${ARCH}" in
            x86_64) ARCH="amd64" ;;
            aarch64|arm64) ARCH="arm64" ;;
            *) echo "Unsupported architecture: ${ARCH}" >&2; exit 1 ;;
          esac

          BASE_URL="https://github.com/anchore/syft/releases/download/${SYFT_VERSION}"
          TARBALL="syft_${SYFT_VERSION#v}_linux_${ARCH}.tar.gz"
          CHECKSUMS="syft_${SYFT_VERSION#v}_checksums.txt"

          curl -fsSLO "${BASE_URL}/${TARBALL}"
          curl -fsSLO "${BASE_URL}/${CHECKSUMS}"
          grep " ${TARBALL}\$" "${CHECKSUMS}" | sha256sum -c -

          tar -xzf "${TARBALL}" syft
          sudo install -m 0755 syft /usr/local/bin/syft
          syft version

      - name: Retrieve SBOM repo
        run: git clone "https://${GH_USER}:${GH_SBOM_REPO_TOKEN}@github.com/${GH_USER}/sbom" /tmp/sbom
        env:
          GH_USER: ${{ env.GH_USER }}
          GH_SBOM_REPO_TOKEN: ${{ env.GH_SBOM_REPO_TOKEN }}

      - name: Generate SBOM
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/grindsa/acme2certifier:${WEBSRV}-${DBHANDLER}"
          mkdir -p /tmp/sbom/sbom/acme2certifier
          syft "${IMAGE}" > "/tmp/sbom/sbom/acme2certifier/acme2certifier-${WEBSRV}-${DBHANDLER}_sbom.txt"
          syft "${IMAGE}" -o json > "/tmp/sbom/sbom/acme2certifier/acme2certifier-${WEBSRV}-${DBHANDLER}_sbom.json"
        env:
          WEBSRV: ${{ matrix.websrv }}
          DBHANDLER: ${{ matrix.dbhandler }}

      - name: Upload SBOM changes
        continue-on-error: true
        run: |
          set -euo pipefail
          cd /tmp/sbom
          git config user.email "${EMAIL}"
          git config user.name "SBOM Generator"
          git add sbom/acme2certifier/
          git diff --cached --quiet && echo "No SBOM changes" && exit 0
          git commit -m "SBOM update"
          git push
        env:
          EMAIL: ${{ env.EMAIL }}
