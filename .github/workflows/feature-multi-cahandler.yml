name: Feature Tests - Multi-CAhandler
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'
      run_id:
        description: 'Run ID of the producing workflow'
        required: true
        default: '0'
      sha:
        description: 'SHA of the commit to run the workflow on'
        required: true
        default: ''
      called_by_workflow:
        description: 'Name of the producing workflow'
        required: true
        default: 'manual-trigger'
      full_ref:
        description: 'Full git ref of the commit to run the workflow on'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ inputs.branch }}
  cancel-in-progress: true

permissions: {}

jobs:
  guard:
    if: github.repository == 'grindsa/acme2certifier'
    permissions: {}
    uses: ./.github/workflows/_guard.yml
    with:
      sha: ${{ inputs.sha }}
      run_id: ${{ inputs.run_id }}
      branch: ${{ inputs.branch }}

  test-containers:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        dbhandler: ['wsgi', 'django']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v7

      - name: "Channel setup"
        uses: ./.github/actions/channel_container_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          WEB_SRV: ${{ matrix.websrv }}
          DB_HANDLER: ${{ matrix.dbhandler }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          NAME_SPACE: acme

      - name: "Parse XCA configuration from JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.XCA_CFG }}

      - name: "Instanciate vault"
        uses: ./.github/actions/wf_specific/vault_ca_handler/vault_prep
        with:
          RUNNER_IP: ${{ env.RUNNER_IP }}
          WORKING_DIR: ${{ github.workspace }}/examples/Docker

      - name: "Stage CA material"
        uses: ./.github/actions/wf_specific/multi_cahandler/stage_assets
        with:
          VOLUME_DIR: examples/Docker/data
          XCA_DB_NAME: ${{ env.XCA_DB_NAME }}

      - name: "Setup multi-CAhandler config"
        uses: ./.github/actions/wf_specific/multi_cahandler/setup_cfg
        with:
          VOLUME_DIR: examples/Docker/data
          XCA_DB_NAME: ${{ env.XCA_DB_NAME }}
          XCA_ISSUING_CA: ${{ env.XCA_ISSUING_CA }}
          XCA_PASSPHRASE: ${{ env.XCA_PASSPHRASE }}
          XCA_TEMPLATE: ${{ env.XCA_TEMPLATE }}
          VAULT_TOKEN: ${{ env.VAULT_TOKEN }}
          ENABLE_EAB: "false"

      - name: "Bring up a2c container"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Profile + domain suite"
        uses: ./.github/actions/wf_specific/multi_cahandler/run_suite
        with:
          DEPLOYMENT_TYPE: container
          SUITE: profile-domain

      - name: "Enable EAB profiling"
        uses: ./.github/actions/wf_specific/multi_cahandler/setup_cfg
        with:
          VOLUME_DIR: examples/Docker/data
          XCA_DB_NAME: ${{ env.XCA_DB_NAME }}
          XCA_ISSUING_CA: ${{ env.XCA_ISSUING_CA }}
          XCA_PASSPHRASE: ${{ env.XCA_PASSPHRASE }}
          XCA_TEMPLATE: ${{ env.XCA_TEMPLATE }}
          VAULT_TOKEN: ${{ env.VAULT_TOKEN }}
          ENABLE_EAB: "true"

      - name: "Restart a2c"
        uses: ./.github/actions/wf_specific/multi_cahandler/restart_a2c
        with:
          DEPLOYMENT_TYPE: container

      - name: "EAB suite"
        uses: ./.github/actions/wf_specific/multi_cahandler/run_suite
        with:
          DEPLOYMENT_TYPE: container
          SUITE: eab

      - name: "Channel teardown"
        if: ${{ always() }}
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: container
          ARTIFACT_NAME: test-containers-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz

  test-rpm:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        rhversion: [8, 9]
        mode: ['wsgi', 'django']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v7

      - name: "Channel setup"
        uses: ./.github/actions/channel_rpm_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          RH_VERSION: ${{ matrix.rhversion }}
          JSON_SECRET: ${{ secrets.GH_CFG }}

      - name: "Parse XCA configuration from JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.XCA_CFG }}

      - name: "Instanciate vault"
        uses: ./.github/actions/wf_specific/vault_ca_handler/vault_prep
        with:
          RUNNER_IP: ${{ env.RUNNER_IP }}
          WORKING_DIR: ${{ github.workspace }}/examples/Docker

      - name: "Stage CA material"
        uses: ./.github/actions/wf_specific/multi_cahandler/stage_assets
        with:
          VOLUME_DIR: data/volume
          XCA_DB_NAME: ${{ env.XCA_DB_NAME }}

      - name: "Setup multi-CAhandler config"
        uses: ./.github/actions/wf_specific/multi_cahandler/setup_cfg
        with:
          VOLUME_DIR: data/volume
          XCA_DB_NAME: ${{ env.XCA_DB_NAME }}
          XCA_ISSUING_CA: ${{ env.XCA_ISSUING_CA }}
          XCA_PASSPHRASE: ${{ env.XCA_PASSPHRASE }}
          XCA_TEMPLATE: ${{ env.XCA_TEMPLATE }}
          VAULT_TOKEN: ${{ env.VAULT_TOKEN }}
          ENABLE_EAB: "false"

      - name: "Execute install script"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh install -m $MODE
        env:
          MODE: ${{ matrix.mode }}

      - name: "Profile + domain suite"
        uses: ./.github/actions/wf_specific/multi_cahandler/run_suite
        with:
          DEPLOYMENT_TYPE: rpm
          SUITE: profile-domain

      - name: "Enable EAB profiling"
        uses: ./.github/actions/wf_specific/multi_cahandler/setup_cfg
        with:
          VOLUME_DIR: data/volume
          XCA_DB_NAME: ${{ env.XCA_DB_NAME }}
          XCA_ISSUING_CA: ${{ env.XCA_ISSUING_CA }}
          XCA_PASSPHRASE: ${{ env.XCA_PASSPHRASE }}
          XCA_TEMPLATE: ${{ env.XCA_TEMPLATE }}
          VAULT_TOKEN: ${{ env.VAULT_TOKEN }}
          ENABLE_EAB: "true"

      - name: "Restart a2c"
        uses: ./.github/actions/wf_specific/multi_cahandler/restart_a2c
        with:
          DEPLOYMENT_TYPE: rpm
          MODE: ${{ matrix.mode }}

      - name: "EAB suite"
        uses: ./.github/actions/wf_specific/multi_cahandler/run_suite
        with:
          DEPLOYMENT_TYPE: rpm
          SUITE: eab

      - name: "Channel teardown"
        if: ${{ always() }}
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: rpm
          ARTIFACT_NAME: test-rpm-rh${{ matrix.rhversion }}-${{ matrix.mode }}.tar.gz

  test-deb:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        mode: ['wsgi', 'django']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v7

      - name: "Channel setup"
        uses: ./.github/actions/channel_deb_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          DJANGO_DB: ${{ matrix.mode == 'django' && 'psql' || '' }}

      - name: "Parse XCA configuration from JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.XCA_CFG }}

      - name: "Instanciate vault"
        uses: ./.github/actions/wf_specific/vault_ca_handler/vault_prep
        with:
          RUNNER_IP: ${{ env.RUNNER_IP }}
          WORKING_DIR: ${{ github.workspace }}/examples/Docker

      - name: "Stage CA material"
        uses: ./.github/actions/wf_specific/multi_cahandler/stage_assets
        with:
          VOLUME_DIR: data/volume
          XCA_DB_NAME: ${{ env.XCA_DB_NAME }}

      - name: "Setup multi-CAhandler config"
        uses: ./.github/actions/wf_specific/multi_cahandler/setup_cfg
        with:
          VOLUME_DIR: data/volume
          XCA_DB_NAME: ${{ env.XCA_DB_NAME }}
          XCA_ISSUING_CA: ${{ env.XCA_ISSUING_CA }}
          XCA_PASSPHRASE: ${{ env.XCA_PASSPHRASE }}
          XCA_TEMPLATE: ${{ env.XCA_TEMPLATE }}
          VAULT_TOKEN: ${{ env.VAULT_TOKEN }}
          PATH_REWRITE_FROM: volume
          PATH_REWRITE_TO: /var/www/acme2certifier/volume
          ENABLE_EAB: "false"

      - name: "Execute install script"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh install $WEBSRV -m $MODE
        env:
          WEBSRV: ${{ matrix.websrv }}
          MODE: ${{ matrix.mode }}

      - name: "Profile + domain suite"
        uses: ./.github/actions/wf_specific/multi_cahandler/run_suite
        with:
          DEPLOYMENT_TYPE: deb
          SUITE: profile-domain

      - name: "Enable EAB profiling"
        uses: ./.github/actions/wf_specific/multi_cahandler/setup_cfg
        with:
          VOLUME_DIR: data/volume
          XCA_DB_NAME: ${{ env.XCA_DB_NAME }}
          XCA_ISSUING_CA: ${{ env.XCA_ISSUING_CA }}
          XCA_PASSPHRASE: ${{ env.XCA_PASSPHRASE }}
          XCA_TEMPLATE: ${{ env.XCA_TEMPLATE }}
          VAULT_TOKEN: ${{ env.VAULT_TOKEN }}
          PATH_REWRITE_FROM: volume
          PATH_REWRITE_TO: /var/www/acme2certifier/volume
          ENABLE_EAB: "true"

      - name: "Restart a2c"
        uses: ./.github/actions/wf_specific/multi_cahandler/restart_a2c
        with:
          DEPLOYMENT_TYPE: deb
          WEBSRV: ${{ matrix.websrv }}
          MODE: ${{ matrix.mode }}

      - name: "EAB suite"
        uses: ./.github/actions/wf_specific/multi_cahandler/run_suite
        with:
          DEPLOYMENT_TYPE: deb
          SUITE: eab

      - name: "Channel teardown"
        if: ${{ always() }}
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: deb
          ARTIFACT_NAME: test-deb-${{ matrix.websrv }}-${{ matrix.mode }}.tar.gz
          WEBSRV: ${{ matrix.websrv }}
