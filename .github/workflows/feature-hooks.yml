name: Feature Tests - Hooks
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'
      run_id:
        description: 'Run ID of the producing workflow'
        required: true
        default: '0'
      sha:
        description: 'SHA of the commit to run the workflow on'
        required: true
        default: ''
      called_by_workflow:
        description: 'Name of the producing workflow'
        required: true
        default: 'manual-trigger'
      full_ref:
        description: 'Full git ref of the commit to run the workflow on'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ inputs.branch }}
  cancel-in-progress: true

permissions: {}

jobs:
  guard:
    permissions: {}
    uses: ./.github/workflows/_guard.yml
    with:
      sha: ${{ inputs.sha }}
      run_id: ${{ inputs.run_id }}
      branch: ${{ inputs.branch }}

  # ---------------------------------------------------------
  # Test container images - regular hooks
  # ---------------------------------------------------------
  test-containers:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        dbhandler: ['wsgi', 'django']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Channel setup"
        uses: ./.github/actions/channel_container_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          WEB_SRV: ${{ matrix.websrv }}
          DB_HANDLER: ${{ matrix.dbhandler }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          NAME_SPACE: acme

      - name: "Setup openssl ca_handler"
        uses: ./.github/actions/setup_openssl_cahandler
        with:
          VOLUME_DIR: examples/Docker/data

      - name: "Configure openssl ca_handler"
        run: |
          sudo mkdir -p examples/Docker/data/hooks
          sudo chmod -R 777 examples/Docker/data/hooks
          sudo cp acme2certifier/cahandlers/openssl_ca_handler.py examples/Docker/data/ca_handler.py
          sudo chmod 777 examples/Docker/data/acme_srv.cfg
          sudo echo -e "\n\n[Hooks]" >> examples/Docker/data/acme_srv.cfg
          sudo echo "hooks_module: acme2certifier.hookhandlers.cn_dump_hooks" >> examples/Docker/data/acme_srv.cfg
          sudo echo "save_path: volume/hooks" >> examples/Docker/data/acme_srv.cfg
          sudo echo "$HOOKS_CHECKSUM" > examples/Docker/data/hooks/checksums.sha256
        env:
          HOOKS_CHECKSUM: ${{ secrets.HOOKS_CHECKSUM }}

      - name: "Bring up a2c container"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Wait for ACME directory"
        uses: ./.github/actions/wait_for_directory

      - name: "Register certbot"
        run: |
          docker run -i --rm --name certbot --network acme -v $PWD/certbot:/etc/letsencrypt/ certbot/certbot register --agree-tos -m 'certbot@example.com' --server http://acme-srv --no-eff-email

      - name: "Enroll certbot"
        run: |
          docker run -i --rm --name certbot --network acme -v $PWD/certbot:/etc/letsencrypt/ certbot/certbot certonly --server http://acme-srv --standalone --preferred-challenges http -d certbot.acme --cert-name certbot
          sudo openssl verify -CAfile examples/Docker/data/acme_ca/root-ca-cert.pem -untrusted examples/Docker/data/acme_ca/sub-ca-cert.pem certbot/live/certbot/cert.pem

      - name: "Prepare acme.sh container"
        run: |
          docker run --rm -id -v "$(pwd)/acme-sh":/acme.sh --network acme --name=acme-sh neilpang/acme.sh:latest daemon

      - name: "Register acme.sh"
        run: |
          docker exec -i acme-sh acme.sh --server http://acme-srv --register-account --accountemail 'acme-sh@example.com' --debug 3

      - name: "Enroll acme.sh"
        run: |
          docker exec -i acme-sh acme.sh --server http://acme-srv --issue -d acme-sh.acme --standalone --debug 3 --output-insecure
          openssl verify -CAfile examples/Docker/data/acme_ca/root-ca-cert.pem -untrusted examples/Docker/data/acme_ca/sub-ca-cert.pem acme-sh/acme-sh.acme_ecc/acme-sh.acme.cer

      - name: "Enroll lego"
        run: |
          docker run -i -v $PWD/lego:/.lego/ --rm --name lego --network acme goacme/lego run --tls-skip-verify -s https://acme-srv -a --email "lego@example.com" -d lego.acme --http
          sudo openssl verify -CAfile examples/Docker/data/acme_ca/root-ca-cert.pem -untrusted examples/Docker/data/acme_ca/sub-ca-cert.pem lego/certificates/lego.acme.crt

      - name: "Compare checksums to validate hook file content"
        working-directory: examples/Docker/data/hooks
        run: |
          sha256sum -c checksums.sha256

      - name: "Check container configuration"
        uses: ./.github/actions/container_check
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Channel teardown"
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: container
          ARTIFACT_NAME: container-tests-hooks-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz

  # ---------------------------------------------------------
  # Test container images - hooks exception handling
  # ---------------------------------------------------------


  test-containers-exception-handling:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        dbhandler: ['wsgi', 'django']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Channel setup"
        uses: ./.github/actions/channel_container_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          WEB_SRV: ${{ matrix.websrv }}
          DB_HANDLER: ${{ matrix.dbhandler }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          NAME_SPACE: acme

      - name: "Setup openssl ca_handler"
        uses: ./.github/actions/setup_openssl_cahandler
        with:
          VOLUME_DIR: examples/Docker/data

      - name: "Configure openssl ca_handler"
        run: |
          sudo mkdir -p examples/Docker/data/hooks
          sudo chmod -R 777 examples/Docker/data/hooks
          sudo cp acme2certifier/cahandlers/openssl_ca_handler.py examples/Docker/data/ca_handler.py
          sudo chmod 777 examples/Docker/data/acme_srv.cfg
          sudo echo -e "\n\n[Hooks]" >> examples/Docker/data/acme_srv.cfg
          sudo echo "hooks_module: acme2certifier.hookhandlers.exception_test_hooks" >> examples/Docker/data/acme_srv.cfg
          sudo echo "raise_pre_hook_exception: False" >> examples/Docker/data/acme_srv.cfg
          sudo echo "raise_post_hook_exception: False" >> examples/Docker/data/acme_srv.cfg
          sudo echo "raise_success_hook_exception: False" >> examples/Docker/data/acme_srv.cfg
        env:
          HOOKS_CHECKSUM: ${{ secrets.HOOKS_CHECKSUM }}

      - name: "Bring up a2c container"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Wait for ACME directory"
        uses: ./.github/actions/wait_for_directory

      - name: "Rrepare acme.sh container"
        run: |
          docker run --rm -id -v "$(pwd)/acme-sh":/acme.sh --network acme --name=acme-sh neilpang/acme.sh:latest daemon

      - name: "Registeracme.sh"
        run: |
          docker exec -i acme-sh acme.sh --server http://acme-srv --register-account --accountemail 'acme-sh@example.com' --debug 3

      - name: "Enroll acme.sh - *_pre_hook_failure not configured "
        run: |
          docker exec -i acme-sh acme.sh --server http://acme-srv --issue -d acme-sh.acme --standalone --debug 3 --output-insecure
          openssl verify -CAfile examples/Docker/data/acme_ca/root-ca-cert.pem -untrusted examples/Docker/data/acme_ca/sub-ca-cert.pem acme-sh/acme-sh.acme_ecc/acme-sh.acme.cer

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "Reconfigure hook handler to trigger pre hook exception "
        run: |
          sudo sed -i "s/raise_pre_hook_exception: False/raise_pre_hook_exception: True/g" examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart

      - name: "acme.sh enrollment fails due to pre-hook exception (default behaviour)"
        id: prehookfailure
        continue-on-error: true
        run: |
          docker exec -i acme-sh acme.sh --server http://acme-srv --issue -d acme-sh.acme --standalone --force --debug 3 --output-insecure

      - name: "Check result - acme.sh enrollment failed due to pre-hook exception "
        if: steps.prehookfailure.outcome != 'failure'
        run: |
          echo "prehookfailure outcome is ${{steps.prehookfailure.outcome }}"
          exit 1

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "Reconfigure a2c to ignore pre-hook failures "
        run: |
          sudo echo "ignore_pre_hook_failure: True" >> examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart

      - name: "Enroll acme.sh - ignore pre_hook_failures "
        run: |
          docker exec -i acme-sh acme.sh --server http://acme-srv --issue -d acme-sh.acme --standalone --force --debug 3 --output-insecure
          openssl verify -CAfile examples/Docker/data/acme_ca/root-ca-cert.pem -untrusted examples/Docker/data/acme_ca/sub-ca-cert.pem acme-sh/acme-sh.acme_ecc/acme-sh.acme.cer

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "Reconfigure hook handler to trigger success hook exception "
        run: |
          sudo sed -i "s/raise_pre_hook_exception: True/raise_pre_hook_exception: False/g" examples/Docker/data/acme_srv.cfg
          sudo sed -i "s/raise_success_hook_exception: False/raise_success_hook_exception: True/g" examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart

      - name: "acme.sh enrollment fails due to success-hook exception (default behaviour) "
        id: successhookfailure
        continue-on-error: true
        run: |
          docker exec -i acme-sh acme.sh --server http://acme-srv --issue -d acme-sh.acme --standalone --force --debug 3 --output-insecure

      - name: "Check result - acme.sh enrollment failed due to success-hook exception "
        if: steps.successhookfailure.outcome != 'failure'
        run: |
          echo "successhookfailure outcome is ${{steps.successhookfailure.outcome }}"
          exit 1

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "Reconfigure a2c to ignore success-hook failures "
        run: |
          sudo sed -i "s/ignore_pre_hook_failure: True/ignore_success_hook_failure: True/g" examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart

      - name: "Enroll acme.sh - ignore success_hook_failures"
        run: |
          docker exec -i acme-sh acme.sh --server http://acme-srv --issue -d acme-sh.acme --standalone --force --debug 3 --output-insecure
          openssl verify -CAfile examples/Docker/data/acme_ca/root-ca-cert.pem -untrusted examples/Docker/data/acme_ca/sub-ca-cert.pem acme-sh/acme-sh.acme_ecc/acme-sh.acme.cer

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "Reconfigure hook handler to trigger post hook exception "
        run: |
          sudo sed -i "s/raise_success_hook_exception: True/raise_success_hook_exception: False/g" examples/Docker/data/acme_srv.cfg
          sudo sed -i "s/raise_post_hook_exception: False/raise_post_hook_exception: True/g" examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart

      - name: "Enroll acme.sh - ignore post_hook_failures (default behaviour) "
        run: |
          docker exec -i acme-sh acme.sh --server http://acme-srv --issue -d acme-sh.acme --standalone --force --debug 3 --output-insecure
          openssl verify -CAfile examples/Docker/data/acme_ca/root-ca-cert.pem -untrusted examples/Docker/data/acme_ca/sub-ca-cert.pem acme-sh/acme-sh.acme_ecc/acme-sh.acme.cer

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "Reconfigure a2c to detect success-hook failures "
        run: |
          sudo sed -i "s/ignore_success_hook_failure: True/ignore_post_hook_failure: False/g" examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart

      - name: "acme.sh enrollment fails due to post-hook exception "
        id: posthookfailure
        continue-on-error: true
        run: |
          docker exec -i acme-sh acme.sh --server http://acme-srv --issue -d acme-sh.acme --standalone --force --debug 3 --output-insecure

      - name: "Check result - acme.sh enrollment failed due to post-hook exception "
        if: steps.posthookfailure.outcome != 'failure'
        run: |
          echo "posthookfailure outcome is ${{steps.posthookfailure.outcome }}"
          exit 1

      - name: "Check container configuration"
        uses: ./.github/actions/container_check
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Channel teardown"
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: container
          ARTIFACT_NAME: test-containers-exception-handling-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz

  # ---------------------------------------------------------
  # Test container images - email hooks
  # ---------------------------------------------------------


  test-containers-email-hooks:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        dbhandler: ['wsgi', 'django']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Channel setup"
        uses: ./.github/actions/channel_container_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          WEB_SRV: ${{ matrix.websrv }}
          DB_HANDLER: ${{ matrix.dbhandler }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          NAME_SPACE: acme

      - name: "Parse EMAIL configuration from JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.EMAILADDRESSES_CFG }}

      - name: "Install mailserver"
        uses: ./.github/actions/mailserver_install
        with:
          MAILSERVER_CERT: ${{ secrets.MAILSERVER_CERT }}

      - name: "Setup openssl ca_handler"
        uses: ./.github/actions/setup_openssl_cahandler
        with:
          VOLUME_DIR: "examples/Docker/data"

      - name: "Configure openssl ca_handler"
        run: |
          sudo mkdir -p examples/Docker/data/hooks
          sudo chmod -R 777 examples/Docker/data/hooks
          sudo chmod 777 examples/Docker/data/acme_srv.cfg
          echo "allowed_domainlist: [\"*.acme\", \"*.bar.local\"]" >> examples/Docker/data/acme_srv.cfg
          sudo echo -e "\n\n[Hooks]" >> examples/Docker/data/acme_srv.cfg
          sudo echo "hooks_module: acme2certifier.hookhandlers.email_hooks" >> examples/Docker/data/acme_srv.cfg
          sudo echo "report_failures: True" >> examples/Docker/data/acme_srv.cfg
          sudo echo "report_successes: True" >> examples/Docker/data/acme_srv.cfg
          sudo echo "subject_prefix: [ACME]" >> examples/Docker/data/acme_srv.cfg
          sudo echo "rcpt: $JUM_ADDR" >> examples/Docker/data/acme_srv.cfg
          sudo sed -i "s/challenge_validation_disable: False/challenge_validation_disable: True/g" examples/Docker/data/acme_srv.cfg
          sudo sed -i "s/debug: True/debug: True\nappname: acme2certifier\nsmtp_server: mailserver.acme\nsmtp_port: 465\nsmtp_use_tls: True\nconnection_timeout: 30\nusername: $JUM_ADDR\npassword: $JUM_PASSWORD\nemail_address: $A2C_ADDR\n/g" examples/Docker/data/acme_srv.cfg
        env:
          HOOKS_CHECKSUM: ${{ secrets.HOOKS_CHECKSUM }}

      - name: "Bring up a2c container"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Enrollment tests"
        uses: ./.github/actions/wf_specific/hooks/enroll
        with:
          DEPLOYMENT_TYPE: container

      - name: "Check container configuration"
        uses: ./.github/actions/container_check
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Channel teardown"
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: container
          ARTIFACT_NAME: container-tests-email-hooks-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz

  # ---------------------------------------------------------
  # Test RPMs (EL8 & EL9) downloaded from the producer run
  # ---------------------------------------------------------


  test-rpm:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        rhversion: [8, 9]
        mode: ['wsgi', 'django']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Channel setup"
        uses: ./.github/actions/channel_rpm_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          RH_VERSION: ${{ matrix.rhversion }}
          JSON_SECRET: ${{ secrets.GH_CFG }}

      - name: "create letsencrypt and lego folder"
        run: |
          mkdir acme-sh
          mkdir lego

      - name: "Prepare acme_srv.cfg with openssl_ca_handler"
        uses: ./.github/actions/setup_openssl_cahandler

      - name: "Prepare acme_srv.cfg with openssl_ca_handler (config)"
        run: |
          sudo mkdir -p data/volume/acme_ca/hooks
          sudo chmod 777 data/volume/acme_srv.cfg
          sudo chmod -R 777 data/volume/acme_ca/hooks
          sudo echo -e "\n\n[Hooks]" >> data/volume/acme_srv.cfg
          sudo echo "hooks_module: acme2certifier.hookhandlers.cn_dump_hooks" >> data/volume/acme_srv.cfg
          sudo echo "save_path: /tmp/acme2certifier/volume/acme_ca/hooks" >> data/volume/acme_srv.cfg
          sudo echo "$HOOKS_CHECKSUM" > data/volume/acme_ca/hooks/checksums.sha256
        env:
          HOOKS_CHECKSUM: ${{ secrets.HOOKS_CHECKSUM }}

      - name: "Execute install script"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh install -m $MODE
        env:
          MODE: ${{ matrix.mode }}

      - name: "Wait for ACME directory (http)"
        uses: ./.github/actions/wait_for_directory
        with:
          CHECK_HTTPS: "false"

      - name: "Register certbot"
        run: |
          docker run -i --rm --name certbot --network acme -v $PWD/certbot:/etc/letsencrypt/ certbot/certbot register --agree-tos -m 'certbot@example.com' --server http://acme-srv --no-eff-email

      - name: "Enroll HTTP-01 single domain certbot"
        run: |
          docker run -i --rm --name certbot --network acme -v $PWD/certbot:/etc/letsencrypt/ certbot/certbot certonly --server http://acme-srv --standalone --preferred-challenges http -d certbot.acme --cert-name certbot
          sudo openssl verify -CAfile data/volume/acme_ca/root-ca-cert.pem -untrusted data/volume/acme_ca/sub-ca-cert.pem certbot/live/certbot/cert.pem

      - name: "Prepare acme.sh container"
        run: |
          docker run --rm -id -v "$(pwd)/acme-sh":/acme.sh --network acme --name=acme-sh neilpang/acme.sh:latest daemon

      - name: "Register acme.sh"
        run: |
          docker exec -i acme-sh acme.sh --server http://acme-srv --register-account --accountemail 'acme-sh@example.com' --debug 3

      - name: "Enroll acme.sh"
        run: |
          docker exec -i acme-sh acme.sh --server http://acme-srv --issue -d acme-sh.acme --standalone --debug 3 --output-insecure
          openssl verify -CAfile data/volume/acme_ca/root-ca-cert.pem -untrusted data/volume/acme_ca/sub-ca-cert.pem acme-sh/acme-sh.acme_ecc/acme-sh.acme.cer

      - name: "Enroll lego"
        run: |
          docker run -i -v $PWD/lego:/.lego/ --rm --name lego --network acme goacme/lego run --tls-skip-verify -s https://acme-srv -a --email "lego@example.com" -d lego.acme --http
          sudo openssl verify -CAfile data/volume/acme_ca/root-ca-cert.pem -untrusted data/volume/acme_ca/sub-ca-cert.pem lego/certificates/lego.acme.crt

      - name: "Compare checksums to validate hook file content"
        working-directory: data/volume/acme_ca/hooks
        run: |
          sha256sum -c checksums.sha256

      - name: "Channel teardown"
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: rpm
          ARTIFACT_NAME: test-rpm-rh${{ matrix.rhversion }}.tar.gz

  # ---------------------------------------------------------
  # Test RPMs (EL8 & EL9) hooks exception handling
  # ---------------------------------------------------------


  test-rpm-hooks-exception-handling:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        rhversion: [8, 9]
        mode: ['wsgi', 'django']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Channel setup"
        uses: ./.github/actions/channel_rpm_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          RH_VERSION: ${{ matrix.rhversion }}
          JSON_SECRET: ${{ secrets.GH_CFG }}

      - name: "create letsencrypt and lego folder"
        run: |
          mkdir acme-sh
          mkdir lego

      - name: "prepare acme_srv.cfg with openssl_ca_handler"
        uses: ./.github/actions/setup_openssl_cahandler

      - name: "prepare acme_srv.cfg with openssl_ca_handler"
        run: |
          sudo mkdir -p data/volume/acme_ca/hooks
          sudo chmod 777 data/volume/acme_srv.cfg
          sudo chmod -R 777 data/volume/acme_ca/hooks
          sudo echo -e "\n\n[Hooks]" >> data/volume/acme_srv.cfg
          sudo echo "hooks_module: acme2certifier.hookhandlers.exception_test_hooks" >> data/volume/acme_srv.cfg
          sudo echo "raise_pre_hook_exception: False" >> data/volume/acme_srv.cfg
          sudo echo "raise_post_hook_exception: False" >> data/volume/acme_srv.cfg
          sudo echo "raise_success_hook_exception: False" >> data/volume/acme_srv.cfg
        env:
          HOOKS_CHECKSUM: ${{ secrets.HOOKS_CHECKSUM }}

      - name: "Execute install script"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh install -m $MODE
        env:
          MODE: ${{ matrix.mode }}

      - name: "Wait for ACME directory (http)"
        uses: ./.github/actions/wait_for_directory
        with:
          CHECK_HTTPS: "false"

      - name: "Prepare acme.sh container"
        run: |
          docker run --rm -id -v "$(pwd)/acme-sh":/acme.sh --network acme --name=acme-sh neilpang/acme.sh:latest daemon

      - name: "Register acme.sh"
        run: |
          docker exec -i acme-sh acme.sh --server http://acme-srv --register-account --accountemail 'acme-sh@example.com' --debug 3

      - name: "Enroll acme.sh - *_pre_hook_failure not configured "
        run: |
          docker exec -i acme-sh acme.sh --server http://acme-srv --issue -d acme-sh.acme --standalone --debug 3 --output-insecure
          openssl verify -CAfile data/volume/acme_ca/root-ca-cert.pem -untrusted data/volume/acme_ca/sub-ca-cert.pem acme-sh/acme-sh.acme_ecc/acme-sh.acme.cer

      - name: "Reconfigure hook handler to trigger pre hook exception "
        run: |
          sudo sed -i "s/raise_pre_hook_exception: False/raise_pre_hook_exception: True/g" data/volume/acme_srv.cfg

      - name: "Reconfigure a2c "
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart
        env:
          MODE: ${{ matrix.mode }}

      - name: "acme.sh enrollment fails due to pre-hook exception (default behaviour)"
        id: prehookfailure
        continue-on-error: true
        run: |
          docker exec -i acme-sh acme.sh --server http://acme-srv --issue -d acme-sh.acme --standalone --force --debug 3 --output-insecure

      - name: "Check result - acme.sh enrollment failed due to pre-hook exception "
        if: steps.prehookfailure.outcome != 'failure'
        run: |
          echo "prehookfailure outcome is ${{steps.prehookfailure.outcome }}"
          exit 1

      - name: "Reconfigure a2c to ignore pre-hook failures "
        run: |
          sudo echo "ignore_pre_hook_failure: True" >> data/volume/acme_srv.cfg

      - name: "Reconfigure a2c "
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart
        env:
          MODE: ${{ matrix.mode }}

      - name: "Enroll acme.sh - ignore pre_hook_failures "
        run: |
          docker exec -i acme-sh acme.sh --server http://acme-srv --issue -d acme-sh.acme --standalone --force --debug 3 --output-insecure
          openssl verify -CAfile data/volume/acme_ca/root-ca-cert.pem -untrusted data/volume/acme_ca/sub-ca-cert.pem acme-sh/acme-sh.acme_ecc/acme-sh.acme.cer

      - name: "Reconfigure hook handler to trigger success hook exception "
        run: |
          sudo sed -i "s/raise_pre_hook_exception: True/raise_pre_hook_exception: False/g" data/volume/acme_srv.cfg
          sudo sed -i "s/raise_success_hook_exception: False/raise_success_hook_exception: True/g" data/volume/acme_srv.cfg

      - name: "Reconfigure a2c "
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart
        env:
          MODE: ${{ matrix.mode }}

      - name: "acme.sh enrollment fails due to success-hook exception (default behaviour) "
        id: successhookfailure
        continue-on-error: true
        run: |
          docker exec -i acme-sh acme.sh --server http://acme-srv --issue -d acme-sh.acme --standalone --force --debug 3 --output-insecure

      - name: "Check result - acme.sh enrollment failed due to success-hook exception "
        if: steps.successhookfailure.outcome != 'failure'
        run: |
          echo "successhookfailure outcome is ${{steps.successhookfailure.outcome }}"
          exit 1

      - name: "Reconfigure a2c to ignore success-hook failures "
        run: |
          sudo sed -i "s/ignore_pre_hook_failure: True/ignore_success_hook_failure: True/g" data/volume/acme_srv.cfg

      - name: "Reconfigure a2c "
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart
        env:
          MODE: ${{ matrix.mode }}

      - name: "Enroll acme.sh - ignore success_hook_failures"
        run: |
          docker exec -i acme-sh acme.sh --server http://acme-srv --issue -d acme-sh.acme --standalone --force --debug 3 --output-insecure
          openssl verify -CAfile data/volume/acme_ca/root-ca-cert.pem -untrusted data/volume/acme_ca/sub-ca-cert.pem acme-sh/acme-sh.acme_ecc/acme-sh.acme.cer

      - name: "Reconfigure hook handler to trigger post hook exception "
        run: |
          sudo sed -i "s/raise_success_hook_exception: True/raise_success_hook_exception: False/g" data/volume/acme_srv.cfg
          sudo sed -i "s/raise_post_hook_exception: False/raise_post_hook_exception: True/g" data/volume/acme_srv.cfg

      - name: "Reconfigure a2c "
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart
        env:
          MODE: ${{ matrix.mode }}

      - name: "Enroll acme.sh - ignore post_hook_failures (default behaviour) "
        run: |
          docker exec -i acme-sh acme.sh --server http://acme-srv --issue -d acme-sh.acme --standalone --force --debug 3 --output-insecure
          openssl verify -CAfile data/volume/acme_ca/root-ca-cert.pem -untrusted data/volume/acme_ca/sub-ca-cert.pem acme-sh/acme-sh.acme_ecc/acme-sh.acme.cer

      - name: "Reconfigure a2c to detect success-hook failures "
        run: |
          sudo sed -i "s/ignore_success_hook_failure: True/ignore_post_hook_failure: False/g" data/volume/acme_srv.cfg

      - name: "Reconfigure a2c "
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart
        env:
          MODE: ${{ matrix.mode }}

      - name: "Fail acme.sh enrollment fails due to post-hook exception "
        id: posthookfailure
        continue-on-error: true
        run: |
          docker exec -i acme-sh acme.sh --server http://acme-srv --issue -d acme-sh.acme --standalone --force --debug 3 --output-insecure

      - name: "Check result - acme.sh enrollment failed due to post-hook exception "
        if: steps.posthookfailure.outcome != 'failure'
        run: |
          echo "posthookfailure outcome is ${{steps.posthookfailure.outcome }}"
          exit 1

      - name: "Channel teardown"
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: rpm
          ARTIFACT_NAME: test-rpm-hooks-exception-rh${{ matrix.rhversion }}.tar.gz

  # ---------------------------------------------------------
  # Test RPMs (EL8 & EL9) email hooks
  # ---------------------------------------------------------


  test-rpm-hooks-email-hooks:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        rhversion: [8, 9]
        mode: ['wsgi', 'django']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Channel setup"
        uses: ./.github/actions/channel_rpm_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          RH_VERSION: ${{ matrix.rhversion }}
          JSON_SECRET: ${{ secrets.GH_CFG }}

      - name: "Parse EMAIL configuration from JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.EMAILADDRESSES_CFG }}

      - name: "Install mailserver"
        uses: ./.github/actions/mailserver_install
        with:
          MAILSERVER_CERT: ${{ secrets.MAILSERVER_CERT }}
          DEPLOYMENT_TYPE: rpm

      - name: "prepare acme_srv.cfg with openssl_ca_handler"
        uses: ./.github/actions/setup_openssl_cahandler

      - name: "prepare acme_srv.cfg with openssl_ca_handler"
        run: |
          sudo mkdir -p data/volume/acme_ca/hooks
          sudo chmod 777 data/volume/acme_srv.cfg
          sudo chmod -R 777 data/volume/acme_ca/hooks
          echo "allowed_domainlist: [\"*.acme\", \"*.bar.local\"]" >> data/volume/acme_srv.cfg
          sudo echo -e "\n\n[Hooks]" >> data/volume/acme_srv.cfg
          sudo echo "hooks_module: acme2certifier.hookhandlers.email_hooks" >> data/volume/acme_srv.cfg
          sudo echo "report_failures: True" >> data/volume/acme_srv.cfg
          sudo echo "report_successes: True" >> data/volume/acme_srv.cfg
          sudo echo "subject_prefix: [ACME]" >> data/volume/acme_srv.cfg
          sudo echo "rcpt: $JUM_ADDR" >> data/volume/acme_srv.cfg
          sudo sed -i "s/challenge_validation_disable: False/challenge_validation_disable: True/g" data/volume/acme_srv.cfg
          sudo sed -i "s/debug: True/debug: True\nappname: acme2certifier\nsmtp_server: mailserver.acme\nsmtp_port: 465\nsmtp_use_tls: True\nconnection_timeout: 30\nusername: $JUM_ADDR\npassword: $JUM_PASSWORD\nemail_address: $A2C_ADDR\n/g" data/volume/acme_srv.cfg

      - name: "Execute install script"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh install -m $MODE
        env:
          MODE: ${{ matrix.mode }}

      - name: "Enrollment tests"
        uses: ./.github/actions/wf_specific/hooks/enroll
        with:
          DEPLOYMENT_TYPE: rpm

      - name: "Channel teardown"
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: rpm
          ARTIFACT_NAME: test-rpm-email-hooks-rh${{ matrix.rhversion }}-${{ matrix.mode }}.tar.gz
