name: Deployment Tests - WSGI to Django migration
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'
      run_id:
        description: 'Run ID of the producing workflow'
        required: true
        default: '0'
      sha:
        description: 'SHA of the commit to run the workflow on'
        required: true
        default: ''
      called_by_workflow:
        description: 'Name of the producing workflow'
        required: true
        default: 'manual-trigger'
      full_ref:
        description: 'Full git ref of the commit to run the workflow on'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ inputs.branch }}
  cancel-in-progress: true

permissions: {}

jobs:
  guard:
    permissions: {}
    uses: ./.github/workflows/_guard.yml
    with:
      sha: ${{ inputs.sha }}
      run_id: ${{ inputs.run_id }}
      branch: ${{ inputs.branch }}

  test-containers:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: true
      matrix:
        websrv: ['nginx', 'apache2']
        django_db: ['sqlite3', 'mariadb']
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Prepare container environment (WSGI first)"
        uses: ./.github/actions/container_prep
        with:
          DB_HANDLER: wsgi
          WEB_SRV: ${{ matrix.websrv }}
          CONTAINER_BUILD: false
          DJANGO_DB: ${{ matrix.django_db }}
          NAME_SPACE: acme

      - name: "Setup openssl ca_handler"
        uses: ./.github/actions/setup_openssl_cahandler
        with:
          VOLUME_DIR: examples/Docker/data

      - name: "Load WSGI build image"
        uses: ./.github/actions/container_load
        with:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: a2c-${{ inputs.run_id }}.${{ matrix.websrv }}.wsgi.tar
          DESTINATION_PATH: /tmp
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Spin-up WSGI image"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: wsgi
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Enroll on WSGI"
        uses: ./.github/actions/wf_specific/upgrade/enroll
        with:
          RENEWAL: false

      - name: "Export WSGI DB dump"
        run: |
          set -euo pipefail
          docker exec acme-srv bash -lc '
            set -euo pipefail
            DUMP="/var/www/acme2certifier/volume/wsgi-dump.json"
            DB_MAIN="/var/www/acme2certifier/acme_srv.db"
            DB_LEGACY="/var/www/acme2certifier/acme_srv/acme_srv.db"
            if [ -f "${DB_MAIN}" ]; then
              a2c-wsgi2django export --db "${DB_MAIN}" --out "${DUMP}"
            else
              a2c-wsgi2django export --db "${DB_LEGACY}" --out "${DUMP}"
            fi
          '

      - name: "Stop WSGI instance"
        uses: ./.github/actions/container_down
        with:
          DB_HANDLER: wsgi
          WEB_SRV: ${{ matrix.websrv }}

      # Migration-specific deviation from upgrade workflow:
      # switch image flavor in-place from wsgi to django on same build.
      - name: "Switch compose env to Django image"
        run: |
          set -euo pipefail
          sed -i 's/^CONTEXT=wsgi/CONTEXT=django/' examples/Docker/.env

      - name: "Load Django build image"
        uses: ./.github/actions/container_load
        with:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: a2c-${{ inputs.run_id }}.${{ matrix.websrv }}.django.tar
          DESTINATION_PATH: /tmp
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Spin-up Django image"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: django
          WEB_SRV: ${{ matrix.websrv }}

      # Entrypoint already runs a2c-django-update; do not re-run (races with up -d).
      - name: "Wait for Django ACME directory"
        uses: ./.github/actions/wait_for_directory

      - name: "Import and check migration dump"
        run: |
          set -euo pipefail
          docker exec acme-srv bash -lc '
            set -euo pipefail
            DUMP="/var/www/acme2certifier/volume/wsgi-dump.json"
            a2c-wsgi2django import --dump "${DUMP}" --wipe
            a2c-wsgi2django check --dump "${DUMP}"
          '

      - name: "Renew on Django"
        uses: ./.github/actions/acme_clients_renew
        with:
          CLEANUP: true
          HOSTNAME_SUFFIX: ""

      - name: "Fresh enrollment on Django"
        uses: ./.github/actions/acme_clients

      - name: "Check Django container configuration"
        uses: ./.github/actions/container_check
        with:
          DB_HANDLER: django
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Stop Django instance"
        uses: ./.github/actions/container_down
        with:
          DB_HANDLER: django
          WEB_SRV: ${{ matrix.websrv }}

      - name: "[ * ] Collect migration artifacts"
        if: ${{ failure() }}
        uses: ./.github/actions/wf_specific/wsgi2django/collect_failure_artifacts

      - name: "Channel teardown"
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: container
          ARTIFACT_NAME: test-containers-${{ matrix.websrv }}-${{ matrix.django_db }}-wsgi2django.tar.gz


  test-deb:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: true
      matrix:
        # nginx+sqlite has known instability in current DEB deployment tests.
        websrv: ['apache2']
        django_db: ['sqlite3', 'mariadb']
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Channel setup"
        uses: ./.github/actions/channel_deb_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          DJANGO_DB: ${{ matrix.django_db }}

      - name: "Setup openssl ca_handler"
        uses: ./.github/actions/setup_openssl_cahandler
        with:
          VOLUME_DIR: data/volume

      - name: "Install build as WSGI"
        uses: ./.github/actions/wf_specific/upgrade/deb_install
        with:
          DEB_PATH: data/acme2certifier-${{ inputs.run_id }}-1_all.deb
          MODE: wsgi
          MODERN: "true"

      - name: "Enroll on WSGI"
        uses: ./.github/actions/wf_specific/upgrade/enroll
        with:
          RENEWAL: false

      - name: "Export WSGI DB dump"
        run: |
          set -euo pipefail
          docker exec acme-srv bash -lc '
            set -euo pipefail
            DB_MAIN="/var/www/acme2certifier/acme_srv.db"
            DB_LEGACY="/var/www/acme2certifier/acme_srv/acme_srv.db"
            if [ -f "${DB_MAIN}" ]; then
              a2c-wsgi2django export --db "${DB_MAIN}" --out /tmp/wsgi-dump.json
            else
              a2c-wsgi2django export --db "${DB_LEGACY}" --out /tmp/wsgi-dump.json
            fi
          '

      - name: "Switch build install to Django"
        uses: ./.github/actions/wf_specific/upgrade/deb_install
        with:
          DEB_PATH: data/acme2certifier-${{ inputs.run_id }}-1_all.deb
          MODE: django
          MODERN: "true"

      - name: "Migrate DB schema to Django"
        uses: ./.github/actions/wf_specific/wsgi2django/django_migrate
        with:
          APP_ROOT: /var/www/acme2certifier

      - name: "Import and check migration dump"
        run: |
          set -euo pipefail
          docker exec acme-srv bash -lc '
            set -euo pipefail
            a2c-wsgi2django import --dump /tmp/wsgi-dump.json --wipe
            a2c-wsgi2django check --dump /tmp/wsgi-dump.json
          '

      - name: "Renew on Django"
        uses: ./.github/actions/acme_clients_renew
        with:
          CLEANUP: true
          HOSTNAME_SUFFIX: ""

      - name: "Fresh enrollment on Django"
        uses: ./.github/actions/acme_clients

      - name: "[ * ] Collect migration artifacts"
        if: ${{ failure() }}
        uses: ./.github/actions/wf_specific/wsgi2django/collect_failure_artifacts

      - name: "Channel teardown"
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: deb
          ARTIFACT_NAME: test-deb-${{ matrix.websrv }}-${{ matrix.django_db }}-wsgi2django.tar.gz
          WEBSRV: ${{ matrix.websrv }}


  test-rpm:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: true
      matrix:
        rhversion: [8, 9]
        django_db: ['sqlite3', 'mariadb']
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Channel setup"
        uses: ./.github/actions/channel_rpm_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          RH_VERSION: ${{ matrix.rhversion }}
          JSON_SECRET: ${{ secrets.GH_CFG }}
          DJANGO_DB: ${{ matrix.django_db }}

      - name: "Setup openssl ca_handler"
        uses: ./.github/actions/setup_openssl_cahandler
        with:
          VOLUME_DIR: data/volume

      - name: "Install build as WSGI"
        uses: ./.github/actions/wf_specific/upgrade/rpm_install
        with:
          RPM_PATH: data/acme2certifier-${{ inputs.run_id }}.noarch.rpm
          MODE: wsgi
          MODERN: "true"

      - name: "Enroll on WSGI"
        uses: ./.github/actions/wf_specific/upgrade/enroll
        with:
          RENEWAL: false

      - name: "Export WSGI DB dump"
        run: |
          set -euo pipefail
          docker exec acme-srv bash -lc '
            set -euo pipefail
            DB_MAIN="/opt/acme2certifier/acme_srv.db"
            DB_LEGACY="/opt/acme2certifier/acme_srv/acme_srv.db"
            if [ -f "${DB_MAIN}" ]; then
              a2c-wsgi2django export --db "${DB_MAIN}" --out /tmp/wsgi-dump.json
            else
              a2c-wsgi2django export --db "${DB_LEGACY}" --out /tmp/wsgi-dump.json
            fi
          '

      - name: "Switch build install to Django"
        uses: ./.github/actions/wf_specific/upgrade/rpm_install
        with:
          RPM_PATH: data/acme2certifier-${{ inputs.run_id }}.noarch.rpm
          MODE: django
          MODERN: "true"

      - name: "Migrate DB schema to Django"
        uses: ./.github/actions/wf_specific/wsgi2django/django_migrate
        with:
          APP_ROOT: /opt/acme2certifier

      - name: "Import and check migration dump"
        run: |
          set -euo pipefail
          docker exec acme-srv bash -lc '
            set -euo pipefail
            a2c-wsgi2django import --dump /tmp/wsgi-dump.json --wipe
            a2c-wsgi2django check --dump /tmp/wsgi-dump.json
          '

      - name: "Renew on Django"
        uses: ./.github/actions/acme_clients_renew
        with:
          CLEANUP: true
          HOSTNAME_SUFFIX: ""

      - name: "Fresh enrollment on Django"
        uses: ./.github/actions/acme_clients

      - name: "[ * ] Collect migration artifacts"
        if: ${{ failure() }}
        uses: ./.github/actions/wf_specific/wsgi2django/collect_failure_artifacts
        with:
          APP_ROOT: /opt/acme2certifier

      - name: "Channel teardown"
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: rpm
          ARTIFACT_NAME: test-rpm-rh${{ matrix.rhversion }}-${{ matrix.django_db }}-wsgi2django.tar.gz


  test-pip:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: true
      matrix:
        ubuntu_version: ['24.04']
        websrv: [apache2, nginx]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Migration-specific deviation from deployment-manual-install:
      # keep matrix lean for migration sequencing and rely on package jobs
      # for broader Django DB backend coverage.
      - name: Prepare container
        uses: ./.github/actions/pip_install_prep
        with:
          DISTRO: ubuntu
          VERSION: ${{ matrix.ubuntu_version }}

      - name: Install via script (--from-source, WSGI)
        run: |
          set -euo pipefail
          if [ "${WEBSRV}" = "apache2" ]; then
            SCRIPT=examples/install_scripts/a2c-ubuntu-apache2.sh
          else
            SCRIPT=examples/install_scripts/a2c-ubuntu-nginx.sh
          fi
          docker exec acme-srv chmod a+rx "/data/acme2certifier/${SCRIPT}"
          docker exec acme-srv bash -lc \
            "cd /data/acme2certifier && ./${SCRIPT} --mode wsgi --from-source"
        env:
          WEBSRV: ${{ matrix.websrv }}

      - name: Enroll on WSGI
        uses: ./.github/actions/wf_specific/upgrade/enroll
        with:
          RENEWAL: false

      - name: Export WSGI DB dump
        run: |
          set -euo pipefail
          docker exec acme-srv bash -lc '
            set -euo pipefail
            A2C_W2D="/var/www/acme2certifier/venv/bin/a2c-wsgi2django"
            DB_MAIN="/var/www/acme2certifier/acme_srv.db"
            DB_LEGACY="/var/www/acme2certifier/acme_srv/acme_srv.db"
            if [ -f "${DB_MAIN}" ]; then
              "${A2C_W2D}" export --db "${DB_MAIN}" --out /tmp/wsgi-dump.json
            else
              "${A2C_W2D}" export --db "${DB_LEGACY}" --out /tmp/wsgi-dump.json
            fi
          '

      - name: Switch install to Django
        run: |
          set -euo pipefail
          if [ "${WEBSRV}" = "apache2" ]; then
            SCRIPT=examples/install_scripts/a2c-ubuntu-apache2.sh
          else
            SCRIPT=examples/install_scripts/a2c-ubuntu-nginx.sh
          fi
          docker exec acme-srv chmod a+rx "/data/acme2certifier/${SCRIPT}"
          docker exec acme-srv bash -lc \
            "cd /data/acme2certifier && ./${SCRIPT} --mode django --from-source"
        env:
          WEBSRV: ${{ matrix.websrv }}

      - name: Migrate DB schema to Django
        uses: ./.github/actions/wf_specific/wsgi2django/django_migrate
        with:
          APP_ROOT: /var/www/acme2certifier

      - name: Import and check migration dump
        run: |
          set -euo pipefail
          docker exec acme-srv bash -lc '
            set -euo pipefail
            A2C_W2D="/var/www/acme2certifier/venv/bin/a2c-wsgi2django"
            "${A2C_W2D}" import --dump /tmp/wsgi-dump.json --wipe
            "${A2C_W2D}" check --dump /tmp/wsgi-dump.json
          '

      - name: Renew on Django
        uses: ./.github/actions/acme_clients_renew
        with:
          CLEANUP: true
          HOSTNAME_SUFFIX: ""

      - name: Fresh enrollment on Django
        uses: ./.github/actions/acme_clients

      - name: "Collect migration artifacts"
        if: ${{ failure() }}
        uses: ./.github/actions/wf_specific/wsgi2django/collect_failure_artifacts

      - name: "Channel teardown"
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: pip
          ARTIFACT_NAME: pip-${{ matrix.ubuntu_version }}-${{ matrix.websrv }}-wsgi2django.tar.gz
          WEBSRV: ${{ matrix.websrv }}

