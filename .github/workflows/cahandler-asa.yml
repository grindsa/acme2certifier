name: CA-Handler Tests - Insta ASA CA
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'
      run_id:
        description: 'Run ID of the producing workflow'
        required: true
        default: '0'
      sha:
        description: 'SHA of the commit to run the workflow on'
        required: true
        default: ''
      called_by_workflow:
        description: 'Name of the producing workflow'
        required: true
        default: 'manual-trigger'
      full_ref:
        description: 'Full git ref of the commit to run the workflow on'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ inputs.branch }}
  cancel-in-progress: true

permissions: {}

jobs:
  guard:
    permissions: {}
    uses: ./.github/workflows/_guard.yml
    with:
      sha: ${{ inputs.sha }}
      run_id: ${{ inputs.run_id }}
      branch: ${{ inputs.branch }}

  asa-preflight:
    permissions:
      contents: read
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v7

      - name: "Parse ASA configuration"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.ASA_CFG }}
          uppercase: 'true'

      - name: "ASA API preflight"
        uses: ./.github/actions/wf_specific/asa_ca_handler/asa_preflight
        with:
          ASA_API_HOST: ${{ env.ASA_API_HOST }}
          ASA_API_USER: ${{ env.ASA_API_USER }}
          ASA_API_PASSWORD: ${{ env.ASA_API_PASSWORD }}
          ASA_API_KEY: ${{ env.ASA_API_KEY }}

  test-containers-useragent:
    permissions:
      contents: read
      actions: write
    needs: [guard, asa-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2']
        dbhandler: ['wsgi']
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v7


      - name: "Channel setup"
        uses: ./.github/actions/channel_container_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          WEB_SRV: ${{ matrix.websrv }}
          DB_HANDLER: ${{ matrix.dbhandler }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Parse ASA configuration"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.ASA_CFG }}
          uppercase: 'true'

      - name: "a2c configuration with standard profile"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.asa_ca_handler
          OPTIONS: |
            api_host: ${{ env.ASA_API_HOST }}
            api_user: ${{ env.ASA_API_USER }}
            api_password: ${{ env.ASA_API_PASSWORD }}
            api_key: ${{ env.ASA_API_KEY }}
            ca_name: ${{ env.ASA_CA_NAME }}
            ca_bundle: ${{ env.ASA_CA_BUNDLE }}
            request_timeout: 30
            request_retries: 3
            profile_name: ${{ env.ASA_PROFILE1 }}

      - name: "a2c configuration with standard profile (post-cfg)"
        run: |
          sudo cp test/ca/certsrv_ca_certs.pem examples/Docker/data/ca_certs.pem
          sudo sed -i "s/revocation_reason_check_disable: False/revocation_reason_check_disable: False\nenrollment_timeout:120/g" examples/Docker/data/acme_srv.cfg
          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nheader_info_list: [\"HTTP_USER_AGENT\"]\nallowed_header_values: [\"ACME\", \"ACME_2\"]/g" examples/Docker/data/acme_srv.cfg

      - name: "Bring up a2c container"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}
          CHECK_HTTPS: "false"

      - name: "Create lego folder"
        run: |
          mkdir lego

      - name: "Enroll lego with profileID ACME - could potentially fail"
        continue-on-error: True
        run: |
          docker run -i -v $PWD/lego:/.lego/ --rm --name lego --network acme goacme/lego run --tls-skip-verify -s https://acme-srv -a --email "lego@example.com" --user-agent profile_name=ACME -d lego.acme --key-type rsa2048 --http

      - name: "Enroll acme.sh with profileID ACME"
        run: |
          sudo rm -rf acme-sh/*
          docker run --rm -i -v "$(pwd)/acme-sh":/acme.sh --network acme --name=acme-sh neilpang/acme.sh:latest --issue --server http://acme-srv --accountemail 'acme-sh@example.com' -d acme-sh.acme --standalone --useragent profile_name=ACME --keylength 2048 --debug 3 --output-insecure
          awk 'BEGIN {c=0;} /BEGIN CERT/{c++} { print > "cert-" c ".pem"}' < acme-sh/acme-sh.acme/ca.cer
          openssl verify -CAfile cert-2.pem -untrusted cert-1.pem acme-sh/acme-sh.acme/acme-sh.acme.cer
          openssl x509 -in acme-sh/acme-sh.acme/acme-sh.acme.cer -ext keyUsage -noout | grep "Digital Signature"

      - name: "Enroll lego with profileID ACME"
        run: |
          sudo rm -rf lego/*
          docker run -i -v $PWD/lego:/.lego/ --rm --name lego --network acme goacme/lego run --tls-skip-verify -s https://acme-srv -a --email "lego@example.com" --user-agent profile_name=ACME -d lego.acme --key-type rsa2048 --http
          sudo openssl verify -CAfile cert-2.pem -untrusted cert-1.pem lego/certificates/lego.acme.crt
          sudo openssl x509 -in lego/certificates/lego.acme.crt -ext keyUsage -noout | grep "Digital Signature"

      - name: "Enroll acme.sh with profileID ACME_2"
        run: |
          docker run --rm -i -v "$(pwd)/acme-sh":/acme.sh --network acme --name=acme-sh neilpang/acme.sh:latest --renew --server http://acme-srv --force -d acme-sh.acme --standalone --useragent profile_name=ACME_2 --keylength 2048 --debug 3 --output-insecure
          openssl verify -CAfile cert-2.pem -untrusted cert-1.pem acme-sh/acme-sh.acme/acme-sh.acme.cer
          openssl x509 -in acme-sh/acme-sh.acme/acme-sh.acme.cer -ext keyUsage -noout | grep "Key Encipherment, Data Encipherment"

      - name: "Enroll lego with profileID ACME_2"
        run: |
          sudo rm -rf lego/*
          docker run -i -v $PWD/lego:/.lego/ --rm --name lego --network acme goacme/lego run --tls-skip-verify -s https://acme-srv -a --email "lego@example.com" --user-agent profile_name=ACME_2 -d lego.acme --key-type rsa2048 --http
          sudo openssl verify -CAfile cert-2.pem -untrusted cert-1.pem lego/certificates/lego.acme.crt
          sudo openssl x509 -in lego/certificates/lego.acme.crt -ext keyUsage -noout | grep "Key Encipherment, Data Encipherment"

      - name: "Channel teardown"
        if: ${{ always() }}
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: container
          ARTIFACT_NAME: test-containers-useragent.tar.gz

  # Channel enrollments wait for the user-agent warmup, then run in parallel.
  # Children are workflow_call-only so the broker cannot skip preflight.
  containers:
    name: containers
    permissions:
      contents: read
      actions: write
    needs: [guard, test-containers-useragent]
    secrets: inherit
    uses: ./.github/workflows/_cahandler-asa-containers.yml
    with:
      run_id: ${{ inputs.run_id }}

  rpm:
    name: rpm
    permissions:
      contents: read
      actions: write
    needs: [guard, test-containers-useragent]
    secrets: inherit
    uses: ./.github/workflows/_cahandler-asa-rpm.yml
    with:
      run_id: ${{ inputs.run_id }}

  deb:
    name: deb
    permissions:
      contents: read
      actions: write
    needs: [guard, test-containers-useragent]
    secrets: inherit
    uses: ./.github/workflows/_cahandler-asa-deb.yml
    with:
      run_id: ${{ inputs.run_id }}
