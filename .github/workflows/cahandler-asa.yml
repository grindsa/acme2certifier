name: CA-Handler Tests - Insta ASA CA
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'
      run_id:
        description: 'Run ID of the producing workflow'
        required: true
        default: '0'
      sha:
        description: 'SHA of the commit to run the workflow on'
        required: true
        default: ''
      called_by_workflow:
        description: 'Name of the producing workflow'
        required: true
        default: 'manual-trigger'
      full_ref:
        description: 'Full git ref of the commit to run the workflow on'
        required: false
        default: ''

jobs:

  # ---------------------------------------------------------
  # Quick guard to validate incoming payload
  # ---------------------------------------------------------
  guard:
    runs-on: ubuntu-latest
    if: ${{ inputs.sha != '' && inputs.run_id != '' && inputs.branch != '' && github.repository == 'grindsa/acme2certifier' }}
    steps:
      - run: |
          echo "Triggered by SHA:    $SHA"
          echo "From branch:         $BRANCH"
          echo "Producer run_id:     $RUN_ID"
        env:
          SHA: ${{ inputs.sha }}
          BRANCH: ${{ inputs.branch }}
          RUN_ID: ${{ inputs.run_id }}

  # ---------------------------------------------------------
  # Fail fast if the shared Insta ASA endpoint is unreachable
  # ---------------------------------------------------------
  asa-preflight:
    needs: guard
    runs-on: ubuntu-latest
    if: github.repository == 'grindsa/acme2certifier'
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Parse ASA configuration"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.ASA_CFG }}
          uppercase: 'true'

      - name: "ASA API preflight"
        uses: ./.github/actions/wf_specific/asa_ca_handler/asa_preflight
        with:
          ASA_API_HOST: ${{ env.ASA_API_HOST }}
          ASA_API_USER: ${{ env.ASA_API_USER }}
          ASA_API_PASSWORD: ${{ env.ASA_API_PASSWORD }}
          ASA_API_KEY: ${{ env.ASA_API_KEY }}

  # ---------------------------------------------------------
  # test headerinfo feature for asa handler the first request
  # might fail for unknown reasons
  # ---------------------------------------------------------
  test-containers-useragent:
    needs: [guard, asa-preflight]
    runs-on: ubuntu-latest
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2']
        dbhandler: ['wsgi']
    steps:

      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Parse ASA configuration"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.ASA_CFG }}
          uppercase: 'true'

      - name: "Download and import container"
        uses: ./.github/actions/container_load
        with:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: a2c-${{ inputs.run_id }}.${{ matrix.websrv }}.${{ matrix.dbhandler }}.tar
          DESTINATION_PATH: /tmp
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Prepare container environment"
        uses: ./.github/actions/container_prep
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}
          CONTAINER_BUILD: false

      - name: "a2c configuration with standard profile"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.asa_ca_handler
          OPTIONS: |
            api_host: ${{ env.ASA_API_HOST }}
            api_user: ${{ env.ASA_API_USER }}
            api_password: ${{ env.ASA_API_PASSWORD }}
            api_key: ${{ env.ASA_API_KEY }}
            ca_name: ${{ env.ASA_CA_NAME }}
            ca_bundle: ${{ env.ASA_CA_BUNDLE }}
            request_timeout: 30
            request_retries: 3
            profile_name: ${{ env.ASA_PROFILE1 }}

      - name: "a2c configuration with standard profile (post-cfg)"
        run: |
          sudo cp test/ca/certsrv_ca_certs.pem examples/Docker/data/ca_certs.pem
          sudo sed -i "s/revocation_reason_check_disable: False/revocation_reason_check_disable: False\nenrollment_timeout:120/g" examples/Docker/data/acme_srv.cfg
          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nheader_info_list: [\"HTTP_USER_AGENT\"]/g" examples/Docker/data/acme_srv.cfg

      - name: "Bring up a2c container"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Wait for ACME directory (http)"
        uses: ./.github/actions/wait_for_directory
        with:
          CHECK_HTTPS: "false"

      - name: "Create lego folder"
        run: |
          mkdir lego

      - name: "Enroll lego with profileID ACME - could potentially fail"
        continue-on-error: True
        run: |
          docker run -i -v $PWD/lego:/.lego/ --rm --name lego --network acme goacme/lego run --tls-skip-verify -s https://acme-srv -a --email "lego@example.com" --user-agent profile_name=ACME -d lego.acme --key-type rsa2048 --http

      - name: "Enroll acme.sh with profileID ACME"
        run: |
          sudo rm -rf acme-sh/*
          docker run --rm -i -v "$(pwd)/acme-sh":/acme.sh --network acme --name=acme-sh neilpang/acme.sh:latest --issue --server http://acme-srv --accountemail 'acme-sh@example.com' -d acme-sh.acme --standalone --useragent profile_name=ACME --keylength 2048 --debug 3 --output-insecure
          awk 'BEGIN {c=0;} /BEGIN CERT/{c++} { print > "cert-" c ".pem"}' < acme-sh/acme-sh.acme/ca.cer
          openssl verify -CAfile cert-2.pem -untrusted cert-1.pem acme-sh/acme-sh.acme/acme-sh.acme.cer
          openssl x509 -in acme-sh/acme-sh.acme/acme-sh.acme.cer -ext keyUsage -noout | grep "Digital Signature"

      - name: "Enroll lego with profileID ACME"
        run: |
          sudo rm -rf lego/*
          docker run -i -v $PWD/lego:/.lego/ --rm --name lego --network acme goacme/lego run --tls-skip-verify -s https://acme-srv -a --email "lego@example.com" --user-agent profile_name=ACME -d lego.acme --key-type rsa2048 --http
          sudo openssl verify -CAfile cert-2.pem -untrusted cert-1.pem lego/certificates/lego.acme.crt
          sudo openssl x509 -in lego/certificates/lego.acme.crt -ext keyUsage -noout | grep "Digital Signature"

      - name: "Enroll acme.sh with profileID ACME_2"
        run: |
          docker run --rm -i -v "$(pwd)/acme-sh":/acme.sh --network acme --name=acme-sh neilpang/acme.sh:latest --renew --server http://acme-srv --force -d acme-sh.acme --standalone --useragent profile_name=ACME_2 --keylength 2048 --debug 3 --output-insecure
          openssl verify -CAfile cert-2.pem -untrusted cert-1.pem acme-sh/acme-sh.acme/acme-sh.acme.cer
          openssl x509 -in acme-sh/acme-sh.acme/acme-sh.acme.cer -ext keyUsage -noout | grep "Key Encipherment, Data Encipherment"

      - name: "Enroll lego with profileID ACME_2"
        run: |
          sudo rm -rf lego/*
          docker run -i -v $PWD/lego:/.lego/ --rm --name lego --network acme goacme/lego run --tls-skip-verify -s https://acme-srv -a --email "lego@example.com" --user-agent profile_name=ACME_2 -d lego.acme --key-type rsa2048 --http
          sudo openssl verify -CAfile cert-2.pem -untrusted cert-1.pem lego/certificates/lego.acme.crt
          sudo openssl x509 -in lego/certificates/lego.acme.crt -ext keyUsage -noout | grep "Key Encipherment, Data Encipherment"

      - name: "[ * ] Collecting test logs"
        if: ${{ failure() }}
        uses: ./.github/actions/collect_failure_logs
        with:
          DEPLOYMENT_TYPE: container

      - name: "Sanitize failure artifacts"
        if: ${{ failure() }}
        uses: ./.github/actions/sanitize_artifact_payload
        with:
          ARTIFACT_DIR: ${{ github.workspace }}/artifact
      - name: "[ * ] Uploading artifacts"
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: test-containers-useragent.tar.gz
          path: ${{ github.workspace }}/artifact/upload/
          retention-days: 1

      - name: "Secure cleanup"
        if: ${{ always() }}
        uses: ./.github/actions/secure_cleanup

  # ---------------------------------------------------------
  # Test container images (matrix from payload)
  # ---------------------------------------------------------


  test-containers:
    needs: [guard, test-containers-useragent]
    runs-on: ubuntu-latest
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        websrv: ['apache2', 'nginx']
        dbhandler: ['wsgi', 'django']
    steps:

      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Parse ASA configuration"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.ASA_CFG }}
          uppercase: 'true'

      - name: "Download and import container"
        uses: ./.github/actions/container_load
        with:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: a2c-${{ inputs.run_id }}.${{ matrix.websrv }}.${{ matrix.dbhandler }}.tar
          DESTINATION_PATH: /tmp
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Prepare container environment"
        uses: ./.github/actions/container_prep
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}
          CONTAINER_BUILD: false

      - name: "Profile $ASA_PROFILE1 - Setup a2c with asa_ca_handler with profile $ASA_PROFILE1"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.asa_ca_handler
          OPTIONS: |
            api_host: ${{ env.ASA_API_HOST }}
            api_user: ${{ env.ASA_API_USER }}
            api_password: ${{ env.ASA_API_PASSWORD }}
            api_key: ${{ env.ASA_API_KEY }}
            ca_name: ${{ env.ASA_CA_NAME }}
            ca_bundle: ${{ env.ASA_CA_BUNDLE }}
            request_timeout: 30
            request_retries: 3
            profile_name: ${{ env.ASA_PROFILE1 }}
            allowed_domainlist: ["bar.local", "*.acme"]

      - name: "Profile $ASA_PROFILE1 - Setup a2c with asa_ca_handler with profile $ASA_PROFILE1 (post-cfg)"
        run: |
          sudo cp test/ca/certsrv_ca_certs.pem examples/Docker/data/ca_certs.pem
          sudo sed -i "s/revocation_reason_check_disable: False/revocation_reason_check_disable: False\nenrollment_timeout:120/g" examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart

      - name: "Bring up a2c container"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "create folders"
        run: |
          mkdir lego
          mkdir acme-sh
          mkdir certbot

      - name: "$ASA_PROFILE1 - enrollment"
        uses: ./.github/actions/wf_specific/asa_ca_handler/enroll_profile_1

      - name: "Profile $ASA_PROFILE2 - Reconfiguration of a2c with a new profile"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.asa_ca_handler
          OPTIONS: |
            api_host: ${{ env.ASA_API_HOST }}
            api_user: ${{ env.ASA_API_USER }}
            api_password: ${{ env.ASA_API_PASSWORD }}
            api_key: ${{ env.ASA_API_KEY }}
            ca_name: ${{ env.ASA_CA_NAME }}
            ca_bundle: ${{ env.ASA_CA_BUNDLE }}
            request_timeout: 30
            request_retries: 3
            profile_name: ${{ env.ASA_PROFILE2 }}
            allowed_domainlist: ["bar.local", "*.acme"]

      - name: "Profile $ASA_PROFILE2 - Reconfiguration of a2c with a new profile (post-cfg)"
        run: |
          sudo cp test/ca/certsrv_ca_certs.pem examples/Docker/data/ca_certs.pem
          sudo sed -i "s/revocation_reason_check_disable: False/revocation_reason_check_disable: False\nenrollment_timeout:120/g" examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart

      - name: "$ASA_PROFILE2 - enrollment"
        uses: ./.github/actions/wf_specific/asa_ca_handler/enroll_profile_2

      - name: "Header-info - Setup asa_ca_handler with headerinfo"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.asa_ca_handler
          OPTIONS: |
            api_host: ${{ env.ASA_API_HOST }}
            api_user: ${{ env.ASA_API_USER }}
            api_password: ${{ env.ASA_API_PASSWORD }}
            api_key: ${{ env.ASA_API_KEY }}
            ca_name: ${{ env.ASA_CA_NAME }}
            ca_bundle: ${{ env.ASA_CA_BUNDLE }}
            request_timeout: 30
            request_retries: 3
            profile_name: ${{ env.ASA_PROFILE1 }}
            allowed_domainlist: ["bar.local", "*.acme"]

      - name: "Header-info - Setup asa_ca_handler with headerinfo (post-cfg)"
        run: |
          sudo cp test/ca/certsrv_ca_certs.pem examples/Docker/data/ca_certs.pem
          sudo sed -i "s/revocation_reason_check_disable: False/revocation_reason_check_disable: False\nenrollment_timeout:120/g" examples/Docker/data/acme_srv.cfg
          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nheader_info_list: [\"HTTP_USER_AGENT\"]/g" examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart

      - name: "Hederinfo - enrollment"
        uses: ./.github/actions/wf_specific/asa_ca_handler/enroll_headerinfo
        with:
          ASA_PROFILE1: ${{ env.ASA_PROFILE1 }}
          ASA_PROFILE2: ${{ env.ASA_PROFILE2 }}

      - name: "EAB without headerinfo - Setup asa_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.asa_ca_handler
          OPTIONS: |
            api_host: ${{ env.ASA_API_HOST }}
            api_user: ${{ env.ASA_API_USER }}
            api_password: ${{ env.ASA_API_PASSWORD }}
            api_key: ${{ env.ASA_API_KEY }}
            ca_name: ${{ env.ASA_CA_NAME }}
            ca_bundle: ${{ env.ASA_CA_BUNDLE }}
            request_timeout: 30
            request_retries: 3
            profile_name: ${{ env.ASA_PROFILE1 }}
          EXTRA_SECTIONS: |
            [EABhandler]
            eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler
            key_file: volume/kid_profiles.json
            eab_profiling: True

      - name: "Stage kid_profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/asa.json
          DEST: examples/Docker/data/kid_profiles.json
          ENVSUBST: "true"
      - name: "EAB without headerinfo - Setup asa_ca_handler (post-cfg)"
        run: |
          sudo cp test/ca/certsrv_ca_certs.pem examples/Docker/data/ca_certs.pem
          sudo sed -i "s/revocation_reason_check_disable: False/revocation_reason_check_disable: False\nenrollment_timeout:120/g" examples/Docker/data/acme_srv.cfg

          cd examples/Docker/
          docker compose restart

      - name: "EAB without headerinfo - enrollment"
        uses: ./.github/actions/wf_specific/asa_ca_handler/enroll_eab_wo_headerinfo
        with:
          ASA_CA_NAME1: ${{ env.ASA_CA_NAME1 }}
          ASA_CA_NAME2: ${{ env.ASA_CA_NAME2 }}

      - name: "EAB with headerinfo - Setup asa_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.asa_ca_handler
          OPTIONS: |
            api_host: ${{ env.ASA_API_HOST }}
            api_user: ${{ env.ASA_API_USER }}
            api_password: ${{ env.ASA_API_PASSWORD }}
            api_key: ${{ env.ASA_API_KEY }}
            ca_name: ${{ env.ASA_CA_NAME }}
            ca_bundle: ${{ env.ASA_CA_BUNDLE }}
            request_timeout: 30
            request_retries: 3
            profile_name: ${{ env.ASA_PROFILE1 }}
          EXTRA_SECTIONS: |
            [EABhandler]
            eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler
            key_file: volume/kid_profiles.json
            eab_profiling: True

      - name: "Stage kid_profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/asa.json
          DEST: examples/Docker/data/kid_profiles.json
          ENVSUBST: "true"
      - name: "EAB with headerinfo - Setup asa_ca_handler (post-cfg)"
        run: |
          sudo cp test/ca/certsrv_ca_certs.pem examples/Docker/data/ca_certs.pem
          sudo sed -i "s/revocation_reason_check_disable: False/revocation_reason_check_disable: False\nenrollment_timeout:120/g" examples/Docker/data/acme_srv.cfg
          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nheader_info_list: [\"HTTP_USER_AGENT\"]/g" examples/Docker/data/acme_srv.cfg

          cd examples/Docker/
          docker compose restart

      - name: "EAB with headerinfo - enrollment"
        uses: ./.github/actions/wf_specific/asa_ca_handler/enroll_eab_w_headerinfo
        with:
          ASA_CA_NAME1: ${{ env.ASA_CA_NAME1 }}
          ASA_CA_NAME2: ${{ env.ASA_CA_NAME2 }}

      - name: "ACME Profile - Setup asa_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.asa_ca_handler
          OPTIONS: |
            api_host: ${{ env.ASA_API_HOST }}
            api_user: ${{ env.ASA_API_USER }}
            api_password: ${{ env.ASA_API_PASSWORD }}
            api_key: ${{ env.ASA_API_KEY }}
            ca_name: ${{ env.ASA_CA_NAME }}
            ca_bundle: ${{ env.ASA_CA_BUNDLE }}
            request_timeout: 30
            request_retries: 3
            profile_name: ${{ env.ASA_PROFILE1 }}
            allowed_domainlist: ["bar.local", "*.acme"]

      - name: "ACME Profile - Setup asa_ca_handler (post-cfg)"
        run: |
          sudo cp test/ca/certsrv_ca_certs.pem examples/Docker/data/ca_certs.pem
          sudo sed -i "s/revocation_reason_check_disable: False/revocation_reason_check_disable: False\nenrollment_timeout:120/g" examples/Docker/data/acme_srv.cfg
          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nprofiles={\"$ASA_PROFILE1\": \"http:\/\/foo.bar\/profile1\", \"$ASA_PROFILE2\": \"http:\/\/foo.bar\/profile2\", \"profile3\": \"http:\/\/foo.bar\/profile3\"}/g" examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart

      - name: "ACME Profile - enrollment"
        uses: ./.github/actions/wf_specific/asa_ca_handler/enroll_acmeprofile
        with:
          ASA_PROFILE1: ${{ env.ASA_PROFILE1 }}
          ASA_PROFILE2: ${{ env.ASA_PROFILE2 }}

      - name: "EAB ACME Profiling - Setup asa_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.asa_ca_handler
          OPTIONS: |
            api_host: ${{ env.ASA_API_HOST }}
            api_user: ${{ env.ASA_API_USER }}
            api_password: ${{ env.ASA_API_PASSWORD }}
            api_key: ${{ env.ASA_API_KEY }}
            ca_name: ${{ env.ASA_CA_NAME }}
            ca_bundle: ${{ env.ASA_CA_BUNDLE }}
            request_timeout: 30
            request_retries: 3
            profile_name: ${{ env.ASA_PROFILE1 }}
          EXTRA_SECTIONS: |
            [EABhandler]
            eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler
            key_file: volume/kid_profiles.json
            eab_profiling: True

      - name: "Stage kid_profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/asa.json
          DEST: examples/Docker/data/kid_profiles.json
          ENVSUBST: "true"
      - name: "EAB ACME Profiling - Setup asa_ca_handler (post-cfg)"
        run: |
          sudo cp test/ca/certsrv_ca_certs.pem examples/Docker/data/ca_certs.pem
          sudo sed -i "s/revocation_reason_check_disable: False/revocation_reason_check_disable: False\nenrollment_timeout:120/g" examples/Docker/data/acme_srv.cfg
          sudo sed -i "s/tnauthlist_support: False/tnauthlist_support: False\nprofiles={\"$ASA_PROFILE1\": \"http:\/\/foo.bar\/profile1\", \"$ASA_PROFILE2\": \"http:\/\/foo.bar\/profile2\", \"profile3\": \"http:\/\/foo.bar\/profile3\"}/g" examples/Docker/data/acme_srv.cfg

          cd examples/Docker/
          docker compose restart

      - name: "EAB ACME Profiling - enrollment"
        uses: ./.github/actions/wf_specific/asa_ca_handler/enroll_eab_acmeprofile
        with:
          ASA_CA_NAME1: ${{ env.ASA_CA_NAME1 }}
          ASA_CA_NAME2: ${{ env.ASA_CA_NAME2 }}
          ASA_PROFILE1: ${{ env.ASA_PROFILE1 }}

      - name: "Check container configuration"
        uses: ./.github/actions/container_check
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "[ * ] Collecting test logs"
        if: ${{ failure() }}
        uses: ./.github/actions/collect_failure_logs
        with:
          DEPLOYMENT_TYPE: container

      - name: "Sanitize failure artifacts"
        if: ${{ failure() }}
        uses: ./.github/actions/sanitize_artifact_payload
        with:
          ARTIFACT_DIR: ${{ github.workspace }}/artifact
      - name: "[ * ] Uploading artifacts"
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: container-tests-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz
          path: ${{ github.workspace }}/artifact/upload/
          retention-days: 1

      - name: "Secure cleanup"
        if: ${{ always() }}
        uses: ./.github/actions/secure_cleanup

  # ---------------------------------------------------------
  # Test RPMs (EL8 & EL9) downloaded from the producer run
  # ---------------------------------------------------------


  test-rpm:
    needs: [guard, test-containers-useragent]
    runs-on: ubuntu-latest
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        rhversion: [8, 9]
        mode: ['wsgi', 'django']

    steps:

      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Parse JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.GH_CFG }}

      - name: "Parse ASA configuration"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.ASA_CFG }}
          uppercase: 'true'

      - name: "Prepare Alma environment"
        uses: ./.github/actions/rpm_prep
        with:
          GH_USER: ${{ env.GH_USER }}
          GH_SBOM_REPO_TOKEN: ${{ env.GH_SBOM_REPO_TOKEN }}
          RH_VERSION: ${{ matrix.rhversion }}
          RPM_BUILD: false

