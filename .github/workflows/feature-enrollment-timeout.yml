name: Feature Tests - Asynchronous enrollment and certificate re-usage
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'
      run_id:
        description: 'Run ID of the producing workflow'
        required: true
        default: '0'
      sha:
        description: 'SHA of the commit to run the workflow on'
        required: true
        default: ''
      called_by_workflow:
        description: 'Name of the producing workflow'
        required: true
        default: 'manual-trigger'
      full_ref:
        description: 'Full git ref of the commit to run the workflow on'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ inputs.branch }}
  cancel-in-progress: true

permissions: {}

jobs:

  # ---------------------------------------------------------
  # Quick guard to validate incoming payload
  # ---------------------------------------------------------
  guard:
    permissions: {}
    uses: ./.github/workflows/_guard.yml
    with:
      sha: ${{ inputs.sha }}
      run_id: ${{ inputs.run_id }}
      branch: ${{ inputs.branch }}

  # -----------------------------------------------------------
  # Test container images - enrollment timeout and cert re-usage
  # -----------------------------------------------------------
  test-containers-timeout-cert-reusage:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        dbhandler: ['wsgi', 'django']

    steps:
      - name: "Channel setup"
        uses: ./.github/actions/channel_container_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          WEB_SRV: ${{ matrix.websrv }}
          DB_HANDLER: ${{ matrix.dbhandler }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          NAME_SPACE: acme
          DJANGO_DB: psql

      - name: "create folders"
        run: |
          mkdir lego
          mkdir acme-sh
          mkdir certbot

      - name: "Setup openssl ca_handler"
        uses: ./.github/actions/setup_openssl_cahandler
        with:
          VOLUME_DIR: "examples/Docker/data"

      - name: "Configure openssl ca_handler"
        run: |
          sudo cp acme2certifier/cahandlers/openssl_ca_handler.py examples/Docker/data/ca_handler.py
          sudo chmod 777 examples/Docker/data/ca_handler.py
          sudo sed -i "s/import uuid/import uuid\\nimport time/g" examples/Docker/data/ca_handler.py
          sudo sed -i "s/        cert_raw = None/        cert_raw = None\\n        time.sleep(30)/g" examples/Docker/data/ca_handler.py
          sudo chmod 777 examples/Docker/data/acme_srv.cfg
          sudo sed -i "s/handler_module: acme2certifier.cahandlers.openssl_ca_handler/handler_file: \/var\/www\/acme2certifier\/volume\/ca_handler.py/g" examples/Docker/data/acme_srv.cfg
          sudo sed -i "s/revocation_reason_check_disable: False/revocation_reason_check_disable: False\ncert_reusage_timeframe: 300\nenrollment_timeout: 15\ncert_operations_log: True/g" examples/Docker/data/acme_srv.cfg

      - name: "Bring up a2c container"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Enrollment"
        uses: ./.github/actions/wf_specific/enrollment_timeout/enroll

      - name: "Channel teardown"
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: container
          ARTIFACT_NAME: test-containers-timeout-cert-reusage-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz

  test-containers-async:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        dbhandler: ['django']
        django_db: ['psql', 'mariadb']

    steps:
      - name: "Channel setup"
        uses: ./.github/actions/channel_container_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          WEB_SRV: ${{ matrix.websrv }}
          DB_HANDLER: django
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          DJANGO_DB: ${{ matrix.django_db }}

      - name: "create folders"
        run: |
          mkdir lego
          mkdir acme-sh
          mkdir certbot

      - name: "Setup openssl ca_handler"
        uses: ./.github/actions/setup_openssl_cahandler
        with:
          VOLUME_DIR: "examples/Docker/data"

      - name: "Configure openssl ca_handler"
        run: |
          sudo cp acme2certifier/cahandlers/openssl_ca_handler.py examples/Docker/data/ca_handler.py
          sudo chmod 777 examples/Docker/data/ca_handler.py
          sudo sed -i "s/import uuid/import uuid\\nimport time/g" examples/Docker/data/ca_handler.py
          sudo sed -i "s/        cert_raw = None/        cert_raw = None\\n        time.sleep(20)/g" examples/Docker/data/ca_handler.py
          sudo chmod 777 examples/Docker/data/acme_srv.cfg
          sudo sed -i "s/handler_module: acme2certifier.cahandlers.openssl_ca_handler/handler_file: \/var\/www\/acme2certifier\/volume\/ca_handler.py/g" examples/Docker/data/acme_srv.cfg
          sudo sed -i "s/revocation_reason_check_disable: False/revocation_reason_check_disable: False\ncert_reusage_timeframe: 300\nenrollment_timeout: 15\ncert_operations_log: True/g" examples/Docker/data/acme_srv.cfg
          sudo sed -i "s/debug: True/debug: True\nasync_mode: True/g" examples/Docker/data/acme_srv.cfg

      - name: "Bring up a2c container"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Test enrollment"
        uses: ./.github/actions/acme_clients

      - name: "Check logs for async enrollment messages (challenge validation)"
        uses: ./.github/actions/logs_assert
        with:
          DEPLOYMENT_TYPE: container
          PATTERN: "Challenge validation started asynchronously"
          FLUSH: "false"

      - name: "Check logs for async enrollment messages (enrollment started)"
        uses: ./.github/actions/logs_assert
        with:
          DEPLOYMENT_TYPE: container
          PATTERN: "asynchronous enrollment started"

      - name: "Channel teardown"
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: container
          ARTIFACT_NAME: test-containers-async-${{ matrix.websrv }}-${{ matrix.django_db }}.tar.gz

  test-rpm-timeout-cert-reusage:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        rhversion: [8, 9]
        mode: ['wsgi', 'django']

    steps:
      - name: "Channel setup"
        uses: ./.github/actions/channel_rpm_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          RH_VERSION: ${{ matrix.rhversion }}
          JSON_SECRET: ${{ secrets.GH_CFG }}

      - name: "Setup openssl ca_handler"
        uses: ./.github/actions/setup_openssl_cahandler

      - name: "Configure openssl ca_handler"
        run: |
          sudo cp acme2certifier/cahandlers/openssl_ca_handler.py data/volume/acme_ca/ca_handler.py
          sudo chmod 777 data/volume/acme_ca/ca_handler.py
          sudo sed -i "s/import uuid/import uuid\\nimport time/g" data/volume/acme_ca/ca_handler.py
          # sudo sed -i "s/        cert_raw = None/        cert_raw = None\\n        time.sleep(15)/g" data/volume/acme_ca/ca_handler.py
          sudo sed -i "s/        cert_raw = None/        cert_raw = None\\n        self.logger.debug('CAhandler.enroll(): timeout start')\\n        time.sleep(30)\\n        self.logger.debug('CAhandler.enroll(): timeout done')/g" data/volume/acme_ca/ca_handler.py
          sudo chmod 777 data/volume/acme_srv.cfg
          sudo sed -i "s/revocation_reason_check_disable: False/revocation_reason_check_disable: False\ncert_reusage_timeframe: 1800\nenrollment_timeout: 15\ncert_operations_log: True/g" data/volume/acme_srv.cfg
          # sudo sed -i "s/retry_after_timeout: 15/retry_after_timeout: 30\nenrollment_timeout: 15/g" data/volume/acme_srv.cfg
          sudo sed -i "s/handler_module: acme2certifier.cahandlers.openssl_ca_handler/handler_file: \/opt\/acme2certifier\/volume\/acme_ca\/ca_handler.py/g" data/volume/acme_srv.cfg

      - name: "Execute install script"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh install -m $MODE
        env:
          MODE: ${{ matrix.mode }}

      - name: "Enrollment"
        uses: ./.github/actions/wf_specific/enrollment_timeout/enroll
        with:
          DEPLOYMENT_TYPE: "rpm"

      - name: "[ * ] Collecting extra failure logs"
        if: ${{ failure() }}
        run: |
          mkdir -p ${{ github.workspace }}/artifact ${{ github.workspace }}/artifact/data
          docker exec acme-srv tar cvfz /tmp/acme2certifier/nginx.tgz /etc/nginx
          docker exec postgresdbsrv pg_dump -U postgres  acme2certifier  > data/acme2certifier.sql
          docker exec acme-srv rpm -qa > ${{ github.workspace }}/artifact/data/packages.txt

      - name: "Channel teardown"
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: rpm
          ARTIFACT_NAME: test-rpm-timeout-cert-reusage-rh${{ matrix.rhversion }}.tar.gz

  # -------------------------------------------------------------
  # Test RPMs (EL8 & EL9)  - async enrollment
  # -------------------------------------------------------------


  test-rpm-async:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        rhversion: [8, 9]
        mode: ['django']
        django_db: ['psql', 'mariadb']

    steps:
      - name: "Channel setup"
        uses: ./.github/actions/channel_rpm_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          RH_VERSION: ${{ matrix.rhversion }}
          JSON_SECRET: ${{ secrets.GH_CFG }}
          DJANGO_DB: ${{ matrix.django_db }}

      - name: "Setup openssl ca_handler"
        uses: ./.github/actions/setup_openssl_cahandler

      - name: "Configure openssl ca_handler"
        run: |
          sudo cp acme2certifier/cahandlers/openssl_ca_handler.py data/volume/acme_ca/ca_handler.py
          sudo chmod 777 data/volume/acme_ca/ca_handler.py
          sudo sed -i "s/import uuid/import uuid\\nimport time/g" data/volume/acme_ca/ca_handler.py
          # sudo sed -i "s/        cert_raw = None/        cert_raw = None\\n        time.sleep(15)/g" data/volume/acme_ca/ca_handler.py
          sudo sed -i "s/        cert_raw = None/        cert_raw = None\\n        self.logger.debug('CAhandler.enroll(): timeout start')\\n        time.sleep(20)\\n        self.logger.debug('CAhandler.enroll(): timeout done')/g" data/volume/acme_ca/ca_handler.py
          sudo chmod 777 data/volume/acme_srv.cfg
          sudo sed -i "s/revocation_reason_check_disable: False/revocation_reason_check_disable: False\ncert_reusage_timeframe: 1800\nenrollment_timeout: 15\ncert_operations_log: True/g" data/volume/acme_srv.cfg
          # sudo sed -i "s/retry_after_timeout: 15/retry_after_timeout: 30\nenrollment_timeout: 15/g" data/volume/acme_srv.cfg
          sudo sed -i "s/handler_module: acme2certifier.cahandlers.openssl_ca_handler/handler_file: \/opt\/acme2certifier\/volume\/acme_ca\/ca_handler.py/g" data/volume/acme_srv.cfg
          sudo sed -i "s/debug: True/debug: True\nasync_mode: True/g" data/volume/acme_srv.cfg

      - name: "Execute install script"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh install -m $MODE
        env:
          MODE: ${{ matrix.mode }}

      - name: "Test enrollment"
        uses: ./.github/actions/acme_clients

      - name: "Check logs for async enrollment messages (challenge validation)"
        uses: ./.github/actions/logs_assert
        with:
          DEPLOYMENT_TYPE: rpm
          PATTERN: "Challenge validation started asynchronously"
          FLUSH: "false"

      - name: "Check logs for async enrollment messages (enrollment started)"
        uses: ./.github/actions/logs_assert
        with:
          DEPLOYMENT_TYPE: rpm
          PATTERN: "asynchronous enrollment started"

      - name: "[ * ] Collecting extra failure logs"
        if: ${{ failure() }}
        run: |
          mkdir -p ${{ github.workspace }}/artifact ${{ github.workspace }}/artifact/data
          docker exec acme-srv tar cvfz /tmp/acme2certifier/nginx.tgz /etc/nginx
          docker exec acme-srv rpm -qa > ${{ github.workspace }}/artifact/data/packages.txt

      - name: "Channel teardown"
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: rpm
          ARTIFACT_NAME: test-rpm-async-rh${{ matrix.rhversion }}-${{ matrix.django_db }}.tar.gz
