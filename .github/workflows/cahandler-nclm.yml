concurrency:
  group: ${{ github.workflow }}-${{ inputs.branch }}
  cancel-in-progress: true

permissions: {}

jobs:
  guard:
    permissions: {}
    uses: ./.github/workflows/_guard.yml
    with:
      sha: ${{ inputs.sha }}
      run_id: ${{ inputs.run_id }}
      branch: ${{ inputs.branch }}

  # ---------------------------------------------------------
  # Test container images (matrix from payload)
  # ---------------------------------------------------------
  test-containers:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        dbhandler: ['wsgi', 'django']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v7

      - name: "Channel setup"
        uses: ./.github/actions/channel_container_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          WEB_SRV: ${{ matrix.websrv }}
          DB_HANDLER: ${{ matrix.dbhandler }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          NAME_SPACE: acme

      - name: "Parse NCLM configuration from JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.NCLM_CFG }}

      - name: "Parse SSH tunnel configuration"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.SSH_TUNNEL_CFG }}
          uppercase: 'true'

      - name: "Generate UUID"
        run: |
          echo UUID=$(uuidgen | cut -d "-" -f1) >> $GITHUB_ENV
      - run: echo "UUID ${{ env.UUID }}"

      - name: "Setup tunnel"
        uses: ./.github/actions/wf_specific/nclm_ca_handler/tunnel_setup
        with:
          SSH_USER: ${{ env.SSH_USER }}
          SSH_HOST: ${{ env.SSH_HOST }}
          SSH_PORT: ${{ env.SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ env.SSH_KNOWN_HOSTS }}
          SSH_KEY: ${{ env.SSH_KEY }}
          NCLM_API_HOST: ${{ env.NCLM_API_HOST }}
          NCLM_API_USER: ${{ env.NCLM_API_USER }}
          NCLM_API_PASSWORD: ${{ env.NCLM_API_PASSWORD }}

      - name: "Setup a2c with nclm_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.nclm_ca_handler
          OPTIONS: |
            api_host: https://forwarder.acme:4000
            api_user: ${{ env.NCLM_API_USER }}
            api_password: ${{ env.NCLM_API_PASSWORD }}
            tsg_name: ${{ env.NCLM_TSG_NAME }}
            ca_name: ${{ env.NCLM_CA_NAME }}
            ca_id_list: [${{ env.NCLM_CA_ID_LIST }}]
            ca_bundle: False
            request_timeout: 40
            allowed_domainlist: ["bar.local", "*.acme"]

      - name: "Setup a2c with nclm_ca_handler (post-cfg)"
        run: |
          sudo cp test/ca/certsrv_ca_certs.pem examples/Docker/data/ca_certs.pem
          sudo sed -i "s/revocation_reason_check_disable: False/revocation_reason_check_disable: False\nenrollment_timeout: 40/g" examples/Docker/data/acme_srv.cfg

      - name: "Bring up a2c container"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Test enrollment"
        uses: ./.github/actions/acme_clients_enroll
        with:
          HOSTNAME_SUFFIX: -${{ env.UUID }}
          VERIFY_CERT: false
          TEST_ADL: "true"

      - name: "Verify allowed_domainlist error"
        uses: ./.github/actions/logs_assert
        with:
          DEPLOYMENT_TYPE: container
          PATTERN: "FQDN/SAN [^ ]+ not allowed by configuration"
          REGEX: "true"
          IGNORE_CASE: "true"

      - name: "Generate UUID"
        run: |
          echo UUID=$(uuidgen | cut -d "-" -f1) >> $GITHUB_ENV
      - run: echo "UUID ${{ env.UUID }}"

      - name: "Reconfigure nclm handler to test enrollment from MSCA"
        run: |
          sudo sed -i "s/ca_name: $NCLM_CA_NAME/ca_name: $NCLM_MSCA_NAME/g" examples/Docker/data/acme_srv.cfg
          sudo echo "template_name: $NCLM_MSCA_TEMPLATE_NAME" >> examples/Docker/data/acme_srv.cfg
          cd examples/Docker/
          docker compose restart

      - name: "Test enrollment"
        uses: ./.github/actions/acme_clients_enroll
        with:
          USE_RSA: true
          HOSTNAME_SUFFIX: -${{ env.UUID }}

      - name: "[ * ] Collecting extra failure logs"
        if: ${{ failure() }}
        run: |
          mkdir -p ${{ github.workspace }}/artifact/clients
          sudo cp -rp acme-sh/ ${{ github.workspace }}/artifact/clients/acme-sh/ || true
          sudo cp -rp certbot/ ${{ github.workspace }}/artifact/clients/certbot/ || true
          sudo cp -rp lego/ ${{ github.workspace }}/artifact/clients/lego/ || true

      - name: "Channel teardown"
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: container
          ARTIFACT_NAME: container-tests-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz

  # ---------------------------------------------------------
  # Test RPMs (EL8 & EL9) downloaded from the producer run
  # ---------------------------------------------------------


  test-rpm:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        rhversion: [8, 9]
        mode: ['wsgi', 'django']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v7

      - name: "Channel setup"
        uses: ./.github/actions/channel_rpm_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          RH_VERSION: ${{ matrix.rhversion }}
          JSON_SECRET: ${{ secrets.GH_CFG }}

      - name: "Parse NCLM configuration from JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.NCLM_CFG }}

      - name: "Parse SSH tunnel configuration"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.SSH_TUNNEL_CFG }}
          uppercase: 'true'

      - name: "Generate UUID"
        run: |
          echo UUID=$(uuidgen | cut -d "-" -f1) >> $GITHUB_ENV
      - run: echo "UUID ${{ env.UUID }}"

      - name: "Setup tunnel"
        uses: ./.github/actions/wf_specific/nclm_ca_handler/tunnel_setup
        with:
          SSH_USER: ${{ env.SSH_USER }}
          SSH_HOST: ${{ env.SSH_HOST }}
          SSH_PORT: ${{ env.SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ env.SSH_KNOWN_HOSTS }}
          SSH_KEY: ${{ env.SSH_KEY }}
          NCLM_API_HOST: ${{ env.NCLM_API_HOST }}
          NCLM_API_USER: ${{ env.NCLM_API_USER }}
          NCLM_API_PASSWORD: ${{ env.NCLM_API_PASSWORD }}

      - name: "Setup a2c with with nclm_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.nclm_ca_handler
          OPTIONS: |
            api_host: ${{ env.NCLM_API_HOST }}
            api_user: ${{ env.NCLM_API_USER }}
            api_password: ${{ env.NCLM_API_PASSWORD }}
            tsg_name: ${{ env.NCLM_TSG_NAME }}
            ca_name: ${{ env.NCLM_CA_NAME }}
            ca_id_list: [${{ env.NCLM_CA_ID_LIST }}]
            ca_bundle: False
            request_timeout: 40
            allowed_domainlist: ["bar.local", "*.acme"]

      - name: "Setup a2c with with nclm_ca_handler (post-cfg)"
        run: |
          sudo mkdir -p data/volume/acme_ca/certs
          sudo cp test/ca/certsrv_ca_certs.pem data/volume/acme_ca/ca_certs.pem
          sudo sed -i "s/revocation_reason_check_disable: False/revocation_reason_check_disable: False\nenrollment_timeout: 60/g" data/volume/acme_srv.cfg

      - name: "Execute install script"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh install -m $MODE
        env:
          MODE: ${{ matrix.mode }}

      - name: "Test enrollment"
        uses: ./.github/actions/acme_clients_enroll
        with:
          HOSTNAME_SUFFIX: -${{ env.UUID }}
          VERIFY_CERT: false
          TEST_ADL: "true"

      - name: "Verify allowed_domainlist error"
        uses: ./.github/actions/logs_assert
        with:
          DEPLOYMENT_TYPE: rpm
          PATTERN: "FQDN/SAN [^ ]+ not allowed by configuration"
          REGEX: "true"
          IGNORE_CASE: "true"

      - name: "Generate UUID"
        run: |
          echo UUID=$(uuidgen | cut -d "-" -f1) >> $GITHUB_ENV
      - run: echo "UUID ${{ env.UUID }}"

      - name: "Reconfigure nclm handler to test enrollment from MSCA"
        run: |
          sudo sed -i "s/ca_name: $NCLM_CA_NAME/ca_name: $NCLM_MSCA_NAME/g" data/volume/acme_srv.cfg
          sudo echo "template_name: $NCLM_MSCA_TEMPLATE_NAME" >> data/volume/acme_srv.cfg

      - name: "Reconfigure a2c "
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart
        env:
          MODE: ${{ matrix.mode }}

      - name: "Test enrollment"
        uses: ./.github/actions/acme_clients_enroll
        with:
          USE_RSA: true
          HOSTNAME_SUFFIX: -${{ env.UUID }}

      - name: "[ * ] Collecting extra failure logs"
        if: ${{ failure() }}
        continue-on-error: true
        run: |
          mkdir -p ${{ github.workspace }}/artifact/clients
          sudo cp -rp acme-sh/ ${{ github.workspace }}/artifact/clients/acme-sh/ || true
          sudo cp -rp certbot/ ${{ github.workspace }}/artifact/clients/certbot/ || true
          sudo cp -rp lego/ ${{ github.workspace }}/artifact/clients/lego/ || true

      - name: "Channel teardown"
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: rpm
          ARTIFACT_NAME: test-rpm-rh${{ matrix.rhversion }}-${{ matrix.mode }}.tar.gz

  test-deb:
    permissions:
      contents: read
      actions: write
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: ['apache2', 'nginx']
        mode: ['wsgi', 'django']

    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v7

      - name: "Channel setup"
        uses: ./.github/actions/channel_deb_setup
        with:
          RUN_ID: ${{ inputs.run_id }}
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}
          DJANGO_DB: ${{ matrix.mode == 'django' && 'psql' || '' }}

      - name: "Parse NCLM configuration from JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.NCLM_CFG }}

      - name: "Parse SSH tunnel configuration"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.SSH_TUNNEL_CFG }}
          uppercase: 'true'

      - name: "Generate UUID"
        run: |
          echo UUID=$(uuidgen | cut -d "-" -f1) >> $GITHUB_ENV
      - run: echo "UUID ${{ env.UUID }}"

      - name: "Setup tunnel"
        uses: ./.github/actions/wf_specific/nclm_ca_handler/tunnel_setup
        with:
          SSH_USER: ${{ env.SSH_USER }}
          SSH_HOST: ${{ env.SSH_HOST }}
          SSH_PORT: ${{ env.SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ env.SSH_KNOWN_HOSTS }}
          SSH_KEY: ${{ env.SSH_KEY }}
          NCLM_API_HOST: ${{ env.NCLM_API_HOST }}
          NCLM_API_USER: ${{ env.NCLM_API_USER }}
          NCLM_API_PASSWORD: ${{ env.NCLM_API_PASSWORD }}

      - name: "Setup a2c with with nclm_ca_handler"
        uses: ./.github/actions/setup_cahandler_cfg
        with:
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.nclm_ca_handler
          OPTIONS: |
            api_host: https://forwarder.acme:4000
            api_user: ${{ env.NCLM_API_USER }}
            api_password: ${{ env.NCLM_API_PASSWORD }}
            tsg_name: ${{ env.NCLM_TSG_NAME }}
            ca_name: ${{ env.NCLM_CA_NAME }}
            ca_id_list: [${{ env.NCLM_CA_ID_LIST }}]
            ca_bundle: False
            request_timeout: 40
            allowed_domainlist: ["bar.local", "*.acme"]

      - name: "Setup a2c with with nclm_ca_handler (post-cfg)"
        run: |
          sudo mkdir -p data/volume/acme_ca/certs
          sudo cp test/ca/certsrv_ca_certs.pem data/volume/acme_ca/ca_certs.pem
          # sudo echo "api_host: $NCLM_API_HOST" >> data/volume/acme_srv.cfg
          sudo sed -i "s/revocation_reason_check_disable: False/revocation_reason_check_disable: False\nenrollment_timeout: 60/g" data/volume/acme_srv.cfg

      - name: "Execute install script"
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh install $WEBSRV -m $MODE
        env:
          WEBSRV: ${{ matrix.websrv }}
          MODE: ${{ matrix.mode }}

      - name: "Test enrollment"
        uses: ./.github/actions/acme_clients_enroll
        with:
          HOSTNAME_SUFFIX: -${{ env.UUID }}
          VERIFY_CERT: false
          TEST_ADL: "true"

      - name: "Reconfigure nclm handler to test enrollment from MSCA"
        run: |
          sudo sed -i "s/ca_name: $NCLM_CA_NAME/ca_name: $NCLM_MSCA_NAME/g" data/volume/acme_srv.cfg
          sudo echo "template_name: $NCLM_MSCA_TEMPLATE_NAME" >> data/volume/acme_srv.cfg

      - name: "Reconfigure a2c "
        run: |
          docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh restart $WEBSRV
        env:
          WEBSRV: ${{ matrix.websrv }}
          MODE: ${{ matrix.mode }}

      - name: "Test enrollment"
        uses: ./.github/actions/acme_clients_enroll
        with:
          USE_RSA: true
          HOSTNAME_SUFFIX: -${{ env.UUID }}

      - name: "Channel teardown"
        uses: ./.github/actions/channel_teardown
        with:
          DEPLOYMENT_TYPE: deb
          ARTIFACT_NAME: test-deb-${{ matrix.websrv }}-${{ matrix.mode }}.tar.gz
          WEBSRV: ${{ matrix.websrv }}
