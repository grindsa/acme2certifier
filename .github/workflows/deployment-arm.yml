name: Deployment Tests - arm64

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run the workflow on"
        required: true
        default: "main"
      run_id:
        description: "Run ID of the producing workflow"
        required: true
        default: "0"
      sha:
        description: "SHA of the commit to run the workflow on"
        required: true
        default: ""
      called_by_workflow:
        description: "Name of the producing workflow"
        required: true
        default: "manual-trigger"
      full_ref:
        description: "Full git ref of the commit to run the workflow on"
        required: false
        default: ""

concurrency:
  group: deployment-arm-${{ github.repository }}-${{ inputs.run_id }}-${{ inputs.sha }}
  cancel-in-progress: false

permissions: {}

jobs:
  guard:
    permissions: {}
    uses: ./.github/workflows/_guard.yml
    with:
      sha: ${{ inputs.sha }}
      run_id: ${{ inputs.run_id }}
      branch: ${{ inputs.branch }}

  # Build natively on arm64 and run enrollment tests (no AWS / SSH).
  build_test:
    name: build_test (${{ matrix.websrv }}-${{ matrix.dbhandler }})
    needs: guard
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      actions: write
    timeout-minutes: 60
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      matrix:
        websrv: [apache2, nginx]
        dbhandler: [wsgi, django]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download DEB artifact from producer run
        uses: ./.github/actions/download_artifact
        with:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: acme2certifier-${{ inputs.run_id }}-1_all.deb
          DESTINATION_PATH: ./
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: Prepare container environment
        uses: ./.github/actions/container_prep
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}
          CONTAINER_BUILD: "false"
          NAME_SPACE: acme

      - name: Setup openssl ca_handler
        uses: ./.github/actions/setup_openssl_cahandler
        with:
          VOLUME_DIR: examples/Docker/data

      - name: Build container (native arm64)
        uses: ./.github/actions/container_build
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: Bring up container
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}
          NAME_SPACE: acme

      - name: Wait for ACME directory
        uses: ./.github/actions/wait_for_directory
        with:
          ACME_SERVER: acme-srv
          NAME_SPACE: acme
          HTTP_PORT: "80"

      - name: Enrollment tests (acme.sh / certbot / lego)
        uses: ./.github/actions/acme_clients
        with:
          ACME_SERVER: acme-srv
          NAME_SPACE: acme
          HOSTNAME_SUFFIX: -${{ matrix.websrv }}-${{ matrix.dbhandler }}-arm64
          REVOCATION: "true"
          RENEWAL: "false"
          VERIFY_CERT: "true"
          USE_CERTBOT: "true"
          USE_LEGO: "true"
          USE_RSA: "false"
          HTTP_PORT: "80"
          HTTPS_PORT: "443"

      - name: Collect failure logs
        if: failure()
        uses: ./.github/actions/collect_failure_logs
        with:
          DEPLOYMENT_TYPE: container

      - name: "Sanitize failure artifacts"
        if: ${{ failure() }}
        uses: ./.github/actions/sanitize_artifact_payload
        with:
          ARTIFACT_DIR: ${{ github.workspace }}/artifact
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz
          path: ${{ github.workspace }}/artifact/upload/
          retention-days: 1
          if-no-files-found: ignore


      - name: Tear down container
        if: always()
        uses: ./.github/actions/container_down
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}
          NAME_SPACE: acme

      - name: "Secure cleanup"
        if: ${{ always() }}
        uses: ./.github/actions/secure_cleanup
