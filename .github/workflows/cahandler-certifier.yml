name: CA-Handler Tests - Insta Certifier
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'
      run_id:
        description: 'Run ID of the producing workflow'
        required: true
        default: '0'
      sha:
        description: 'SHA of the commit to run the workflow on'
        required: true
        default: ''
      called_by_workflow:
        description: 'Name of the producing workflow'
        required: true
        default: 'manual-trigger'
      full_ref:
        description: 'Full git ref of the commit to run the workflow on'
        required: false
        default: ''

jobs:
  guard:
    runs-on: ubuntu-latest
    if: ${{ inputs.sha != '' && inputs.run_id != '' && inputs.branch != '' && github.repository == 'grindsa/acme2certifier' }}
    steps:
      - run: |
          echo "Triggered by SHA:    $SHA"
          echo "From branch:         $BRANCH"
          echo "Producer run_id:     $RUN_ID"
        env:
          SHA: ${{ inputs.sha }}
          BRANCH: ${{ inputs.branch }}
          RUN_ID: ${{ inputs.run_id }}

  instance_start:
    needs: guard
    runs-on: ubuntu-latest
    # Shared NCM AWS host; keep in sync with instance_stop skip logic.
    if: ${{ github.repository == 'grindsa/acme2certifier' && (inputs.branch == 'master' || inputs.branch == 'devel' || contains(inputs.branch, 'wf_pip') || contains(inputs.branch, 'certifier')) }}
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Parse AWS_CFG JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.AWS_CFG }}

      - name: "Parse NCM_CFG JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.NCM_CFG }}

      - name: "Start AWS instance for testing"
        uses: ./.github/actions/aws_instance_manage
        with:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_INSTANCE_ID: ${{ env.AWS_X64-UB-01_INSTANCE_ID }}
          ACTION: "start"
          IGNORE_CURRENT_STATUS: "false"

      - name: "Prepare ssh environment in ramdisk"
        run: |
          set -euo pipefail
          sudo mkdir -p /tmp/rd
          sudo mount -t tmpfs -o size=5M none /tmp/rd || true
          printf '%s\n' "$SSH_KEY" | sudo tee /tmp/rd/ak.tmp >/dev/null
          printf '%s\n' "$SSH_KNOWN_HOSTS" | sudo tee /tmp/rd/known_hosts >/dev/null
          sudo chmod 600 /tmp/rd/ak.tmp
          # Allow runner user to read the key (avoid sudo ssh).
          sudo chown "$(id -u):$(id -g)" /tmp/rd/ak.tmp /tmp/rd/known_hosts

      - name: "Wait for instance public IP + SSH"
        run: |
          set -euo pipefail
          # Prefer the live EC2 public IP: DNS (SSH_HOST) can lag after stop/start.
          INSTANCE_ID="${{ env.AWS_X64-UB-01_INSTANCE_ID }}"
          REGION="${{ env.AWS_REGION }}"
          DNS_HOST="${{ env.SSH_HOST }}"
          DNS_IP="$(getent ahostsv4 "$DNS_HOST" | awk '{print $1; exit}' || true)"
          echo "SSH_HOST DNS ${DNS_HOST} -> ${DNS_IP:-unresolved}"

          PUBLIC_IP=""
          for i in $(seq 1 40); do
            STATE="$(aws ec2 describe-instances --region "$REGION" --instance-ids "$INSTANCE_ID" \
              --query 'Reservations[0].Instances[0].State.Name' --output text)"
            PUBLIC_IP="$(aws ec2 describe-instances --region "$REGION" --instance-ids "$INSTANCE_ID" \
              --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)"
            echo "attempt ${i}/40 state=${STATE} public_ip=${PUBLIC_IP}"
            if [[ "$STATE" == "running" && -n "$PUBLIC_IP" && "$PUBLIC_IP" != "None" ]]; then
              break
            fi
            sleep 5
            PUBLIC_IP=""
          done
          if [[ -z "$PUBLIC_IP" || "$PUBLIC_IP" == "None" ]]; then
            echo "ERROR: instance has no public IP yet" >&2
            exit 1
          fi
          if [[ -n "$DNS_IP" && "$DNS_IP" != "$PUBLIC_IP" ]]; then
            echo "WARNING: DNS ${DNS_IP} != EC2 public IP ${PUBLIC_IP}; using EC2 IP for SSH"
          fi
          echo "SSH_CONNECT_HOST=${PUBLIC_IP}" >> "$GITHUB_ENV"

          # System status checks (sshd typically up once these pass).
          aws ec2 wait instance-status-ok --region "$REGION" --instance-ids "$INSTANCE_ID" || true

          ssh_cmd() {
            ssh -i /tmp/rd/ak.tmp -p "${{ env.SSH_PORT }}" \
              -o BatchMode=yes \
              -o ConnectTimeout=10 \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/tmp/rd/known_hosts \
              "${{ env.SSH_USER }}@${PUBLIC_IP}" "$@"
          }
          for i in $(seq 1 30); do
            if ssh_cmd true; then
              echo "SSH ready after ${i} attempt(s) via ${PUBLIC_IP}"
              exit 0
            fi
            echo "SSH attempt ${i}/30 to ${PUBLIC_IP} failed; retrying..."
            sleep 3
          done
          echo "ERROR: SSH not ready on ${PUBLIC_IP} (DNS was ${DNS_IP:-unknown})" >&2
          ssh -v -i /tmp/rd/ak.tmp -p "${{ env.SSH_PORT }}" \
            -o BatchMode=yes -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/tmp/rd/known_hosts \
            "${{ env.SSH_USER }}@${PUBLIC_IP}" true || true
          exit 1

      - name: "start ncm on remote instance"
        run: |
          ssh -i /tmp/rd/ak.tmp -p ${{ env.SSH_PORT }} \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/tmp/rd/known_hosts \
            ${{ env.SSH_USER }}@${{ env.SSH_CONNECT_HOST }} \
            "/usr/local/bin/ncm_mgr.sh start"


  # max-parallel: 1 — single shared NCM AWS instance via SSH tunnel
  test-containers:
    needs: [guard, instance_start]
    runs-on: ubuntu-latest
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        websrv: ['apache2', 'nginx']
        dbhandler: ['wsgi', 'django']
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Parse AWS_CFG JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.AWS_CFG }}

      - name: "Parse NCM configuration from JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.NCM_CFG }}

      - name: "Download and import container"
        uses: ./.github/actions/container_load
        with:
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: a2c-${{ inputs.run_id }}.${{ matrix.websrv }}.${{ matrix.dbhandler }}.tar
          DESTINATION_PATH: /tmp
          TOKEN: ${{ secrets.GH_WF_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Prepare container environment"
        uses: ./.github/actions/container_prep
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}
          CONTAINER_BUILD: false

      - name: "Setup tunnel"
        uses: ./.github/actions/wf_specific/certifier_ca_handler/tunnel_setup
        with:
          SSH_USER: ${{ env.SSH_USER }}
          SSH_HOST: ${{ env.SSH_HOST }}
          SSH_PORT: ${{ env.SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ env.SSH_KNOWN_HOSTS }}
          SSH_KEY: ${{ env.SSH_KEY }}
          NCM_API_HOST: ${{ env.NCM_API_HOST }}
          NCM_API_USER: ${{ env.NCM_API_USER }}
          NCM_API_PASSWORD: ${{ env.NCM_API_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_INSTANCE_ID: ${{ env.AWS_X64-UB-01_INSTANCE_ID }}

      - name: "No profile - Setup a2c"
        uses: ./.github/actions/wf_specific/certifier_ca_handler/reconfigure
        with:
          DEPLOYMENT_TYPE: container
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.certifier_ca_handler
          RESTART: "false"
          COPY_CA_CERTS: "true"
          CERTIFICATE_OPTIONS: |
            enrollment_timeout: 15
          OPTIONS: |
            api_host: https://forwarder.acme:8084
            ca_bundle: False
            api_user: ${{ env.NCM_API_USER }}
            api_password: ${{ env.NCM_API_PASSWORD }}
            ca_name: ${{ env.NCM_CA_NAME }}
            allowed_domainlist: ["bar.local", "*.acme"]

      - name: "Bring up a2c container"
        uses: ./.github/actions/container_up
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "No profile - Enrollment"
        uses: ./.github/actions/wf_specific/certifier_ca_handler/enroll_no_profile

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "Profile 101 - Setup a2c"
        uses: ./.github/actions/wf_specific/certifier_ca_handler/reconfigure
        with:
          DEPLOYMENT_TYPE: container
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.certifier_ca_handler
          RESTART: "true"
          COPY_CA_CERTS: "false"
          CERTIFICATE_OPTIONS: |
            enrollment_timeout: 15
          OPTIONS: |
            api_host: https://forwarder.acme:8084
            ca_bundle: False
            api_user: ${{ env.NCM_API_USER }}
            api_password: ${{ env.NCM_API_PASSWORD }}
            ca_name: ${{ env.NCM_CA_NAME }}
            profile_id: 101

      - name: "Profile 101 - Enrollment"
        uses: ./.github/actions/wf_specific/certifier_ca_handler/enroll_101_profile

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "Profile 102 - Setup a2c"
        uses: ./.github/actions/wf_specific/certifier_ca_handler/reconfigure
        with:
          DEPLOYMENT_TYPE: container
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.certifier_ca_handler
          RESTART: "true"
          COPY_CA_CERTS: "false"
          CERTIFICATE_OPTIONS: |
            enrollment_timeout: 15
          OPTIONS: |
            api_host: https://forwarder.acme:8084
            ca_bundle: False
            api_user: ${{ env.NCM_API_USER }}
            api_password: ${{ env.NCM_API_PASSWORD }}
            ca_name: ${{ env.NCM_CA_NAME }}
            profile_id: 102

      - name: "Profile 102 - Enrollment"
        uses: ./.github/actions/wf_specific/certifier_ca_handler/enroll_102_profile

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "Header-info - Setup a2c"
        uses: ./.github/actions/wf_specific/certifier_ca_handler/reconfigure
        with:
          DEPLOYMENT_TYPE: container
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.certifier_ca_handler
          RESTART: "true"
          COPY_CA_CERTS: "false"
          CERTIFICATE_OPTIONS: |
            enrollment_timeout: 15
          ORDER_OPTIONS: |
            header_info_list: ["HTTP_USER_AGENT"]
          OPTIONS: |
            api_host: https://forwarder.acme:8084
            ca_bundle: False
            api_user: ${{ env.NCM_API_USER }}
            api_password: ${{ env.NCM_API_PASSWORD }}
            ca_name: ${{ env.NCM_CA_NAME }}

      - name: "Header-info - Enrollment"
        uses: ./.github/actions/wf_specific/certifier_ca_handler/enroll_headerinfo

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "EAB without headerinfo - Setup a2c"
        uses: ./.github/actions/wf_specific/certifier_ca_handler/reconfigure
        with:
          DEPLOYMENT_TYPE: container
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.certifier_ca_handler
          RESTART: "false"
          COPY_CA_CERTS: "false"
          CERTIFICATE_OPTIONS: |
            enrollment_timeout: 15
          OPTIONS: |
            api_host: https://forwarder.acme:8084
            ca_bundle: False
            api_user: ${{ env.NCM_API_USER }}
            api_password: ${{ env.NCM_API_PASSWORD }}
            ca_name: ${{ env.NCM_CA_NAME }}
            profile_id: 100
          EXTRA_SECTIONS: |
            [EABhandler]
            eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler
            key_file: volume/kid_profiles.json
            eab_profiling: True

      - name: "Stage kid_profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/certifier.json
          DEST: examples/Docker/data/kid_profiles.json

      - name: "Restart a2c"
        run: |
          cd examples/Docker/
          docker compose restart

      - name: "EAB without headerinfo - Enrollment"
        uses: ./.github/actions/wf_specific/certifier_ca_handler/enroll_eab_wo_headerinfo

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "EAB with headerinfo - Setup a2c"
        uses: ./.github/actions/wf_specific/certifier_ca_handler/reconfigure
        with:
          DEPLOYMENT_TYPE: container
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.certifier_ca_handler
          RESTART: "false"
          COPY_CA_CERTS: "false"
          CERTIFICATE_OPTIONS: |
            enrollment_timeout: 15
          ORDER_OPTIONS: |
            header_info_list: ["HTTP_USER_AGENT"]
          OPTIONS: |
            api_host: https://forwarder.acme:8084
            ca_bundle: False
            api_user: ${{ env.NCM_API_USER }}
            api_password: ${{ env.NCM_API_PASSWORD }}
            ca_name: ${{ env.NCM_CA_NAME }}
            profile_id: 100
          EXTRA_SECTIONS: |
            [EABhandler]
            eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler
            key_file: volume/kid_profiles.json
            eab_profiling: True

      - name: "Stage kid_profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/certifier.json
          DEST: examples/Docker/data/kid_profiles.json

      - name: "Restart a2c"
        run: |
          cd examples/Docker/
          docker compose restart

      - name: "EAB with headerinfo - Enrollment"
        uses: ./.github/actions/wf_specific/certifier_ca_handler/enroll_eab_w_headerinfo

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "EAB with headerinfo - Reconfigure key_file without restarting"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/certifier_reconfigured.json
          DEST: examples/Docker/data/kid_profiles.json

      - name: "EAB with headerinfo - Enrollment after reconfiguration"
        uses: ./.github/actions/wf_specific/certifier_ca_handler/enroll_eab_w_headerinfo
        with:
          RECONFIGURE: true

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "kid-file in yaml format - Reconfiguration"
        run: |
          sudo sed -i "s/kid_profiles.json/kid_profiles.yml/g" examples/Docker/data/acme_srv.cfg
          sudo cp .github/actions/wf_specific/eab_profiling/fixtures/certifier_reconfigured.yml examples/Docker/data/kid_profiles.yml
          sudo chmod 777 examples/Docker/data/kid_profiles.yml
          sudo rm -f examples/Docker/data/kid_profiles.json

      - name: "kid-file in yaml format - Enrollment after reconfiguration"
        uses: ./.github/actions/wf_specific/certifier_ca_handler/enroll_eab_w_headerinfo
        with:
          RECONFIGURE: true

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "ACME Profile - Setup a2c"
        uses: ./.github/actions/wf_specific/certifier_ca_handler/reconfigure
        with:
          DEPLOYMENT_TYPE: container
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.certifier_ca_handler
          RESTART: "true"
          COPY_CA_CERTS: "false"
          CERTIFICATE_OPTIONS: |
            enrollment_timeout: 15
          ORDER_OPTIONS: |
            profiles={"101": "http://foo.bar/profile1", "102": "http://foo.bar/profile2", "profile3": "http://foo.bar/profile3"}
          OPTIONS: |
            api_host: https://forwarder.acme:8084
            ca_bundle: False
            api_user: ${{ env.NCM_API_USER }}
            api_password: ${{ env.NCM_API_PASSWORD }}
            ca_name: ${{ env.NCM_CA_NAME }}
            enrollment_config_log: True

      - name: "ACME Profile - Enrollment"
        uses: ./.github/actions/wf_specific/certifier_ca_handler/enroll_acmeprofile

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "EAB ACME Profile - Setup a2c"
        uses: ./.github/actions/wf_specific/certifier_ca_handler/reconfigure
        with:
          DEPLOYMENT_TYPE: container
          VOLUME_DIR: "examples/Docker/data"
          HANDLER_MODULE: acme2certifier.cahandlers.certifier_ca_handler
          RESTART: "false"
          COPY_CA_CERTS: "false"
          CERTIFICATE_OPTIONS: |
            enrollment_timeout: 15
            cert_operations_log: True
          ORDER_OPTIONS: |
            profiles={"101": "http://foo.bar/profile1", "102": "http://foo.bar/profile2", "profile3": "http://foo.bar/profile3"}
          OPTIONS: |
            api_host: https://forwarder.acme:8084
            ca_bundle: False
            api_user: ${{ env.NCM_API_USER }}
            api_password: ${{ env.NCM_API_PASSWORD }}
            ca_name: ${{ env.NCM_CA_NAME }}
            profile_id: 100
            enrollment_config_log: True
          EXTRA_SECTIONS: |
            [EABhandler]
            eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler
            key_file: volume/kid_profiles.json
            eab_profiling: True

      - name: "Stage kid_profiles"
        uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
        with:
          SOURCE: .github/actions/wf_specific/eab_profiling/fixtures/certifier.json
          DEST: examples/Docker/data/kid_profiles.json

      - name: "Restart a2c"
        run: |
          cd examples/Docker/
          docker compose restart

      - name: "EAB ACME Profile - Enrollment"
        uses: ./.github/actions/wf_specific/certifier_ca_handler/enroll_eab_w_acmeprofile
        with:
          DEPLOYMENT_TYPE: container

      - name: "Check container configuration"
        uses: ./.github/actions/container_check
        with:
          DB_HANDLER: ${{ matrix.dbhandler }}
          WEB_SRV: ${{ matrix.websrv }}

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: container

      - name: "[ * ] Collecting test logs"
        if: ${{ failure() }}
        uses: ./.github/actions/collect_failure_logs
        with:
          DEPLOYMENT_TYPE: container

      - name: "[ * ] Uploading artifacts"
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: test-containers-${{ matrix.websrv }}-${{ matrix.dbhandler }}.tar.gz
          path: ${{ github.workspace }}/artifact/upload/

  test-rpm:
    needs: [guard, instance_start]
    runs-on: ubuntu-latest
    if: github.repository == 'grindsa/acme2certifier'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        rhversion: [8, 9]
        mode: ['wsgi', 'django']
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: Parse GitHub secrets from JSON
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.GH_CFG }}

      - name: "Parse AWS_CFG JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.AWS_CFG }}

      - name: "Parse NCM configuration from JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.NCM_CFG }}

      - name: "Prepare Alma environment"
        uses: ./.github/actions/rpm_prep
        with:
          GH_USER: ${{ env.GH_USER }}
          GH_SBOM_REPO_TOKEN: ${{ env.GH_SBOM_REPO_TOKEN }}
          RH_VERSION: ${{ matrix.rhversion }}

      - name: "Setup tunnel"
        uses: ./.github/actions/wf_specific/certifier_ca_handler/tunnel_setup
        with:
          SSH_USER: ${{ env.SSH_USER }}
          SSH_HOST: ${{ env.SSH_HOST }}
          SSH_PORT: ${{ env.SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ env.SSH_KNOWN_HOSTS }}
          SSH_KEY: ${{ env.SSH_KEY }}
          NCM_API_HOST: ${{ env.NCM_API_HOST }}
          NCM_API_USER: ${{ env.NCM_API_USER }}
          NCM_API_PASSWORD: ${{ env.NCM_API_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_INSTANCE_ID: ${{ env.AWS_X64-UB-01_INSTANCE_ID }}

      - name: "No profile - Setup a2c"
        uses: ./.github/actions/wf_specific/certifier_ca_handler/reconfigure
        with:
          DEPLOYMENT_TYPE: rpm
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.certifier_ca_handler
          RESTART: "false"
          COPY_CA_CERTS: "true"
          CERTIFICATE_OPTIONS: |
            enrollment_timeout: 15
          OPTIONS: |
            api_host: https://forwarder.acme:8084
            ca_bundle: False
            api_user: ${{ env.NCM_API_USER }}
            api_password: ${{ env.NCM_API_PASSWORD }}
            ca_name: ${{ env.NCM_CA_NAME }}
            allowed_domainlist: ["bar.local", "*.acme"]

      - name: "Execute install script"
        run: docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh install -m $MODE
        env:
          MODE: ${{ matrix.mode }}

      - name: "No profile - Enrollment"
        uses: ./.github/actions/wf_specific/certifier_ca_handler/enroll_no_profile

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: rpm

      - name: "Profile 101 - Setup a2c"
        uses: ./.github/actions/wf_specific/certifier_ca_handler/reconfigure
        with:
          DEPLOYMENT_TYPE: rpm
          VOLUME_DIR: "data/volume"
          HANDLER_MODULE: acme2certifier.cahandlers.certifier_ca_handler
          RESTART: "true"
          COPY_CA_CERTS: "false"
          CERTIFICATE_OPTIONS: |
            enrollment_timeout: 15
          OPTIONS: |
            api_host: https://forwarder.acme:8084
            ca_bundle: False
            api_user: ${{ env.NCM_API_USER }}
            api_password: ${{ env.NCM_API_PASSWORD }}
            ca_name: ${{ env.NCM_CA_NAME }}
            profile_id: 101

      - name: "Profile 101 - Enrollment"
        uses: ./.github/actions/wf_specific/certifier_ca_handler/enroll_101_profile

      - name: "Flush logs"
        uses: ./.github/actions/logs_flush
        with:
          DEPLOYMENT_TYPE: rpm

