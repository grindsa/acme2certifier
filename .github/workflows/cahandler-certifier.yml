name: CA-Handler Tests - Insta Certifier
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'
      run_id:
        description: 'Run ID of the producing workflow'
        required: true
        default: '0'
      sha:
        description: 'SHA of the commit to run the workflow on'
        required: true
        default: ''
      called_by_workflow:
        description: 'Name of the producing workflow'
        required: true
        default: 'manual-trigger'
      full_ref:
        description: 'Full git ref of the commit to run the workflow on'
        required: false
        default: ''

concurrency:
  # Shared NCM EC2: serialize across branches so master+devel cannot start the same box.
  group: ncm-ec2
  cancel-in-progress: false

permissions: {}

jobs:
  guard:
    permissions: {}
    uses: ./.github/workflows/_guard.yml
    with:
      sha: ${{ inputs.sha }}
      run_id: ${{ inputs.run_id }}
      branch: ${{ inputs.branch }}

  instance_start:
    permissions:
      contents: read
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Shared NCM AWS host; keep in sync with instance_stop skip logic.
    if: ${{ github.repository == 'grindsa/acme2certifier' && (inputs.branch == 'master' || inputs.branch == 'devel' || contains(inputs.branch, 'wf_devel') || contains(inputs.branch, 'certifier')) }}
    outputs:
      # Live EC2 public IP captured after start; prefer over DNS (often stale post stop/start).
      public_ip: ${{ steps.wait_ip.outputs.public_ip }}
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v7

      - name: "Parse AWS_CFG JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.AWS_CFG }}

      - name: "Parse NCM_CFG JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.NCM_CFG }}

      - name: "Start AWS instance for testing"
        uses: ./.github/actions/aws_instance_manage
        with:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_INSTANCE_ID: ${{ env.AWS_X64-UB-01_INSTANCE_ID }}
          ACTION: "start"
          IGNORE_CURRENT_STATUS: "false"

      - name: "Prepare ssh environment in ramdisk"
        run: |
          set -euo pipefail
          sudo mkdir -p /tmp/rd
          sudo mount -t tmpfs -o size=5M none /tmp/rd || true
          printf '%s\n' "$SSH_KEY" | sudo tee /tmp/rd/ak.tmp >/dev/null
          printf '%s\n' "$SSH_KNOWN_HOSTS" | sudo tee /tmp/rd/known_hosts >/dev/null
          sudo chmod 600 /tmp/rd/ak.tmp
          # Allow runner user to read the key (avoid sudo ssh).
          sudo chown "$(id -u):$(id -g)" /tmp/rd/ak.tmp /tmp/rd/known_hosts

      - name: "Wait for instance public IP + SSH"
        id: wait_ip
        run: |
          set -euo pipefail
          # Prefer the live EC2 public IP: DNS (SSH_HOST) can lag after stop/start.
          INSTANCE_ID="${{ env.AWS_X64-UB-01_INSTANCE_ID }}"
          REGION="${{ env.AWS_REGION }}"
          DNS_HOST="${{ env.SSH_HOST }}"
          DNS_IP="$(getent ahostsv4 "$DNS_HOST" | awk '{print $1; exit}' || true)"
          echo "SSH_HOST DNS ${DNS_HOST} -> ${DNS_IP:-unresolved}"

          PUBLIC_IP=""
          for i in $(seq 1 40); do
            STATE="$(aws ec2 describe-instances --region "$REGION" --instance-ids "$INSTANCE_ID" \
              --query 'Reservations[0].Instances[0].State.Name' --output text)"
            PUBLIC_IP="$(aws ec2 describe-instances --region "$REGION" --instance-ids "$INSTANCE_ID" \
              --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)"
            echo "attempt ${i}/40 state=${STATE} public_ip=${PUBLIC_IP}"
            if [[ "$STATE" == "running" && -n "$PUBLIC_IP" && "$PUBLIC_IP" != "None" ]]; then
              break
            fi
            sleep 5
            PUBLIC_IP=""
          done
          if [[ -z "$PUBLIC_IP" || "$PUBLIC_IP" == "None" ]]; then
            echo "ERROR: instance has no public IP yet" >&2
            exit 1
          fi
          if [[ -n "$DNS_IP" && "$DNS_IP" != "$PUBLIC_IP" ]]; then
            echo "WARNING: DNS ${DNS_IP} != EC2 public IP ${PUBLIC_IP}; using EC2 IP for SSH"
          fi
          echo "SSH_CONNECT_HOST=${PUBLIC_IP}" >> "$GITHUB_ENV"
          echo "public_ip=${PUBLIC_IP}" >> "$GITHUB_OUTPUT"

          # System status checks (sshd typically up once these pass).
          aws ec2 wait instance-status-ok --region "$REGION" --instance-ids "$INSTANCE_ID" || true

          ssh_cmd() {
            ssh -i /tmp/rd/ak.tmp -p "${{ env.SSH_PORT }}" \
              -o BatchMode=yes \
              -o ConnectTimeout=10 \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/tmp/rd/known_hosts \
              "${{ env.SSH_USER }}@${PUBLIC_IP}" "$@"
          }
          for i in $(seq 1 30); do
            if ssh_cmd true; then
              echo "SSH ready after ${i} attempt(s) via ${PUBLIC_IP}"
              exit 0
            fi
            echo "SSH attempt ${i}/30 to ${PUBLIC_IP} failed; retrying..."
            sleep 3
          done
          echo "ERROR: SSH not ready on ${PUBLIC_IP} (DNS was ${DNS_IP:-unknown})" >&2
          ssh -v -i /tmp/rd/ak.tmp -p "${{ env.SSH_PORT }}" \
            -o BatchMode=yes -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/tmp/rd/known_hosts \
            "${{ env.SSH_USER }}@${PUBLIC_IP}" true || true
          exit 1

      - name: "start ncm on remote instance"
        run: |
          ssh -i /tmp/rd/ak.tmp -p ${{ env.SSH_PORT }} \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/tmp/rd/known_hosts \
            ${{ env.SSH_USER }}@${{ env.SSH_CONNECT_HOST }} \
            "/usr/local/bin/ncm_mgr.sh start"


  # max-parallel: 1 — single shared NCM AWS instance via SSH tunnel

  # REST enrollments (container / rpm / deb). CMPv2 waits for this reusable
  # to finish so the parent can keep a single instance_start / instance_stop.
  rest:
    name: REST
    permissions:
      contents: read
      actions: write
    needs: [guard, instance_start]
    secrets: inherit
    uses: ./.github/workflows/_cahandler-certifier-rest.yml
    with:
      run_id: ${{ inputs.run_id }}
      public_ip: ${{ needs.instance_start.outputs.public_ip }}

  cmpv2:
    name: CMPv2
    permissions:
      contents: read
      actions: write
    needs: [guard, instance_start, rest]
    secrets: inherit
    uses: ./.github/workflows/_cahandler-certifier-cmpv2.yml
    with:
      run_id: ${{ inputs.run_id }}
      public_ip: ${{ needs.instance_start.outputs.public_ip }}

  instance_stop:
    permissions:
      contents: read
    needs: [guard, instance_start, rest, cmpv2]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ always() && needs.instance_start.result != 'skipped' && github.repository == 'grindsa/acme2certifier' }}
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v7

      - name: "Parse AWS_CFG JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.AWS_CFG }}

      - name: "Parse NCM_CFG JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.NCM_CFG }}

      - name: "Prepare ssh environment in ramdisk"
        run: |
          set -euo pipefail
          sudo mkdir -p /tmp/rd
          sudo mount -t tmpfs -o size=5M none /tmp/rd || true
          printf '%s\n' "$SSH_KEY" | sudo tee /tmp/rd/ak.tmp >/dev/null
          printf '%s\n' "$SSH_KNOWN_HOSTS" | sudo tee /tmp/rd/known_hosts >/dev/null
          sudo chmod 600 /tmp/rd/ak.tmp
          sudo chown "$(id -u):$(id -g)" /tmp/rd/ak.tmp /tmp/rd/known_hosts

      - name: "Resolve SSH connect host"
        run: |
          set -euo pipefail
          # Prefer IP captured by instance_start (avoids DNS lag and a second EC2 lookup).
          PUBLIC_IP="${{ needs.instance_start.outputs.public_ip }}"
          if [[ -n "$PUBLIC_IP" && "$PUBLIC_IP" != "None" ]]; then
            echo "Using instance_start public IP ${PUBLIC_IP}"
          else
            echo "WARNING: instance_start.public_ip empty; falling back to EC2 describe-instances"
            aws configure set aws_access_key_id "${{ env.AWS_ACCESS_KEY_ID }}"
            aws configure set aws_secret_access_key "${{ env.AWS_SECRET_ACCESS_KEY }}"
            aws configure set default.region "${{ env.AWS_REGION }}"
            INSTANCE_ID="${{ env.AWS_X64-UB-01_INSTANCE_ID }}"
            REGION="${{ env.AWS_REGION }}"
            PUBLIC_IP="$(aws ec2 describe-instances --region "$REGION" --instance-ids "$INSTANCE_ID" \
              --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)"
            if [[ -z "$PUBLIC_IP" || "$PUBLIC_IP" == "None" ]]; then
              echo "ERROR: instance has no public IP" >&2
              exit 1
            fi
            echo "Using EC2 public IP ${PUBLIC_IP}"
          fi
          echo "SSH_CONNECT_HOST=${PUBLIC_IP}" >> "$GITHUB_ENV"

      - name: "Stop ncm on remote instance"
        # Best-effort: instance may still be stopped below even if SSH fails.
        continue-on-error: true
        run: |
          ssh -i /tmp/rd/ak.tmp -p ${{ env.SSH_PORT }} \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/tmp/rd/known_hosts \
            ${{ env.SSH_USER }}@${{ env.SSH_CONNECT_HOST }} \
            "/usr/local/bin/ncm_mgr.sh stop"

      - name: "Stop AWS instance for testing"
        if: always()
        uses: ./.github/actions/aws_instance_manage
        with:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_INSTANCE_ID: ${{ env.AWS_X64-UB-01_INSTANCE_ID }}
          ACTION: "stop"
          IGNORE_CURRENT_STATUS: "false"
