          awk 'BEGIN {c=0;} /BEGIN CERT/{c++} { print > "cert-" c ".pem"}' < acme-sh/acme-sh.acme_ecc/ca.cer
          openssl verify -CAfile cert-2.pem -untrusted cert-1.pem acme-sh/acme-sh.acme_ecc/acme-sh.acme.cer
          sudo rm -rf acme-sh/* || true

      - name: "Allowed domainlist feature - Enroll lego (fail)"
        continue-on-error: true
        id: legofail02
        run: |
          docker run -i --rm -v $PWD/lego:/.lego/ --name lego --network acme goacme/lego run -s  https://acme-srv --tls-skip-verify -a --email "lego@example.com" -d lego --tls

      - name: "Allowed domainlist feature - check result"
        if: ${{ steps.legofail02.outcome != 'failure' }}
        run: |
          echo "legofail outcome is ${{ steps.legofail02.outcome }}"
          exit 1

      - name: "[ * ] Collecting test logs"
        if: ${{ failure() }}
        uses: ./.github/actions/collect_failure_logs
        with:
          DEPLOYMENT_TYPE: deb
          WEBSRV: ${{ matrix.websrv }}

      - name: "[ * ] Uploading artifacts"
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: test-cmpv2-deb-${{ matrix.websrv }}-${{ matrix.mode }}.tar.gz
          path: ${{ github.workspace }}/artifact/upload/

  instance_stop:
    needs: [guard, instance_start, test-containers, test-deb, test-rpm, test-cmpv2-containers, test-cmpv2-deb, test-cmpv2-rpm]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.instance_start.result != 'skipped' && github.repository == 'grindsa/acme2certifier' }}
    steps:
      - name: "checkout GIT"
        uses: actions/checkout@v6

      - name: "Parse AWS_CFG JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.AWS_CFG }}

      - name: "Parse NCM_CFG JSON secret"
        uses: ./.github/actions/parse-json-secret
        with:
          json_secret: ${{ secrets.NCM_CFG }}

      - name: "Prepare ssh environment in ramdisk"
        run: |
          set -euo pipefail
          sudo mkdir -p /tmp/rd
          sudo mount -t tmpfs -o size=5M none /tmp/rd || true
          printf '%s\n' "$SSH_KEY" | sudo tee /tmp/rd/ak.tmp >/dev/null
          printf '%s\n' "$SSH_KNOWN_HOSTS" | sudo tee /tmp/rd/known_hosts >/dev/null
          sudo chmod 600 /tmp/rd/ak.tmp
          sudo chown "$(id -u):$(id -g)" /tmp/rd/ak.tmp /tmp/rd/known_hosts

      - name: "Resolve instance public IP"
        run: |
          set -euo pipefail
          aws configure set aws_access_key_id "${{ env.AWS_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ env.AWS_SECRET_ACCESS_KEY }}"
          aws configure set default.region "${{ env.AWS_REGION }}"
          INSTANCE_ID="${{ env.AWS_X64-UB-01_INSTANCE_ID }}"
          REGION="${{ env.AWS_REGION }}"
          PUBLIC_IP="$(aws ec2 describe-instances --region "$REGION" --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)"
          if [[ -z "$PUBLIC_IP" || "$PUBLIC_IP" == "None" ]]; then
            echo "ERROR: instance has no public IP" >&2
            exit 1
          fi
          echo "SSH_CONNECT_HOST=${PUBLIC_IP}" >> "$GITHUB_ENV"
          echo "Using EC2 public IP ${PUBLIC_IP}"

      - name: "Stop ncm on remote instance"
        run: |
          ssh -i /tmp/rd/ak.tmp -p ${{ env.SSH_PORT }} \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/tmp/rd/known_hosts \
            ${{ env.SSH_USER }}@${{ env.SSH_CONNECT_HOST }} \
            "/usr/local/bin/ncm_mgr.sh stop"

      - name: "Stop AWS instance for testing"
        uses: ./.github/actions/aws_instance_manage
        with:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_INSTANCE_ID: ${{ env.AWS_X64-UB-01_INSTANCE_ID }}
          ACTION: "stop"
          IGNORE_CURRENT_STATUS: "false"
