name: "rpm_prep"
description: "Prepare environment for RPM installation"
inputs:
  GH_USER:
    description: "GIT user for SBOM repo"
    required: true
  GH_SBOM_REPO_TOKEN:
    description: "GIT token for SBOM repo"
    required: true
  RH_VERSION:
    description: "RHEL version"
    required: true
  DJANGO_DB:
    description: "Django database"
  RPM_BUILD:
    description: "Build RPM"
    required: true
    default: "true"
  NAME_SPACE:
    description: "Name space"
    required: true
    default: "acme"
  IPV6:
    description: "IPv6"
    required: true
    default: "false"

runs:
  using: "composite"
  steps:

    - name: "Build rpm package"
      if: inputs.RPM_BUILD == 'true'
      id: rpm_build
      uses: ./.github/actions/rpm_build

    - name: "Generate keys and certificates"
      uses: ./.github/actions/cert_gen

    - name: "Setup environment for alma installation"
      run: |
        echo "IPv6 is $IPV6"
        if [ "$IPV6" == "false" ]; then
          echo "create v4 namespace"
          docker network create $NAME_SPACE
        else
          echo "create v6 namespace"
          docker network create $NAME_SPACE --ipv6 --subnet "fdbb:6445:65b4:0a60::/64"
        fi
        sudo mkdir -p data/volume
        sudo mkdir -p data/acme2certifier
        sudo mkdir -p data/nginx
        sudo chmod -R 777 data
        sudo cp examples/install_scripts/a2c-rpm.sh data/a2c-rpm.sh
        sudo chmod a+rx data/a2c-rpm.sh
        sudo touch data/.a2c_ci
        # Nginx SSL vhost uses ${APP_ROOT}/volume/acme2certifier_{cert,key}.pem
        # (see a2c-rpm.sh). Stage CI TLS material there so Traefik/LEGO_CA_CERTIFICATES
        # can verify https://acme-srv.acme — data/nginx/ alone is not enough.
        sudo cp .github/acme2certifier_cert.pem data/volume/acme2certifier_cert.pem
        sudo cp .github/acme2certifier_key.pem data/volume/acme2certifier_key.pem
        sudo cp .github/acme2certifier_cert.pem data/nginx/acme2certifier_cert.pem
        sudo cp .github/acme2certifier_key.pem data/nginx/acme2certifier_key.pem
        if [ -f ${{ steps.rpm_build.outputs.rpm_dir_path }}noarch/acme2certifier-${{ env.TAG_NAME }}-1.0.noarch.rpm ]; then
          echo "RPM exists"
          sudo cp ${{ steps.rpm_build.outputs.rpm_dir_path }}noarch/acme2certifier-${{ env.TAG_NAME }}-1.0.noarch.rpm data
        else
          echo "RPM does not exist"
        fi
        if [ -z "$DJANGO_DB" ] || [ "$DJANGO_DB" == "sqlite3" ]; then
            sudo cp .github/django_settings.py data/acme2certifier/settings.py
        else
            sudo cp .github/django_settings_$DJANGO_DB.py data/acme2certifier/settings.py
        fi
        sudo sed -i "s/\/var\/www\//\/opt\//g" data/acme2certifier/settings.py
        sudo sed -i "s/USE_I18N = True/USE_I18N = False/g" data/acme2certifier/settings.py
        # Also stage under volume/ for a2c-rpm --volume-dir sync
        sudo cp data/acme2certifier/settings.py data/volume/settings.py
      env:
        DJANGO_DB: ${{ inputs.DJANGO_DB }}
        NAME_SPACE: ${{ inputs.NAME_SPACE }}
        IPV6: ${{ inputs.IPV6 }}
        RH_VERSION: ${{ inputs.RH_VERSION }}

      shell: bash

    - run: echo "RH_VERSION is $RH_VERSION"
      env:
        RH_VERSION: ${{ inputs.RH_VERSION }}
      shell: bash

    - name: "Retrieve rpm from SBOM repo"
      run: |
        git clone https://$GH_USER:$GH_SBOM_REPO_TOKEN@github.com/$GH_USER/sbom /tmp/sbom
        cp /tmp/sbom/rpm-repo/RPMs/rhel$RH_VERSION/*.rpm  data
      env:
        GH_USER: ${{ inputs.GH_USER }}
        GH_SBOM_REPO_TOKEN: ${{ inputs.GH_SBOM_REPO_TOKEN }}
        RH_VERSION: ${{ inputs.RH_VERSION }}
      shell: bash

    - name: "Spin-up alma instance"
      run: |
        docker run -d -id --privileged --network $NAME_SPACE -p 22280:80 --name=acme-srv -v "$(pwd)/data":/tmp/acme2certifier almalinux/$RH_VERSION-init
      env:
        RH_VERSION: ${{ inputs.RH_VERSION }}
        NAME_SPACE: ${{ inputs.NAME_SPACE }}
      shell: bash

    - name: "CI host packages (former rpm_tester bits)"
      run: |
        set -euo pipefail
        for i in $(seq 1 30); do
          if docker exec acme-srv systemctl is-system-running 2>/dev/null | grep -Eq 'running|degraded'; then
            break
          fi
          sleep 2
        done
        docker exec acme-srv yum -y install epel-release || true
        docker exec acme-srv yum install -y procps syslog-ng krb5-workstation krb5-libs || \
          docker exec acme-srv dnf install -y procps syslog-ng krb5-workstation krb5-libs
        docker exec acme-srv systemctl start syslog-ng.service || true
      shell: bash

    - name: "Install SBOM companion RPMs into Alma container"
      run: |
        set -euo pipefail
        docker exec acme-srv bash -c '
          set -euo pipefail
          shopt -s nullglob
          filtered=()
          for r in /tmp/acme2certifier/*.rpm; do
            b=$(basename "$r")
            case "$b" in
              acme2certifier-*) continue ;;
              packages-microsoft-prod.rpm) continue ;;
            esac
            filtered+=("$r")
          done
          if ((${#filtered[@]} == 0)); then
            echo "No SBOM companion RPMs to install"
            exit 0
          fi
          echo "Installing companion RPMs:"
          printf "  %s\n" "${filtered[@]}"
          if command -v dnf >/dev/null 2>&1; then
            dnf localinstall -y "${filtered[@]}"
          else
            yum localinstall -y "${filtered[@]}"
          fi
        '
      shell: bash

    - name: "Instanciate Mariadb"
      if: inputs.DJANGO_DB == 'mariadb'
      uses: ./.github/actions/mariadb_prep
      with:
        NAME_SPACE: ${{ inputs.NAME_SPACE }}
        RH_VERSION: ${{ inputs.RH_VERSION }}

    - name: "Instanciate Postgres"
      if: inputs.DJANGO_DB == 'psql'
      uses: ./.github/actions/psql_prep
      with:
        NAME_SPACE: ${{ inputs.NAME_SPACE }}

    - name: "Prepare and install MSSQL client stack"
      if: inputs.DJANGO_DB == 'mssql'
      run: |
        set -euo pipefail
        echo "Download Microsoft repository configuration package"
        curl -fsSL "https://packages.microsoft.com/config/rhel/${VERSION}/packages-microsoft-prod.rpm" \
          --output data/packages-microsoft-prod.rpm
        docker exec acme-srv bash -c '
          set -euo pipefail
          PKG=yum
          command -v dnf >/dev/null 2>&1 && PKG=dnf
          echo "Installing Microsoft ODBC / mssql-django"
          ${PKG} localinstall -y /tmp/acme2certifier/packages-microsoft-prod.rpm
          ACCEPT_EULA=Y ${PKG} install -y msodbcsql18 python3-pip python3-pyodbc
          ${PKG} install -y gcc gcc-c++ python3-devel unixODBC-devel
          pip3 install mssql-django==1.3 || pip3 install mssql-django
        '
      env:
        DJANGO_DB: ${{ inputs.DJANGO_DB }}
        VERSION: ${{ inputs.RH_VERSION }}
      shell: bash

    - name: "Instanciate MSSQL"
      if: inputs.DJANGO_DB == 'mssql'
      uses: ./.github/actions/mssql_prep
      with:
        NAME_SPACE: ${{ inputs.NAME_SPACE }}
