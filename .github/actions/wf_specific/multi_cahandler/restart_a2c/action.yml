name: "restart_a2c"
description: "Restart a2c after config change"
inputs:
  DEPLOYMENT_TYPE:
    description: "container | rpm | deb"
    required: true
  WEBSRV:
    description: "Web server (deb only)"
    required: false
    default: ""
  MODE:
    description: "wsgi | django (rpm install script)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: "Restart a2c (${{ inputs.DEPLOYMENT_TYPE }})"
      shell: bash
      env:
        DEPLOYMENT_TYPE: ${{ inputs.DEPLOYMENT_TYPE }}
        WEBSRV: ${{ inputs.WEBSRV }}
        MODE: ${{ inputs.MODE }}
      run: |
        set -euo pipefail
        case "${DEPLOYMENT_TYPE}" in
          container)
            (cd examples/Docker && docker compose restart)
            ;;
          rpm)
            if [[ -n "${MODE}" ]]; then
              docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart -m "${MODE}"
            else
              docker exec acme-srv bash /tmp/acme2certifier/a2c-rpm.sh restart
            fi
            ;;
          deb)
            if [[ -z "${WEBSRV}" ]]; then
              echo "ERROR: WEBSRV is required for deb restart" >&2
              exit 1
            fi
            if [[ -n "${MODE}" ]]; then
              docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh restart "${WEBSRV}" -m "${MODE}"
            else
              docker exec acme-srv bash /tmp/acme2certifier/a2c-deb.sh restart "${WEBSRV}"
            fi
            ;;
          *)
            echo "ERROR: unsupported DEPLOYMENT_TYPE=${DEPLOYMENT_TYPE}" >&2
            exit 1
            ;;
        esac
