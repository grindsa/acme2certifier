name: "dryrun tests"
description: "Test dryrun feature"
inputs:
  FAIL:
    description: "Fail "
    required: true
    default: "false"
  ACME_SERVER:
    description: "ACME server address"
    required: true
    default: "acme-srv"
  CA_PATH:
    description: "Path to CA certificates"
    required: false
    default: "examples/Docker/data/acme_ca/"
  DEPLOYMENT_TYPE:
    description: "Deployment type"
    required: true
    default: "rpm"

runs:
  using: "composite"
  steps:

    - name: "Create lego folder"
      run: |
        mkdir -p lego
      shell: bash

    - name: "Wait for ACME directory"
      uses: ./.github/actions/wait_for_directory
      with:
        ACME_SERVER: ${{ inputs.ACME_SERVER }}

    - name: "Enroll lego"
      if: ${{ inputs.FAIL == 'false' || inputs.FAIL == 'missing_profile' || inputs.FAIL == 'profile'}}
      run: |
        sudo rm -rf lego/*
        docker run -i -v $PWD/lego:/.lego/ --rm --name lego --network acme goacme/lego run --tls-skip-verify -s https://$ACME_SERVER -a --email "lego@example.com" -d lego.acme --http
        sudo openssl verify -CAfile $CA_PATH/root-ca-cert.pem -untrusted $CA_PATH/sub-ca-cert.pem lego/certificates/lego.acme.crt
      shell: bash
      env:
        ACME_SERVER: ${{ inputs.ACME_SERVER }}
        CA_PATH: ${{ inputs.CA_PATH }}

    - name: "Enroll lego"
      if: ${{ inputs.FAIL == 'true' }}
      continue-on-error: true
      id: legofail01
      run: |
        sudo rm -rf lego/*
        docker run -i -v $PWD/lego:/.lego/ --rm --name lego --network acme goacme/lego run --tls-skip-verify -s https://$ACME_SERVER -a --email "lego@example.com" -d lego.acme --http # 2>&1 | grep -q "Dry run mode - enrollment skipped"
      shell: bash
      env:
        ACME_SERVER: ${{ inputs.ACME_SERVER }}

    - name: "Check  result "
      if: ${{ (inputs.FAIL == 'true') && steps.legofail01.outcome != 'failure' }}
      run: |
        echo "legofail outcome is ${{steps.legofail01.outcome }}"
        exit 1
      shell: bash

    - name: "Sleep for 10s"
      uses: juliangruber/sleep-action@aa7a3ef2f85b9870fba679dfc43d307040c7b528 # v2.0.4
      with:
        time: 10s

    - name: "Check logs dryrun skip"
      if: ${{ inputs.FAIL == 'true' }}
      uses: ./.github/actions/logs_assert
      with:
        DEPLOYMENT_TYPE: ${{ inputs.DEPLOYMENT_TYPE }}
        PATTERN: "Dry run mode enabled - skipping enrollment and certificate issuance"
        FLUSH: ${{ inputs.DEPLOYMENT_TYPE == 'container' && 'false' || 'true' }}

    - name: "Check logs dryrun config"
      if: ${{ inputs.FAIL == 'true' && inputs.DEPLOYMENT_TYPE == 'container' }}
      uses: ./.github/actions/logs_assert
      with:
        DEPLOYMENT_TYPE: ${{ inputs.DEPLOYMENT_TYPE }}
        PATTERN: "Helper.config_dryrun_load() ended with: True/None"
        FLUSH: "true"

    - name: "Check logs missing profile"
      if: ${{ inputs.FAIL == 'missing_profile' }}
      uses: ./.github/actions/logs_assert
      with:
        DEPLOYMENT_TYPE: ${{ inputs.DEPLOYMENT_TYPE }}
        PATTERN: "Dryrun profile name not set in configuration, please set dryrun_profile parameter"

    - name: "Enroll lego"
      if: ${{ inputs.FAIL == 'profile' }}
      continue-on-error: true
      id: legofail02
      run: |
        sudo rm -rf lego/*
        docker run -i -v $PWD/lego:/.lego/ --rm --name lego --network acme goacme/lego run --tls-skip-verify -s https://$ACME_SERVER -a --email "lego@example.com" -d lego.acme --http --profile dry-run
      shell: bash
      env:
        ACME_SERVER: ${{ inputs.ACME_SERVER }}

    - name: "Check  result "
      if: ${{ (inputs.FAIL == 'profile') && steps.legofail02.outcome != 'failure' }}
      run: |
        echo "legofail outcome is ${{steps.legofail02.outcome }}"
        exit 1
      shell: bash

    - name: "Sleep for 10s"
      if: ${{ inputs.FAIL == 'profile' }}
      uses: juliangruber/sleep-action@aa7a3ef2f85b9870fba679dfc43d307040c7b528 # v2.0.4
      with:
        time: 10s

    - name: "Check logs dryrun profile"
      if: ${{ inputs.FAIL == 'profile' }}
      uses: ./.github/actions/logs_assert
      with:
        DEPLOYMENT_TYPE: ${{ inputs.DEPLOYMENT_TYPE }}
        PATTERN: "enabling dryrun mode for profile: dry-run"
