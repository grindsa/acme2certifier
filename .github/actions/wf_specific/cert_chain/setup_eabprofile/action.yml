name: "setup_eabprofile"
description: "openssl + kid_profile_handler with cert_chain skip/append overlays"
inputs:
  VOLUME_DIR:
    description: "Volume directory (contains acme_ca/ and acme_srv.cfg)"
    required: false
    default: "data/volume"
  KEY_FILE:
    description: "key_file path written into [EABhandler] (as seen by the server)"
    required: true
  KID_PROFILES_DEST:
    description: "Host path for the staged kid_profiles.json fixture"
    required: true
  APPEND_PREFIX:
    description: "cert_chain_append path prefix as seen by the server"
    required: false
    default: "volume/acme_ca"
  KID_PROFILES_SOURCE:
    description: "Source kid_profiles fixture"
    required: false
    default: ".github/actions/wf_specific/eab_profiling/fixtures/cert_chain.json"
  PATH_REWRITE_FROM:
    description: "Optional substring to rewrite in acme_srv.cfg after openssl setup"
    required: false
    default: ""
  PATH_REWRITE_TO:
    description: "Replacement for PATH_REWRITE_FROM"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: "Setup openssl ca_handler base cfg"
      uses: ./.github/actions/setup_openssl_cahandler
      with:
        VOLUME_DIR: ${{ inputs.VOLUME_DIR }}
        PATH_REWRITE_FROM: ${{ inputs.PATH_REWRITE_FROM }}
        PATH_REWRITE_TO: ${{ inputs.PATH_REWRITE_TO }}

    - name: "Configure EABhandler"
      shell: bash
      env:
        VOLUME_DIR: ${{ inputs.VOLUME_DIR }}
        KEY_FILE: ${{ inputs.KEY_FILE }}
      run: |
        set -euo pipefail
        cfg="${VOLUME_DIR}/acme_srv.cfg"
        {
          echo
          echo "[EABhandler]"
          echo "eab_handler_module: acme2certifier.eabhandlers.kid_profile_handler"
          echo "key_file: ${KEY_FILE}"
          echo "eab_profiling: True"
        } | sudo tee -a "${cfg}" >/dev/null

    - name: "Fingerprint skip targets"
      id: fp
      shell: bash
      env:
        VOLUME_DIR: ${{ inputs.VOLUME_DIR }}
      run: |
        set -euo pipefail
        fp() {
          openssl x509 -in "$1" -noout -fingerprint -sha256 \
            | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]'
        }
        ca="${VOLUME_DIR}/acme_ca"
        {
          echo "old_root=$(fp "${ca}/root-ca-cert.pem")"
          echo "old_sub=$(fp "${ca}/sub-ca-cert.pem")"
        } >> "${GITHUB_OUTPUT}"

    - name: "Stage kid_profiles"
      uses: ./.github/actions/wf_specific/eab_profiling/stage_kid_profiles
      with:
        SOURCE: ${{ inputs.KID_PROFILES_SOURCE }}
        DEST: ${{ inputs.KID_PROFILES_DEST }}
        ENVSUBST: "true"
        APPEND_PREFIX: ${{ inputs.APPEND_PREFIX }}
        OLD_ROOT_FP: ${{ steps.fp.outputs.old_root }}
        OLD_SUB_FP: ${{ steps.fp.outputs.old_sub }}
