name: "challenge_type_support_checks"
description: "Verify RFC 8555 challenge types offered match acme_srv.cfg support flags"
inputs:
  NAME_SPACE:
    description: "namespace"
    required: false
    default: "acme"
  DEPLOYMENT_TYPE:
    description: "Deployment type"
    required: false
    default: "container"
  ACME_SERVER:
    description: "ACME server hostname"
    required: false
    default: "acme-srv"
  EXPECT_TYPES:
    description: "Comma-separated challenge types that must appear in authorization"
    required: true
  FORBID_TYPES:
    description: "Comma-separated challenge types that must not appear"
    required: false
    default: ""
  IDENTIFIER:
    description: "DNS identifier for the test order"
    required: false
    default: "chal-types-01.bar.local"
  EAB_KID:
    description: "Optional EAB key id for account registration"
    required: false
    default: ""
  EAB_HMAC:
    description: "Optional EAB HMAC key for account registration"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: "Create acmeshell script for challenge type check"
      if: ${{ inputs.EAB_KID == '' }}
      working-directory: acmeshell
      run: |
        rm -f acmeshell.chaltypes.log
        cat <<EOT > commands.shell
        newAccount -contacts=chal-types@bar.local,
        newOrder -identifiers=${{ inputs.IDENTIFIER }}
        getAuthz -order=0 -identifier=${{ inputs.IDENTIFIER }}
        EOT
      shell: bash

    - name: "Run acmeshell and capture authorization response"
      if: ${{ inputs.EAB_KID == '' }}
      working-directory: acmeshell
      continue-on-error: true
      id: acmeshell_chaltypes
      run: |
        docker exec alma bash -c '/acmeshell/acmeshell -directory http://acme-srv -postAsGet=true -printResponses -printRequests -autoregister=false --account="" -in /acmeshell/commands.shell &> /acmeshell/acmeshell.chaltypes.log'
        cat acmeshell.chaltypes.log || true
      shell: bash
      env:
        ACME_SERVER: ${{ inputs.ACME_SERVER }}
        NAME_SPACE: ${{ inputs.NAME_SPACE }}

    - name: "Register EAB account and request authorization"
      if: ${{ inputs.EAB_KID != '' }}
      run: |
        rm -f acmeshell/acmeshell.chaltypes.log
        docker exec alma bash -c "cp /root/.acme.sh/acme.sh.bup /root/.acme.sh/acme.sh"
        docker exec alma bash -c "/root/.acme.sh/acme.sh --register-account --server http://${{ inputs.ACME_SERVER }} --accountemail 'chal-types@bar.local' --eab-kid '${{ inputs.EAB_KID }}' --eab-hmac-key '${{ inputs.EAB_HMAC }}' --debug 2" 2>&1 | tee acmeshell/acmeshell.chaltypes.log
        docker exec alma bash -c "/root/.acme.sh/acme.sh --issue --server http://${{ inputs.ACME_SERVER }} -d '${{ inputs.IDENTIFIER }}' --dns --yes-I-know-dns-manual-mode-enough-go-ahead-please --debug 2 --output-insecure" >> acmeshell/acmeshell.chaltypes.log 2>&1 || true
        cat acmeshell/acmeshell.chaltypes.log
      shell: bash

    - name: "Assert acmeshell enrollment succeeded"
      if: ${{ inputs.EAB_KID == '' && steps.acmeshell_chaltypes.outcome == 'failure' }}
      run: |
        echo "acmeshell enrollment failed; see acmeshell.chaltypes.log above"
        exit 1
      shell: bash

    - name: "Assert expected challenge types are present"
      working-directory: acmeshell
      run: |
        IFS=',' read -ra EXPECTED <<< "${{ inputs.EXPECT_TYPES }}"
        for challenge_type in "${EXPECTED[@]}"; do
          challenge_type="$(echo "$challenge_type" | xargs)"
          if ! grep -qE "\"type\"[[:space:]]*:[[:space:]]*\"${challenge_type}\"" acmeshell.chaltypes.log; then
            echo "Expected challenge type '${challenge_type}' not found in acmeshell output"
            exit 1
          fi
        done
      shell: bash

    - name: "Assert forbidden challenge types are absent"
      if: ${{ inputs.FORBID_TYPES != '' }}
      working-directory: acmeshell
      run: |
        IFS=',' read -ra FORBIDDEN <<< "${{ inputs.FORBID_TYPES }}"
        for challenge_type in "${FORBIDDEN[@]}"; do
          challenge_type="$(echo "$challenge_type" | xargs)"
          if grep -qE "\"type\"[[:space:]]*:[[:space:]]*\"${challenge_type}\"" acmeshell.chaltypes.log; then
            echo "Forbidden challenge type '${challenge_type}' found in acmeshell output"
            exit 1
          fi
        done
      shell: bash
