name: "acme_email_enroll"
description: "Spin up Ubuntu systemd + pip install via a2c-ubuntu-nginx.sh --from-source"
inputs:
  NAME_SPACE:
    description: "namespace"
    required: false
    default: "acme"
  DB_HANDLER:
    description: "Database handler type"
    required: false
    default: "wsgi"
  ACME_SERVER:
    description: "ACME server hostname"
    required: false
    default: "acme-srv"
  HTTP_PORT:
    description: "ACME server HTTP port"
    required: false
    default: "80"
  HTTPS_PORT:
    description: "ACME server HTTPS port"
    required: false
    default: "443"

runs:
  using: "composite"
  steps:
  - name: "Sleep for 5s"
    uses: juliangruber/sleep-action@v2.0.4
    with:
      time: 5s

  - name: "Generate keys and certificates"
    uses: ./.github/actions/cert_gen
    with:
      DESTINATION_PATH: ".github"
      EE_KEY: "acme2certifier_key.pem"
      EE_CERT: "acme2certifier_cert.pem"
      EE_CSR: "acme2certifier_csr.pem"
      EE_BUNDLE: "acme2certifier.pem"
      CA_BUNDLE: "acme2certifier_cabundle.pem"
      ISSUING_CA_KEY: "test/ca/sub-ca-key.pem"
      ISSUING_CA_CERT: "test/ca/sub-ca-cert.pem"
      ISSUING_CA_PASSPHRASE: "Test1234"
      ROOT_CA_CERT: "test/ca/root-ca-cert.pem"

  - name: "Instanciate Mariadb"
    if: inputs.DB_HANDLER == 'django'
    uses: ./.github/actions/mariadb_prep
    with:
      NAME_SPACE: ${{ inputs.NAME_SPACE }}

  - name: "Pull Ubuntu image"
    uses: ./.github/actions/docker_pull
    with:
      IMAGE: grindsa/systemd-ubuntu:24.04

  - name: "Start Ubuntu systemd container"
    run: |
      set -euo pipefail
      docker run -d --rm --name acme-srv --network acme --privileged \
        -v /sys/fs/cgroup:/sys/fs/cgroup:rw --cgroupns=host \
        -v "$PWD":/tmp/acme2certifier \
        grindsa/systemd-ubuntu:24.04
      for i in $(seq 1 30); do
        if docker exec acme-srv systemctl is-system-running 2>/dev/null | grep -Eq 'running|degraded'; then
          break
        fi
        sleep 2
      done
      docker exec acme-srv apt-get update
      docker exec acme-srv apt-get install -y rsyslog curl
      docker exec acme-srv systemctl enable rsyslog || true
      docker exec acme-srv systemctl start rsyslog || true
    shell: bash

  - name: "Install acme2certifier via a2c-ubuntu-nginx.sh --from-source"
    run: |
      set -euo pipefail
      MODE="${{ inputs.DB_HANDLER }}"
      if [[ "${MODE}" != "wsgi" && "${MODE}" != "django" ]]; then
        MODE="wsgi"
      fi
      docker exec acme-srv bash -c "cd /tmp/acme2certifier && ./examples/install_scripts/a2c-ubuntu-nginx.sh --from-source -m ${MODE}"
    shell: bash

  - name: "Configure django settings overlay"
    if: inputs.DB_HANDLER == 'django'
    run: |
      set -euo pipefail
      docker exec acme-srv apt-get install -y python3-mysqldb python3-pymysql python3-yaml || true
      docker exec acme-srv bash -c '
        set -euo pipefail
        SETTINGS=$(find /var/www/acme2certifier/venv -path "*/acme2certifier/django_project/settings.py" | head -n 1)
        test -n "$SETTINGS"
        cp /tmp/acme2certifier/.github/django_settings_mariadb.py "$SETTINGS"
        export ACME_SRV_CONFIGFILE=/var/www/acme2certifier/acme_srv.cfg
        export ACME2CERTIFIER_BASE_DIR=/var/www/acme2certifier
        export DJANGO_SETTINGS_MODULE=acme2certifier.django_project.settings
        /var/www/acme2certifier/venv/bin/a2c-manage migrate
        /var/www/acme2certifier/venv/bin/a2c-manage loaddata status
        chown -R www-data:www-data /var/www/acme2certifier
        systemctl restart acme2certifier nginx
      '
    shell: bash
