name: "le-sim_prep"
description: "Bring up an openssl-backed le-sim ACME sidecar and smoke-enroll"
inputs:
  LESIM_NAME:
    description: "Name of the le-sim"
    required: true
    default: "acme-le-sim"
  NAME_SPACE:
    description: "Name space of the le-sim"
    required: true
    default: "acme"
  SECTIGO_SIM:
    description: "Sectigo sim"
    required: true
    default: "false"
  MODERN:
    description: "If true, latest apache2-wsgi + handler_module cfg. If false, 0.44-apache2-wsgi + handler_file cfg (≤0.44 layout)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:

  - name: "Resolve le-sim image"
    id: resolve
    run: |
      set -euo pipefail
      case "${MODERN}" in
        true|false) ;;
        *)
          echo "ERROR: MODERN must be true|false (got: ${MODERN})" >&2
          exit 1
          ;;
      esac
      if [[ "${MODERN}" == "true" ]]; then
        resolved="grindsa/acme2certifier:apache2-wsgi"
      else
        resolved="grindsa/acme2certifier:0.44-apache2-wsgi"
      fi
      echo "image=${resolved}" >> "${GITHUB_OUTPUT}"
      echo "Resolved le-sim image: ${resolved} (MODERN=${MODERN})"
    shell: bash
    env:
      MODERN: ${{ inputs.MODERN }}

  - name: "Pull le-sim image"
    uses: ./.github/actions/docker_pull
    with:
      IMAGE: ${{ steps.resolve.outputs.image }}

  - name: "Pull acme.sh image"
    uses: ./.github/actions/docker_pull
    with:
      IMAGE: neilpang/acme.sh:latest

  - name: "Stage openssl CA handler volume"
    uses: ./.github/actions/setup_openssl_cahandler
    with:
      VOLUME_DIR: ${{ inputs.LESIM_NAME }}

  - name: "Configure and start le-sim"
    run: |
      set -euo pipefail
      if [[ "${MODERN}" != "true" ]]; then
        # ≤0.44 layout: load handler from the image tree via handler_file
        sudo sed -i \
          "s|handler_module: acme2certifier.cahandlers.openssl_ca_handler|handler_file: examples/ca_handler/openssl_ca_handler.py|" \
          "${LESIM_NAME}/acme_srv.cfg"
      fi
      sudo sed -i "s/challenge_validation_disable: False/challenge_validation_disable: True/g" \
        "${LESIM_NAME}/acme_srv.cfg"
      if [ "${SECTIGO_SIM}" == "true" ]; then
        echo "Sectigo sim enabled"
        echo "sectigo_sim: True" | sudo tee -a "${LESIM_NAME}/acme_srv.cfg" >/dev/null
      fi
      docker_args=(
        -d --rm
        --network "${NAME_SPACE}"
        --name "${LESIM_NAME}"
        -v "$(pwd)/${LESIM_NAME}":/var/www/acme2certifier/volume/
      )
      if [[ "${MODERN}" == "true" ]]; then
        docker_args+=(-e ACME2CERTIFIER_BASE_DIR=/var/www/acme2certifier)
      fi
      docker run "${docker_args[@]}" "${IMAGE}"
      cat "${LESIM_NAME}/acme_srv.cfg"
    shell: bash
    env:
      LESIM_NAME: ${{ inputs.LESIM_NAME }}
      NAME_SPACE: ${{ inputs.NAME_SPACE }}
      SECTIGO_SIM: ${{ inputs.SECTIGO_SIM }}
      MODERN: ${{ inputs.MODERN }}
      IMAGE: ${{ steps.resolve.outputs.image }}

  - name: "Wait for ACME directory (http)"
    uses: ./.github/actions/wait_for_directory
    with:
      NAME_SPACE: ${{ inputs.NAME_SPACE }}
      ACME_SERVER: ${{ inputs.LESIM_NAME }}
      CHECK_HTTPS: "false"

  - name: "Enroll from le-sim"
    run: |
      set -euo pipefail
      mkdir -p acme-sh/
      docker run --rm -i -v "$(pwd)/acme-sh":/acme.sh --network "${NAME_SPACE}" --name=acme-sh \
        neilpang/acme.sh:latest --issue --server "http://${LESIM_NAME}" \
        --accountemail 'acme-sh@example.com' -d acme-sh.acme --standalone \
        --debug 3 --output-insecure --force
      awk 'BEGIN {c=0;} /BEGIN CERT/{c++} { print > "cert-" c ".pem"}' < acme-sh/acme-sh.acme_ecc/ca.cer
      openssl verify -CAfile cert-2.pem -untrusted cert-1.pem acme-sh/acme-sh.acme_ecc/acme-sh.acme.cer
      sudo rm -rf acme-sh/*
    shell: bash
    env:
      LESIM_NAME: ${{ inputs.LESIM_NAME }}
      NAME_SPACE: ${{ inputs.NAME_SPACE }}
