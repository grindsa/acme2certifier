name: "enroll_dns_wc"
description: "Wildcard DNS-01 enroll via lego against a2c (manual dns, validation disabled on a2c)"
inputs:
  ACME_SERVER:
    description: "ACME server hostname"
    required: false
    default: "acme-srv"
  REVOCATION:
    description: "Revoke after enroll"
    required: false
    default: "true"
  USE_RSA:
    description: "Use RSA key type"
    required: false
    default: "false"
  HTTPS_PORT:
    description: "HTTPS port"
    required: false
    default: "443"
  HOSTNAME_SUFFIX:
    description: "Optional container name suffix"
    required: false
    default: ""
  NAME_SPACE:
    description: "Docker network / DNS namespace"
    required: true
    default: "acme"
  CERT_TIMEOUT:
    description: "lego cert.timeout seconds"
    required: false
    default: "360"

runs:
  using: "composite"
  steps:
    - name: "Pull lego image"
      uses: ./.github/actions/docker_pull
      with:
        IMAGE: goacme/lego

    - name: "Create directories"
      run: |
        set -euo pipefail
        mkdir -p lego/ca
        sudo cp .github/acme2certifier_cabundle.pem lego/ || true
      shell: bash

    - name: "Wait for ACME directory"
      uses: ./.github/actions/wait_for_directory
      with:
        NAME_SPACE: ${{ inputs.NAME_SPACE }}
        ACME_SERVER: ${{ inputs.ACME_SERVER }}
        HTTPS_PORT: ${{ inputs.HTTPS_PORT }}

    - name: "HTTPS - Enroll lego"
      run: |
        set -euo pipefail
        # --dns manual: trigger dns-01 (required for wildcards). challenge_validation_disable
        # on a2c skips server-side checks; --dns.propagation.wait skips client TXT wait.
        if [ "${USE_RSA}" = "false" ]; then
          echo | docker run -i --rm -e LEGO_CA_CERTIFICATES=.lego/acme2certifier_cabundle.pem \
            -v "$PWD/lego:/.lego/" --name "lego${HOSTNAME_SUFFIX}" --network "${NAME_SPACE}" \
            goacme/lego run -s "https://${ACME_SERVER}:${HTTPS_PORT}" --tls-skip-verify -a \
            --email "lego@example.com" -d "*.${NAME_SPACE}" \
            --cert.timeout "${CERT_TIMEOUT}" --dns manual --dns.propagation.wait 1s --no-random-sleep
        else
          echo | docker run -i --rm -e LEGO_CA_CERTIFICATES=.lego/acme2certifier_cabundle.pem \
            -v "$PWD/lego:/.lego/" --name "lego${HOSTNAME_SUFFIX}" --network "${NAME_SPACE}" \
            goacme/lego run -s "https://${ACME_SERVER}:${HTTPS_PORT}" --tls-skip-verify -a \
            --email "lego@example.com" --key-type=rsa2048 -d "*.${NAME_SPACE}" \
            --cert.timeout "${CERT_TIMEOUT}" --dns manual --dns.propagation.wait 1s --no-random-sleep
        fi
      shell: bash
      env:
        ACME_SERVER: ${{ inputs.ACME_SERVER }}
        HTTPS_PORT: ${{ inputs.HTTPS_PORT }}
        USE_RSA: ${{ inputs.USE_RSA }}
        HOSTNAME_SUFFIX: ${{ inputs.HOSTNAME_SUFFIX }}
        NAME_SPACE: ${{ inputs.NAME_SPACE }}
        CERT_TIMEOUT: ${{ inputs.CERT_TIMEOUT }}

    - name: "HTTPS - Revoke lego"
      if: ${{ inputs.REVOCATION == 'true' }}
      run: |
        set -euo pipefail
        docker run -i -v "$PWD/lego:/.lego/" --rm --name "lego${HOSTNAME_SUFFIX}" \
          --network "${NAME_SPACE}" goacme/lego certificates revoke \
          -s "https://${ACME_SERVER}:${HTTPS_PORT}" --tls-skip-verify \
          --email "lego@example.com" --cert.name "*.${NAME_SPACE}"
      shell: bash
      env:
        ACME_SERVER: ${{ inputs.ACME_SERVER }}
        HTTPS_PORT: ${{ inputs.HTTPS_PORT }}
        HOSTNAME_SUFFIX: ${{ inputs.HOSTNAME_SUFFIX }}
        NAME_SPACE: ${{ inputs.NAME_SPACE }}
