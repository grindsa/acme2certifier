name: "enroll_dns"
description: "Enroll (and optionally revoke) via lego against a2c with challenge_validation_disable"
inputs:
  ACME_SERVER:
    description: "ACME server hostname"
    required: false
    default: "acme-srv"
  REVOCATION:
    description: "Revoke after enroll"
    required: false
    default: "true"
  VERIFY_CERT:
    description: "Verify certificate against local CA files"
    required: false
    default: "true"
  USE_RSA:
    description: "Use RSA key type"
    required: false
    default: "false"
  HTTPS_PORT:
    description: "HTTPS port"
    required: false
    default: "443"
  HOSTNAME_SUFFIX:
    description: "Hostname suffix"
    required: true
  NAME_SPACE:
    description: "Docker network / DNS namespace"
    required: true
    default: "acme"
  CERT_TIMEOUT:
    description: "lego cert.timeout seconds"
    required: false
    default: "360"

runs:
  using: "composite"
  steps:
    - name: "Pull lego image"
      uses: ./.github/actions/docker_pull
      with:
        IMAGE: goacme/lego

    - name: "Create directories"
      run: |
        set -euo pipefail
        mkdir -p lego/ca
        sudo cp .github/acme2certifier_cabundle.pem lego/ || true
        rm -f cert-1.pem cert-2.pem
      shell: bash

    - name: "Wait for ACME directory"
      uses: ./.github/actions/wait_for_directory
      with:
        NAME_SPACE: ${{ inputs.NAME_SPACE }}
        ACME_SERVER: ${{ inputs.ACME_SERVER }}
        HTTPS_PORT: ${{ inputs.HTTPS_PORT }}

    - name: "HTTPS - Enroll lego"
      run: |
        set -euo pipefail
        if [ "${USE_RSA}" = "false" ]; then
          docker run -i --rm -e LEGO_CA_CERTIFICATES=.lego/acme2certifier_cabundle.pem \
            -v "$PWD/lego:/.lego/" --name "lego${HOSTNAME_SUFFIX}" --network "${NAME_SPACE}" \
            goacme/lego run -s "https://${ACME_SERVER}:${HTTPS_PORT}" --tls-skip-verify -a \
            --email "lego@example.com" -d "lego${HOSTNAME_SUFFIX}.${NAME_SPACE}" \
            --cert.timeout "${CERT_TIMEOUT}" --tls
        else
          docker run -i --rm -e LEGO_CA_CERTIFICATES=.lego/acme2certifier_cabundle.pem \
            -v "$PWD/lego:/.lego/" --name "lego${HOSTNAME_SUFFIX}" --network "${NAME_SPACE}" \
            goacme/lego run -s "https://${ACME_SERVER}:${HTTPS_PORT}" --tls-skip-verify -a \
            --email "lego@example.com" --key-type=rsa2048 \
            -d "lego${HOSTNAME_SUFFIX}.${NAME_SPACE}" \
            --cert.timeout "${CERT_TIMEOUT}" --tls
        fi
      shell: bash
      env:
        ACME_SERVER: ${{ inputs.ACME_SERVER }}
        HTTPS_PORT: ${{ inputs.HTTPS_PORT }}
        USE_RSA: ${{ inputs.USE_RSA }}
        HOSTNAME_SUFFIX: ${{ inputs.HOSTNAME_SUFFIX }}
        NAME_SPACE: ${{ inputs.NAME_SPACE }}
        CERT_TIMEOUT: ${{ inputs.CERT_TIMEOUT }}

    - name: "HTTPS - Revoke lego"
      if: ${{ inputs.REVOCATION == 'true' }}
      run: |
        set -euo pipefail
        docker run -i -v "$PWD/lego:/.lego/" --rm --name "lego${HOSTNAME_SUFFIX}" \
          --network "${NAME_SPACE}" goacme/lego certificates revoke \
          -s "https://${ACME_SERVER}:${HTTPS_PORT}" --tls-skip-verify \
          --email "lego@example.com" --cert.name "lego${HOSTNAME_SUFFIX}.${NAME_SPACE}"
      shell: bash
      env:
        ACME_SERVER: ${{ inputs.ACME_SERVER }}
        HTTPS_PORT: ${{ inputs.HTTPS_PORT }}
        HOSTNAME_SUFFIX: ${{ inputs.HOSTNAME_SUFFIX }}
        NAME_SPACE: ${{ inputs.NAME_SPACE }}

    - name: "Cleanup lego"
      run: sudo rm -rf lego/*
      shell: bash
