name: "enroll_dns"
description: "Enroll (and optionally revoke) via lego against a2c with challenge_validation_disable"
inputs:
  ACME_SERVER:
    description: "ACME server hostname"
    required: false
    default: "acme-srv"
  REVOCATION:
    description: "Revoke after enroll"
    required: false
    default: "true"
  VERIFY_CERT:
    description: "Verify certificate against local CA files"
    required: false
    default: "true"
  USE_RSA:
    description: "Use RSA key type"
    required: false
    default: "false"
  HTTPS_PORT:
    description: "HTTPS port"
    required: false
    default: "443"
  HOSTNAME_SUFFIX:
    description: "Hostname suffix"
    required: true
  NAME_SPACE:
    description: "Docker network / DNS namespace"
    required: true
    default: "acme"
  CERT_TIMEOUT:
    description: "lego cert.timeout and http-timeout seconds"
    required: false
    default: "360"
  MAX_ATTEMPTS:
    description: "Enrollment retry attempts (fresh order each attempt)"
    required: false
    default: "3"
  RETRY_SLEEP_SECONDS:
    description: "Base sleep between retries (multiplied by attempt)"
    required: false
    default: "15"

runs:
  using: "composite"
  steps:
    - name: "Pull lego image"
      uses: ./.github/actions/docker_pull
      with:
        IMAGE: goacme/lego

    - name: "Create directories"
      run: |
        set -euo pipefail
        mkdir -p lego/ca
        sudo cp .github/acme2certifier_cabundle.pem lego/ || true
        rm -f cert-1.pem cert-2.pem
      shell: bash

    - name: "Wait for ACME directory"
      uses: ./.github/actions/wait_for_directory
      with:
        NAME_SPACE: ${{ inputs.NAME_SPACE }}
        ACME_SERVER: ${{ inputs.ACME_SERVER }}
        HTTPS_PORT: ${{ inputs.HTTPS_PORT }}

    - name: "HTTPS - Enroll lego"
      run: |
        set -euo pipefail
        attempt=1
        while [ "${attempt}" -le "${MAX_ATTEMPTS}" ]; do
          echo "Enrollment attempt ${attempt}/${MAX_ATTEMPTS}"
          sudo rm -rf lego/certificates lego/accounts 2>/dev/null || true
          set +e
          if [ "${USE_RSA}" = "false" ]; then
            docker run -i --rm -e LEGO_CA_CERTIFICATES=.lego/acme2certifier_cabundle.pem \
              -v "$PWD/lego:/.lego/" --name "lego${HOSTNAME_SUFFIX}" --network "${NAME_SPACE}" \
              goacme/lego run -s "https://${ACME_SERVER}:${HTTPS_PORT}" --tls-skip-verify -a \
              --email "lego@example.com" -d "lego${HOSTNAME_SUFFIX}.${NAME_SPACE}" \
              --cert.timeout "${CERT_TIMEOUT}" --http-timeout "${CERT_TIMEOUT}" --tls
          else
            docker run -i --rm -e LEGO_CA_CERTIFICATES=.lego/acme2certifier_cabundle.pem \
              -v "$PWD/lego:/.lego/" --name "lego${HOSTNAME_SUFFIX}" --network "${NAME_SPACE}" \
              goacme/lego run -s "https://${ACME_SERVER}:${HTTPS_PORT}" --tls-skip-verify -a \
              --email "lego@example.com" --key-type=rsa2048 \
              -d "lego${HOSTNAME_SUFFIX}.${NAME_SPACE}" \
              --cert.timeout "${CERT_TIMEOUT}" --http-timeout "${CERT_TIMEOUT}" --tls
          fi
          rc=$?
          set -e
          if [ "${rc}" -eq 0 ]; then
            exit 0
          fi
          echo "Enrollment failed (attempt ${attempt}/${MAX_ATTEMPTS}, rc=${rc})" >&2
          if [ "${attempt}" -ge "${MAX_ATTEMPTS}" ]; then
            break
          fi
          sleep_secs=$((attempt * RETRY_SLEEP_SECONDS))
          echo "Retrying in ${sleep_secs}s..."
          sleep "${sleep_secs}"
          attempt=$((attempt + 1))
        done
        echo "Enrollment failed after ${MAX_ATTEMPTS} attempts" >&2
        exit 1
      shell: bash
      env:
        ACME_SERVER: ${{ inputs.ACME_SERVER }}
        HTTPS_PORT: ${{ inputs.HTTPS_PORT }}
        USE_RSA: ${{ inputs.USE_RSA }}
        HOSTNAME_SUFFIX: ${{ inputs.HOSTNAME_SUFFIX }}
        NAME_SPACE: ${{ inputs.NAME_SPACE }}
        CERT_TIMEOUT: ${{ inputs.CERT_TIMEOUT }}
        MAX_ATTEMPTS: ${{ inputs.MAX_ATTEMPTS }}
        RETRY_SLEEP_SECONDS: ${{ inputs.RETRY_SLEEP_SECONDS }}

    - name: "HTTPS - Revoke lego"
      if: ${{ inputs.REVOCATION == 'true' }}
      run: |
        set -euo pipefail
        docker run -i -v "$PWD/lego:/.lego/" --rm --name "lego${HOSTNAME_SUFFIX}" \
          --network "${NAME_SPACE}" goacme/lego certificates revoke \
          -s "https://${ACME_SERVER}:${HTTPS_PORT}" --tls-skip-verify \
          --email "lego@example.com" --cert.name "lego${HOSTNAME_SUFFIX}.${NAME_SPACE}"
      shell: bash
      env:
        ACME_SERVER: ${{ inputs.ACME_SERVER }}
        HTTPS_PORT: ${{ inputs.HTTPS_PORT }}
        HOSTNAME_SUFFIX: ${{ inputs.HOSTNAME_SUFFIX }}
        NAME_SPACE: ${{ inputs.NAME_SPACE }}

    - name: "Cleanup lego"
      run: sudo rm -rf lego/*
      shell: bash
