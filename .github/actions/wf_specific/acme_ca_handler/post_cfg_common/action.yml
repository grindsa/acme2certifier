name: "acme_ca_handler post-cfg common"
description: "Create acme volume dir and disable challenge validation"
inputs:
  VOLUME_DIR:
    description: "Volume directory containing acme_srv.cfg"
    required: true
  ACME_SUBDIR:
    description: "Subdirectory under VOLUME_DIR for acme key material"
    required: false
    default: "acme"
  EXTRA_SED:
    description: "Optional extra sed expression applied to acme_srv.cfg (single -e)"
    required: false
    default: ""
  CHMOD_777:
    description: "chmod -R 777 the acme subdir (true/false)"
    required: false
    default: "true"
  DEPLOYMENT_TYPE:
    description: "container | rpm | deb (auto: examples/Docker* → container, else rpm/deb systemd)"
    required: false
    default: ""
  COMPOSE_DIR:
    description: "docker compose directory (container)"
    required: false
    default: "examples/Docker"

runs:
  using: "composite"
  steps:
    - name: "Post-cfg common"
      id: cfg
      run: |
        set -euo pipefail
        cfg="${VOLUME_DIR}/acme_srv.cfg"
        sudo mkdir -p "${VOLUME_DIR}"
        if [ -n "${ACME_SUBDIR}" ]; then
          acme_dir="${VOLUME_DIR}/${ACME_SUBDIR}"
          sudo mkdir -p "${acme_dir}"
          if [ "${CHMOD_777}" = "true" ]; then
            sudo chmod -R 777 "${acme_dir}"
          fi
        fi
        sudo sed -i "s/challenge_validation_disable: False/challenge_validation_disable: True/g" "${cfg}"
        if [ -n "${EXTRA_SED}" ]; then
          sudo sed -i "${EXTRA_SED}" "${cfg}"
        fi
        dt="${DEPLOYMENT_TYPE}"
        if [ -z "${dt}" ]; then
          case "${VOLUME_DIR}" in
            examples/Docker*|*/examples/Docker*) dt=container ;;
            *) dt=rpm ;;
          esac
        fi
        echo "deployment_type=${dt}" >> "${GITHUB_OUTPUT}"
      shell: bash
      env:
        VOLUME_DIR: ${{ inputs.VOLUME_DIR }}
        ACME_SUBDIR: ${{ inputs.ACME_SUBDIR }}
        EXTRA_SED: ${{ inputs.EXTRA_SED }}
        CHMOD_777: ${{ inputs.CHMOD_777 }}
        DEPLOYMENT_TYPE: ${{ inputs.DEPLOYMENT_TYPE }}

    - name: "Acknowledge naked challenge_validation_disable"
      uses: ./.github/actions/set_break_glass
      with:
        DEPLOYMENT_TYPE: ${{ steps.cfg.outputs.deployment_type }}
        COMPOSE_DIR: ${{ inputs.COMPOSE_DIR }}
