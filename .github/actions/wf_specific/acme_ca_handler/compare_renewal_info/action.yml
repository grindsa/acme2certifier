name: "compare_renewal_info"
description: "Enroll via a2c, then compare ARI payloads from a2c and LE staging"
inputs:
  NAME_SPACE:
    description: "Docker network namespace"
    required: true
    default: "acme"
  CERTIFICATE_FILE:
    description: "Path to issued certificate file"
    required: false
    default: "/tmp/cert.pem"
  HTTPS_PORT:
    description: "HTTPS port"
    required: false
    default: "443"
  HOSTNAME_SUFFIX:
    description: "Hostname suffix for enrollment"
    required: false
    default: ""
  ACME_SERVER:
    description: "a2c ACME server hostname"
    required: false
    default: "acme-srv"
  CERT_TIMEOUT:
    description: "lego cert.timeout and http-timeout seconds"
    required: false
    default: "360"
  REVOCATION:
    description: "Revoke after compare (true/false)"
    required: false
    default: "true"
  LE_ARI_BASE:
    description: "LE staging ARI base URL"
    required: false
    default: "https://acme-staging-v02.api.letsencrypt.org/acme/renewal-info"
  MAX_ATTEMPTS:
    description: "ARI fetch retry attempts"
    required: false
    default: "5"
  SLEEP_SECONDS:
    description: "Seconds between ARI retries"
    required: false
    default: "3"
  ENROLL_MAX_ATTEMPTS:
    description: "Enrollment retry attempts (fresh order each attempt)"
    required: false
    default: "3"
  ENROLL_RETRY_SLEEP_SECONDS:
    description: "Base sleep between enrollment retries (multiplied by attempt)"
    required: false
    default: "15"

runs:
  using: "composite"
  steps:
    - name: "Pull lego image"
      uses: ./.github/actions/docker_pull
      with:
        IMAGE: goacme/lego

    - name: "Pull curl image"
      uses: ./.github/actions/docker_pull
      with:
        IMAGE: curlimages/curl

    - name: "Wait for ACME directory"
      uses: ./.github/actions/wait_for_directory
      with:
        NAME_SPACE: ${{ inputs.NAME_SPACE }}
        ACME_SERVER: ${{ inputs.ACME_SERVER }}
        HTTPS_PORT: ${{ inputs.HTTPS_PORT }}

    - name: "HTTPS - Enroll lego"
      run: |
        set -euo pipefail
        mkdir -p lego
        attempt=1
        while [ "${attempt}" -le "${ENROLL_MAX_ATTEMPTS}" ]; do
          echo "Enrollment attempt ${attempt}/${ENROLL_MAX_ATTEMPTS}"
          sudo rm -rf lego/certificates lego/accounts 2>/dev/null || true
          set +e
          docker run -i --rm -v "$PWD/lego:/.lego/" --name "lego${HOSTNAME_SUFFIX}" \
            --network "${NAME_SPACE}" goacme/lego run \
            -s "https://${ACME_SERVER}:${HTTPS_PORT}" --tls-skip-verify -a \
            --email "lego@example.com" -d "lego${HOSTNAME_SUFFIX}.${NAME_SPACE}" \
            --cert.timeout "${CERT_TIMEOUT}" --http-timeout "${CERT_TIMEOUT}" --tls
          rc=$?
          set -e
          if [ "${rc}" -eq 0 ]; then
            exit 0
          fi
          echo "Enrollment failed (attempt ${attempt}/${ENROLL_MAX_ATTEMPTS}, rc=${rc})" >&2
          if [ "${attempt}" -ge "${ENROLL_MAX_ATTEMPTS}" ]; then
            break
          fi
          sleep_secs=$((attempt * ENROLL_RETRY_SLEEP_SECONDS))
          echo "Retrying in ${sleep_secs}s..."
          sleep "${sleep_secs}"
          attempt=$((attempt + 1))
        done
        echo "Enrollment failed after ${ENROLL_MAX_ATTEMPTS} attempts" >&2
        exit 1
      shell: bash
      env:
        ACME_SERVER: ${{ inputs.ACME_SERVER }}
        HTTPS_PORT: ${{ inputs.HTTPS_PORT }}
        HOSTNAME_SUFFIX: ${{ inputs.HOSTNAME_SUFFIX }}
        NAME_SPACE: ${{ inputs.NAME_SPACE }}
        CERT_TIMEOUT: ${{ inputs.CERT_TIMEOUT }}
        ENROLL_MAX_ATTEMPTS: ${{ inputs.ENROLL_MAX_ATTEMPTS }}
        ENROLL_RETRY_SLEEP_SECONDS: ${{ inputs.ENROLL_RETRY_SLEEP_SECONDS }}

    - name: "Construct renewal info string"
      id: construct_renewal_info
      run: |
        set -euo pipefail
        AKI_HEX=$(sudo openssl x509 -in "$CERT" -noout -text | awk '/Authority Key Identifier/{getline; print}' | sed 's/ *keyid://;s/://g')
        SERIAL_HEX=$(sudo openssl x509 -in "$CERT" -noout -serial | cut -d'=' -f2)
        echo "$AKI_HEX" | xxd -r -p > /tmp/aki.bin
        echo "$SERIAL_HEX" | xxd -r -p > /tmp/serial.bin
        AKI_B64=$(openssl base64 -A -in /tmp/aki.bin | tr '+/' '-_' | tr -d '=')
        SERIAL_B64=$(openssl base64 -A -in /tmp/serial.bin | tr '+/' '-_' | tr -d '=')
        echo "RENEWAL_INFO=${AKI_B64}.${SERIAL_B64}" >> "$GITHUB_OUTPUT"
      shell: bash
      env:
        CERT: ${{ inputs.CERTIFICATE_FILE }}

    - name: "Get and compare renewal strings from a2c and LE"
      run: |
        set -euo pipefail
        echo "LEGO RENEWAL INFO: ${RENEWAL_INFO}"

        fetch_ari() {
          local url="$1"
          local attempt=1
          local body=""
          while [ "${attempt}" -le "${MAX_ATTEMPTS}" ]; do
            if body=$(docker run -i --rm --network "${NAME_SPACE}" curlimages/curl \
              -fsS --connect-timeout 5 --max-time 30 --insecure "${url}"); then
              echo "${body}"
              return 0
            fi
            echo "ARI fetch failed (${attempt}/${MAX_ATTEMPTS}): ${url}" >&2
            sleep "${SLEEP_SECONDS}"
            attempt=$((attempt + 1))
          done
          return 1
        }

        LE_RENEWAL_OUTPUT=$(fetch_ari "${LE_ARI_BASE}/${RENEWAL_INFO}")
        A2C_RENEWAL_OUTPUT=$(fetch_ari "https://${ACME_SERVER}:${HTTPS_PORT}/acme/renewal-info/${RENEWAL_INFO}")
        LE_RENEWAL_INFO=$(echo "${LE_RENEWAL_OUTPUT}" | jq -c . | sha224sum)
        A2C_RENEWAL_INFO=$(echo "${A2C_RENEWAL_OUTPUT}" | jq -c . | sha224sum)
        echo "LE_RENEWAL: ${LE_RENEWAL_INFO}"
        echo "A2C_RENEWAL: ${A2C_RENEWAL_INFO}"

        if [ -z "${LE_RENEWAL_INFO}" ] || [ -z "${A2C_RENEWAL_INFO}" ]; then
          echo "One of the renewal info values is empty!" >&2
          exit 1
        fi
        if [ "${LE_RENEWAL_INFO}" != "${A2C_RENEWAL_INFO}" ]; then
          echo "Renewal information does not match!" >&2
          echo "LE: ${LE_RENEWAL_OUTPUT}"
          echo "A2C: ${A2C_RENEWAL_OUTPUT}"
          exit 1
        fi
        echo "Renewal information matches."
      shell: bash
      env:
        ACME_SERVER: ${{ inputs.ACME_SERVER }}
        HTTPS_PORT: ${{ inputs.HTTPS_PORT }}
        NAME_SPACE: ${{ inputs.NAME_SPACE }}
        RENEWAL_INFO: ${{ steps.construct_renewal_info.outputs.RENEWAL_INFO }}
        LE_ARI_BASE: ${{ inputs.LE_ARI_BASE }}
        MAX_ATTEMPTS: ${{ inputs.MAX_ATTEMPTS }}
        SLEEP_SECONDS: ${{ inputs.SLEEP_SECONDS }}

    - name: "HTTPS - Revoke lego"
      if: ${{ inputs.REVOCATION == 'true' }}
      run: |
        set -euo pipefail
        docker run -i -v "$PWD/lego:/.lego/" --rm --name "lego${HOSTNAME_SUFFIX}" \
          --network "${NAME_SPACE}" goacme/lego certificates revoke \
          -s "https://${ACME_SERVER}:${HTTPS_PORT}" --tls-skip-verify \
          --email "lego@example.com" --cert.name "lego${HOSTNAME_SUFFIX}.${NAME_SPACE}"
      shell: bash
      env:
        ACME_SERVER: ${{ inputs.ACME_SERVER }}
        HTTPS_PORT: ${{ inputs.HTTPS_PORT }}
        HOSTNAME_SUFFIX: ${{ inputs.HOSTNAME_SUFFIX }}
        NAME_SPACE: ${{ inputs.NAME_SPACE }}

    - name: "Delete lego folders"
      run: sudo rm -rf lego/*
      shell: bash
