name: "tunnel_setup"
description: "SSH port-forward tunnel to MSCA (445/443/88) on the remote AWS instance"
inputs:
  SSH_KEY:
    description: "SSH access key"
    required: true
  SSH_KNOWN_HOSTS:
    description: "SSH known hosts"
    required: true
  MSCA_FQDN_WOTLD:
    description: "FQDN without top level domain (docker container name)"
    required: true
  MSCA_FQDN:
    description: "FQDN used for HTTPS readiness probe"
    required: true
  MSCA_IP:
    description: "MSCA host IP for port mappings; overridden by EC2 public IP when stale"
    required: true
  SSH_USER:
    description: "SSH user"
    required: true
  SSH_HOST:
    description: "SSH host (DNS name or IP); overridden by EC2 public IP when DNS is stale"
    required: true
  SSH_PORT:
    description: "SSH port"
    required: true
  NAME_SPACE:
    description: "Docker network namespace"
    required: true
    default: "acme"
  AWS_ACCESS_KEY_ID:
    description: "Optional AWS key to resolve live EC2 public IP when DNS is stale"
    required: false
    default: ""
  AWS_SECRET_ACCESS_KEY:
    description: "Optional AWS secret"
    required: false
    default: ""
  AWS_REGION:
    description: "Optional AWS region"
    required: false
    default: ""
  AWS_INSTANCE_ID:
    description: "Optional EC2 instance id used for public IP lookup"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
  - name: "Prepare ssh environment on ramdisk"
    run: |
      set -euo pipefail
      sudo mkdir -p /tmp/rd
      sudo mount -t tmpfs -o size=5M none /tmp/rd || true
      printf '%s\n' "${SSH_KEY}" | sudo tee /tmp/rd/ak.tmp >/dev/null
      sudo chmod 600 /tmp/rd/ak.tmp
      printf '%s\n' "${KNOWN_HOSTS}" | sudo tee /tmp/rd/known_hosts >/dev/null
      sudo chown "$(id -u):$(id -g)" /tmp/rd/ak.tmp /tmp/rd/known_hosts 2>/dev/null || true
    env:
      SSH_KEY: ${{ inputs.SSH_KEY }}
      KNOWN_HOSTS: ${{ inputs.SSH_KNOWN_HOSTS }}
    shell: bash

  - name: "Resolve SSH connect host and MSCA_IP (DNS vs EC2 public IP)"
    id: resolve_host
    run: |
      set -euo pipefail
      CONNECT_HOST="${SSH_HOST}"
      FORWARD_IP="${MSCA_IP}"
      DNS_IP="$(getent ahostsv4 "${SSH_HOST}" | awk '{print $1; exit}' || true)"
      echo "SSH_HOST DNS ${SSH_HOST} -> ${DNS_IP:-unresolved}"
      echo "MSCA_IP input: ${MSCA_IP}"

      if [[ -n "${AWS_ACCESS_KEY_ID}" && -n "${AWS_SECRET_ACCESS_KEY}" && -n "${AWS_REGION}" && -n "${AWS_INSTANCE_ID}" ]]; then
        if ! command -v aws >/dev/null 2>&1; then
          pip3 install --user awscli >/dev/null
          export PATH="${HOME}/.local/bin:${PATH}"
        fi
        aws configure set aws_access_key_id "${AWS_ACCESS_KEY_ID}"
        aws configure set aws_secret_access_key "${AWS_SECRET_ACCESS_KEY}"
        aws configure set default.region "${AWS_REGION}"
        export AWS_MAX_ATTEMPTS=1
        PUBLIC_IP=""
        for attempt in 1 2 3 4 5; do
          # Cap connect wait; without this, runner→AWS timeouts burn ~3m per attempt.
          if PUBLIC_IP="$(aws ec2 describe-instances \
            --region "${AWS_REGION}" \
            --instance-ids "${AWS_INSTANCE_ID}" \
            --cli-connect-timeout 10 \
            --cli-read-timeout 30 \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text 2>/tmp/aws_ec2_err.txt)"; then
            break
          fi
          echo "WARNING: aws ec2 describe-instances attempt ${attempt}/5 failed:"
          cat /tmp/aws_ec2_err.txt >&2 || true
          PUBLIC_IP=""
          sleep $((attempt * 2))
        done

        if [[ -n "${PUBLIC_IP}" && "${PUBLIC_IP}" != "None" ]]; then
          echo "EC2 public IP for ${AWS_INSTANCE_ID}: ${PUBLIC_IP}"
          if [[ -z "${DNS_IP}" || "${DNS_IP}" != "${PUBLIC_IP}" ]]; then
            echo "WARNING: DNS ${DNS_IP:-unresolved} != EC2 public IP ${PUBLIC_IP}; using EC2 IP for SSH"
            CONNECT_HOST="${PUBLIC_IP}"
          else
            echo "DNS matches EC2 public IP; using ${SSH_HOST}"
          fi
          # Keep RFC1918 MSCA_IP (reachable from bastion). Refresh only when MSCA_IP
          # is empty, equals stale SSH DNS, or is a mismatched public address.
          is_private=0
          if [[ "${MSCA_IP}" =~ ^10\. ]] || [[ "${MSCA_IP}" =~ ^192\.168\. ]] || [[ "${MSCA_IP}" =~ ^172\.(1[6-9]|2[0-9]|3[0-1])\. ]]; then
            is_private=1
          fi
          if [[ ${is_private} -eq 1 ]]; then
            echo "MSCA_IP ${MSCA_IP} is private; keeping for mappings"
          elif [[ -z "${MSCA_IP}" || "${MSCA_IP}" == "${DNS_IP}" || "${MSCA_IP}" != "${PUBLIC_IP}" ]]; then
            echo "WARNING: MSCA_IP ${MSCA_IP:-empty} stale/mismatched; using EC2 IP ${PUBLIC_IP} for mappings"
            FORWARD_IP="${PUBLIC_IP}"
          else
            echo "MSCA_IP matches EC2 public IP"
          fi
        else
          echo "WARNING: EC2 public IP lookup failed or empty; falling back to SSH_HOST=${SSH_HOST} MSCA_IP=${MSCA_IP}"
        fi
      else
        echo "AWS inputs not fully set; using SSH_HOST=${SSH_HOST} MSCA_IP=${MSCA_IP}"
      fi

      echo "connect_host=${CONNECT_HOST}" >> "${GITHUB_OUTPUT}"
      echo "forward_ip=${FORWARD_IP}" >> "${GITHUB_OUTPUT}"
      echo "Tunnel SSH target: ${CONNECT_HOST}; forward IP: ${FORWARD_IP}"
    env:
      SSH_HOST: ${{ inputs.SSH_HOST }}
      MSCA_IP: ${{ inputs.MSCA_IP }}
      AWS_ACCESS_KEY_ID: ${{ inputs.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ inputs.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ inputs.AWS_REGION }}
      AWS_INSTANCE_ID: ${{ inputs.AWS_INSTANCE_ID }}
    shell: bash

  - name: "Setup ssh forwarder"
    run: |
      set -euo pipefail
      docker run -d --rm --network "${NAME_SPACE}" --name="${MSCA_FQDN_WOTLD}" \
        -e "MAPPINGS=445:${MSCA_IP}:445; 443:${MSCA_IP}:443; 88:${MSCA_IP}:88" \
        -e "SSH_HOST=${SSH_HOST}" \
        -e "SSH_PORT=${SSH_PORT}" \
        -e "SSH_USER=${SSH_USER}" \
        -p 443:443 -p 445:445 -p 88:88 \
        -v "/tmp/rd/ak.tmp:/ssh_key:ro" \
        davidlor/ssh-port-forward-client:dev
    env:
      SSH_USER: ${{ inputs.SSH_USER }}
      SSH_HOST: ${{ steps.resolve_host.outputs.connect_host }}
      SSH_PORT: ${{ inputs.SSH_PORT }}
      MSCA_IP: ${{ steps.resolve_host.outputs.forward_ip }}
      MSCA_FQDN_WOTLD: ${{ inputs.MSCA_FQDN_WOTLD }}
      NAME_SPACE: ${{ inputs.NAME_SPACE }}
    shell: bash

  - name: "Wait for MSCA HTTPS via ssh tunnel"
    run: |
      set -euo pipefail
      # MSCA root may return non-2xx; any HTTP response means the tunnel is up.
      for i in $(seq 1 30); do
        code="$(docker run -i --rm --network "${NAME_SPACE}" curlimages/curl \
          --silent --show-error --insecure \
          --output /dev/null --write-out '%{http_code}' \
          "https://${MSCA_FQDN}" \
          || true)"
        echo "attempt ${i}/30 http_code=${code}"
        if [[ "${code}" =~ ^[1-5][0-9]{2}$ ]]; then
          echo "tunnel ready after ${i} attempt(s)"
          exit 0
        fi
        sleep 2
      done
      echo "ERROR: MSCA tunnel not ready" >&2
      docker logs "${MSCA_FQDN_WOTLD}" 2>&1 || true
      exit 1
    env:
      MSCA_FQDN: ${{ inputs.MSCA_FQDN }}
      MSCA_FQDN_WOTLD: ${{ inputs.MSCA_FQDN_WOTLD }}
      NAME_SPACE: ${{ inputs.NAME_SPACE }}
    shell: bash
