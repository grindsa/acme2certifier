name: "enroll_acmeprofile_remap"
description: "XiPKI ACME single-profile remap: unknown profile enrolls as the sole configured profile"

runs:
  using: "composite"
  steps:
  - name: "Wait for ACME directory"
    uses: ./.github/actions/wait_for_directory

  - name: "ACME Profile remap - unknown profile succeeds (mapped to tls)"
    run: |
      sudo rm -rf lego/*
      docker run -i -v $PWD/lego:/.lego/ --rm --name lego --network acme goacme/lego run --tls-skip-verify -s https://acme-srv -a --email "lego@example.com" -d lego.acme --http --profile unknown
      sudo openssl x509 -in lego/certificates/lego.acme.crt -text -noout
      sudo openssl x509 -in lego/certificates/lego.acme.crt -subject -noout | grep -i lego.acme
    shell: bash
