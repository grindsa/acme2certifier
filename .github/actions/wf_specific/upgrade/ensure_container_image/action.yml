name: "ensure container image"
description: "Pull grindsa/acme2certifier:TAG-websrv-dbhandler or build from that git tag"
inputs:
  VERSION:
    description: "Release tag / image version"
    required: true
  WEB_SRV:
    description: "Web server"
    required: true
    default: "nginx"
  DB_HANDLER:
    description: "wsgi or django"
    required: true

runs:
  using: "composite"
  steps:
    - name: "Pull ${{ inputs.VERSION }}-${{ inputs.WEB_SRV }}-${{ inputs.DB_HANDLER }}"
      id: pull
      continue-on-error: true
      uses: ./.github/actions/docker_pull
      with:
        IMAGE: grindsa/acme2certifier:${{ inputs.VERSION }}-${{ inputs.WEB_SRV }}-${{ inputs.DB_HANDLER }}

    - name: "Build ${{ inputs.VERSION }}-${{ inputs.WEB_SRV }}-${{ inputs.DB_HANDLER }} from tag"
      if: steps.pull.outcome == 'failure'
      shell: bash
      env:
        VERSION: ${{ inputs.VERSION }}
        WEB_SRV: ${{ inputs.WEB_SRV }}
        DB_HANDLER: ${{ inputs.DB_HANDLER }}
      run: |
        set -euo pipefail
        IMAGE="grindsa/acme2certifier:${VERSION}-${WEB_SRV}-${DB_HANDLER}"
        echo "Hub miss/timeout for ${IMAGE}; building from tag ${VERSION}"
        rm -rf "/tmp/a2c-build-${VERSION}"
        git clone --branch "${VERSION}" --depth 1 \
          https://github.com/grindsa/acme2certifier.git "/tmp/a2c-build-${VERSION}"
        docker build \
          -f "/tmp/a2c-build-${VERSION}/examples/Docker/${WEB_SRV}/${DB_HANDLER}/Dockerfile" \
          -t "${IMAGE}" \
          "/tmp/a2c-build-${VERSION}"
        echo "Built ${IMAGE}"
