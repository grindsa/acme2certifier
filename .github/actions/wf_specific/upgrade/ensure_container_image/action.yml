name: "ensure container image"
description: "Pull grindsa/acme2certifier:TAG-websrv-dbhandler (legacy alias) or build from that git tag"
inputs:
  VERSION:
    description: "Release tag / image version"
    required: true
  WEB_SRV:
    description: "Web server"
    required: true
    default: "nginx"
  DB_HANDLER:
    description: "wsgi or django"
    required: true

runs:
  using: "composite"
  steps:
    - name: "Pull ${{ inputs.VERSION }}-${{ inputs.WEB_SRV }}-${{ inputs.DB_HANDLER }}"
      id: pull
      continue-on-error: true
      uses: ./.github/actions/docker_pull
      with:
        IMAGE: grindsa/acme2certifier:${{ inputs.VERSION }}-${{ inputs.WEB_SRV }}-${{ inputs.DB_HANDLER }}

    - name: "Build ${{ inputs.VERSION }}-${{ inputs.WEB_SRV }}-${{ inputs.DB_HANDLER }} from tag"
      if: steps.pull.outcome == 'failure'
      shell: bash
      env:
        VERSION: ${{ inputs.VERSION }}
        WEB_SRV: ${{ inputs.WEB_SRV }}
        DB_HANDLER: ${{ inputs.DB_HANDLER }}
      run: |
        set -euo pipefail
        IMAGE="grindsa/acme2certifier:${VERSION}-${WEB_SRV}-${DB_HANDLER}"
        echo "Hub miss/timeout for ${IMAGE}; building from tag ${VERSION}"
        ROOT="/tmp/a2c-build-${VERSION}"
        rm -rf "${ROOT}"
        git clone --branch "${VERSION}" --depth 1 \
          https://github.com/grindsa/acme2certifier.git "${ROOT}"
        UNIFIED="${ROOT}/examples/Docker/${WEB_SRV}/Dockerfile"
        LEGACY="${ROOT}/examples/Docker/${WEB_SRV}/${DB_HANDLER}/Dockerfile"
        if [[ -f "${UNIFIED}" ]]; then
          echo "Building unified Dockerfile ${UNIFIED}"
          docker build \
            -f "${UNIFIED}" \
            --build-arg "ACME_SRV_DB_HANDLER=${DB_HANDLER}" \
            -t "${IMAGE}" \
            "${ROOT}"
        elif [[ -f "${LEGACY}" ]]; then
          echo "Building legacy Dockerfile ${LEGACY}"
          docker build \
            -f "${LEGACY}" \
            -t "${IMAGE}" \
            "${ROOT}"
        else
          echo "ERROR: no Dockerfile at ${UNIFIED} or ${LEGACY}" >&2
          exit 1
        fi
        echo "Built ${IMAGE}"
