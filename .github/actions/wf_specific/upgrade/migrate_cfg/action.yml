name: "upgrade migrate cfg"
description: "Migrate acme_srv.cfg from handler_file (≤0.44) to handler_module (>0.44)"
inputs:
  VOLUME_DIR:
    description: "Host volume directory containing acme_srv.cfg"
    required: true
  XDB_FILE:
    description: "xdb_file path for the target deployment"
    required: true
  DJANGO:
    description: "If true, refresh django settings to current package layout"
    required: false
    default: "false"
  DEPLOYMENT_TYPE:
    description: "container | rpm | deb (django settings layout)"
    required: true

runs:
  using: "composite"
  steps:
    - name: "Migrate acme_srv.cfg to handler_module"
      uses: ./.github/actions/setup_cahandler_cfg
      with:
        VOLUME_DIR: ${{ inputs.VOLUME_DIR }}
        HANDLER_MODULE: acme2certifier.cahandlers.xca_ca_handler
        OPTIONS: |
          xdb_file: ${{ inputs.XDB_FILE }}
          issuing_ca_name: ${{ env.XCA_ISSUING_CA }}
          passphrase: ${{ env.XCA_PASSPHRASE }}
          ca_cert_chain_list: ["root-ca"]
          template_name: ${{ env.XCA_TEMPLATE }}

    - name: "Refresh django settings if needed"
      if: inputs.DJANGO == 'true'
      shell: bash
      env:
        VOLUME_DIR: ${{ inputs.VOLUME_DIR }}
        DEPLOYMENT_TYPE: ${{ inputs.DEPLOYMENT_TYPE }}
      run: |
        set -euo pipefail
        src=".github/django_settings_mariadb.py"
        tmp="$(mktemp)"
        cp "${src}" "${tmp}"
        bash .github/actions/wf_specific/upgrade/patch_django_ci_settings.sh "${tmp}"
        case "${DEPLOYMENT_TYPE}" in
          container)
            sudo cp "${tmp}" "${VOLUME_DIR}/settings.py"
            ;;
          rpm)
            sudo mkdir -p data/acme2certifier
            sudo cp "${tmp}" data/acme2certifier/settings.py
            sudo sed -i "s|/var/www/|/opt/|g" data/acme2certifier/settings.py
            sudo sed -i "s/USE_I18N = True/USE_I18N = False/g" data/acme2certifier/settings.py
            sudo cp data/acme2certifier/settings.py "${VOLUME_DIR}/settings.py"
            ;;
          deb)
            sudo mkdir -p "${VOLUME_DIR}/acme2certifier"
            sudo cp "${tmp}" "${VOLUME_DIR}/acme2certifier/settings.py"
            ;;
        esac
        rm -f "${tmp}"
