name: "upgrade migrate cfg"
description: "Migrate acme_srv.cfg from handler_file (≤0.44) to handler_module (>0.44)"
inputs:
  VOLUME_DIR:
    description: "Host volume directory containing acme_srv.cfg"
    required: true
  XDB_FILE:
    description: "xdb_file path for the target deployment"
    required: true
  DJANGO:
    description: >
      If true, overlay current-branch django CI settings. Use only after the
      FROM package is stopped / about to be replaced. 0.45.x logging_utils has
      no apply_log_levels; overlaying too early breaks the FROM hop.
    required: false
    default: "false"
  DEPLOYMENT_TYPE:
    description: "container | rpm | deb (django settings layout)"
    required: true

runs:
  using: "composite"
  steps:
    - name: "Migrate acme_srv.cfg to handler_module"
      uses: ./.github/actions/setup_cahandler_cfg
      with:
        VOLUME_DIR: ${{ inputs.VOLUME_DIR }}
        HANDLER_MODULE: acme2certifier.cahandlers.xca_ca_handler
        OPTIONS: |
          xdb_file: ${{ inputs.XDB_FILE }}
          issuing_ca_name: ${{ env.XCA_ISSUING_CA }}
          passphrase: ${{ env.XCA_PASSPHRASE }}
          ca_cert_chain_list: ["root-ca"]
          template_name: ${{ env.XCA_TEMPLATE }}

    - name: "Refresh django DATABASE_URL if needed"
      if: inputs.DJANGO == 'true'
      shell: bash
      env:
        VOLUME_DIR: ${{ inputs.VOLUME_DIR }}
        DEPLOYMENT_TYPE: ${{ inputs.DEPLOYMENT_TYPE }}
      run: |
        set -euo pipefail
        secret="${ACME2CERTIFIER_SECRET_KEY:-$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')}"
        case "${DEPLOYMENT_TYPE}" in
          container)
            env_file="${VOLUME_DIR}/django.env"
            host="mariadbsrv.acme"
            ;;
          rpm)
            env_file="data/django.env"
            host="mariadbsrv.acme"
            ;;
          deb)
            env_file="data/django.env"
            host="mariadbsrv.acme"
            ;;
          *)
            echo "Unknown DEPLOYMENT_TYPE=${DEPLOYMENT_TYPE}" >&2
            exit 1
            ;;
        esac
        bash .github/scripts/django_ci_database_url.sh \
          --django-db mariadb \
          --host "${host}" \
          --secret "${secret}" \
          --env-file "${env_file}" \
          --github-env
        case "${DEPLOYMENT_TYPE}" in
          container)
            ;;
          rpm)
            sudo mkdir -p data/volume
            sudo cp "${env_file}" data/volume/django.env
            sudo cp "${env_file}" "${VOLUME_DIR}/django.env"
            ;;
          deb)
            sudo mkdir -p "${VOLUME_DIR}"
            sudo cp "${env_file}" "${VOLUME_DIR}/django.env"
            ;;
        esac
