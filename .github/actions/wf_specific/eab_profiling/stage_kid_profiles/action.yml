name: "stage_kid_profiles"
description: "Stage a kid_profiles.json fixture into a volume path (optional envsubst)"
inputs:
  SOURCE:
    description: "Path to the kid_profiles fixture JSON"
    required: true
  DEST:
    description: "Destination path for kid_profiles.json"
    required: true
  ENVSUBST:
    description: "If true, run envsubst on the fixture before writing DEST"
    required: false
    default: "false"
  ACME_KEYPATH:
    description: "Substituted for ${ACME_KEYPATH} when ENVSUBST is true"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: "Stage kid_profiles.json"
      shell: bash
      run: |
        set -euo pipefail
        dest_dir="$(dirname "${DEST}")"
        sudo mkdir -p "${dest_dir}"
        if [ "${ENVSUBST}" = "true" ]; then
          if ! command -v envsubst >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq gettext-base
          fi
          # shellcheck disable=SC2016
          envsubst < "${SOURCE}" | sudo tee "${DEST}" >/dev/null
        else
          sudo cp "${SOURCE}" "${DEST}"
        fi
        sudo chmod 777 "${DEST}"
      env:
        SOURCE: ${{ inputs.SOURCE }}
        DEST: ${{ inputs.DEST }}
        ENVSUBST: ${{ inputs.ENVSUBST }}
        ACME_KEYPATH: ${{ inputs.ACME_KEYPATH }}
