name: "container_build_upload"
description: "Build and Upload Container (one image per webserver)"
inputs:
  WEB_SRV:
    description: "Web server"
    required: true
    default: "apache2"
  GH_USER:
    description: "GitHub user/org for sbom companion debs"
    required: true
  GH_SBOM_REPO_TOKEN:
    description: "Token for sbom companion debs"
    required: true
  UBUNTU_TARGET:
    description: "SBOM deb leaf (must match Dockerfile Ubuntu base)"
    required: false
    default: "ub26.04"

runs:
  using: "composite"
  steps:
  - name: "Build container"
    uses: ./.github/actions/container_build
    with:
      DB_HANDLER: wsgi
      WEB_SRV: ${{ inputs.WEB_SRV }}
      GH_USER: ${{ inputs.GH_USER }}
      GH_SBOM_REPO_TOKEN: ${{ inputs.GH_SBOM_REPO_TOKEN }}
      UBUNTU_TARGET: ${{ inputs.UBUNTU_TARGET }}

  - name: "Save container"
    run: |
      docker images
      mkdir -p /tmp/a2c
      docker save "acme2certifier/${WEB_SRV}" > /tmp/a2c/a2c-${{ github.run_id }}.${WEB_SRV}.tar
      gzip /tmp/a2c/a2c-${{ github.run_id }}.${WEB_SRV}.tar
    shell: bash
    env:
      WEB_SRV: ${{ inputs.WEB_SRV }}

  - name: "Upload container package"
    uses: actions/upload-artifact@v7
    with:
      name: a2c-${{ github.run_id }}.${{ inputs.WEB_SRV }}.tar.gz
      path: /tmp/a2c
