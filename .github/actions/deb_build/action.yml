name: "deb_build"
description: "Build deb package"
outputs:
  deb_file_name:
    description: "Name of the debian package file"
    value: acme2certifier_${{ env.TAG_NAME }}-1_all.deb

runs:
  using: "composite"
  steps:

    - name: Retrieve Version from version.py
      run: |
        echo TAG_NAME=$(cat acme2certifier/acme_srv/version.py | grep -i __version__ | head -n 1 | sed 's/__version__ = //g' | sed s/\"//g) >> $GITHUB_ENV
      shell: bash

    - run: echo "Latest tag is ${{ env.TAG_NAME }}"
      shell: bash

    - name: "Install Firefox from Mozilla"
      run: |
        sudo apt-get update
        sudo install -d -m 0755 /etc/apt/keyrings
        wget -q https://packages.mozilla.org/apt/repo-signing-key.gpg -O- | sudo tee /etc/apt/keyrings/packages.mozilla.org.asc > /dev/null
        echo "deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] https://packages.mozilla.org/apt mozilla main" | sudo tee -a /etc/apt/sources.list.d/mozilla.list > /dev/null
        echo '
        Package: *
        Pin: origin packages.mozilla.org
        Pin-Priority: 1000
        ' | sudo tee /etc/apt/preferences.d/mozilla
        sudo apt update && sudo apt install -y firefox --allow-downgrades
      shell: bash

    - name: "Prepare environment to build deb package"
      run: |
        sudo apt-get update && sudo apt-get -y upgrade
        sudo apt-get -y install --allow-downgrades \
          build-essential fakeroot dpkg-dev devscripts debhelper \
          dh-python pybuild-plugin-pyproject python3-all python3-setuptools
        # DEB-specific nginx/uwsgi path and user tweaks (not for pip wheel).
        rm -f acme2certifier/share/nginx/supervisord.conf
        rm -f acme2certifier/share/nginx/uwsgi.service
        rm -f acme2certifier/share/nginx/acme2certifier.te
        sed -i "s/run\/uwsgi\/acme.sock/var\/www\/acme2certifier\/acme.sock/g" acme2certifier/share/nginx/nginx_acme_srv.conf
        sed -i "s/run\/uwsgi\/acme.sock/var\/www\/acme2certifier\/acme.sock/g" acme2certifier/share/nginx/nginx_acme_srv_ssl.conf
        sed -i "s/\/run\/uwsgi\/acme.sock/acme.sock/g" acme2certifier/share/nginx/acme2certifier.ini
        sed -i "s/nginx/www-data/g" acme2certifier/share/nginx/acme2certifier.ini
        echo "plugins=python3" >> acme2certifier/share/nginx/acme2certifier.ini
        # DEB uses system Python packages — drop pip venv python-home from Apache templates.
        for f in acme2certifier/share/apache2/apache_*.conf; do
          # Collapse multi-line WSGIDaemonProcess and drop python-home=.../venv
          perl -i -0pe 's/WSGIDaemonProcess\s+(\S+)\s*\\\s*\n\s*python-home=\/var\/www\/acme2certifier\/venv\s*\\\s*\n\s*python-path=/WSGIDaemonProcess $1 python-path=/g' "$f"
          sed -i 's/ python-home=\/var\/www\/acme2certifier\/venv//' "$f"
        done
        cat <<EOT > acme2certifier/share/nginx/acme2certifier.service
        [Unit]
        Description=uWSGI instance to serve acme2certifier
        After=network.target

        [Service]
        User=www-data
        Group=www-data
        WorkingDirectory=/var/www/acme2certifier
        Environment="PATH=/var/www/acme2certifier"
        Environment="ACME_SRV_CONFIGFILE=/var/www/acme2certifier/acme_srv.cfg"
        ExecStart=uwsgi --ini /var/www/acme2certifier/acme2certifier.ini

        [Install]
        WantedBy=multi-user.target
        EOT
        cp -R examples/install_scripts/debian ./
        sudo sed -i "s/__version__/${{ env.TAG_NAME }}/g" debian/changelog
      shell: bash

    - name: "Build debian package"
      run: |
        set -e
        dpkg-buildpackage -uc -us
        DEB="../acme2certifier_${{ env.TAG_NAME }}-1_all.deb"
        dpkg -c "$DEB"
        echo "Smoke-check package contents for dist-packages + deploy tree"
        dpkg -c "$DEB" | grep -E 'dist-packages/acme2certifier/'
        dpkg -c "$DEB" | grep -E 'var/www/acme2certifier/acme2certifier_wsgi\.py'
        dpkg -c "$DEB" | grep -E 'var/www/acme2certifier/acme_srv\.cfg'
        dpkg -c "$DEB" | grep -E 'var/www/acme2certifier/share/(apache2|nginx)/'
      shell: bash
