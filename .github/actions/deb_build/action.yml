name: "deb_build"
description: "Build deb package"
outputs:
  deb_file_name:
    description: "Name of the debian package file"
    value: acme2certifier_${{ env.TAG_NAME }}-1_all.deb

runs:
  using: "composite"
  steps:

    - name: Retrieve Version from version.py
      run: |
        echo TAG_NAME=$(cat acme2certifier/acme_srv/version.py | grep -i __version__ | head -n 1 | sed 's/__version__ = //g' | sed s/\"//g) >> $GITHUB_ENV
      shell: bash

    - name: "Prepare environment to build deb package"
      run: |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update
        # Match debian/control Build-Depends (+ dpkg tooling for dpkg-buildpackage).
        sudo apt-get -y install --no-install-recommends \
          build-essential dpkg-dev fakeroot debhelper \
          dh-python pybuild-plugin-pyproject \
          python3-all python3-setuptools python3-build
        cp -R examples/install_scripts/debian ./
        sudo sed -i "s/__version__/${{ env.TAG_NAME }}/g" debian/changelog
        chmod +x debian/rules debian/patch_apache_for_deb.py
      shell: bash

    - name: "Build debian package"
      run: |
        set -euo pipefail
        dpkg-buildpackage -uc -us
        echo "DEB_FILE=${PWD}/../acme2certifier_${{ env.TAG_NAME }}-1_all.deb" >> "$GITHUB_ENV"
      shell: bash

    - name: "Smoke-check debian package layout"
      run: |
        set -euo pipefail
        DEB="${DEB_FILE:-../acme2certifier_${{ env.TAG_NAME }}-1_all.deb}"
        [[ -f "${DEB}" ]] || { echo "ERROR: missing ${DEB}" >&2; exit 1; }
        CHECK="$(mktemp -d)"
        trap 'rm -rf "${CHECK}"' EXIT
        dpkg-deb -x "$DEB" "${CHECK}"
        echo "Smoke-check package contents for dist-packages + deploy tree"
        fail() { echo "ERROR: $1" >&2; exit 1; }
        # Avoid pipefail+head SIGPIPE when collecting dist-packages paths.
        mapfile -t DIST_DIRS < <(
          find "${CHECK}/usr/lib" -type d -path '*/dist-packages/acme2certifier' 2>/dev/null || true
        )
        [[ ${#DIST_DIRS[@]} -ge 1 ]] || fail "no dist-packages/acme2certifier under usr/lib"
        WWW="${CHECK}/var/www/acme2certifier"
        [[ -f "${WWW}/acme2certifier_wsgi.py" ]] || fail "missing acme2certifier_wsgi.py"
        [[ -d "${WWW}/acme_srv" ]] || fail "missing acme_srv/ deploy dir (debian/dirs)"
        # Sample cfg only under share/ + examples/ (not as a dpkg conffile at WWW root).
        [[ -f "${WWW}/share/acme_srv.cfg" ]] || fail "missing share/acme_srv.cfg sample"
        [[ -f "${WWW}/examples/acme_srv.cfg" ]] || fail "missing examples/acme_srv.cfg sample"
        [[ ! -e "${WWW}/acme_srv.cfg" ]] || fail "acme_srv.cfg must not be packaged at WWW root (conffile)"
        [[ -d "${WWW}/share/apache2" ]] || fail "missing share/apache2"
        [[ -d "${WWW}/share/nginx" ]] || fail "missing share/nginx"
        [[ -f "${WWW}/share/nginx/acme2certifier.service" ]] || fail "missing nginx unit"
        [[ -f "${WWW}/share/apache2/apache_wsgi.conf" ]] || fail "missing apache_wsgi.conf"
        echo "Apache vhosts in .deb must not reference pip venv"
        if grep -R 'python-home=/var/www/acme2certifier/venv' \
          "${WWW}/share/apache2/"; then
          fail "python-home=venv still present in packaged Apache configs"
        fi
        echo "Smoke-check OK (dist-packages=${DIST_DIRS[0]#"${CHECK}"})"
      shell: bash
