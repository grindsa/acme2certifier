name: "clear_break_glass"
description: "Remove ACME2CERTIFIER_I_KNOW_THE_RISK for CI security-disable negative tests"
inputs:
  DEPLOYMENT_TYPE:
    description: "container | rpm | deb"
    required: true
  COMPOSE_DIR:
    description: "docker compose directory (container)"
    required: false
    default: "examples/Docker"
  CONTAINER:
    description: "Host container name (rpm/deb)"
    required: false
    default: "acme-srv"
  RECREATE:
    description: "container: force-recreate so env clear applies"
    required: false
    default: "true"
  RESTART:
    description: "rpm/deb: restart a2c so DefaultEnvironment clear is picked up"
    required: false
    default: "true"
  WEBSRV:
    description: "Web server for deb restart (apache2|nginx)"
    required: false
    default: ""
  CONF_NAME:
    description: "systemd drop-in filename (rpm/deb)"
    required: false
    default: "a2c-break-glass.conf"

runs:
  using: "composite"
  steps:
    - name: "Clear ACME2CERTIFIER_I_KNOW_THE_RISK (${{ inputs.DEPLOYMENT_TYPE }})"
      run: |
        set -euo pipefail
        case "${DEPLOYMENT_TYPE}" in
          container)
            rm -f "${COMPOSE_DIR}/docker-compose.override.yml"
            if [ "${RECREATE}" = "true" ]; then
              (cd "${COMPOSE_DIR}" && docker compose up -d --force-recreate --no-build)
            fi
            ;;
          rpm|deb)
            # deb+apache2 runs under apache2/mod_wsgi (no acme2certifier unit).
            # rpm and deb+nginx use acme2certifier.service (uWSGI).
            if [ "${DEPLOYMENT_TYPE}" = "deb" ] && [ "${WEBSRV}" = "apache2" ]; then
              UNIT="apache2.service"
            else
              UNIT="acme2certifier.service"
            fi
            # EL8 systemd can retain manager DefaultEnvironment across a soft
            # restart; remove drop-in, UnsetEnvironment on the app unit, reexec,
            # restart, then assert the running process no longer has the env.
            docker exec "${CONTAINER}" bash -c "
              set -euo pipefail
              unit='${UNIT}'
              rm -f /etc/systemd/system.conf.d/${CONF_NAME}
              mkdir -p \"/etc/systemd/system/\${unit}.d\"
              printf '%s\n' \
                '[Service]' \
                'UnsetEnvironment=ACME2CERTIFIER_I_KNOW_THE_RISK' \
                > \"/etc/systemd/system/\${unit}.d/clear-break-glass.conf\"
              systemctl daemon-reload
              systemctl daemon-reexec
            "
            if [ "${RESTART}" = "true" ]; then
              if [ "${DEPLOYMENT_TYPE}" = "rpm" ]; then
                docker exec "${CONTAINER}" bash -c '
                  set -euo pipefail
                  systemctl stop acme2certifier.service || true
                  bash /tmp/acme2certifier/a2c-rpm.sh restart
                '
              else
                if [ -z "${WEBSRV}" ]; then
                  echo "ERROR: WEBSRV is required for deb restart" >&2
                  exit 1
                fi
                docker exec "${CONTAINER}" bash -c "
                  set -euo pipefail
                  systemctl stop '${UNIT}' || true
                  bash /tmp/acme2certifier/a2c-deb.sh restart ${WEBSRV}
                "
              fi
            fi
            docker exec "${CONTAINER}" bash -c "
              set -euo pipefail
              unit='${UNIT}'
              pid=\"\$(systemctl show -p MainPID --value \"\${unit}\")\"
              if [ -z \"\${pid}\" ] || [ \"\${pid}\" = \"0\" ]; then
                echo \"ERROR: \${unit} MainPID unavailable after clear\" >&2
                exit 1
              fi
              if tr '\0' '\n' < \"/proc/\${pid}/environ\" | grep -qx 'ACME2CERTIFIER_I_KNOW_THE_RISK=1'; then
                echo \"ERROR: ACME2CERTIFIER_I_KNOW_THE_RISK still set in \${unit} pid \${pid}\" >&2
                exit 1
              fi
              echo \"break-glass cleared (\${unit} pid \${pid})\"
            "
            ;;
          *)
            echo "ERROR: unknown DEPLOYMENT_TYPE=${DEPLOYMENT_TYPE}" >&2
            exit 1
            ;;
        esac
      shell: bash
      env:
        DEPLOYMENT_TYPE: ${{ inputs.DEPLOYMENT_TYPE }}
        COMPOSE_DIR: ${{ inputs.COMPOSE_DIR }}
        CONTAINER: ${{ inputs.CONTAINER }}
        RECREATE: ${{ inputs.RECREATE }}
        RESTART: ${{ inputs.RESTART }}
        WEBSRV: ${{ inputs.WEBSRV }}
        CONF_NAME: ${{ inputs.CONF_NAME }}
