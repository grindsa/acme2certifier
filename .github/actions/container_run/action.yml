name: "container_run"
description: "Run grindsa/acme2certifier:VERSION-websrv-dbhandler (prefer local image; pull only if missing)"
inputs:
  DB_HANDLER:
    description: "Database handler"
    required: true
    default: "wsgi"
  WEB_SRV:
    description: "Web server"
    required: true
    default: "apache2"
  DOCKER_COMPOSE_FILE_PATH:
    description: "Path to the docker compose file (volume data/)"
    required: false
    default: "examples/Docker"
  NAME_SPACE:
    description: "namespace"
    required: true
    default: "acme"
  VERSION:
    description: "a2c version"
    required: false
    default: "latest"
  SKIP_PULL:
    description: "Never pull; require image already local (e.g. after ensure_container_image)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: "Resolve image ${{ inputs.VERSION }}-${{ inputs.WEB_SRV }}-${{ inputs.DB_HANDLER }}"
      id: image
      shell: bash
      env:
        VERSION: ${{ inputs.VERSION }}
        WEB_SRV: ${{ inputs.WEB_SRV }}
        DB_HANDLER: ${{ inputs.DB_HANDLER }}
        SKIP_PULL: ${{ inputs.SKIP_PULL }}
      run: |
        set -euo pipefail
        IMAGE="grindsa/acme2certifier:${VERSION}-${WEB_SRV}-${DB_HANDLER}"
        echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
        if docker image inspect "${IMAGE}" >/dev/null 2>&1; then
          echo "Using local image ${IMAGE}"
          echo "need_pull=false" >> "${GITHUB_OUTPUT}"
          exit 0
        fi
        if [[ "${SKIP_PULL}" == "true" ]]; then
          echo "ERROR: image ${IMAGE} not local and SKIP_PULL=true" >&2
          exit 1
        fi
        echo "Local image missing; will pull ${IMAGE}"
        echo "need_pull=true" >> "${GITHUB_OUTPUT}"

    - name: "Pull a2c image"
      if: steps.image.outputs.need_pull == 'true'
      uses: ./.github/actions/docker_pull
      with:
        IMAGE: ${{ steps.image.outputs.image }}

    - name: "Spin-up a2c instance (${{ inputs.WEB_SRV }}_${{ inputs.DB_HANDLER }})"
      working-directory: ${{ inputs.DOCKER_COMPOSE_FILE_PATH }}
      run: |
        set -euo pipefail
        # django.env is KEY='value' for bash source. docker --env-file would keep the quotes.
        env_args=()
        if [[ -f ./data/django.env ]]; then
          set -a
          # shellcheck disable=SC1091
          source ./data/django.env
          set +a
        fi
        for key in ACME2CERTIFIER_SECRET_KEY ACME2CERTIFIER_ALLOWED_HOSTS ACME2CERTIFIER_DATABASE_URL; do
          if [[ -n "${!key:-}" ]]; then
            env_args+=(-e "$key")
          fi
        done
        docker run -d -p 80:80 -p 443:443 --rm -id --network "$NAME_SPACE" --name=acme-srv \
          "${env_args[@]}" \
          -v "$(pwd)/data":/var/www/acme2certifier/volume/ \
          "${IMAGE}"
        # ≤0.44 nginx SSL conf hardcodes /etc/nginx/acme2certifier_{cert,key}.pem
        # (modern share uses volume/). Stage CI certs where legacy nginx looks.
        if [[ -f ./data/acme2certifier_cert.pem && -f ./data/acme2certifier_key.pem ]]; then
          docker exec acme-srv sh -c '
            set -e
            if [[ -d /etc/nginx ]]; then
              cp -f /var/www/acme2certifier/volume/acme2certifier_cert.pem /etc/nginx/acme2certifier_cert.pem
              cp -f /var/www/acme2certifier/volume/acme2certifier_key.pem /etc/nginx/acme2certifier_key.pem
              supervisorctl restart nginx >/dev/null 2>&1 || supervisorctl start nginx >/dev/null 2>&1 || true
            fi
          '
        fi
        docker logs acme-srv
      env:
        NAME_SPACE: ${{ inputs.NAME_SPACE }}
        IMAGE: ${{ steps.image.outputs.image }}
      shell: bash
