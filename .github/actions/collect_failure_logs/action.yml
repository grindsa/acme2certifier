name: "collect_failure_logs"
description: "Collect deployment logs into artifact/upload/artifact.tar.gz on failure"
inputs:
  DEPLOYMENT_TYPE:
    description: "container | rpm | deb"
    required: true
  WEBSRV:
    description: "Web server (deb only: apache2|nginx)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: "Collect logs"
      run: |
        set -euo pipefail
        mkdir -p "${GITHUB_WORKSPACE}/artifact/upload"
        case "${DEPLOYMENT_TYPE}" in
          container)
            sudo cp -rp examples/Docker/data/ "${GITHUB_WORKSPACE}/artifact/data/"
            sudo cp -rp acme-sh/ "${GITHUB_WORKSPACE}/artifact/acme-sh/" 2>/dev/null || true
            sudo cp -rp certbot/ "${GITHUB_WORKSPACE}/artifact/certbot/" 2>/dev/null || true
            sudo cp -rp lego/ "${GITHUB_WORKSPACE}/artifact/lego/" 2>/dev/null || true
            (cd examples/Docker && docker compose logs > "${GITHUB_WORKSPACE}/artifact/docker-compose.log") || true
            ;;
          rpm)
            docker exec acme-srv tar cvfz /tmp/acme2certifier/a2c.tgz /opt/acme2certifier || true
            sudo cp -rp data/ "${GITHUB_WORKSPACE}/artifact/data/"
            sudo rm -f "${GITHUB_WORKSPACE}"/artifact/data/*.rpm || true
            sudo cp -rp acme-sh/ "${GITHUB_WORKSPACE}/artifact/acme-sh/" 2>/dev/null || true
            docker exec acme-srv cat /etc/nginx/nginx.conf.orig > "${GITHUB_WORKSPACE}/artifact/data/nginx.conf.orig" 2>/dev/null || true
            docker exec acme-srv cat /etc/nginx/nginx.conf > "${GITHUB_WORKSPACE}/artifact/data/nginx.conf" 2>/dev/null || true
            docker exec acme-srv cat /var/log/messages > "${GITHUB_WORKSPACE}/artifact/acme-srv.log" || true
            ;;
          deb)
            docker exec acme-srv tar cvfz /tmp/acme2certifier/a2c.tgz /var/www/acme2certifier/ || true
            sudo cp -rp data/ "${GITHUB_WORKSPACE}/artifact/data/"
            sudo rm -f "${GITHUB_WORKSPACE}"/artifact/data/*.deb || true
            if [[ "${WEBSRV}" == "apache2" ]]; then
              docker exec acme-srv cat /var/log/apache2/error.log > "${GITHUB_WORKSPACE}/artifact/acme-srv.log" || true
            else
              docker exec acme-srv cat /var/log/nginx/error.log > "${GITHUB_WORKSPACE}/artifact/acme-srv.log" || true
            fi
            docker exec acme-srv cat /var/log/syslog > "${GITHUB_WORKSPACE}/artifact/syslog" || true
            ;;
          *)
            echo "ERROR: unknown DEPLOYMENT_TYPE=${DEPLOYMENT_TYPE}" >&2
            exit 1
            ;;
        esac
        # Include any pre-collected extras under artifact/ (exclude upload/)
        sudo tar -C "${GITHUB_WORKSPACE}/artifact/" -cvzf "${GITHUB_WORKSPACE}/artifact/upload/artifact.tar.gz" \
          --exclude=upload \
          .
      shell: bash
      env:
        DEPLOYMENT_TYPE: ${{ inputs.DEPLOYMENT_TYPE }}
        WEBSRV: ${{ inputs.WEBSRV }}
