name: "channel_teardown"
description: "Collect, sanitize, and upload failure logs; always run secure cleanup. Callers MUST use if: always()."
inputs:
  DEPLOYMENT_TYPE:
    description: "container | rpm | deb | pip"
    required: true
  ARTIFACT_NAME:
    description: "upload-artifact name"
    required: true
  WEBSRV:
    description: "Web server (deb collect_failure_logs)"
    required: false
    default: ""
  ARTIFACT_PATH:
    description: "Path uploaded on failure"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    # Callers must use `if: always()`. Without it the composite is skipped on
    # job failure (default if: success()) and no logs are uploaded.
    # `failure()` alone is not enough if a caller used `if: failure()` (inner
    # failure() is then false because no prior composite step failed).
    - name: "[ * ] Collecting test logs"
      if: ${{ failure() || job.status == 'failure' }}
      continue-on-error: true
      uses: ./.github/actions/collect_failure_logs
      with:
        DEPLOYMENT_TYPE: ${{ inputs.DEPLOYMENT_TYPE }}
        WEBSRV: ${{ inputs.WEBSRV }}

    - name: "Sanitize failure artifacts"
      if: ${{ failure() || job.status == 'failure' }}
      uses: ./.github/actions/sanitize_artifact_payload
      with:
        ARTIFACT_DIR: ${{ github.workspace }}/artifact

    - name: "[ * ] Uploading artifacts"
      if: ${{ failure() || job.status == 'failure' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.ARTIFACT_NAME }}
        path: ${{ inputs.ARTIFACT_PATH != '' && inputs.ARTIFACT_PATH || format('{0}/artifact/upload/', github.workspace) }}
        retention-days: 1

    - name: "Secure cleanup"
      if: ${{ always() }}
      uses: ./.github/actions/secure_cleanup
