name: "setup_cahandler_cfg"
description: "Write acme_srv.cfg from openssl base, replacing [CAhandler] body with handler_module + options"
inputs:
  VOLUME_DIR:
    description: "Target volume directory (acme_srv.cfg is written here)"
    required: false
    default: "data/volume"
  CFG_SOURCE:
    description: "Base acme_srv.cfg (sections above [CAhandler] are kept)"
    required: false
    default: ".github/acme_srv.openssl.cfg"
  HANDLER_MODULE:
    description: "Dotted Python module for CAhandler.handler_module (omit when using handler_file in OPTIONS)"
    required: false
    default: ""
  OPTIONS:
    description: "Extra [CAhandler] options (multiline). Expand secrets in the caller before passing."
    required: false
    default: ""
  EXTRA_SECTIONS:
    description: "Additional cfg sections to append (e.g. [EABhandler]). Multiline."
    required: false
    default: ""
  CERTIFICATE_OPTIONS:
    description: "Lines to insert after [Certificate] header (e.g. enrollment_timeout: 15)"
    required: false
    default: ""
  ORDER_OPTIONS:
    description: "Lines to insert after [Order] header (e.g. header_info_list / profiles)"
    required: false
    default: ""
  PATH_REWRITE_FROM:
    description: "Optional substring to rewrite in the finished cfg"
    required: false
    default: ""
  PATH_REWRITE_TO:
    description: "Replacement for PATH_REWRITE_FROM"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: "Write acme_srv.cfg"
      run: |
        set -euo pipefail
        cfg="${VOLUME_DIR}/acme_srv.cfg"
        sudo mkdir -p "${VOLUME_DIR}"

        # Keep base cfg through the [CAhandler] header; drop openssl-specific body.
        awk '1; /^\[CAhandler\][[:space:]]*$/ { exit }' "${CFG_SOURCE}" | sudo tee "${cfg}" >/dev/null

        {
          if [[ -n "${HANDLER_MODULE}" ]]; then
            echo "handler_module: ${HANDLER_MODULE}"
          fi
          if [[ -n "${OPTIONS}" ]]; then
            # Callers should expand secrets in OPTIONS before passing the input.
            printf '%s\n' "${OPTIONS}"
          fi
        } | sudo tee -a "${cfg}" >/dev/null

        if [[ -n "${EXTRA_SECTIONS}" ]]; then
          printf '\n%s\n' "${EXTRA_SECTIONS}" | sudo tee -a "${cfg}" >/dev/null
        fi

        insert_after_section() {
          local section="$1"
          local options="$2"
          [[ -z "${options}" ]] && return 0
          local opts_file tmp
          opts_file="$(mktemp)"
          tmp="$(mktemp)"
          printf '%s\n' "${options}" > "${opts_file}"
          awk -v section="[${section}]" -v opts_file="${opts_file}" '
            $0 == section {
              print
              while ((getline line < opts_file) > 0) print line
              close(opts_file)
              next
            }
            { print }
          ' "${cfg}" > "${tmp}"
          sudo mv "${tmp}" "${cfg}"
          rm -f "${opts_file}"
        }

        insert_after_section "Certificate" "${CERTIFICATE_OPTIONS}"
        insert_after_section "Order" "${ORDER_OPTIONS}"

        if [[ -n "${PATH_REWRITE_FROM}" ]]; then
          sudo sed -i "s|${PATH_REWRITE_FROM}|${PATH_REWRITE_TO}|g" "${cfg}"
        fi

        sudo chmod 777 "${cfg}"
      shell: bash
      env:
        VOLUME_DIR: ${{ inputs.VOLUME_DIR }}
        CFG_SOURCE: ${{ inputs.CFG_SOURCE }}
        HANDLER_MODULE: ${{ inputs.HANDLER_MODULE }}
        OPTIONS: ${{ inputs.OPTIONS }}
        EXTRA_SECTIONS: ${{ inputs.EXTRA_SECTIONS }}
        CERTIFICATE_OPTIONS: ${{ inputs.CERTIFICATE_OPTIONS }}
        ORDER_OPTIONS: ${{ inputs.ORDER_OPTIONS }}
        PATH_REWRITE_FROM: ${{ inputs.PATH_REWRITE_FROM }}
        PATH_REWRITE_TO: ${{ inputs.PATH_REWRITE_TO }}
