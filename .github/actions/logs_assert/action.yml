name: "logs_assert"
description: "Assert PATTERN appears in acme-srv logs (full file), then flush"
inputs:
  PATTERN:
    description: "Substring/regex that must appear in the logs"
    required: true
  DEPLOYMENT_TYPE:
    description: "container | rpm | deb"
    required: true
    default: "rpm"
  ACME_SERVER:
    description: "Container name for rpm/deb exec"
    required: false
    default: "acme-srv"
  COMPOSE_SERVICE:
    description: "docker compose service container name for container deployments"
    required: false
    default: "acme2certifier-acme-srv-1"
  REGEX:
    description: "If true, use grep -E; otherwise grep -F"
    required: false
    default: "false"
  IGNORE_CASE:
    description: "If true, use grep -i"
    required: false
    default: "false"
  FLUSH:
    description: "If true, flush logs after a successful match"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: "Assert log pattern (${{ inputs.DEPLOYMENT_TYPE }})"
      working-directory: examples/Docker/
      run: |
        set -euo pipefail
        GREP_OPTS=()
        if [[ "${REGEX}" == "true" ]]; then
          GREP_OPTS+=(-E)
        else
          GREP_OPTS+=(-F)
        fi
        if [[ "${IGNORE_CASE}" == "true" ]]; then
          GREP_OPTS+=(-i)
        fi
        case "${DEPLOYMENT_TYPE}" in
          container)
            docker compose logs | grep "${GREP_OPTS[@]}" -- "${PATTERN}"
            if [[ "${FLUSH}" == "true" ]]; then
              sudo truncate -s 0 "$(docker inspect --format='{{.LogPath}}' "${COMPOSE_SERVICE}")"
            fi
            ;;
          rpm)
            docker exec "${ACME_SERVER}" grep "${GREP_OPTS[@]}" -- "${PATTERN}" /var/log/messages
            if [[ "${FLUSH}" == "true" ]]; then
              docker exec "${ACME_SERVER}" truncate -s 0 /var/log/messages
            fi
            ;;
          deb)
            docker exec "${ACME_SERVER}" sh -c '
              pattern=$1; shift
              if [ -f /var/log/apache2/error.log ]; then
                grep "$@" -- "$pattern" /var/log/apache2/error.log /var/log/syslog
              elif [ -f /var/log/nginx/error.log ]; then
                grep "$@" -- "$pattern" /var/log/nginx/error.log /var/log/syslog
              else
                grep "$@" -- "$pattern" /var/log/syslog
              fi
            ' sh "${PATTERN}" "${GREP_OPTS[@]}"
            if [[ "${FLUSH}" == "true" ]]; then
              docker exec "${ACME_SERVER}" sh -c '
                if [ -f /var/log/apache2/error.log ]; then truncate -s 0 /var/log/apache2/error.log; fi
                if [ -f /var/log/nginx/error.log ]; then truncate -s 0 /var/log/nginx/error.log; fi
                if [ -f /var/log/syslog ]; then truncate -s 0 /var/log/syslog; fi
              '
            fi
            ;;
          *)
            echo "ERROR: unsupported DEPLOYMENT_TYPE=${DEPLOYMENT_TYPE}" >&2
            exit 1
            ;;
        esac
      shell: bash
      env:
        PATTERN: ${{ inputs.PATTERN }}
        DEPLOYMENT_TYPE: ${{ inputs.DEPLOYMENT_TYPE }}
        ACME_SERVER: ${{ inputs.ACME_SERVER }}
        COMPOSE_SERVICE: ${{ inputs.COMPOSE_SERVICE }}
        REGEX: ${{ inputs.REGEX }}
        IGNORE_CASE: ${{ inputs.IGNORE_CASE }}
        FLUSH: ${{ inputs.FLUSH }}
