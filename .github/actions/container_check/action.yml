name: "container_check"
description: "Check container configuration"
inputs:
  DB_HANDLER:
    description: "Database handler"
    required: true
    default: "wsgi"
  WEB_SRV:
    description: "Web server"
    required: true
    default: "apache2"
  DOCKER_COMPOSE_FILE_PATH:
    description: "Path to the docker compose file"
    required: false
    default: "examples/Docker/"

runs:
  using: "composite"
  steps:
    - name: "ACME_SRV_DB_HANDLER matches image variant"
      working-directory: ${{ inputs.DOCKER_COMPOSE_FILE_PATH }}
      run: |
          set -euo pipefail
          got="$(docker compose exec -T acme-srv printenv ACME_SRV_DB_HANDLER)"
          echo "ACME_SRV_DB_HANDLER=${got} (expected ${DB_HANDLER})"
          test "${got}" = "${DB_HANDLER}"
      env:
        DB_HANDLER: ${{ inputs.DB_HANDLER }}
      shell: bash
    - name: "Check logs for web server"
      uses: ./.github/actions/logs_assert
      with:
        DEPLOYMENT_TYPE: container
        PATTERN: ${{ inputs.WEB_SRV }}
        IGNORE_CASE: "true"
        FLUSH: "false"
    - name: "Check logs for django migrations"
      if: ${{ inputs.DB_HANDLER == 'django' }}
      uses: ./.github/actions/logs_assert
      with:
        DEPLOYMENT_TYPE: container
        PATTERN: "migrations"
        IGNORE_CASE: "true"
        FLUSH: "false"
    - name: "Check logs for db handler"
      if: ${{ inputs.DB_HANDLER != 'django' }}
      uses: ./.github/actions/logs_assert
      with:
        DEPLOYMENT_TYPE: container
        PATTERN: ${{ inputs.DB_HANDLER }}
        IGNORE_CASE: "true"
        FLUSH: "false"
