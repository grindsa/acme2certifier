name: "download artifact"
description: "download an artifact from a workflow run"
inputs:
  RUN_ID:
    description: "The run ID of the workflow run that produced the artifact"
    required: true
  ARTIFACT_NAME:
    description: "The name of the artifact to download"
    required: true
  DESTINATION_PATH:
    description: "The path to download the artifact to"
    required: false
    default: "./"
  TOKEN:
    description: "GitHub token with permissions to access the artifact"
    required: false
    default: ""
  REPO:
    description: "The repository in the format owner/repo. Defaults to the current repository."
    required: false
    default: ""
  MAX_ATTEMPTS:
    description: "Maximum number of resolve/download attempts"
    required: false
    default: "5"
  RETRY_DELAY_SECONDS:
    description: "Initial delay between retries in seconds (doubles each attempt)"
    required: false
    default: "10"

runs:
  using: "composite"
  steps:

    - name: "Get artifact"
      run: |
        set -euo pipefail

        mkdir -p "${DESTINATION_PATH}"
        cd "${DESTINATION_PATH}"

        ZIP_FILE="${ARTIFACT_NAME}.zip"
        attempt=1
        delay="${RETRY_DELAY_SECONDS}"

        while [ "${attempt}" -le "${MAX_ATTEMPTS}" ]; do
          echo "Attempt ${attempt}/${MAX_ATTEMPTS}: resolve artifact '${ARTIFACT_NAME}' from run ${RUN_ID} in ${REPO}"

          ART_ID="$(
            gh api --paginate "repos/${REPO}/actions/runs/${RUN_ID}/artifacts" \
              --jq ".artifacts[] | select(.name==\"${ARTIFACT_NAME}\") | .id" \
              | head -n1 || true
          )"

          if [ -z "${ART_ID}" ]; then
            echo "Artifact '${ARTIFACT_NAME}' not found in run ${RUN_ID}" >&2
          else
            echo "Downloading artifact id=${ART_ID}"
            rm -f "${ZIP_FILE}"
            if gh api "repos/${REPO}/actions/artifacts/${ART_ID}/zip" > "${ZIP_FILE}" \
              && unzip -t "${ZIP_FILE}" >/dev/null; then
              unzip -o "${ZIP_FILE}"
              rm -f "${ZIP_FILE}"
              echo "Download succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Download or zip validation failed for artifact id=${ART_ID}" >&2
            rm -f "${ZIP_FILE}"
          fi

          if [ "${attempt}" -ge "${MAX_ATTEMPTS}" ]; then
            break
          fi

          echo "Retrying in ${delay}s..."
          sleep "${delay}"
          delay=$((delay * 2))
          attempt=$((attempt + 1))
        done

        echo "Failed to download artifact '${ARTIFACT_NAME}' after ${MAX_ATTEMPTS} attempts" >&2
        exit 1
      shell: bash
      env:
        DESTINATION_PATH: ${{ inputs.DESTINATION_PATH }}
        GH_TOKEN: ${{ inputs.TOKEN || github.token }}
        REPO: ${{ inputs.REPO || github.repository }}
        RUN_ID: ${{ inputs.RUN_ID }}
        ARTIFACT_NAME: ${{ inputs.ARTIFACT_NAME }}
        MAX_ATTEMPTS: ${{ inputs.MAX_ATTEMPTS }}
        RETRY_DELAY_SECONDS: ${{ inputs.RETRY_DELAY_SECONDS }}
