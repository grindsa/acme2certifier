name: "image_build_push"
description: "Checkout a release tag, download its .deb, build multi-arch websrv image, push primary + legacy tags"
inputs:
  tag:
    description: "Release tag to build"
    required: true
  websrv:
    description: "Web server variant (apache2|nginx)"
    required: true
  tag_n:
    description: "Current supported tag N (enables floating tags when tag == tag_n)"
    required: true
  dockerhub_user:
    description: "Docker Hub username"
    required: true
  dockerhub_token:
    description: "Docker Hub token"
    required: true
  ghcr_user:
    description: "GHCR username"
    required: true
  ghcr_token:
    description: "GHCR token"
    required: true
  github_token:
    description: "GitHub token for downloading release assets"
    required: true
  GH_USER:
    description: "GitHub user/org for sbom companion debs"
    required: true
  GH_SBOM_REPO_TOKEN:
    description: "Token for sbom companion debs"
    required: true
  UBUNTU_TARGET:
    description: "SBOM deb leaf (must match Dockerfile Ubuntu base)"
    required: false
    default: "ub26.04"

runs:
  using: "composite"
  steps:
    - name: Checkout image tag sources
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.tag }}
        path: image-src

    - name: Download release .deb into build context
      uses: ./.github/actions/download_release_deb
      with:
        tag: ${{ inputs.tag }}
        destination: image-src
        github_token: ${{ inputs.github_token }}

    - name: Fetch sbom companion debs into build context
      uses: ./.github/actions/fetch_sbom_debs
      with:
        GH_USER: ${{ inputs.GH_USER }}
        GH_SBOM_REPO_TOKEN: ${{ inputs.GH_SBOM_REPO_TOKEN }}
        UBUNTU_TARGET: ${{ inputs.UBUNTU_TARGET }}
        DESTINATION: image-src

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
      with:
        platforms: linux/amd64,linux/arm64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ inputs.dockerhub_user }}
        password: ${{ inputs.dockerhub_token }}

    - name: Login to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ inputs.ghcr_user }}
        password: ${{ inputs.ghcr_token }}

    - name: Compute primary and legacy-wsgi tags
      id: tags
      shell: bash
      env:
        WEBSRV: ${{ inputs.websrv }}
        TAG: ${{ inputs.tag }}
        TAG_N: ${{ inputs.tag_n }}
      run: |
        set -euo pipefail
        DH="grindsa/acme2certifier"
        GH="ghcr.io/grindsa/acme2certifier"
        # Primary: websrv. Compat: same-digest *-wsgi aliases.
        TAG_LIST=(
          "${DH}:${TAG}-${WEBSRV}"
          "${GH}:${TAG}-${WEBSRV}"
          "${DH}:${TAG}-${WEBSRV}-wsgi"
          "${GH}:${TAG}-${WEBSRV}-wsgi"
        )

        if [[ "${TAG}" == "${TAG_N}" ]]; then
          TAG_LIST+=(
            "${DH}:${WEBSRV}" "${GH}:${WEBSRV}"
            "${DH}:${WEBSRV}-wsgi" "${GH}:${WEBSRV}-wsgi"
          )
          if [[ "${WEBSRV}" == "apache2" ]]; then
            TAG_LIST+=("${DH}:latest" "${GH}:latest")
          fi
        fi

        {
          echo "tags<<EOF"
          printf "%s\n" "${TAG_LIST[@]}"
          echo "EOF"
          echo "django_tags<<EOF"
          echo "${DH}:${TAG}-${WEBSRV}-django"
          echo "${GH}:${TAG}-${WEBSRV}-django"
          if [[ "${TAG}" == "${TAG_N}" ]]; then
            echo "${DH}:${WEBSRV}-django"
            echo "${GH}:${WEBSRV}-django"
          fi
          echo "EOF"
        } >> "${GITHUB_OUTPUT}"

        echo "Building ${WEBSRV} (default wsgi) for tag ${TAG}"
        printf "%s\n" "${TAG_LIST[@]}"

    - name: Build and push primary multi-arch image (wsgi default)
      uses: docker/build-push-action@v7
      with:
        context: image-src
        file: image-src/examples/Docker/${{ inputs.websrv }}/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        build-args: |
          ACME_SRV_DB_HANDLER=wsgi
        tags: ${{ steps.tags.outputs.tags }}

    # Thin config-layer alias so pull-and-run without cfg still boots Django.
    - name: Build and push legacy *-django aliases
      shell: bash
      env:
        WEBSRV: ${{ inputs.websrv }}
        TAG: ${{ inputs.tag }}
        DJANGO_TAGS: ${{ steps.tags.outputs.django_tags }}
      run: |
        set -euo pipefail
        printf '%s\n' \
          "FROM grindsa/acme2certifier:${TAG}-${WEBSRV}" \
          "ENV ACME_SRV_DB_HANDLER=django" \
          > /tmp/a2c-django-alias.Dockerfile
        tag_args=()
        while IFS= read -r t; do
          [[ -n "${t}" ]] || continue
          tag_args+=(-t "${t}")
        done <<< "${DJANGO_TAGS}"
        docker buildx build \
          --platform linux/amd64,linux/arm64 \
          --push \
          -f /tmp/a2c-django-alias.Dockerfile \
          "${tag_args[@]}" \
          /tmp
