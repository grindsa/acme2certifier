name: "rpm_build_upload"
description: "Build and Upload package"
outputs:
  rpm_file_name:
    description: "Name of the RPM package file"
    value: acme2certifier-${{ github.run_id }}.noarch.rpm

runs:
  using: "composite"
  steps:

  - name: "Build rpm package"
    id: rpm_build
    uses: ./.github/actions/rpm_build

  - name: "Rename main RPM package"
    run: |
      set -euo pipefail
      NOARCH="${{ steps.rpm_build.outputs.rpm_dir_path }}/noarch"
      # Rename payload RPM only; keep flavor subpackages (acme2certifier-python*).
      main="$(ls -1 "${NOARCH}"/acme2certifier-[0-9]*.noarch.rpm 2>/dev/null | head -n 1)"
      if [[ -z "${main}" ]]; then
        echo "ERROR: main acme2certifier-*.noarch.rpm not found in ${NOARCH}" >&2
        ls -la "${NOARCH}" >&2 || true
        exit 1
      fi
      sudo mv "${main}" "${NOARCH}/acme2certifier-${{ github.run_id }}.noarch.rpm"
      ls -la "${NOARCH}"
    shell: bash

  - name: "Upload RPM package"
    uses: actions/upload-artifact@v7
    with:
      name: acme2certifier-${{ github.run_id }}.noarch.rpm
      path: ${{ steps.rpm_build.outputs.rpm_dir_path }}/noarch/
