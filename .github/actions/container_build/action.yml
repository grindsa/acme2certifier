name: "container_build"
description: "Build Container"
inputs:
  DB_HANDLER:
    description: "Database handler"
    required: true
    default: "wsgi"
  WEB_SRV:
    description: "Web server"
    required: true
    default: "apache2"
  DOCKER_COMPOSE_FILE_PATH:
    description: "Path to the docker compose file"
    required: false
    default: "examples/Docker/"
  GH_USER:
    description: "GitHub user/org for sbom companion debs"
    required: true
  GH_SBOM_REPO_TOKEN:
    description: "Token for sbom companion debs"
    required: true
  UBUNTU_TARGET:
    description: "SBOM deb leaf (must match Dockerfile Ubuntu base)"
    required: false
    default: "ub26.04"

runs:
  using: "composite"
  steps:
    - name: "Fetch sbom companion debs into build context"
      uses: ./.github/actions/fetch_sbom_debs
      with:
        GH_USER: ${{ inputs.GH_USER }}
        GH_SBOM_REPO_TOKEN: ${{ inputs.GH_SBOM_REPO_TOKEN }}
        UBUNTU_TARGET: ${{ inputs.UBUNTU_TARGET }}
        DESTINATION: "."

    - name: "Build docker compose (${{ inputs.WEB_SRV }}_${{ inputs.DB_HANDLER }})"
      working-directory: ${{ inputs.DOCKER_COMPOSE_FILE_PATH }}
      run: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --batch --yes --no-tty --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
        sudo apt update
        sudo apt install -y docker-compose-plugin
        sed -i "s/wsgi/$DB_HANDLER/g" .env
        sed -i "s/apache2/$WEB_SRV/g" .env
        # cat .env
        docker compose build
      shell: bash
      env:
        WEB_SRV: ${{ inputs.WEB_SRV }}
        DB_HANDLER: ${{ inputs.DB_HANDLER }}
